<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaap - Welcome Back</title>
    
    <!-- Google Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#0A0B0E',
                            card: '#16171D',
                            cardBorder: '#232530',
                            inputBg: '#0F1014',
                            inputBorder: '#1E202B',
                            socialBg: '#1A1C23',
                            socialBorder: '#292B37',
                            muted: '#7C8092',
                            subtle: '#4B4E5E'
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 50px -10px rgba(0, 0, 0, 0.8), 0 20px 40px -15px rgba(0,0,0,0.9)',
                        'card-rim': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.08), inset 0 -1px 2px 0 rgba(0, 0, 0, 0.8)',
                        'button-gloss': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.2), 0 4px 15px rgba(0,0,0,0.5)',
                        'inset-input': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255,255,255,0.02)',
                        'avatar-rim': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.3), inset 0 -2px 4px 0 rgba(0, 0, 0, 0.8), 0 8px 16px rgba(0,0,0,0.5)'
                    }
                }
            }
        }
    </script>

    <style>
        /* Matrix/Grid background effect behind the modal */
        .bg-pattern {
            background-color: #08090C;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(25, 28, 38, 0.8) 0%, rgba(8, 9, 12, 1) 70%),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 100% 100%, 18px 18px;
            background-position: 0 0, 9px 9px;
        }

        /* Ambient subtle center glow */
        .glow-spot {
            background: radial-gradient(circle, rgba(45, 50, 70, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #232530;
            border-radius: 10px;
        }

        /* Soft fade keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .animate-pop-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Curved Page Curl Effect styling */
        .page-curl-shadow {
            filter: drop-shadow(-4px 6px 8px rgba(0,0,0,0.7));
        }
    </style>
</head>
<body class="bg-pattern text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden font-sans antialiased select-none">

    <!-- Ambient backdrop lighting -->
    <div class="absolute w-[600px] h-[600px] glow-spot pointer-events-none rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

    <!-- Re-open modal button if closed -->
    <button id="reopenBtn" onclick="toggleModal(true)" class="hidden fixed top-6 right-6 px-4 py-2 bg-dark-card border border-dark-cardBorder text-xs text-slate-300 rounded-xl hover:bg-dark-socialBg transition-all flex items-center gap-2 shadow-lg">
        <i class="ph ph-arrow-counter-clockwise text-base"></i> Reset Demo Modal
    </button>

    <!-- Main Login Card Modal -->
    <div id="loginCard" class="relative w-full max-w-[430px] bg-dark-card/90 backdrop-blur-xl rounded-[28px] border border-dark-cardBorder/80 shadow-glow shadow-card-rim p-8 pt-9 flex flex-col items-center animate-pop-in transition-all duration-300">
        
        <!-- Page Curl Fold in Top Right Corner -->
        <div class="absolute top-0 right-0 w-16 h-16 pointer-events-none overflow-hidden rounded-tr-[28px]">
            <!-- Fold triangle shadow & highlight -->
            <svg class="absolute top-0 right-0 w-16 h-16 page-curl-shadow" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Under shadow path -->
                <path d="M64 0L0 0L64 64V0Z" fill="#0A0B0E" opacity="0.6" />
                <!-- Folded surface gradient -->
                <path d="M64 64C48 64 24 52 0 0C52 24 64 48 64 64Z" fill="url(#curlGrad)" />
                <path d="M64 64C48 64 24 52 0 0" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
                <defs>
                    <linearGradient id="curlGrad" x1="64" y1="64" x2="20" y2="10" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#111217" />
                        <stop offset="50%" stop-color="#282A36" />
                        <stop offset="100%" stop-color="#414558" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Close Button (Top Right next to curl) -->
        <button onclick="toggleModal(false)" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-black/40 hover:bg-black/70 flex items-center justify-center text-dark-muted hover:text-white transition-colors z-10" title="Close">
            <i class="ph ph-x text-xs font-bold"></i>
        </button>

        <!-- User Profile Avatar Badge (Skeuomorphic 3D ring) -->
        <div class="relative w-16 h-16 rounded-full bg-gradient-to-b from-[#323544] via-[#1B1C24] to-[#101116] p-[2px] shadow-avatar-rim mb-5 flex items-center justify-center">
            <div class="w-full h-full rounded-full bg-gradient-to-b from-[#1C1E26] to-[#0E0F13] flex items-center justify-center overflow-hidden relative">
                <!-- Gloss highlight overlay -->
                <div class="absolute top-0 inset-x-0 h-1/2 bg-gradient-to-b from-white/10 to-transparent rounded-t-full pointer-events-none"></div>
                <!-- Profile Silhouette Icon -->
                <i class="ph-fill ph-user text-2xl text-slate-300 drop-shadow-md"></i>
            </div>
        </div>

        <!-- Header Titles -->
        <h1 class="text-2xl font-bold text-slate-100 tracking-tight mb-1 text-center">Welcome Back</h1>
        <p class="text-xs text-dark-muted font-normal mb-6 text-center tracking-wide">Please enter your info to sing in to Zaap</p>

        <!-- Social Login Row -->
        <div class="grid grid-cols-3 gap-3 w-full mb-6">
            <!-- Google Button -->
            <button onclick="triggerSocialAuth('Google')" class="h-11 rounded-xl bg-dark-socialBg border border-dark-socialBorder hover:border-slate-600/50 hover:bg-[#20222B] transition-all flex items-center justify-center group shadow-sm active:scale-95">
                <!-- Google SVG Icon -->
                <svg class="w-4 h-4 transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
            </button>

            <!-- Facebook Button -->
            <button onclick="triggerSocialAuth('Facebook')" class="h-11 rounded-xl bg-dark-socialBg border border-dark-socialBorder hover:border-slate-600/50 hover:bg-[#20222B] transition-all flex items-center justify-center group shadow-sm active:scale-95">
                <!-- Facebook SVG Icon -->
                <svg class="w-4 h-4 text-[#1877F2] fill-current transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>

            <!-- Apple Button -->
            <button onclick="triggerSocialAuth('Apple')" class="h-11 rounded-xl bg-dark-socialBg border border-dark-socialBorder hover:border-slate-600/50 hover:bg-[#20222B] transition-all flex items-center justify-center group shadow-sm active:scale-95">
                <!-- Apple SVG Icon -->
                <svg class="w-4 h-4 text-white fill-current transition-transform group-hover:scale-110" viewBox="0 0 170 170">
                    <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.13-1.9-14.38-6.08-3.37-2.73-7.23-7.39-11.58-13.98-6.19-9.35-11.08-19.86-14.67-31.52-3.58-11.66-5.38-22.89-5.38-33.69 0-15.03 3.69-27.52 11.08-37.47 7.39-9.95 16.73-14.99 28.02-15.12 4.45 0 9.49 1.16 15.12 3.48 5.63 2.33 9.49 3.54 11.58 3.63 1.95 0 5.92-1.25 11.91-3.75 5.99-2.5 10.9-3.68 14.73-3.54 8.04.53 15.42 3.26 22.14 8.2 4.88 3.6 8.84 8.04 11.88 13.32-10.74 6.51-16.03 15.42-15.87 26.73.16 8.89 3.48 16.29 9.95 22.21 6.47 5.92 14.15 9.38 23.05 10.37-1.74 5.34-3.81 10.51-6.21 15.52zM119.22 31.02c0-7.39 2.68-14.39 8.04-21 5.36-6.61 12.01-10.02 19.95-10.22.11 1.08.16 2 .16 2.76 0 7.27-2.73 14.31-8.2 21.12-5.47 6.81-12.19 10.37-20.16 10.67-.11-.87-.16-1.98-.16-3.33z"/>
                </svg>
            </button>
        </div>

        <!-- Subtle Horizontal Divider -->
        <div class="w-full h-[1px] bg-dark-cardBorder/60 mb-6"></div>

        <!-- Form Container -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="w-full flex flex-col gap-4">
            
            <!-- Email Input Field -->
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-xs font-medium text-slate-300">Email Address</label>
                <div class="relative">
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        placeholder="Enter your email.." 
                        class="w-full h-11 bg-dark-inputBg border border-dark-inputBorder rounded-xl px-4 text-xs text-slate-200 placeholder:text-dark-subtle shadow-inset-input outline-none focus:border-slate-500/60 focus:ring-1 focus:ring-slate-500/20 transition-all"
                    >
                </div>
            </div>

            <!-- Password Input Field -->
            <div class="flex flex-col gap-1.5">
                <label for="password" class="text-xs font-medium text-slate-300">Password</label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        placeholder="••••••••••" 
                        class="w-full h-11 bg-dark-inputBg border border-dark-inputBorder rounded-xl px-4 pr-10 text-xs text-slate-200 placeholder:text-dark-subtle shadow-inset-input outline-none focus:border-slate-500/60 focus:ring-1 focus:ring-slate-500/20 transition-all"
                    >
                    <!-- Password visibility toggle icon -->
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-dark-muted hover:text-slate-300 transition-colors">
                        <i id="pwdIcon" class="ph ph-eye text-sm"></i>
                    </button>
                </div>
                <!-- Forgot Password Link -->
                <div class="flex justify-end mt-0.5">
                    <a href="#" onclick="showToast('Password reset link sent to email')" class="text-[11px] text-dark-muted hover:text-slate-300 transition-colors font-normal">Forgot Password?</a>
                </div>
            </div>

            <!-- Sign In Main Action Button -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full h-11 mt-2 rounded-xl bg-gradient-to-b from-[#2A2D39] via-[#1E202A] to-[#15161D] border border-slate-600/40 text-xs font-semibold text-slate-100 shadow-button-gloss hover:from-[#323645] hover:to-[#1A1C25] active:scale-[0.99] transition-all flex items-center justify-center gap-2 group"
            >
                <span id="btnText">Sign in</span>
                <i id="btnIcon" class="ph ph-arrow-right text-xs group-hover:translate-x-0.5 transition-transform"></i>
            </button>
        </form>

        <!-- Footer Text -->
        <p class="text-xs text-dark-muted mt-6 text-center">
            Don't have an account yet? 
            <a href="#" onclick="toggleMode('signup'); return false;" class="text-slate-200 font-semibold hover:underline">Sign up</a>
        </p>
    </div>

    <!-- Custom Toast Notification Container -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-dark-card border border-dark-cardBorder text-slate-200 text-xs py-2.5 px-4 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 flex items-center gap-2">
        <i class="ph-fill ph-check-circle text-emerald-400 text-base"></i>
        <span id="toastMsg">Action completed!</span>
    </div>

    <script>
        // Modal toggle logic
        function toggleModal(show) {
            const card = document.getElementById('loginCard');
            const reopenBtn = document.getElementById('reopenBtn');
            if (show) {
                card.classList.remove('scale-95', 'opacity-0', 'pointer-events-none');
                reopenBtn.classList.add('hidden');
            } else {
                card.classList.add('scale-95', 'opacity-0', 'pointer-events-none');
                reopenBtn.classList.remove('hidden');
                showToast('Modal closed. Click reset to restore.');
            }
        }

        // Show/Hide password toggle
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const pwdIcon = document.getElementById('pwdIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                pwdInput.type = 'password';
                pwdIcon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        // Trigger social authentication feedback
        function triggerSocialAuth(provider) {
            showToast(`Authenticating with ${provider}...`);
        }

        // Toggle sign in vs sign up mode
        function toggleMode(mode) {
            const btnText = document.getElementById('btnText');
            if (mode === 'signup') {
                btnText.textContent = 'Sign up';
                showToast('Switched to Sign up mode');
            } else {
                btnText.textContent = 'Sign in';
                showToast('Switched to Sign in mode');
            }
        }

        // Handle Form Submission
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            // Button loading animation
            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnIcon.className = 'ph ph-spinner animate-spin text-xs';

            setTimeout(() => {
                btn.disabled = false;
                btnText.textContent = 'Sign in';
                btnIcon.className = 'ph ph-arrow-right text-xs group-hover:translate-x-0.5 transition-transform';
                showToast('Signed in successfully!');
            }, 1200);
        }

        // Toast notification helper function
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
            }, 3000);
        }
    </script>
</body>
</html>
