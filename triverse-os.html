  const files = App.files = {
    STORE: STORE,

    /** IndexedDB is not available on every file:// origin — fall back quietly */
    backend() { return idbBlocked ? 'localStorage' : 'indexedDB'; },

    async probe() {
      try { await openDB(); idbBlocked = false; return 'indexedDB'; }
      catch (e) { idbBlocked = true; return 'localStorage'; }
    },

    /* -------------------------------------------------------------- bytes */
    async put(id, blob) {
      const record = { id: id, size: blob.size, type: blob.type || '', at: U.now(), blob: blob };
      try {
        await tx('readwrite', s => s.put(record));
        return { backend: 'indexedDB', bytes: blob.size };
      } catch (e) {
        if (blob.size > LS_LIMIT) throw new Error('This browser cannot store files larger than ' + U.bytes(LS_LIMIT) + ' here. Open the app over http://localhost (npm start) for full-size storage, or keep this file on Google Drive.');
        if (lsUsage() + blob.size * 1.34 > LS_TOTAL_LIMIT) throw new Error('Local file storage is full. Delete files you no longer need, or connect Google Drive in Settings.');
        const url = await blobToDataURL(blob);
        try { global.localStorage.setItem(LS_PREFIX + id, url); }
        catch (err) { throw new Error('Local file storage is full (' + err.message + '). Connect Google Drive to keep files off this device.'); }
        return { backend: 'localStorage', bytes: blob.size };
      }
    },

    async get(id) {
      try {
        const rec = await tx('readonly', s => s.get(id));
        if (rec && rec.blob) return rec.blob;
      } catch (e) { /* fall through to localStorage */ }
      try {
        const url = global.localStorage.getItem(LS_PREFIX + id);
        if (url) return dataURLToBlob(url);
      } catch (e) {}
      return null;
    },

    async has(id) {
      try {
        const rec = await tx('readonly', s => s.get(id));
        if (rec) return true;
      } catch (e) {}
      try { return Boolean(global.localStorage.getItem(LS_PREFIX + id)); } catch (e) { return false; }
    },

    async remove(id) {
      try { await tx('readwrite', s => s.delete(id)); } catch (e) {}
      try { global.localStorage.removeItem(LS_PREFIX + id); } catch (e) {}
      return true;
    },

    async list() {
      let rows = [];
      try { rows = (await tx('readonly', s => s.getAll())) || []; } catch (e) { rows = []; }
      const seen = {};
      rows.forEach(r => { if (r && r.id) seen[r.id] = r.size; });
      lsKeys().forEach(k => {
        const id = k.slice(LS_PREFIX.length);
        const raw = global.localStorage.getItem(k) || '';
        if (!seen[id]) seen[id] = Math.round(raw.length * 0.75);
      });
      return Object.keys(seen).map(id => ({ id: id, size: seen[id] }));
    },

    async usage() {
      const rows = await files.list();
      return { count: rows.length, bytes: rows.reduce((a, b) => a + (b.size || 0), 0), backend: files.backend() };
    },

    async clear() {
      try { await tx('readwrite', s => s.clear()); } catch (e) {}
      lsKeys().forEach(k => { try { global.localStorage.removeItem(k); } catch (e) {} });
      return true;
    },

    /* --------------------------------------------------------- fingerprints */
    /** SHA-256 of the bytes — proves a downloaded copy is the file we stored */
    async checksum(blob) {
      try {
        const buf = await blob.arrayBuffer();
        const digest = await global.crypto.subtle.digest('SHA-256', buf);
        return Array.prototype.map.call(new Uint8Array(digest), b => ('00' + b.toString(16)).slice(-2)).join('');
      } catch (e) { return ''; }
    },

    /* -------------------------------------------------------------- adding */
    /**
     * Store a file and return its record. The metadata goes into the workspace,
     * the bytes go into the device's file store.
     */
    async add(file, meta) {
      meta = meta || {};
      if (!file) throw new Error('No file selected.');
      const id = meta.id || U.uid('doc');
      const name = file.name || meta.name || ('file-' + Date.now());
      const stored = await files.put(id, file);
      const checksum = meta.checksum === false ? '' : await files.checksum(file);
      let text = '';
      /* keep a readable copy of small text files so it can be searched */
      if (file.size <= 256 * 1024 && /^(text\/|application\/(json|javascript|xml|x-yaml))/.test(file.type || '') ) {
        try { text = await file.text(); } catch (e) { text = ''; }
      } else if (file.size <= 256 * 1024 && /\.(html?|css|js|mjs|json|txt|md|csv|sql|php|py|ts|tsx|jsx|yml|yaml|svg)$/i.test(name)) {
        try { text = await file.text(); } catch (e) { text = ''; }
      }
      const doc = Object.assign({
        id: id,
        name: name,
        ext: (name.split('.').pop() || '').toLowerCase(),
        mime: file.type || '',
        size: file.size,
        kind: U.fileKind(name, file.type),
        checksum: checksum,
        backend: stored.backend,
        source: 'upload',
        version: '1.0',
        author: App.store.get('settings.company.senderName', '') || 'Triverse Studio',
        uploadedAt: U.now(),
        updatedAt: U.now(),
        downloads: 0,
        opened: 0,
        category: meta.category || 'other',
        projectId: meta.projectId || '',
        projectName: meta.projectName || '',
        clientId: meta.clientId || '',
        description: meta.description || '',
        language: meta.language || '',
        tags: meta.tags || [],
        notes: meta.notes || '',
        cloud: { driveId: '', syncedAt: '' },
        preview: text.slice(0, 8000),
        previewable: /^(text\/|image\/|application\/(json|javascript|xml|x-yaml|pdf))/.test(file.type || '') ||
          /\.(html?|css|js|mjs|json|txt|md|csv|sql|php|py|ts|tsx|jsx|yml|yaml|svg|png|jpe?g|gif|webp|ico|pdf)$/i.test(name)
      }, meta.overrides || {});
      /* when the file itself is a website, remember it as a website record too */
      if (meta.linkSiteId) doc.projectId = meta.linkSiteId;
      App.store.add('documents', doc);
      App.log('file', 'Added “' + name + '” (' + U.bytes(file.size) + ') to the file vault', doc.id);
      return doc;
    },

    /** add several files at once, skipping anything that fails */
    async addMany(fileList, meta) {
      const out = { added: [], failed: [] };
      const list = Array.prototype.slice.call(fileList || []);
      for (let i = 0; i < list.length; i++) {
        try { out.added.push(await files.add(list[i], Object.assign({}, meta, { overrides: { partOf: meta && meta.batchName || '' } }))); }
        catch (e) { out.failed.push({ name: list[i].name, error: e.message }); }
      }
      return out;
    },

    /* --------------------------------------------------------------- using */
    async download(docOrId) {
      const doc = typeof docOrId === 'string' ? App.store.find('documents', docOrId) : docOrId;
      if (!doc) { App.ui.toast('That file record no longer exists', 'amber'); return false; }
      const blob = await files.get(doc.id);
      if (!blob) {
        App.ui.toast('The stored copy of “' + doc.name + '” is missing from this device — restore a backup or re-upload it.', 'red');
        return false;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = doc.name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
      App.store.patch('documents', doc.id, { downloads: (Number(doc.downloads) || 0) + 1, lastDownloadedAt: U.now() });
      return true;
    },

    async open(docOrId) {
      const doc = typeof docOrId === 'string' ? App.store.find('documents', docOrId) : docOrId;
      if (!doc) return false;
      const blob = await files.get(doc.id);
      if (!blob) { App.ui.toast('The stored copy is missing from this device', 'red'); return false; }
      const url = URL.createObjectURL(blob);
      const w = global.open(url, '_blank');
      if (!w) App.ui.toast('Pop-up blocked — allow pop-ups to open the file', 'amber');
      setTimeout(() => URL.revokeObjectURL(url), 120000);
      App.store.patch('documents', doc.id, { opened: (Number(doc.opened) || 0) + 1, lastOpenedAt: U.now() });
      return true;
    },

    async blobUrl(docOrId) {
      const doc = typeof docOrId === 'string' ? App.store.find('documents', docOrId) : docOrId;
      if (!doc) return '';
      const blob = await files.get(doc.id);
      return blob ? URL.createObjectURL(blob) : '';
    },

    /** replace the bytes of an existing record with a newer version */
    async replace(docId, file) {
      const doc = App.store.find('documents', docId);
      if (!doc) throw new Error('That file record no longer exists.');
      const stored = await files.put(docId, file);
      await files.remove(docId === doc.id ? docId : docId); /* keeps the same key */
      await files.put(docId, file);
      const checksum = await files.checksum(file);
      const patch = {
        size: file.size, mime: file.type || doc.mime, ext: (file.name.split('.').pop() || '').toLowerCase(),
        kind: U.fileKind(file.name, file.type), checksum: checksum, backend: stored.backend,
        updatedAt: U.now(), lastVersionAt: U.now(),
        history: (doc.history || []).concat([{ at: U.now(), size: doc.size, version: doc.version, checksum: doc.checksum }]).slice(-20)
      };
      App.store.patch('documents', docId, patch);
      App.log('file', 'New version of “' + doc.name + '” uploaded', docId);
      return true;
    },

    /* ------------------------------------------------- search + statistics */
    all() { return App.store.get('documents', []) || []; },

    search(term, opts) {
      opts = opts || {};
      const t = String(term || '').trim().toLowerCase();
      let rows = files.all();
      if (opts.category && opts.category !== 'all') rows = rows.filter(d => d.category === opts.category);
      if (opts.projectId) rows = rows.filter(d => d.projectId === opts.projectId || d.clientId === opts.projectId);
      if (opts.missing) rows = rows.filter(d => d.missing);
      if (t) {
        rows = rows.filter(d =>
          U.hit(d.name, t) || U.hit(d.description, t) || U.hit(d.kind, t) || U.hit(d.language, t) ||
          U.hit(d.projectName, t) || U.hit(d.notes, t) || U.hit(d.checksum, t) ||
          (d.tags || []).some(x => U.hit(x, t)) || U.hit(d.preview, t));
      }
      return rows;
    },

    stats() {
      const rows = files.all();
      const byCat = {};
      rows.forEach(d => { byCat[d.category || 'other'] = (byCat[d.category || 'other'] || 0) + 1; });
      return {
        count: rows.length,
        bytes: U.sum(rows, d => Number(d.size) || 0),
        byCategory: byCat,
        newest: U.sortBy(rows, d => d.uploadedAt || '', 'desc')[0] || null,
        links: rows.filter(d => d.projectId).length
      };
    },

    categories() {
      return [
        ['website', 'Website build', 'fa-globe'],
        ['source', 'Source code', 'fa-code'],
        ['design', 'Design & graphics', 'fa-palette'],
        ['document', 'Document', 'fa-file-lines'],
        ['contract', 'Contract / agreement', 'fa-file-signature'],
        ['invoice', 'Invoice / receipt', 'fa-file-invoice-dollar'],
        ['brand', 'Brand assets', 'fa-swatchbook'],
        ['media', 'Photo / video', 'fa-photo-film'],
        ['backup', 'Backup / archive', 'fa-box-archive'],
        ['other', 'Other', 'fa-paperclip']
      ];
    },
    categoryLabel(key) {
      const c = files.categories().filter(x => x[0] === key)[0];
      return c ? c[1] : 'Other';
    },
    categoryIcon(key) {
      const c = files.categories().filter(x => x[0] === key)[0];
      return c ? c[2] : 'fa-paperclip';
    },

    /** flag records whose bytes are no longer on this device */
    async audit() {
      const rows = files.all();
      let missing = 0;
      for (let i = 0; i < rows.length; i++) {
        const ok = await files.has(rows[i].id);
        if (!ok && !(rows[i].cloud && rows[i].cloud.driveId)) {
          missing++;
          if (!rows[i].missing) App.store.patch('documents', rows[i].id, { missing: true });
        } else if (ok && rows[i].missing) {
          App.store.patch('documents', rows[i].id, { missing: false });
        }
      }
      App.store.save();
      return { total: rows.length, missing: missing };
    }
  };
})(window);

</script>
  <script>
/* ===== assets/js/cloud.js ===== */
/* =============================================================================
   Triverse OS — Google Drive
   Two jobs, both opt-in:

     1. Keep the workspace itself in the studio's own Drive. Open the system on
        any other computer, sign in with the same Google account, and the whole
        operation — clients, invoices, projects, file index — is there.
     2. Keep the actual file vault in Drive too, so a build folder or a design
        source is not trapped on one laptop.

   It talks to the Google Identity Services token client and the Drive REST API
   directly; there is no server in the middle and nothing is sent anywhere else.
   The app asks only for the drive.file scope, which means it can see the files
   it created and nothing else in the account.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;

  const SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const GIS_SRC = 'https://accounts.google.com/gsi/client';
  const FOLDER_NAME = 'Triverse OS';
  const BACKUP_NAME = 'triverse-workspace.json';
  const DRIVE = 'https://www.googleapis.com/drive/v3';
  const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

  let tokenClient = null;
  let gisLoading = null;
  let token = null;              /* { value, expiresAt } */
  let folderId = '';             /* remembered for the session */

  function clientId() { return String(App.store.get('settings.cloud.clientId', '') || '').trim(); }
  function connectedFlag() { return Boolean(App.store.get('settings.cloud.connected', false)); }

  function httpOrigin() {
    return location.protocol === 'http:' || location.protocol === 'https:';
  }

  function authHeader() {
    if (!token || Date.now() > token.expiresAt) throw new Error('Your Google session has expired. Press Connect again.');
    return { Authorization: 'Bearer ' + token.value };
  }

  function loadGis() {
    if (global.google && global.google.accounts && global.google.accounts.oauth2) return Promise.resolve();
    if (gisLoading) return gisLoading;
    gisLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = GIS_SRC;
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Could not reach Google sign-in. Check the internet connection and try again.'));
      document.head.appendChild(s);
    });
    return gisLoading;
  }

  async function json(res) {
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok) {
      const msg = (data && data.error && (data.error.message || data.error)) || ('Drive returned HTTP ' + res.status);
      const err = new Error(String(msg));
      err.status = res.status;
      if (res.status === 401 || res.status === 403) err.auth = true;
      throw err;
    }
    return data;
  }

  function explain(err) {
    const raw = String((err && err.message) || err || '');
    if (/has not been used in project|is disabled/i.test(raw)) {
      return 'Google Drive API is not enabled for the project that owns your OAuth client.\n' +
        'Open console.cloud.google.com → APIs & Services → Library → “Google Drive API” → Enable, then press Connect again.\n\n' + raw;
    }
    if (/redirect_uri_mismatch|origin_mismatch|origin/i.test(raw)) {
      return 'This address is not authorised in your OAuth client.\n' +
        'In Google Cloud → Credentials → your OAuth client → Authorised JavaScript origins, add:\n' + location.origin + '\n\n' + raw;
    }
    if (/idpiframe|third-party cookies|storage/i.test(raw)) {
      return 'The browser blocked Google sign-in storage. Allow third-party cookies for accounts.google.com, or open the app in a normal window (not private mode).\n\n' + raw;
    }
    return raw;
  }

  const cloud = App.cloud = {
    SCOPE: SCOPE,
    FOLDER_NAME: FOLDER_NAME,
    BACKUP_NAME: BACKUP_NAME,

    hasClientId() { return clientId().length > 20; },
    isConnected() { return Boolean(token && Date.now() < token.expiresAt); },
    configured() { return connectedFlag() || cloud.isConnected(); },

    status() {
      return {
        origin: location.origin,
        http: httpOrigin(),
        clientId: clientId(),
        hasClientId: cloud.hasClientId(),
        authorized: cloud.isConnected(),
        connected: connectedFlag(),
        account: App.store.get('settings.cloud.account', ''),
        lastSync: App.store.get('settings.cloud.lastSync', ''),
        lastPull: App.store.get('settings.cloud.lastPull', ''),
        auto: Boolean(App.store.get('settings.cloud.auto', false)),
        backupId: App.store.get('settings.cloud.backupId', '')
      };
    },

    /* ------------------------------------------------------------ sign in */
    async connect(interactive) {
      if (!httpOrigin()) {
        throw new Error('Google sign-in only works from a web address, never from a file opened straight off the disk.\n\n' +
          'Run “npm start” in this folder, then open http://localhost:8099 in the browser. Your workspace and files are the same either way.');
      }
      if (!cloud.hasClientId()) {
        throw new Error('Add your Google OAuth Client ID in Settings → Cloud first. The next card explains exactly where to get it.');
      }
      await loadGis();
      return new Promise((resolve, reject) => {
        try {
          tokenClient = global.google.accounts.oauth2.initTokenClient({
            client_id: clientId(),
            scope: SCOPE,
            prompt: interactive === false ? '' : 'consent',
            callback: resp => {
              if (resp && resp.access_token) {
                token = { value: resp.access_token, expiresAt: Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000 };
                App.store.set('settings.cloud.connected', true, { silent: true });
                App.store.save();
                Promise.resolve()
                  .then(() => cloud.account())
                  .then(acct => { if (acct) App.store.set('settings.cloud.account', acct, { silent: true }); App.store.save(); })
                  .then(() => resolve(true))
                  .catch(() => resolve(true));
              } else {
                reject(new Error('Google sign-in was closed before it finished. Nothing was changed.'));
              }
            },
            error_callback: e => reject(new Error(explain({ message: (e && (e.message || e.type)) || 'Google sign-in failed.' })))
          });
          tokenClient.requestAccessToken();
        } catch (e) { reject(new Error(explain(e))); }
      });
    },

    disconnect() {
      try { if (token && global.google && global.google.accounts) global.google.accounts.oauth2.revoke(token.value); } catch (e) {}
      token = null; folderId = '';
      App.store.set('settings.cloud.connected', false, { silent: true });
      App.store.set('settings.cloud.lastSync', '', { silent: true });
      App.store.save();
    },

    async ensureToken() {
      if (cloud.isConnected()) return true;
      return cloud.connect(connectedFlag() ? false : true);
    },

    async account() {
      try {
        const r = await fetch(DRIVE + '/about?fields=user(emailAddress,displayName)', { headers: authHeader() });
        const d = await json(r);
        return (d && d.user && (d.user.emailAddress || d.user.displayName)) || '';
      } catch (e) { return ''; }
    },

    /* ---------------------------------------------------------- folder */
    async folder() {
      if (folderId) return folderId;
      await cloud.ensureToken();
      const q = "name='" + FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false";
      const r = await fetch(DRIVE + '/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)&spaces=drive', { headers: authHeader() });
      const d = await json(r);
      if (d.files && d.files.length) { folderId = d.files[0].id; return folderId; }
      const create = await fetch(DRIVE + '/files?fields=id', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
      });
      const made = await json(create);
      folderId = made.id;
      return folderId;
    },

    /* ------------------------------------------------------------ backup */
    /** push the whole workspace up as one JSON file, replacing the previous copy */
    async backupNow(reason) {
      try {
        await cloud.ensureToken();
        const folder = await cloud.folder();
        const payload = App.store.export();
        const blob = new Blob([payload], { type: 'application/json' });
        const existing = App.store.get('settings.cloud.backupId', '');

        const meta = { name: BACKUP_NAME, parents: [folder], mimeType: 'application/json' };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
        form.append('file', blob);

        let r;
        if (existing) {
          r = await fetch(UPLOAD + '/files/' + encodeURIComponent(existing) + '?uploadType=multipart&fields=id,modifiedTime', {
            method: 'PATCH', headers: authHeader(), body: form
          });
          if (r.status === 404) {
            App.store.set('settings.cloud.backupId', '', { silent: true });
            r = await fetch(UPLOAD + '/files?uploadType=multipart&fields=id,modifiedTime', { method: 'POST', headers: authHeader(), body: form });
          }
        } else {
          r = await fetch(UPLOAD + '/files?uploadType=multipart&fields=id,modifiedTime', { method: 'POST', headers: authHeader(), body: form });
        }
        const d = await json(r);
        App.store.set('settings.cloud.backupId', d.id, { silent: true });
        App.store.set('settings.cloud.lastSync', U.now(), { silent: true });
        App.store.set('settings.cloud.lastSyncReason', reason || 'manual', { silent: true });
        App.store.save();
        App.log('cloud', 'Workspace backed up to Google Drive (' + U.bytes(payload.length) + ')', '');
        return { id: d.id, bytes: payload.length };
      } catch (e) {
        throw new Error(explain(e));
      }
    },

    /** the newest backup file in the Drive folder */
    async listBackups() {
      try {
        await cloud.ensureToken();
        const folder = await cloud.folder();
        const q = "'" + folder + "' in parents and trashed=false";
        const r = await fetch(DRIVE + '/files?q=' + encodeURIComponent(q) +
          '&fields=files(id,name,mimeType,size,modifiedTime,webViewLink)&orderBy=modifiedTime%20desc&pageSize=100',
          { headers: authHeader() });
        const d = await json(r);
        return (d.files || []);
      } catch (e) { throw new Error(explain(e)); }
    },

    /** pull the workspace back — the answer to “open it on another device” */
    async restoreLatest() {
      const rows = await cloud.listBackups();
      const file = rows.filter(f => f.name === BACKUP_NAME)[0] || rows.filter(f => /\.json$/.test(f.name))[0];
      if (!file) throw new Error('No workspace backup found in the “' + FOLDER_NAME + '” folder of that Google account yet.');
      const r = await fetch(DRIVE + '/files/' + encodeURIComponent(file.id) + '?alt=media', { headers: authHeader() });
      if (!r.ok) throw new Error(explain(new Error('Drive returned HTTP ' + r.status)));
      const text = await r.text();
      App.store.importJSON(text);
      App.store.set('settings.cloud.lastPull', U.now(), { silent: true });
      App.store.save();
      App.log('cloud', 'Workspace restored from Google Drive (' + file.name + ')', '');
      return { name: file.name, modifiedTime: file.modifiedTime };
    },

    /* -------------------------------------------------------- vault files */
    /** put one vault file into Drive, so it survives losing the laptop */
    async uploadFile(doc) {
      const record = typeof doc === 'string' ? App.store.find('documents', doc) : doc;
      if (!record) throw new Error('That file record no longer exists.');
      const blob = await App.files.get(record.id);
      if (!blob) throw new Error('The stored bytes for “' + record.name + '” are missing from this device.');
      try {
        await cloud.ensureToken();
        const folder = await cloud.folder();
        const existing = (record.cloud || {}).driveId;
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify({ name: record.name, parents: existing ? undefined : [folder] })], { type: 'application/json' }));
        form.append('file', blob);
        let r;
        if (existing) {
          r = await fetch(UPLOAD + '/files/' + encodeURIComponent(existing) + '?uploadType=multipart&fields=id,modifiedTime,webViewLink', {
            method: 'PATCH', headers: authHeader(), body: form
          });
          if (r.status === 404) {
            const form2 = new FormData();
            form2.append('metadata', new Blob([JSON.stringify({ name: record.name, parents: [folder] })], { type: 'application/json' }));
            form2.append('file', blob);
            r = await fetch(UPLOAD + '/files?uploadType=multipart&fields=id,modifiedTime,webViewLink', { method: 'POST', headers: authHeader(), body: form2 });
          }
        } else {
          r = await fetch(UPLOAD + '/files?uploadType=multipart&fields=id,modifiedTime,webViewLink', { method: 'POST', headers: authHeader(), body: form });
        }
        const d = await json(r);
        App.store.patch('documents', record.id, {
          cloud: { driveId: d.id, syncedAt: U.now(), link: d.webViewLink || '', bytes: record.size }
        });
        App.store.set('settings.cloud.lastSync', U.now(), { silent: true });
        App.store.save();
        return d;
      } catch (e) { throw new Error(explain(e)); }
    },

    /** everything that has bytes on this device but no copy in Drive yet */
    unsynced() {
      return App.files.all().filter(d => !(d.cloud && d.cloud.driveId));
    },

    /** push every unsynced vault file, one at a time, reporting progress */
    async syncAllFiles(onProgress) {
      const rows = cloud.unsynced();
      let done = 0;
      const failed = [];
      for (let i = 0; i < rows.length; i++) {
        try { await cloud.uploadFile(rows[i]); }
        catch (e) { failed.push({ name: rows[i].name, error: e.message }); }
        done++;
        if (onProgress) onProgress(done, rows.length);
      }
      App.store.set('settings.cloud.lastSync', U.now(), { silent: true });
      App.store.save();
      return { total: rows.length, done: done, failed: failed };
    },

    /** pull a file back down from Drive using the record's Drive id */
    async fetchFile(doc) {
      const record = typeof doc === 'string' ? App.store.find('documents', doc) : doc;
      if (!record || !(record.cloud || {}).driveId) throw new Error('This file has no copy in Drive.');
      await cloud.ensureToken();
      const r = await fetch(DRIVE + '/files/' + encodeURIComponent(record.cloud.driveId) + '?alt=media', { headers: authHeader() });
      if (!r.ok) throw new Error(explain(new Error('Drive returned HTTP ' + r.status)));
      const blob = await r.blob();
      await App.files.put(record.id, blob);
      App.store.patch('documents', record.id, { missing: false, backend: 'drive+local' });
      App.store.save(true);
      return blob;
    },

    /** the studio's own Drive folder, opened in a new tab */
    async openFolder() {
      const id = await cloud.folder();
      U.openUrl('https://drive.google.com/drive/folders/' + id);
    }
  };

  /* one quiet automatic backup after real changes, at most every few minutes */
  let autoTimer = null;
  App.on('state:changed', () => {
    if (!App.store.get('settings.cloud.auto', false)) return;
    if (!cloud.configured()) return;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      cloud.backupNow('auto').catch(e => {
        App.store.set('settings.cloud.lastError', String(e.message).split('\n')[0], { silent: true });
        App.store.save();
      });
    }, 4 * 60 * 1000);
  });
})(window);

  <script>
/* ===== assets/js/signin.js ===== */
/* =============================================================================
   Triverse OS — the way in
   A real sign-in page: sign in with Google to keep the whole workspace in the
   studio's own Drive folder and pick it up on any device, or open this device's
   copy. Nothing renders until this resolves.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;

  const SESSION_KEY = 'triverse.os.session';
  const SESSION_DAYS = 14;

  let overlay = null;
  let onDone = null;

  function readSession() {
    try {
      const raw = global.localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return s && s.at ? s : null;
    } catch (e) { return null; }
  }

  function writeSession(info) {
    try { global.localStorage.setItem(SESSION_KEY, JSON.stringify(info || {})); } catch (e) {}
  }

  function company() { return App.store.get('settings.company', {}) || {}; }

  function mark() {
    const logo = App.brand && App.brand.logo ? App.brand.logo() : '';
    if (logo) return '<img src="' + U.attr(logo) + '" alt="" />';
    return '<span>' + U.esc(App.brand && App.brand.initials ? App.brand.initials() : 'TS') + '</span>';
  }

  function socials() {
    const co = company();
    const list = (App.dict && App.dict.socials) || [];
    const soc = co.socials || {};
    const links = list.map(s => {
      const raw = s.key === 'website' ? co.website : s.key === 'portfolio' ? co.portfolio : soc[s.key];
      const href = s.url(raw || '');
      if (!href) return '';
      return '<a href="' + U.esc(href) + '" target="_blank" rel="noopener" title="' + U.esc(s.label) + '" class="signin__social">' +
        '<i class="fa-' + (s.brand ? 'brands' : 'solid') + ' ' + s.icon + '"></i></a>';
    }).filter(Boolean);
    if (!links.length) return '';
    return '<div class="signin__socials">' + links.join('') + '</div>';
  }

  function mount(html) {
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'signin-screen';
      overlay.className = 'signin';
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = html;
    overlay.querySelectorAll('[data-signin]').forEach(el => {
      el.addEventListener('click', () => handle(el.getAttribute('data-signin')));
    });
    return overlay;
  }

  function note(message, tone) {
    const box = overlay && overlay.querySelector('.signin__message');
    if (!box) return;
    box.className = 'signin__message' + (tone ? ' is-' + tone : '');
    box.textContent = message || '';
    box.style.display = message ? '' : 'none';
  }

  function busy(button, label) {
    const btn = overlay && overlay.querySelector('[data-signin="' + button + '"]');
    if (btn) { btn.disabled = true; btn.classList.add('is-busy'); }
    overlay.querySelectorAll('.signin__actions button').forEach(b => { if (b !== btn) b.disabled = true; });
    if (label) note(label, 'busy');
  }

  function release() {
    if (!overlay) return;
    overlay.querySelectorAll('.signin__actions button').forEach(b => { b.disabled = false; b.classList.remove('is-busy'); });
  }

  function finish(info, payload) {
    writeSession(Object.assign({ at: Date.now(), device: deviceLabel() }, info || {}));
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    overlay = null;
    const next = onDone;
    onDone = null;
    if (next) next(payload);
  }

  function deviceLabel() {
    return location.host || (location.protocol === 'file:' ? 'this computer' : location.hostname);
  }

  function show() {
    const co = company();
    const wired = App.cloud && App.cloud.hasClientId();
    mount(
      '<div class="signin__glow" aria-hidden="true"></div>' +
      '<div class="signin__shell">' +

      '<section class="signin__aside">' +
        '<div class="signin__brand">' +
          '<span class="signin__mark">' + mark() + '</span>' +
          '<span><b>' + U.esc(co.name || 'Triverse Studio') + '</b>' +
          '<i>' + U.esc(co.tagline || 'Software solution & digital studio') + '</i></span>' +
        '</div>' +
        '<h1 class="signin__headline">Every client, website,<br />invoice and file —<br /><em>in one place.</em></h1>' +
        '<ul class="signin__points">' +
          '<li>' + App.ui.icon('fa-cloud-arrow-up', 'text-accentMint') + ' The whole workspace lives in your Google Drive folder.</li>' +
          '<li>' + App.ui.icon('fa-mobile-screen', 'text-accentMint') + ' Sign in on any device and everything is already there.</li>' +
          '<li>' + App.ui.icon('fa-lock', 'text-accentMint') + ' AES-256 encryption when you protect the workspace with a passphrase.</li>' +
          '<li>' + App.ui.icon('fa-map-location-dot', 'text-accentMint') + ' Find businesses, build their site, message them, get paid.</li>' +
        '</ul>' +
        socials() +
        '<p class="signin__foot">' + U.esc(deviceLabel()) + '</p>' +
      '</section>' +

      '<section class="signin__panel">' +
        '<div class="signin__card">' +
          '<p class="signin__eyebrow">Welcome</p>' +
          '<h2 class="signin__title">Sign in</h2>' +
          '<p class="signin__sub">Choose how this device loads the studio workspace.</p>' +

          '<div class="signin__message" style="display:none"></div>' +

          '<div class="signin__actions">' +
            '<button type="button" class="signin__btn signin__btn--google" data-signin="google"' + (wired ? '' : ' disabled') + '>' +
              '<i class="fa-brands fa-google"></i><span>Continue with Google Drive</span>' +
            '</button>' +
            (wired ? '' :
              '<p class="signin__hint">Google sign-in is off until the OAuth client ID is saved in Settings → Cloud.</p>') +
            '<div class="signin__or"><span>or</span></div>' +
            '<button type="button" class="signin__btn" data-signin="device">' +
              '<i class="fa-solid fa-laptop"></i><span>Continue on this device</span>' +
            '</button>' +
            (App.vault.has()
              ? '<button type="button" class="signin__btn signin__btn--quiet" data-signin="passphrase">' +
                  '<i class="fa-solid fa-shield-halved"></i><span>Unlock with my passphrase</span></button>'
              : '') +
            '<button type="button" class="signin__btn signin__btn--quiet" data-signin="file">' +
              '<i class="fa-solid fa-file-import"></i><span>Open a backup file</span></button>' +
          '</div>' +

          '<p class="signin__legal">Your data stays yours. Nothing is uploaded anywhere unless you press the Google button above.</p>' +
        '</div>' +
      '</section>' +
      '</div>'
    );
  }

  async function handle(action) {
    if (action === 'device') {
      finish({ mode: 'device' });
      return;
    }

    if (action === 'google') {
      busy('google', 'Opening Google sign-in…');
      try {
        await App.cloud.connect(true);
        note('Reading the studio folder in Drive…', 'busy');
        const info = await App.cloud.restoreLatest();
        App.store.load();
        App.store.set('settings.cloud.connected', true, { silent: true });
        App.store.set('settings.cloud.account', App.store.get('settings.cloud.account', ''), { silent: true });
        App.store.save();
        finish({ mode: 'google', account: App.store.get('settings.cloud.account', ''), restored: info && info.name });
      } catch (e) {
        release();
        note(String((e && e.message) || e).split('\n').slice(0, 2).join(' '), 'error');
      }
      return;
    }

    if (action === 'file') {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = () => {
        const file = input.files && input.files[0];
        if (!file) return;
        busy('file', 'Reading the backup…');
        const fr = new FileReader();
        fr.onload = () => {
          let data = null;
          try { data = JSON.parse(String(fr.result)); } catch (e) { data = null; }
          if (!data || !data.state) { release(); note('That file is not a Triverse Studio backup.', 'error'); return; }
          App.store.importJSON(String(fr.result));
          App.store.load();
          finish({ mode: 'file' });
        };
        fr.onerror = () => { release(); note('That file could not be read.', 'error'); };
        fr.readAsText(file);
      };
      input.click();
    }
  }

  const auth = App.auth = {
    KEY: SESSION_KEY,

    signedIn() {
      const s = readSession();
      return Boolean(s && s.at && (Date.now() - s.at) < SESSION_DAYS * 24 * 60 * 60 * 1000);
    },
    account() { const s = readSession(); return (s && s.account) || ''; },
    mode() { const s = readSession(); return (s && s.mode) || ''; },
    signedInAt() { const s = readSession(); return (s && s.at) || 0; },

    mark(info) { writeSession(Object.assign({ at: Date.now() }, info || {})); },

    signOut() {
      try { global.localStorage.removeItem(SESSION_KEY); } catch (e) {}
      if (App.cloud) { try { App.cloud.disconnect(); } catch (e) {} }
      location.reload();
    },

    /**
     * The door. A protected workspace is asked for its passphrase (that screen
     * is the sign-in page); otherwise this page appears unless the device is
     * already signed in. `next` receives the decrypted workspace when there is
     * one, so the two steps never double up.
     */
    begin(next) {
      onDone = next;
      if (App.vault.has()) {
        App.vault.screen({
          mode: 'unlock',
          onSubmit: state => {
            auth.mark({ mode: 'passphrase' });
            const go = onDone; onDone = null;
            if (go) go(state);
          }
        });
        return;
      }
      if (auth.signedIn()) { onDone = null; next(); return; }
      show();
    },

    /** re-open the page on purpose (Settings → sign out / switch account) */
    open(next) {
      onDone = next || function () {};
      show();
    }
  };
})(window);

</script>

/* ===== assets/js/pricing.js ===== */
/* =============================================================================
   Triverse OS — pricing
   Every figure in this system is Ethiopian Birr (ETB) and is built from the
   service catalogue, never guessed. The website line starts at 15,000 Birr and
   the QR menu line runs from 15,000 to 30,000 — the top of that range is a
   table QR menu with ordering and a call-waiter button.

   A quote is always:  base package  +  only the functions this business needs.

   Nothing here invents a number. If the catalogue does not contain a service,
   the quote does not contain it either.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;

  /* quoted in Birr; the ids match the service catalogue in data.js */
  const BASE = { website: 'svc_site_starter', qrmenu: 'svc_qr_menu' };

  /* an add-on only ever appears because a reason asked for it */
  const FUNCTION_BY_SECTION = {
    booking: 'add_booking',
    order: 'add_ordering',
    delivery: 'add_ordering',
    qr: 'svc_qr_menu'
  };

  /* business types whose first product is the QR menu, not a website */
  const QR_FIRST = ['restaurant', 'cafe', 'coffee', 'fastfood', 'bakery', 'juice', 'lounge', 'bar'];

  function catalogue() {
    return App.store.get('catalog', []).filter(s => s.active !== false);
  }
  function service(id) {
    return catalogue().filter(s => s.id === id)[0] || null;
  }
  function priceOf(id) {
    const s = service(id);
    return s ? Number(s.price) || 0 : 0;
  }

  const pricing = App.pricing = {
    BASE: BASE,
    QR_FIRST: QR_FIRST,

    /**
     * The minimum a business can be quoted, in Birr. This is the honest floor:
     * a standard website, or the entry QR menu.
     */
    floor(kind) {
      return priceOf(BASE[kind === 'qrmenu' ? 'qrmenu' : 'website']);
    },

    /**
     * The most the QR menu line can reach — ordering plus call-waiter.
     * Kept as a function so the ceiling follows the catalogue if prices change.
     */
    qrCeiling() {
      const base = priceOf('svc_qr_menu');
      return priceOf('svc_qr_menu_order') || (base + priceOf('add_ordering') + priceOf('add_call_waiter'));
    },

    /** does this business sell food and drink? */
    isFood(lead) {
      const t = App.dict.typeOf(lead && lead.businessType);
      return QR_FIRST.indexOf(t.key) !== -1;
    },

    /**
     * What this business actually needs, read from its type's section list and
     * its Google record. These become the line items of the quote.
     */
    suggestWants(lead) {
      const t = App.dict.typeOf(lead && lead.businessType);
      const sections = t.sections || [];
      const food = pricing.isFood(lead);
      const wants = {
        kind: food ? 'qrmenu' : 'website',
        booking: sections.indexOf('booking') !== -1,
        ordering: sections.indexOf('order') !== -1,
        callWaiter: false,
        bilingual: false,
        extraPages: 0,
        /* the studio's own work is what is quoted by default; domain, hosting
           and profile setup are offered separately so a plain website stays at
           the 15,000 Birr figure and the client can see what each extra costs */
        googleProfile: false,
        domain: false
      };
      /* a business with a strong review count is ready for the bigger package */
      if (!food && (lead && (lead.reviews || 0) >= 80)) wants.extraPages = 2;
      /* a kitchen that already takes orders by phone wants the table button too */
      if (food && (lead && (lead.reviews || 0) >= 120)) wants.callWaiter = true;
      return wants;
    },

    /**
     * The quote. Returns the exact lines, the total, and the range, so the UI can
     * show the client what each function costs instead of one unexplained number.
     */
    quote(lead, wants) {
      wants = Object.assign({}, pricing.suggestWants(lead), wants || {});
      const kind = wants.kind === 'qrmenu' ? 'qrmenu' : 'website';
      const lines = [];
      const push = (id, why) => {
        const s = service(id);
        if (!s) return;
        lines.push({ id: s.id, name: s.name, price: Number(s.price) || 0, unit: s.unit || 'one-time', desc: s.desc || '', why: why || '' });
      };

      if (kind === 'qrmenu') {
        /* the QR menu line has exactly two shapes: entry, or ordering + waiter */
        const full = wants.ordering && wants.callWaiter;
        push(full ? 'svc_qr_menu_order' : 'svc_qr_menu', full
          ? 'Table QR menu with ordering and a call-waiter button — the top of this line'
          : 'Table QR menu with photos and a WhatsApp button — the 15,000 Birr entry point');
      } else {
        push(BASE.website, 'The 15,000 Birr starting point for any website');
        if (wants.ordering) push('add_ordering', 'They take orders — this puts the order form on the site');
        if (wants.booking) push('add_booking', 'Their customers book appointments, so the site must take bookings');
        if (wants.callWaiter) push('add_call_waiter', 'A per-table button for the counter');
      }

      if (wants.bilingual) push('add_bilingual', 'Amharic alongside English');
      if (wants.extraPages > 0) {
        for (let i = 0; i < wants.extraPages; i++) push('add_extra_page', 'Extra page beyond the package');
      }
      if (wants.googleProfile) push('add_google_profile', 'Their Google listing needs fixing before traffic can convert');
      if (wants.domain) push('add_domain_host', 'Domain, hosting, SSL and business email for the first year');

      const total = U.sum(lines, l => l.price);
      const days = Math.max.apply(null, lines.map(l => {
        const s = service(l.id);
        return Number((s && s.deliveryDays) || 0);
      }).concat([3]));

      return {
        kind: kind,
        wants: wants,
        lines: lines,
        ids: lines.map(l => l.id),
        items: lines.map(l => service(l.id)).filter(Boolean),
        names: lines.map(l => l.name + (l.unit && l.unit !== 'one-time' ? ' (' + l.unit + ')' : '')),
        total: total,
        days: days,
        deliveryLabel: days <= 3 ? '2–3 days' : days <= 7 ? '5–7 days' : days <= 14 ? '1–2 weeks' : days + '+ days',
        currency: 'ETB'
      };
    },

    /**
     * What the same business could add later, priced — used in the proposal so
     * the upsell is a real number rather than "ask us".
     */
    upsell(lead, quote) {
      const have = (quote || pricing.quote(lead)).ids;
      return catalogue()
        .filter(s => (s.addon || s.qr || s.category === 'website') && s.price > 0)
        .filter(s => have.indexOf(s.id) === -1)
        .filter(s => s.category !== 'website' || s.id === 'svc_ecommerce' || s.id === 'svc_site_business' || s.id === 'svc_site_premium')
        .slice(0, 8)
        .map(s => ({ id: s.id, name: s.name, price: Number(s.price) || 0, unit: s.unit || 'one-time', desc: s.desc || '' }));
    },

    /** plain-text quote the studio can paste into WhatsApp */
    text(lead, quote) {
      const q = quote || pricing.quote(lead);
      const rows = q.lines.map(l => '• ' + l.name + ' — ' + U.money(l.price) + ' / ' + l.unit);
      return [
        'Quote for ' + (lead.name || 'your business'),
        'All prices are in Ethiopian Birr.',
        '',
        rows.join('\n'),
        '',
        'Total: ' + U.money(q.total),
        'Estimated delivery: ' + q.deliveryLabel
      ].join('\n');
    }
  };
})(window);

</script>

/* =============================================================================
   Triverse OS — outreach engine
   Merge fields, per-business service recommendation, channel detection,
   one-click sending (deep links + optional API/webhook), reply triage.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;

  const FOOD = ['restaurant', 'cafe', 'fastfood', 'hotel', 'grocery'];
  const SOFTWARE = ['school', 'tuition', 'logistics', 'clinic', 'accounting', 'itfirm', 'hotel'];
  const DESIGN_FIRST = ['boutique', 'photographer', 'eventdecor', 'printing'];

  const msg = App.msg = {

    /* ------------------------------------------------------------ variables */
    vars(lead, extra) {
      lead = lead || {};
      extra = extra || {};
      const c = App.store.get('settings.company', {});
      const t = App.dict.typeOf(lead.businessType);
      const rec = extra.rec || msg.recommend(lead);
      const rating = Number(lead.rating) || 0;
      const phone = lead.phone || lead.intlPhone || '';
      const wa = lead.intlPhone || (lead.whatsapp ? phone : '') || c.whatsapp || '';
      const out = {
        business: lead.name || 'there',
        category: lead.category || t.label,
        city: lead.city || App.store.get('settings.google.city', ''),
        area: (lead.address || '').split(',').slice(-2).join(',').trim(),
        rating: rating ? rating.toFixed(1) : '—',
        reviews: U.num(lead.reviews || 0),
        website: lead.website || '',
        phone: phone,
        whatsapp: wa || '',
        telegram: lead.telegram || '',
        email: lead.email || '',
        sender: c.senderName || c.owner || 'Studio Owner',
        sender_role: c.senderRole || 'Business Development',
        company: c.name || 'Triverse Studio',
        company_short: c.shortName || c.name || 'Triverse Studio',
        phone_company: c.phone || '',
        portfolio: c.portfolio || c.website || '',
        website_company: c.website || '',
        working_hours: c.workingHours || '',
        hook: t.pitch || 'a website that turns Google Maps visitors into paying customers',
        offer: rec.names.join(', '),
        price: U.money(rec.total),
        price_raw: rec.total,
        delivery: rec.deliveryLabel,
        services: rec.names.slice(1).join(', '),
        employees: (lead.reviews || 0) > 150 ? '25+' : '15+',
        invoice: extra.invoice || '',
        due: extra.due || '',
        amount: extra.amount ? U.money(extra.amount) : '',
        cta: 'Shall I send the link?',
        year: String(new Date().getFullYear())
      };
      out.signature = msg.renderText(App.store.get('settings.outreach.signature', ''), out);
      if (!out.signature) out.signature = '— ' + out.sender + ', ' + out.company + '\n' + out.phone_company;
      return out;
    },

    renderText(text, vars) {
      return String(text || '').replace(/\{\{\s*([a-z_]+)\s*\}\}/gi, (m, k) => {
        const key = String(k).toLowerCase();
        return vars[key] === undefined || vars[key] === null ? '' : String(vars[key]);
      });
    },

    /** fill a template with the business's real data */
    render(tpl, lead, extra) {
      if (!tpl) return '';
      const vars = msg.vars(lead, extra);
      return {
        subject: msg.renderText(tpl.subject || '', vars),
        body: msg.renderText(tpl.body || '', vars),
        vars: vars,
        templateId: tpl.id,
        channel: tpl.channel
      };
    },

    templates() { return App.store.get('messages.templates', []).filter(t => t.active !== false); },
    template(id) { return msg.templates().filter(t => t.id === id)[0] || null; },

    /** choose the best first-touch template for a business */
    defaultTemplate(lead) {
      const hasSite = Boolean(lead.website);
      const list = msg.templates();
      const byId = id => list.filter(t => t.id === id)[0];
      if (!hasSite) {
        if (FOOD.indexOf(lead.businessType) !== -1) return byId('msg_wa_qr_menu') || byId('msg_wa_first_nowebsite') || list[0];
        if (SOFTWARE.indexOf(lead.businessType) !== -1) return byId('msg_wa_hr_system') || byId('msg_wa_first_nowebsite') || list[0];
        return byId('msg_wa_first_nowebsite') || list[0];
      }
      return byId('msg_wa_first_generic') || list[0];
    },

    /** which of our products to pitch to this business */
    /**
     * Which of our products to pitch to this business, priced in Birr.
     * A business with no website is quoted the website line built from its own
     * needs (see App.pricing); a business that already has one gets care work.
     */
    recommend(lead) {
      const catalog = App.store.get('catalog', []).filter(s => s.active !== false);
      const pick = id => catalog.filter(s => s.id === id)[0];
      const hasSite = Boolean(lead && lead.website);

      if (!hasSite && App.pricing) {
        const q = App.pricing.quote(lead);
        return {
          ids: q.ids,
          items: q.items,
          names: q.names,
          lines: q.lines,
          total: q.total,
          days: q.days,
          deliveryLabel: q.deliveryLabel,
          currency: 'ETB'
        };
      }

      let ids;
      if (!hasSite) {
        ids = ['svc_site_starter', 'svc_hosting'];
      } else {
        ids = ['svc_maintenance'];
        if (FOOD.indexOf(lead.businessType) !== -1) ids.push('svc_qr_menu');
        else if (DESIGN_FIRST.indexOf(lead.businessType) !== -1) ids.push('svc_social_pack');
        else ids.push('svc_ads_boost');
      }
      const items = ids.map(pick).filter(Boolean);
      const total = U.sum(items, i => Number(i.price) || 0);
      const days = Math.max.apply(null, items.map(i => Number(i.deliveryDays) || 0).concat([3]));
      return {
        ids: items.map(i => i.id),
        items: items,
        names: items.map(i => i.name + (i.unit && i.unit !== 'one-time' ? ' (' + i.unit + ')' : '')),
        total: total,
        days: days,
        deliveryLabel: days <= 3 ? '2–3 days' : days <= 7 ? '5–7 days' : days + '+ days'
      };
    },

    /* --------------------------------------------------------------- channels */
    channelsFor(lead) {
      const c = App.store.get('settings.company', {});
      const phone = lead.intlPhone || lead.phone || '';
      const list = [];
      if (phone && (lead.whatsapp || lead.source !== 'google')) list.push({ key: 'whatsapp', address: phone, ready: true });
      if (lead.telegram) list.push({ key: 'telegram', address: lead.telegram, ready: true });
      if (lead.email) list.push({ key: 'email', address: lead.email, ready: true });
      if (phone) { list.push({ key: 'sms', address: phone, ready: true }); list.push({ key: 'call', address: phone, ready: true }); }
      if (lead.socials && lead.socials.facebook) list.push({ key: 'facebook', address: lead.socials.facebook, ready: true });
      if (lead.socials && lead.socials.instagram) list.push({ key: 'instagram', address: lead.socials.instagram, ready: true });
      if (!list.length && c.whatsapp) list.push({ key: 'whatsapp', address: c.whatsapp, ready: false, note: 'No number saved for this business — add one first' });
      return list;
    },

    /** normalise to international digits for wa.me / tel: links */
    dial(lead, fallbackCountry) {
      const c = App.store.get('settings.company', {});
      let d = U.digits(lead.intlPhone || lead.phone || '');
      const cc = U.digits(fallbackCountry || c.defaultCountryCode || '');
      if (!d) return '';
      if (d.charAt(0) === '0' && cc) d = cc + d.slice(1);
      else if (d.length <= 10 && cc && d.indexOf(cc) !== 0) d = cc + d.replace(/^0+/, '');
      return d;
    },

    deepLink(channel, lead, payload) {
      const body = payload && payload.body ? payload.body : '';
      const subject = payload && payload.subject ? payload.subject : '';
      const enc = encodeURIComponent;
      const c = App.store.get('settings.company', {});
      if (channel === 'whatsapp') {
        const d = msg.dial(lead);
        return d ? 'https://wa.me/' + d + '?text=' + enc(body) : '';
      }
      if (channel === 'telegram') {
        const tg = String(lead.telegram || '').replace(/^@/, '').trim();
        if (tg) return 'https://t.me/' + tg;
        const d = msg.dial(lead);
        return d ? 'https://t.me/+' + d : '';
      }
      if (channel === 'email') {
        return 'mailto:' + (lead.email || '') + '?subject=' + enc(subject || ('A website concept for ' + lead.name)) + '&body=' + enc(body);
      }
      if (channel === 'sms') {
        const d = msg.dial(lead);
        return d ? 'sms:+' + d + '?&body=' + enc(body) : '';
      }
      if (channel === 'call') {
        const d = msg.dial(lead);
        return d ? 'tel:+' + d : '';
      }
      if (channel === 'facebook') return lead.socials && lead.socials.facebook ? lead.socials.facebook : (c.portfolioUrl || '');
      if (channel === 'instagram') return lead.socials && lead.socials.instagram ? lead.socials.instagram : '';
      return '';
    },

    /**
     * One tap send.
     *  - with an API/webhook configured (WhatsApp Cloud API or your own sender) → posts the message
     *  - otherwise → opens the chat with the message prefilled/copied so you press send
     * Always logs an outreach record so the pipeline stays accurate.
     */
    send(o) {
      const lead = o.lead, channel = o.channel, body = o.body || '';
      const payload = { body: body, subject: o.subject || '' };
      const integration = App.store.get('settings.integration', {});
      const canApi = integration.autoSendEnabled && integration.webhookUrl;

      const finish = (via, url) => {
        msg.logOutreach(lead, {
          channel: channel, templateId: o.templateId, body: body, subject: o.subject,
          via: via, url: url || ''
        });
        return { via: via, url: url || '' };
      };

      if (canApi) {
        const to = channel === 'email' ? lead.email : (channel === 'telegram' ? lead.telegram : msg.dial(lead));
        return fetch(integration.webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Triverse-Token': integration.webhookToken || '' },
          body: JSON.stringify({
            channel: channel, to: to, toName: lead.name, message: body, subject: o.subject || '',
            leadId: lead.id, sentBy: App.store.get('settings.company.senderName', '')
          })
        }).then(res => {
          if (!res.ok) throw new Error('Sender API responded HTTP ' + res.status);
          App.ui.toast('Sent through your API sender ✓', 'lime');
          return finish('api', '');
        }).catch(err => {
          App.ui.toast('API send failed (' + err.message + ') — opening the chat manually instead', 'amber');
          const url = msg.deepLink(channel, lead, payload);
          if (url) U.openUrl(url);
          return finish('manual', url);
        });
      }

      const url = msg.deepLink(channel, lead, payload);
      if (url) {
        U.openUrl(url);
        if (channel !== 'email') U.copy(body);
      }
      return Promise.resolve(finish('manual', url));
    },

    logOutreach(lead, data) {
      const leadRow = App.store.find('leads', lead.id) || lead;
      const outreach = (leadRow.outreach || []).slice(0, 60);
      outreach.unshift({
        id: U.uid('out'), at: U.now(), channel: data.channel, templateId: data.templateId || '',
        body: data.body || '', subject: data.subject || '', status: 'sent', via: data.via || 'manual',
        url: data.url || '', reply: ''
      });
      const patch = { outreach: outreach };
      if (['new', 'qualified'].indexOf(leadRow.status) !== -1) patch.status = 'contacted';
      const days = App.store.get('settings.outreach.followUpDays', 3);
      if (!leadRow.nextFollowUp || leadRow.nextFollowUp < U.todayISO()) patch.nextFollowUp = U.addDays(U.todayISO(), days);
      App.store.patch('leads', leadRow.id, patch);
      App.log('message', 'Sent ' + App.dict.chanLabel(data.channel) + ' message to ' + leadRow.name, leadRow.id);
      return patch;
    },

    /* ------------------------------------------------------------ reply triage */
    classify(text) {
      const raw = String(text || '').toLowerCase().trim();
      const kw = App.store.get('messages.keywords', {});
      const reasons = [];
      let score = 0;
      const test = (needle) => {
        const n = needle.toLowerCase();
        if (n.length <= 2) return new RegExp('(^|\\s)' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\s|$|[.,!])').test(raw);
        return raw.indexOf(n) !== -1;
      };
      (kw.negative || []).forEach(k => { if (test(k)) { score += k.indexOf(' ') !== -1 ? -3 : -2; reasons.push('“' + k + '”'); } });
      (kw.positive || []).forEach(k => { if (test(k)) { score += k.indexOf(' ') !== -1 ? 2 : 1; reasons.push('“' + k + '”'); } });
      const wantsSite = (kw.wantSite || []).some(k => test(k));
      if (wantsSite) { score += 2; reasons.push('mentioned a website/software need'); }
      const sentiment = score > 0 ? 'positive' : score < 0 ? 'negative' : 'neutral';
      return { sentiment: sentiment, score: score, wantsSite: wantsSite, reasons: U.uniq(reasons).slice(0, 6) };
    },

    /** store an incoming reply and move the lead accordingly */
    recordReply(leadId, text, channel) {
      const lead = App.store.find('leads', leadId);
      if (!lead) return null;
      const auto = App.store.get('settings.outreach.autoClassify', true);
      const res = auto ? msg.classify(text) : { sentiment: 'neutral', score: 0, wantsSite: false, reasons: ['manual review'] };
      /* positive → hot list (interested), negative → do-not-chase, unsure → needs triage */
      const status = res.sentiment === 'positive' ? 'interested'
        : res.sentiment === 'negative' ? 'rejected' : 'replied';
      const dropped = ['replied-positive', 'replied-negative', 'do-not-chase', 'wants-website', 'needs-qualify'];
      const tags = (lead.tags || []).filter(t => dropped.indexOf(t) === -1);
      if (res.sentiment === 'positive') tags.push('replied-positive');
      if (res.sentiment === 'negative') { tags.push('replied-negative'); tags.push('do-not-chase'); }
      if (res.wantsSite) tags.push('wants-website');
      if (res.sentiment === 'positive' && !res.wantsSite) tags.push('needs-qualify');

      const outreach = (lead.outreach || []).slice();
      if (outreach.length && !outreach[0].reply) outreach[0] = Object.assign({}, outreach[0], { reply: text, replyAt: U.now() });

      const nextFollowUp = res.sentiment === 'negative' ? ''
        : res.sentiment === 'positive' ? U.addDays(U.todayISO(), App.store.get('settings.outreach.followUpDays', 3))
          : U.addDays(U.todayISO(), App.store.get('settings.outreach.secondFollowUpDays', 7));

      App.store.patch('leads', leadId, {
        reply: { text: text, sentiment: res.sentiment, score: res.score, reasons: res.reasons, at: U.now(), channel: channel || 'whatsapp' },
        status: status, tags: tags, outreach: outreach, nextFollowUp: nextFollowUp, lastReplyAt: U.now()
      });
      App.log(res.sentiment === 'negative' ? 'reply-negative' : 'reply', lead.name + ' replied (' + res.sentiment + '): “' + String(text).slice(0, 90) + '”', leadId);

      const skip = App.store.get('settings.outreach.autoAdvanceOnNegative', true);
      return {
        sentiment: res.sentiment, score: res.score, reasons: res.reasons, wantsSite: res.wantsSite,
        status: status, lead: App.store.find('leads', leadId),
        nextLeadId: (res.sentiment === 'negative' && skip) ? msg.nextLead(leadId, l => ['new', 'qualified'].indexOf(l.status) !== -1) : ''
      };
    },

    /** the queue the operator is working through (last search order, filtered) */
    queueIds() {
      const q = App.router.q.queue;
      const all = App.store.get('leads', []);
      if (q && q.length) {
        const map = {};
        all.forEach(l => { map[l.id] = l; });
        return q.filter(id => map[id]);
      }
      return all.map(l => l.id);
    },

    nextLead(currentId, pred) {
      const ids = msg.queueIds();
      const map = {};
      App.store.get('leads', []).forEach(l => { map[l.id] = l; });
      const start = Math.max(0, ids.indexOf(currentId));
      for (let i = start + 1; i < ids.length + start; i++) {
        const id = ids[i % ids.length];
        if (!id || id === currentId) continue;
        const lead = map[id];
        if (!lead) continue;
        if (!pred || pred(lead)) return id;
      }
      return '';
    },

    /** quick stats for the dashboard / outreach screen */
    stats(leads) {
      const list = leads || App.store.get('leads', []);
      const contacted = list.filter(l => l.outreach && l.outreach.length);
      const replied = list.filter(l => l.reply);
      const positive = replied.filter(l => l.reply.sentiment === 'positive');
      const negative = replied.filter(l => l.reply.sentiment === 'negative');
      return {
        total: list.length,
        noWebsite: list.filter(l => !l.website).length,
        contacted: contacted.length,
        sent: U.sum(contacted, l => l.outreach.length),
        replied: replied.length,
        replyRate: contacted.length ? Math.round((replied.length / contacted.length) * 100) : 0,
        positive: positive.length,
        negative: negative.length,
        interested: list.filter(l => l.status === 'interested').length,
        won: list.filter(l => l.status === 'won').length,
        positiveRate: replied.length ? Math.round((positive.length / replied.length) * 100) : 0,
        pipelineValue: U.sum(list.filter(l => ['interested', 'proposal', 'contacted', 'replied'].indexOf(l.status) !== -1), l => Number(l.value) || 0)
      };
    }
  };
})(window);
