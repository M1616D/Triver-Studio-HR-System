          if (!s) return;
          App.store.set('ui.pay.projectTitle', s.name, { silent: true });
          App.store.set('ui.pay.amount', s.price, { silent: true });
          const t = root.querySelector('[data-model="ui.pay.projectTitle"]');
          const a = root.querySelector('[data-model="ui.pay.amount"]');
          if (t) t.value = s.name; if (a) a.value = s.price;
          const cls = root.querySelector('[data-model="ui.pay.method"]');
          if (cls) cls.value = cls.value || 'Telebirr';
        });
        const clientSel = root.querySelector('[data-model="ui.pay.clientId"]');
        if (clientSel) clientSel.addEventListener('change', () => App.store.set('ui.pay.clientId', clientSel.value, { silent: true }));
      }
    });
  }

  /* -------------------------------- actions -------------------------------- */
  App.action('pay.applyFilters', () => {
    const s = q();
    s.search = App.store.get('ui.paySearch', '');
    s.clientId = App.store.get('ui.payClient', s.clientId);
    s.month = App.store.get('ui.payMonth', s.month);
    s.method = App.store.get('ui.payMethod', s.method);
    App.emit('state:changed', { path: 'payfilter' });
  });
  App.action('pay.new', el => payForm('', el ? el.getAttribute('data-arg') : ''));
  App.action('pay.edit', el => payForm(el.getAttribute('data-arg')));
  App.action('pay.filter', el => { q().status = el.getAttribute('data-arg'); App.emit('state:changed', { path: 'payfilter' }); });
  App.action('pay.save', el => {
    const id = el.getAttribute('data-arg');
    const g = k => App.store.get('ui.pay.' + k, '');
    const data = {
      invoiceNo: g('invoiceNo'), clientId: g('clientId'), serviceId: g('serviceId'), projectTitle: g('projectTitle'),
      amount: Number(g('amount')) || 0, amountPaid: Number(g('amountPaid')) || 0, method: g('method'), status: g('status'),
      issueDate: g('issueDate'), dueDate: g('dueDate'), paidDate: g('paidDate'), recurring: g('recurring'),
      renewalDate: g('renewalDate'), currency: g('currency'), notes: g('notes')
    };
    if (!data.clientId) { ui.toast('Pick a client (add one first if the list is empty)', 'amber'); return; }
    if (!data.projectTitle) data.projectTitle = (App.store.find('catalog', data.serviceId) || {}).name || 'Project';
    if (data.status === 'paid' && !data.paidDate) data.paidDate = U.todayISO();
    if (data.status === 'paid') data.amountPaid = data.amount;
    if (id) {
      App.store.patch('payments', id, data);
      ui.toast('Invoice updated', 'lime');
    } else {
      App.store.add('payments', data);
      const n = (App.store.get('counters.invoice', 0) || 0) + 1;
      App.store.set('counters.invoice', n, { silent: true });
      App.log('payment', 'Invoice ' + data.invoiceNo + ' created for ' + clientName(data.clientId) + ' · ' + U.money(data.amount), '');
      ui.toast('Invoice ' + data.invoiceNo + ' created', 'lime');
    }
    ui.closeModal();
    App.emit('state:changed', { path: 'payments' });
  });
  App.action('pay.markPaid', el => {
    const id = el.getAttribute('data-arg');
    const p = App.store.find('payments', id);
    ui.confirm({
      title: 'Mark ' + p.invoiceNo + ' as paid?', confirmLabel: 'Mark paid',
      message: U.money(balance(p)) + ' will be recorded as received today' + (p.method ? ' via ' + p.method : '') + '.',
      onConfirm() {
        App.store.patch('payments', id, { status: 'paid', amountPaid: Number(p.amount) || 0, paidDate: U.todayISO() });
        App.log('payment', U.money(p.amount) + ' received from ' + clientName(p.clientId) + ' (' + p.invoiceNo + ')', p.clientId);
        ui.toast('Payment recorded', 'lime');
      }
    });
  });
  App.action('pay.delete', el => {
    const id = el.getAttribute('data-arg');
    const p = App.store.find('payments', id);
    ui.confirm({
      title: 'Delete invoice?', tone: 'danger', confirmLabel: 'Delete', message: p.invoiceNo + ' · ' + U.money(p.amount) + ' will be removed from the ledger.',
      onConfirm() { App.store.remove('payments', id); ui.closeModal(); ui.toast('Invoice deleted', 'amber'); }
    });
  });
  App.action('pay.remind', el => {
    const p = App.store.find('payments', el.getAttribute('data-arg'));
    const c = App.store.find('clients', p.clientId);
    const tpl = App.msg.templates().filter(t => t.id === 'msg_wa_invoice')[0] || App.msg.templates()[0];
    const lead = {
      id: p.clientId, name: c ? c.name : 'Client', phone: c ? (c.whatsapp || c.phone) : '', intlPhone: c ? (c.whatsapp || c.phone) : '',
      whatsapp: true, telegram: c ? c.telegram : '', email: c ? c.email : '', businessType: c ? c.industry : 'general',
      category: App.dict.typeLabel(c ? c.industry : ''), outreach: [], reviews: 0
    };
    const body = App.msg.render(tpl, lead, { invoice: p.invoiceNo, due: U.fmtDate(p.dueDate), amount: balance(p) }).body;
    ui.modal({
      title: 'Payment reminder · ' + p.invoiceNo,
      sub: (c ? c.name : '') + ' · ' + U.money(balance(p)) + ' due ' + U.fmtDate(p.dueDate),
      size: 'lg',
      body: ui.field({ label: 'Message (editable)', model: 'ui.remindBody', value: body, rows: 10 }) +
        '<p class="text-[10px] text-textMuted mt-2">Tip: mention the method you prefer (Telebirr / CBE Birr / bank transfer) and the last 4 digits so they can verify.</p>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-lime" data-action="pay.sendRemind" data-arg="' + p.id + '"><i class="fa-brands fa-whatsapp"></i> Open WhatsApp</button>'
    });
  });
  App.action('pay.sendRemind', el => {
    const p = App.store.find('payments', el.getAttribute('data-arg'));
    const c = App.store.find('clients', p.clientId);
    const body = App.store.get('ui.remindBody', '');
    const lead = { name: c ? c.name : '', phone: c ? (c.whatsapp || c.phone) : '', intlPhone: c ? (c.whatsapp || c.phone) : '', whatsapp: true };
    const url = App.msg.deepLink('whatsapp', lead, { body: body });
    if (!url) { ui.toast('No WhatsApp number on this client', 'amber'); return; }
    U.openUrl(url); U.copy(body);
    App.log('message', 'Payment reminder sent to ' + (c ? c.name : '') + ' for ' + p.invoiceNo, p.id);
    ui.closeModal();
    ui.toast('Reminder ready in WhatsApp', 'lime');
  });
  App.action('pay.export', () => {
    const rows = filtered().map(p => ({
      invoiceNo: p.invoiceNo, client: clientName(p.clientId), project: p.projectTitle, amount: p.amount, amountPaid: p.amountPaid,
      balance: balance(p), status: effectiveStatus(p), method: p.method, issueDate: p.issueDate, dueDate: p.dueDate,
      paidDate: p.paidDate, recurring: p.recurring, renewalDate: p.renewalDate, notes: p.notes
    }));
    U.download('triverse-payments-' + U.todayISO() + '.csv', U.toCSV(rows), 'text/csv');
    ui.toast('Exported ' + rows.length + ' invoices', 'lime');
  });

  /* ----------------------------- invoice document --------------------------- */
  App.action('pay.print', el => {
    const p = App.store.find('payments', el.getAttribute('data-arg'));
    const html = invoiceHTML(p, App.store.find('clients', p.clientId));
    App.router.q.invoiceHtml = html;
    ui.modal({
      title: 'Invoice ' + p.invoiceNo,
      size: 'xl',
      body: '<p class="text-[10px] text-textMuted mb-2">Print or “Save as PDF” from the browser. Amounts are read from the ledger — edit the invoice first if anything changed.</p>' +
        ui.previewFrame(html, 560),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
        '<button class="btn btn-ghost" data-action="pay.copyInvoice">Copy HTML</button>' +
        '<button class="btn btn-lime" data-action="pay.openInvoice"><i class="fa-solid fa-print"></i> Open &amp; print</button>'
    });
  });
  App.action('pay.openInvoice', () => U.openHTML(App.router.q.invoiceHtml || '', 'invoice'));
  App.action('pay.copyInvoice', () => U.copy(App.router.q.invoiceHtml || '').then(() => ui.toast('Invoice HTML copied', 'lime')));

  function invoiceHTML(p, c) {
    const co = App.store.get('settings.company', {});
    const cur = p.currency || co.currency || 'ETB';
    const method = p.method || 'Bank transfer';
    const methodNote = {
      'Telebirr': 'Telebirr transfer to ' + (co.phone || 'our number') + ' — put ' + p.invoiceNo + ' in the reason.',
      'CBE Birr': 'CBE Birr transfer to ' + (co.phone || 'our number') + ' — reference: ' + p.invoiceNo,
      'M-Pesa': 'M-Pesa transfer — reference: ' + p.invoiceNo,
      'Chapa': 'Chapa payment link can be raised on request.',
      'Bank transfer (CBE)': 'Commercial Bank of Ethiopia — account details shared on request, reference: ' + p.invoiceNo,
      'Bank transfer (Awash)': 'Awash Bank — account details shared on request, reference: ' + p.invoiceNo,
      'Bank transfer (Dashen)': 'Dashen Bank — account details shared on request, reference: ' + p.invoiceNo,
      'Card': 'Card payment link shared on request.',
      'PayPal': 'PayPal invoice can be raised on request.',
      'Wise': 'Wise transfer — reference: ' + p.invoiceNo,
      'Cash': 'Cash / hand delivery.',
      'Crypto/USDT': 'USDT (TRC20) — wallet shared on request.',
      'Other': 'Contact us for the payment details.'
    }[method] || '';
    const rows = [[p.projectTitle || 'Project', p.notes || '', Number(p.amount) || 0]];
    const bal = balance(p);
    return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />' +
      '<meta name="viewport" content="width=device-width, initial-scale=1" />' +
      '<title>Invoice ' + U.esc(p.invoiceNo) + ' — ' + U.esc(co.name || '') + '</title>' +
      '<style>' +
      '*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#141a23;font-family:"Segoe UI",system-ui,sans-serif;padding:24px}' +
      '.sheet{max-width:820px;margin:0 auto;background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:32px;box-shadow:0 12px 40px -24px rgba(15,23,42,.35)}' +
      '.top{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #e7ebf2;padding-bottom:20px}' +
      'h1{margin:0;font-size:22px}.mark{width:44px;height:44px;border-radius:12px;background:#cbfa31;color:#0a0b0d;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;margin-bottom:8px}' +
      '.muted{color:#5f6a7a;font-size:12px;margin:2px 0}.badge{display:inline-block;background:#eaf7cf;color:#4a7108;border:1px solid rgba(101,145,22,.35);border-radius:999px;padding:3px 12px;font-size:11px;font-weight:700;text-transform:uppercase}' +
      '.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}' +
      'table{width:100%;border-collapse:collapse;margin-top:8px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#5f6a7a;padding:8px 6px}' +
      'td{padding:12px 6px;border-top:1px solid #e7ebf2;font-size:13px}.r{text-align:right}' +
      '.totals{margin-top:18px;margin-left:auto;width:280px}.totals div{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}' +
      '.grand{border-top:1px solid #cfd7e3;margin-top:6px;padding-top:10px!important;font-size:17px;font-weight:800;color:#2f5c05}' +
      '.paybox{background:#f6f8fb;border:1px solid #e2e7ef;border-radius:14px;padding:16px;margin-top:22px;font-size:12px}' +
      '.foot{margin-top:24px;border-top:1px solid #e7ebf2;padding-top:16px;font-size:11px;color:#5f6a7a;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}' +
      'button{background:#cbfa31;color:#10130a;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;margin-top:20px;transition:transform .15s ease}' +
      'button:hover{transform:translateY(-1px)}' +
      '@media print{body{background:#fff;padding:0}.sheet{border:0;box-shadow:none;border-radius:0}button{display:none}}' +
      '</style></head><body><div class="sheet">' +
      '<div class="top"><div><div class="mark">' + U.esc((co.shortName || co.name || 'T').split(' ').map(w => w[0]).slice(0, 2).join('')) + '</div>' +
      '<h1>' + U.esc(co.name || 'Triverse Studio') + '</h1>' +
      '<p class="muted">' + U.esc(co.address || '') + '</p>' +
      '<p class="muted">' + U.esc(co.phone || '') + ' · ' + U.esc(co.email || '') + ' · ' + U.esc(co.website || '') + '</p></div>' +
      '<div style="text-align:right"><span class="badge">' + U.esc(effectiveStatus(p)) + '</span>' +
      '<h1 style="margin-top:10px">INVOICE</h1>' +
      '<p class="muted">No. <b>' + U.esc(p.invoiceNo) + '</b></p>' +
      '<p class="muted">Issued ' + U.esc(U.fmtDate(p.issueDate)) + '</p>' +
      '<p class="muted">Due ' + U.esc(U.fmtDate(p.dueDate)) + '</p></div></div>' +
      '<div class="grid"><div><p class="muted">BILLED TO</p><h1 style="font-size:17px">' + U.esc(c ? c.name : '—') + '</h1>' +
      '<p class="muted">' + U.esc(c && c.contactName ? c.contactName : '') + (c && c.designation ? ' · ' + U.esc(c.designation) : '') + '</p>' +
      '<p class="muted">' + U.esc(c ? (c.address || '') : '') + '</p>' +
      '<p class="muted">' + U.esc(c ? (c.phone || '') : '') + (c && c.email ? ' · ' + U.esc(c.email) : '') + '</p></div>' +
      '<div><p class="muted">PROJECT</p><p style="font-size:13px">' + U.esc(p.projectTitle || '—') + '</p>' +
      '<p class="muted">Payment method: ' + U.esc(method) + '</p>' +
      (p.recurring && p.recurring !== 'none' ? '<p class="muted">Recurring: ' + U.esc(p.recurring) + (p.renewalDate ? ' · next on ' + U.esc(U.fmtDate(p.renewalDate)) : '') + '</p>' : '') +
      '</div></div>' +
      '<table><thead><tr><th>Description</th><th>Notes</th><th class="r">Amount (' + U.esc(cur) + ')</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td>' + U.esc(r[0]) + '</td><td class="muted">' + U.esc(r[1]) + '</td><td class="r">' + U.esc(U.money(r[2], cur)) + '</td></tr>').join('') +
      '</tbody></table>' +
      '<div class="totals"><div><span class="muted">Subtotal</span><span>' + U.esc(U.money(p.amount, cur)) + '</span></div>' +
      '<div><span class="muted">Received</span><span>' + U.esc(U.money(p.amountPaid, cur)) + '</span></div>' +
      '<div class="grand"><span>Balance due</span><span>' + U.esc(U.money(bal, cur)) + '</span></div></div>' +
      '<div class="paybox"><b>How to pay</b><p class="muted" style="margin:8px 0 4px">' + U.esc(methodNote) + '</p>' +
      '<p class="muted">' + U.esc(co.name || '') + ' · ' + U.esc(co.phone || '') + ' · ' + U.esc(co.email || '') + '</p>' +
      '<p class="muted">Please send the transaction reference once paid so we can update your account.</p></div>' +
      '<button onclick="window.print()">Print / Save as PDF</button>' +
      '<div class="foot"><span>Thank you for your business.</span><span>' + U.esc(co.website || '') + '</span></div>' +
      '</div></body></html>';
  }

  App.invoiceHTML = invoiceHTML;
})(window);

</script>
  <script>
/* ===== assets/js/views.assets.js ===== */
/* =============================================================================
   Triverse OS — Websites, samples & templates
   Everything we already own: hosted sites, client sites, sample pages,
   auto-generated drafts and the design templates they come from.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  function q() {
    App.router.q.assets = App.router.q.assets || { tab: 'all', search: '' };
    return App.router.q.assets;
  }

  const KINDS = [['all', 'Everything', 'fa-layer-group'], ['hosted', 'Our hosted sites', 'fa-server'], ['client', 'Client websites', 'fa-handshake'],
    ['library', 'Sample library', 'fa-cubes'], ['sample', 'Reference pages', 'fa-images'],
    ['template', 'Design templates', 'fa-swatchbook'], ['draft', 'Generated drafts', 'fa-wand-magic-sparkles']];

  function sitesFiltered() {
    const s = q();
    let list = App.store.get('sites', []).slice();
    if (s.tab !== 'all' && s.tab !== 'template') list = list.filter(x => x.kind === s.tab);
    if (s.search) list = list.filter(x => U.hit(x.name, s.search) || U.hit(x.clientName, s.search) || U.hit(x.url, s.search) || U.hit(x.notes, s.search));
    return U.sortBy(list, x => x.updatedAt || x.createdAt || '', 'desc');
  }

  function renewChip(date, label) {
    if (!date) return '';
    const d = U.daysUntil(date);
    const tone = d < 0 ? 'red' : d <= 30 ? 'amber' : 'muted';
    return '<span class="chip ' + (tone === 'amber' ? 'is-on' : '') + '">' + ui.icon('fa-rotate', 'text-[9px]') + ' ' + label + ' ' + U.fmtDate(date) + (d < 0 ? ' (expired)' : ' · ' + d + 'd') + '</span>';
  }

  function siteCard(x) {
    const hasHtml = x.kind === 'draft' && App.store.html(x.id);
    return '<div class="glass-card rounded-2xl p-4 flex flex-col justify-between">' +
      '<div>' +
      '<div class="flex items-start justify-between gap-2 mb-2">' +
      '<div class="min-w-0"><p class="text-[12px] font-bold truncate">' + U.esc(x.name) + '</p>' +
      '<p class="text-[9px] text-textMuted truncate">' + U.esc(x.clientName || 'Triverse Studio') + (x.businessType ? ' · ' + U.esc(App.dict.typeLabel(x.businessType)) : '') + '</p></div>' +
      '<div class="flex flex-col items-end gap-1 shrink-0">' + ui.badge(x.status, App.dict.siteTones[x.status] || 'muted') +
      '<span class="tag">' + U.esc(x.kind) + '</span></div></div>' +
      (x.url ? '<p class="text-[10px] mb-2">' + ui.link(x.url, x.url.replace(/^https?:\/\//, '')) + '</p>' : '<p class="text-[10px] text-textMuted mb-2">not published yet' + (hasHtml ? ' · local draft stored' : '') + '</p>') +
      '<div class="flex flex-wrap gap-1 mb-2">' +
      (x.templateId ? '<span class="tag">' + U.esc((App.store.find('templates', x.templateId) || {}).name || x.templateId) + '</span>' : '') +
      (x.hostingProvider ? '<span class="tag">' + U.esc(x.hostingProvider) + '</span>' : '') +
      (x.price ? '<span class="tag" style="color:#cbfa31">' + U.money(x.price) + '</span>' : '') +
      (x.generatedFrom && x.generatedFrom.leadId ? '<span class="tag">from lead</span>' : '') +
      '</div>' +
      '<p class="text-[9px] text-textMuted line-clamp-2">' + U.esc(x.notes || '') + '</p>' +
      '</div>' +
      '<div class="mt-3">' +
      '<div class="flex flex-wrap gap-1 mb-2">' + renewChip(x.hostRenewDate, 'hosting') + renewChip(x.domainRenewDate, 'domain') + '</div>' +
      '<div class="btn-row">' +
      (x.kind === 'draft' || x.kind === 'sample'
        ? '<button class="btn btn-lime btn-sm" data-action="sites.open" data-arg="' + x.id + '"><i class="fa-solid fa-eye"></i> Preview</button>'
        : '<a class="btn btn-lime btn-sm" href="' + U.attr(x.url) + '" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Visit</a>') +
      '<button class="btn btn-ghost btn-sm" data-action="sites.edit" data-arg="' + x.id + '"><i class="fa-solid fa-pen"></i></button>' +
      (x.kind === 'draft' ? '<button class="btn btn-ghost btn-sm" data-action="sites.rebuild" data-arg="' + x.id + '" title="Rebuild from the latest data and template"><i class="fa-solid fa-rotate"></i></button>' : '') +
      (App.store.html(x.id) || x.url ? '<button class="btn btn-ghost btn-sm" data-action="sites.send" data-arg="' + x.id + '" title="Send to the client"><i class="fa-brands fa-whatsapp"></i></button>' : '') +
      '</div></div></div>';
  }

  function templateCard(t) {
    const used = App.store.get('sites', []).filter(s => s.templateId === t.id).length;
    return '<div class="glass-card rounded-2xl p-4">' +
      '<div class="flex items-start justify-between gap-2 mb-2">' +
      '<div class="min-w-0"><p class="text-[12px] font-bold truncate">' + U.esc(t.name) + '</p>' +
      '<p class="text-[9px] text-textMuted">' + U.esc(t.style) + ' · ' + U.esc(t.hero) + ' hero</p></div>' +
      (t.active === false ? ui.badge('hidden', 'muted') : ui.badge('active', 'lime')) + '</div>' +
      '<div class="h-16 rounded-xl mb-2 flex items-end p-2" style="background:linear-gradient(135deg,' + U.attr(t.accent) + '22,' + U.attr(t.bg) + ');border:1px solid ' + U.attr(t.border) + '">' +
      '<span class="px-2 py-1 rounded-lg text-[9px] font-bold" style="background:' + U.attr(t.accent) + ';color:' + U.attr(t.bg) + '">' + U.esc((t.bestFor || []).slice(0, 2).map(b => App.dict.typeLabel(b)).join(' + ') || 'any business') + '</span></div>' +
      '<p class="text-[9px] text-textMuted mb-2">' + U.esc(t.notes || '') + '</p>' +
      '<div class="flex flex-wrap gap-1 mb-2"><span class="tag">used ' + used + '×</span>' +
      [['accent', t.accent], ['bg', t.bg], ['surface', t.surface], ['text', t.text]].map(c =>
        '<span class="w-4 h-4 rounded" style="background:' + U.attr(c[1]) + ';border:1px solid ' + U.attr(t.border) + '" title="' + c[0] + ' ' + U.attr(c[1]) + '"></span>').join('') + '</div>' +
      '<div class="btn-row">' +
      '<button class="btn btn-lime btn-sm" data-action="tpl.use" data-arg="' + t.id + '"><i class="fa-solid fa-wand-magic-sparkles"></i> Build with this</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="tpl.edit" data-arg="' + t.id + '"><i class="fa-solid fa-pen"></i> Edit theme</button>' +
      '</div></div>';
  }

  App.views = App.views || {};
  /* ======================= sample site library (clone + fill) =============== */
  const CATEGORY_LABELS = {
    saas: 'Software / SaaS', qrmenu: 'Digital QR menu', food: 'Restaurant & cafe',
    hotel: 'Hotel & guest house', cosmetics: 'Cosmetics & beauty', gym: 'Gym & fitness',
    shop: 'Shop & retail', clinic: 'Clinic & pharmacy', services: 'Local service', other: 'Other'
  };

  function categoryLabel(k) { return CATEGORY_LABELS[k] || U.title(String(k || 'other')); }

  /** the scanner report — exactly what the design gives us to swap later */
  function analysisBox(a) {
    if (!a) return '';
    const row = (l, v, ok) => '<div class="scan__cell">' +
      '<p class="scan__label">' + ui.icon(ok ? 'fa-circle-check' : 'fa-circle-minus') + ' ' + l + '</p>' +
      '<p class="scan__value">' + v + '</p></div>';
    const socials = Object.keys(a.socials || {});
    return '<div class="scan">' +
      '<div class="scan__head">' +
      '<span class="scan__score">' + (a.quality || 0) + '%</span>' +
      '<div><p class="scan__title">' + U.esc(a.title || 'Untitled design') + '</p>' +
      '<p class="scan__sub">' + U.bytes(a.size || 0) + ' scanned · the design stays exactly as uploaded; only these fields change per client</p></div>' +
      '</div>' +
      '<div class="scan__grid">' +
      row('Headlines & text', a.words + ' words · ' + a.textCount + ' blocks that can be rewritten', a.textCount > 4) +
      row('Photos', a.images.length ? a.images.length + ' picture reference(s) — swapped for the client\u2019s own' : 'none found', a.images.length > 0) +
      row('Phone', U.esc(a.phones[0] || 'none found — a call button is added'), a.phones.length > 0) +
      row('Email', U.esc(a.emails[0] || 'none found'), a.emails.length > 0) +
      row('Map', a.mapIframe ? 'live Google map embed — repointed at the client' : 'none found — one is added', Boolean(a.mapIframe)) +
      row('Address', U.esc((a.addresses || [])[0] || 'none found'), (a.addresses || []).length > 0) +
      row('Social links', U.esc(socials.join(', ') || 'none found'), socials.length > 0) +
      row('Blocks', U.esc(a.sections.slice(0, 4).join(', ') || 'basic page'), a.sections.length > 0) +
      row('Live fields', a.placeholders.length ? a.placeholders.length + ' {{placeholders}} ready to fill' : 'detection-based fill', true) +
      row('Identifiers', U.esc((a.colors || []).slice(0, 3).join(' ') || '—') + ' · ' + U.esc((a.fonts || [])[0] || 'system'), true) +
      '</div></div>';
  }

  function sampleCard(s) {
    const types = App.dict.businessTypes.filter(t => (App.samples.typeCategory[t[0]] || 'other') === s.category)
      .map(t => t[1]).slice(0, 4).join(', ');
    const a = s.analysis || {};
    const bits = [];
    if (a.textCount) bits.push(a.textCount + ' text blocks');
    if ((a.images || []).length) bits.push((a.images || []).length + ' photos');
    if (a.mapIframe) bits.push('map');
    if (Object.keys(a.socials || {}).length) bits.push('socials');
    return '<div class="glass-card rounded-2xl p-4 flex flex-col justify-between lib-card">' +
      '<div>' +
      '<div class="flex items-start justify-between gap-2 mb-2">' +
      '<div class="min-w-0"><p class="text-[12px] font-bold truncate">' + U.esc(s.name) + '</p>' +
      '<p class="text-[9px] text-textMuted">' + U.esc(categoryLabel(s.category)) +
      (s.files ? ' · ' + s.files + ' file(s) in the folder' : ' · single file') + '</p></div>' +
      (s.usedCount ? '<span class="tag">' + s.usedCount + 'x used</span>' : '<span class="tag">' + (a.quality || 0) + '%</span>') + '</div>' +
      '<p class="text-[10px] text-textMuted mb-2">' + U.esc(s.blurb || '') + '</p>' +
      (types ? '<p class="text-[9px] text-textMuted mb-2">Serves: ' + U.esc(types) + '</p>' : '') +
      (bits.length ? '<div class="lib-card__bits">' + bits.map(b => '<span class="lib-bit">' + U.esc(b) + '</span>').join('') + '</div>' : '') +
      (s.source ? '<p class="text-[9px] text-textMuted mt-2 truncate" title="' + U.attr(s.source) + '">' +
        ui.icon('fa-folder-open', 'text-[8px]') + ' ' + U.esc(String(s.source)) + '</p>' : '') +
      '</div>' +
      '<div class="btn-row mt-3">' +
      '<button class="btn btn-lime btn-sm" data-action="samples.open" data-arg="' + U.attr(s.id) + '"><i class="fa-solid fa-eye"></i> Preview</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="samples.clone" data-arg="' + U.attr(s.id) + '" title="Copy it as a starting point for a client"><i class="fa-solid fa-copy"></i></button>' +
      '<button class="btn btn-ghost btn-sm" data-action="samples.scan" data-arg="' + U.attr(s.id) + '" title="See what can be filled"><i class="fa-solid fa-magnifying-glass-chart"></i></button>' +
      '<button class="btn btn-ghost btn-sm" data-action="samples.rename" data-arg="' + U.attr(s.id) + '" title="Rename"><i class="fa-solid fa-pen"></i></button>' +
      '<button class="btn btn-ghost btn-sm" data-action="samples.del" data-arg="' + U.attr(s.id) + '" title="Remove from the library"><i class="fa-solid fa-trash"></i></button>' +
      '</div></div>';
  }

  /** the drop zone: a whole folder, a zip of files, or one single page */
  function uploadZone(compact) {
    return '<div class="dropzone" id="samples-drop" data-drop="samples">' +
      '<div class="dropzone__glow"></div>' +
      '<span class="dropzone__icon">' + ui.icon('fa-folder-tree') + '</span>' +
      '<p class="dropzone__title">Drop a design here</p>' +
      '<p class="dropzone__sub">A whole folder, or just one <b>.html</b> file. The scanner reads its text, photos, map, socials and specifications — the design itself is never touched.</p>' +
      '<div class="dropzone__actions">' +
      '<button class="btn btn-lime" data-action="samples.pickFolder"><i class="fa-solid fa-folder-open"></i> Choose a folder</button>' +
      '<button class="btn btn-ghost" data-action="samples.new"><i class="fa-solid fa-file-code"></i> Choose one file</button>' +
      '</div>' +
      (compact ? '' : '<p class="dropzone__foot">Nothing ships with the app. The library is exactly what you upload — so a design can never be silently rewritten.</p>') +
      '</div>';
  }

  function sampleLibrary() {
    const list = App.samples.list();
    const last = App.router.q.samplesLast;
    const pending = App.router.q.samplesBundle;
    return ui.card(
      ui.head('Design library',
        '<div class="btn-row">' +
        (list.length ? '<button class="btn btn-ghost btn-sm" data-action="samples.match"><i class="fa-solid fa-diagram-project"></i> Which design for which type</button>' : '') +
        (list.length ? '<button class="btn btn-ghost btn-sm" data-action="samples.pickFolder"><i class="fa-solid fa-folder-plus"></i> Add a design</button>' : '') +
        '</div>',
        list.length
          ? list.length + ' design(s) uploaded by the studio · the layout, spacing and style stay exactly as you made them; only the information changes per client.'
          : 'Upload the designs you already sell with. Each one becomes a category the generator can pour a new client into.') +
      (last ? analysisBox(last) : '') +
      (list.length
        ? (pending ? '' : '') + '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + list.map(sampleCard).join('') + '</div>' +
          '<div class="mt-4">' + uploadZone(true) + '</div>'
        : uploadZone(false)), 'mb-4');
  }

  /** the category chips, shared by every tab including the sample library */
  function tabChips(s, sites, templates) {
    const count = k => k === 'library' ? App.samples.list().length
      : k === 'template' ? templates.length
        : k === 'all' ? sites.length
          : sites.filter(x => x.kind === k).length;
    return '<div class="flex flex-wrap gap-1.5">' +
      KINDS.map(k => ui.chip(k[1] + ' (' + count(k[0]) + ')', s.tab === k[0], 'assets.tab', k[0], k[2])).join('') + '</div>';
  }

  App.views.sites = {
    title: 'Websites & templates',
    sub: 'Hosted sites, sample pages, generated drafts and design templates',
    icon: 'fa-folder-closed',
    render(el, params) {
      const s = q();
      const sites = App.store.get('sites', []);
      const templates = App.store.get('templates', []);
      const live = sites.filter(x => x.status === 'live').length;
      const hostingCost = U.sum(sites.filter(x => x.hostRenewDate), x => 0);

      /* #/sites/library — the sidebar "Samples" link lands straight on the library */
      if (params === 'library') { s.tab = 'library'; s.search = ''; }

      if (s.tab === 'library') {
        el.innerHTML = '<div class="mb-3">' + tabChips(s, sites, templates) + '</div>' + sampleLibrary();
        return;
      }

      el.innerHTML =
        '<div class="flex items-center justify-between gap-3 flex-wrap mb-3">' +
        tabChips(s, sites, templates) +
        '<div class="btn-row">' +
        '<input class="inp w-[180px]" data-model="ui.assetsSearch" data-change-action="assets.applyFilters" data-enter="assets.applyFilters" value="' + U.attr(s.search) + '" placeholder="Search sites…" />' +
        '<button class="btn btn-ghost btn-sm" data-action="sites.new"><i class="fa-solid fa-plus"></i> Register a website</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="tpl.new"><i class="fa-solid fa-swatchbook"></i> New template</button>' +
        '<button class="btn btn-lime btn-sm" data-action="sites.generate"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate from a lead</button>' +
        '</div></div>' +

        '<div class="four-col mb-4">' +
        ui.stat({ tag: 'Live', label: 'Websites online', value: live + '', badge: sites.filter(x => x.kind === 'client').length + ' client sites', sub: 'Our own site + client properties' }) +
        ui.stat({ tag: 'Library', label: 'Sample pages', value: sites.filter(x => x.kind === 'sample').length + '', badge: templates.length + ' templates', tone: 'blue', sub: 'Send a sample link in the first message' }) +
        ui.stat({ tag: 'Drafts', label: 'Generated drafts', value: sites.filter(x => x.kind === 'draft').length + '', badge: 'ready to demo', tone: 'amber', sub: 'Built by the generator from Google data' }) +
        ui.stat({ tag: 'Pipeline', label: 'Website deal value', value: U.money(U.sum(sites, x => Number(x.price) || 0)), badge: 'all properties', sub: 'Renewals feed the retainer column' }) +
        '</div>' +

        (function () {
          const items = sites.filter(x => (x.hostRenewDate && U.daysUntil(x.hostRenewDate) <= 60) || (x.domainRenewDate && U.daysUntil(x.domainRenewDate) <= 60))
            .concat(App.store.get('payments', []).filter(p => p.renewalDate && U.daysUntil(p.renewalDate) <= 60 && U.daysUntil(p.renewalDate) > -30)
              .map(p => ({ name: p.projectTitle + ' · ' + (App.store.find('clients', p.clientId) || {}).name, hostRenewDate: p.renewalDate, clientName: 'payment' })));
          if (!items.length) return '';
          return ui.card(ui.head('Renewals to watch', ui.badge('next 60 days', 'amber')) +
            '<div class="space-y-1.5">' + items.map(x =>
            '<div class="flex items-center gap-3 row-card p-2.5" data-action="sites.open" data-arg="' + (x.id || '') + '">' +
            ui.badge(U.daysUntil(x.hostRenewDate) < 0 ? 'expired' : U.daysUntil(x.hostRenewDate) + ' days', U.daysUntil(x.hostRenewDate) <= 14 ? 'red' : 'amber') +
            '<div class="min-w-0 flex-1"><p class="text-[11px] truncate">' + U.esc(x.name) + '</p>' +
            '<p class="text-[9px] text-textMuted">renews ' + U.fmtDate(x.hostRenewDate) + ' · ' + U.esc(x.clientName || '') + '</p></div></div>').join('') + '</div>', 'mb-4');
        })() +

        (s.tab === 'template'
          ? (templates.length ? '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">' + templates.map(templateCard).join('') + '</div>' : ui.empty('No templates yet', 'Add a template to generate websites instantly', 'fa-swatchbook'))
          : (sitesFiltered().length
            ? '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">' +
              (s.tab === 'all' ? sitesFiltered().map(siteCard).join('') : sitesFiltered().map(siteCard).join('')) + '</div>'
            : ui.empty('Nothing here yet', 'Generate a website from any discovered business — it is saved here as a draft.', 'fa-folder-closed',
              '<button class="btn btn-lime btn-sm" data-action="sites.generate">Generate a website</button>'))) +

        (s.tab === 'all' ? ui.card(ui.head('Design templates', '<button class="btn btn-ghost btn-sm" data-action="assets.tab" data-arg="template">See all</button>', 'Pick one and the generator fills it with the business data') +
          '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + templates.slice(0, 3).map(templateCard).join('') + '</div>', 'mt-4') : '');

      if (params) openSite(params);
    }
  };

  /* ---------------------------------- site drawer -------------------------- */
  function openSite(id) {
    const x = App.store.find('sites', id);
    if (!x) return;
    const html = App.store.html(id);
    ui.modal({
      title: x.name,
      sub: (x.clientName || 'Triverse Studio') + ' · ' + x.kind + ' · ' + App.dict.typeLabel(x.businessType),
      size: 'xl',
      body:
        '<div class="grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-4">' +
        '<div>' + (html ? ui.previewFrame(html, 520)
          : (x.url ? '<p class="text-[10px] text-textMuted mb-2">No local copy stored — opening the live site instead.</p>' + ui.previewFrame('<div style="font:14px system-ui;padding:24px;color:#333">Live site: <a href="' + x.url + '">' + x.url + '</a></div>', 90)
            : '<div class="glass-soft rounded-xl p-6 text-center text-[11px] text-textMuted">No stored HTML for this record. Register it with a URL, or rebuild it from a lead.</div>')) +
        '<div class="btn-row mt-3">' +
        (html ? '<button class="btn btn-lime btn-sm" data-action="sites.previewOpen" data-arg="' + x.id + '"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open in tab</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="sites.download" data-arg="' + x.id + '"><i class="fa-solid fa-download"></i> Download</button>' : '') +
        (x.kind === 'draft' ? '<button class="btn btn-ghost btn-sm" data-action="sites.rebuild" data-arg="' + x.id + '"><i class="fa-solid fa-rotate"></i> Rebuild from latest data</button>' : '') +
        (x.url ? '<a class="btn btn-ghost btn-sm" href="' + U.attr(x.url) + '" target="_blank" rel="noopener"><i class="fa-solid fa-globe"></i> ' + U.esc(x.url.replace(/^https?:\/\//, '')) + '</a>' : '') +
        '</div></div>' +
        '<div>' +
        ui.card(ui.head('Details') +
          ui.kv('Kind', U.esc(x.kind)) +
          ui.kv('Status', ui.badge(x.status, App.dict.siteTones[x.status] || 'muted')) +
          ui.kv('Client', x.clientId ? ui.link('#/clients/' + x.clientId, x.clientName || 'open client', 'link') : U.esc(x.clientName || '—')) +
          ui.kv('Template', U.esc((App.store.find('templates', x.templateId) || {}).name || '—')) +
          ui.kv('Stack', U.esc(x.stack || '—')) +
          ui.kv('Host', U.esc(x.hostingProvider || '—')) +
          ui.kv('Price', U.money(x.price)) +
          ui.kv('Hosting renewal', x.hostRenewDate ? U.fmtDate(x.hostRenewDate) + ' (' + U.daysUntil(x.hostRenewDate) + 'd)' : '—') +
          ui.kv('Domain renewal', x.domainRenewDate ? U.fmtDate(x.domainRenewDate) + ' (' + U.daysUntil(x.domainRenewDate) + 'd)' : '—') +
          ui.kv('Repo', U.esc(x.repoUrl || '—')) +
          ui.kv('Created', U.fmtDate(x.createdAt)) +
          ui.kv('Updated', U.relTime(x.updatedAt)), 'mb-3') +
        ui.card(ui.head('Notes') + '<p class="text-[10px] text-gray-300 whitespace-pre-line">' + U.esc(x.notes || '—') + '</p>') +
        '</div></div>',
      footer: '<button class="btn btn-ghost btn-sm" data-action="sites.send" data-arg="' + x.id + '"><i class="fa-brands fa-whatsapp"></i> Send link to client</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="sites.edit" data-arg="' + x.id + '">Edit record</button>' +
        '<button class="btn btn-danger btn-sm" data-action="sites.delete" data-arg="' + x.id + '">Delete</button>'
    });
  }
  App.openSite = openSite;

  /* --------------------------------- actions ------------------------------- */
  App.action('assets.tab', el => { q().tab = el.getAttribute('data-arg'); App.emit('state:changed', { path: 'assets' }); });
  App.action('assets.applyFilters', () => {
    q().search = App.store.get('ui.assetsSearch', '');
    App.emit('state:changed', { path: 'assets' });
  });

  /* ========================= design library: upload and scan =============== */

  /** every file under a dropped folder, walked depth-first */
  function filesFromDrop(dt) {
    const out = [];
    const walk = entry => new Promise(res => {
      if (!entry) return res();
      if (entry.isFile) {
        return entry.file(f => { f.relPath = entry.fullPath ? entry.fullPath.replace(/^\//, '') : f.name; out.push(f); res(); }, () => res());
      }
      if (!entry.isDirectory) return res();
      const reader = entry.createReader();
      const read = () => reader.readEntries(entries => {
        if (!entries.length) return res();
        Promise.all(entries.map(walk)).then(read);
      }, () => res());
      read();
    });
    const items = dt && dt.items ? Array.prototype.slice.call(dt.items) : [];
    const entries = items.map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
    if (!entries.length) {
      return Promise.resolve(Array.prototype.slice.call((dt && dt.files) || []));
    }
    return Promise.all(entries.map(walk)).then(() => out);
  }

  /** read a pile of files into one self-contained design and scan it */
  function ingestFiles(files, meta) {
    const box = document.getElementById('sample-analysis');
    const label = document.getElementById('sample-file-name');
    if (label) label.textContent = 'reading ' + (files || []).length + ' file(s)…';
    if (box) box.innerHTML = '<p class="text-[11px] text-textMuted"><i class="fa-solid fa-magnifying-glass-chart fa-fade text-accentMint"></i> Scanning the design…</p>';
    return App.samples.bundle(files, meta || {}).then(out => {
      const a = App.samples.analyse(out.html);
      App.router.q.samplesLast = a;
      App.router.q.samplesBundle = out;
      if (label) label.textContent = files.length + ' file(s) read · ' + U.bytes(out.bytes || out.html.length) +
        (out.carried ? ' · ' + out.carried.styles + ' stylesheet(s), ' + out.carried.scripts + ' script(s), ' + out.carried.images + ' picture(s) folded in' : '');
      App.router.q.samplesUp = App.router.q.samplesUp || {};
      App.router.q.samplesUp.text = out.html;
      const nm = App.store.get('ui.samplesUp.name', '');
      if (!nm) {
        App.store.set('ui.samplesUp.name', out.name || a.title || 'Uploaded design', { silent: true });
        const nameBox = document.getElementById('f_ui_samplesUp_name');
        if (nameBox) nameBox.value = out.name || a.title || 'Uploaded design';
      }
      if (!App.store.get('ui.samplesUp.category', '') || App.store.get('ui.samplesUp.category', '') === 'shop') {
        const guess = App.samples.guessCategory(a, out.name || '');
        if (guess) {
          App.store.set('ui.samplesUp.category', guess, { silent: true });
          const sel = document.getElementById('f_ui_samplesUp_category');
          if (sel) sel.value = guess;
        }
      }
      if (box) box.innerHTML = analysisBox(a) +
        '<p class="text-[10px] text-textMuted">Everything listed above is swapped for each new client\u2019s own details. Nothing about the layout, spacing, colours or wording style changes.</p>';
      return out;
    }).catch(err => {
      if (box) box.innerHTML = '<p class="text-[11px] text-amber-300">' + U.esc(err.message) + '</p>';
      if (label) label.textContent = 'nothing read';
      throw err;
    });
  }

    App.router.q.assets = App.router.q.assets || {};
    App.router.q.assets.tab = 'library';
    ui.closeModal();
    App.router.go('sites', 'library');
  });

  App.action('samples.new', () => uploadModal('file'));
  App.action('samples.pickFolder', () => uploadModal('folder'));

  function sampleText() {
    const up = App.router.q.samplesUp || {};
    return String(up.text || '');
  }

  App.action('samples.rescan', () => {
    const html = sampleText();
    const box = document.getElementById('sample-analysis');
    if (!html) { if (box) box.innerHTML = '<p class="text-[11px] text-amber-300">Choose a design first.</p>'; return; }
    const a = App.samples.analyse(html);
    App.router.q.samplesLast = a;
    if (box) box.innerHTML = analysisBox(a);
  });
  App.action('samples.analyse', () => App.actions['samples.rescan']({}, null));

  App.action('samples.save', () => {
    const up = App.router.q.samplesUp || {};
    if (!up.text) { ui.toast('Choose a design first', 'amber'); return; }
    const bundle = App.router.q.samplesBundle || {};
    const res = App.samples.save({
      name: App.store.get('ui.samplesUp.name', ''),
      category: App.store.get('ui.samplesUp.category', 'shop'),
      tags: App.store.get('ui.samplesUp.tags', ''),
      note: App.store.get('ui.samplesUp.note', ''),
      html: up.text,
      source: bundle.source || 'uploaded by hand',
      files: bundle.files || 0,
      pages: bundle.pages || [],
      carried: bundle.carried || null
    });
    if (res.error) { ui.toast(res.error, 'red'); return; }
    App.router.q.samplesLast = res.analysis;
    App.router.q.samplesBundle = null;
    App.router.q.samplesUp = { text: '' };
    App.router.q.assets.tab = 'library';
    ui.closeModal();
    ui.toast('“' + res.sample.name + '” saved — ' + res.analysis.quality + '% ready to clone', 'lime');
    App.emit('state:changed', { path: 'samples' });
  });

  App.action('samples.scan', el => {
    const s = App.samples.find(el.getAttribute('data-arg'));
    if (!s) return;
    App.router.q.samplesLast = s.analysis || App.samples.analyse(s.html);
    App.router.q.assets.tab = 'library';
    App.refresh();
  });

  App.action('samples.rename', el => {
    const s = App.samples.find(el.getAttribute('data-arg'));
    if (!s) return;
    App.store.set('ui.samplesRename', { name: s.name, category: s.category || 'shop' }, { silent: true });
    ui.modal({
      title: 'Rename “' + s.name + '”',
      size: 'sm',
      body: ui.field({ label: 'Design name', model: 'ui.samplesRename.name', value: s.name }) +
        ui.field({ label: 'Category', model: 'ui.samplesRename.category', value: s.category, options: Object.keys(CATEGORY_LABELS).map(k => [k, categoryLabel(k)]) }),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-lime" data-action="samples.renameSave" data-arg="' + U.attr(s.id) + '">Save</button>'
    });
  });

  App.action('samples.renameSave', el => {
    const id = el.getAttribute('data-arg');
    const name = App.store.get('ui.samplesRename.name', '');
    const category = App.store.get('ui.samplesRename.category', '');
    if (!name) { ui.toast('Give the design a name', 'amber'); return; }
    App.store.patch('samples.items', id, { name: name, category: category });
    App.store.save();
    ui.closeModal();
    ui.toast('Design updated', 'lime');
    App.emit('state:changed', { path: 'samples' });
  });

  App.action('samples.open', el => {
    const s = App.samples.find(el.getAttribute('data-arg'));
    if (!s) return;
    const lead = demoLeadFor(s);
    const out = App.samples.fill(s, lead, {});
    U.openHTML(out.html, 'sample');
  });

  /*
   * Take one of the studio's own imported designs and fork it into the editable
   * library — so a design from the sample folder can be tuned for one client
   * without touching the original.
   */
  App.action('samples.clone', el => {
    const s = App.samples.find(el.getAttribute('data-arg'));
    if (!s) return;
    const name = (s.name || 'Sample') + ' copy';
    const res = App.samples.save({
      name: name, category: s.category || 'shop',
      tags: (s.tags || []).join(', '),
      note: 'Forked from ' + (s.source || s.id) + ' on ' + U.todayISO(),
      html: s.html
    });
    if (res.error) { ui.toast(res.error, 'red'); return; }
    App.router.q.assets.tab = 'library';
    ui.toast('“' + name + '” added to the library — edit it freely', 'lime');
    App.emit('state:changed', { path: 'samples' });
  });

  App.action('samples.del', el => {
    const id = el.getAttribute('data-arg');
    const s = App.samples.find(id);
    if (!s) return;
    ui.confirm({
      title: 'Remove “' + s.name + '” from the library?',
      sub: 'The uploaded design is dropped from this workspace. A workspace backup or an earlier Drive copy still has it.',
      tone: 'danger',
      confirmLabel: 'Remove the design',
      onConfirm: () => {
        App.samples.remove(id);
        ui.toast('Design removed from the library', 'amber');
        App.emit('state:changed', { path: 'samples' });
      }
    });
  });

  App.action('samples.edit', el => {
    const s = App.samples.find(el.getAttribute('data-arg'));
    if (!s) return;
    const cats = Object.keys(CATEGORY_LABELS).map(k => [k, categoryLabel(k)]);
    App.router.q.sampleEdit = s.id;
    App.store.set('ui.sampleEdit', { name: s.name, category: s.category, tags: (s.tags || []).join(', '), note: s.blurb }, { silent: true });
    ui.modal({
      title: 'Edit “' + s.name + '”',
      size: 'md',
      body: '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
        ui.field({ label: 'Name', model: 'ui.sampleEdit.name', value: s.name }) +
        ui.field({ label: 'Category', model: 'ui.sampleEdit.category', value: s.category, options: cats }) +
        '</div>' +
        ui.field({ label: 'Match words', model: 'ui.sampleEdit.tags', value: (s.tags || []).join(', '), hint: 'Comma separated. A business type containing any of these words will pick this sample.', wrapCls: 'mt-3' }) +
        ui.field({ label: 'Note', model: 'ui.sampleEdit.note', value: s.blurb, rows: 2, wrapCls: 'mt-3' }),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-lime" data-action="samples.editSave">Save</button>'
    });
  });

  App.action('samples.editSave', () => {
    const id = App.router.q.sampleEdit;
    const items = (App.store.get('samples.items', []) || []).slice();
    const s = items.filter(x => x.id === id)[0];
    if (!s) return;
    s.name = App.store.get('ui.sampleEdit.name', s.name);
    s.category = App.store.get('ui.sampleEdit.category', s.category);
    s.tags = String(App.store.get('ui.sampleEdit.tags', '')).split(',').map(x => x.trim()).filter(Boolean);
    s.blurb = App.store.get('ui.sampleEdit.note', s.blurb);
    App.store.set('samples.items', items);
    App.store.save();
    ui.closeModal();
    ui.toast('Sample updated', 'lime');
    App.emit('state:changed', { path: 'samples' });
  });

  /** a throwaway business record so a sample can be previewed with real detail */
  function demoLeadFor(s) {
    const t = App.dict.businessTypes.filter(x => (App.samples.typeCategory[x[0]] || 'other') === s.category)[0] ||
      App.dict.businessTypes[0];
    return {
      id: 'demo', name: 'Sample ' + categoryLabel(s.category), businessType: (t || [])[0] || 'general',
      category: (t || [])[1] || '', areaLabel: 'Bole, Addis Ababa', address: 'Bole Road, Addis Ababa',
      phone: '+251 90 246 8625', rating: 4.8, reviews: 126, photos: [],
      hoursWeek: [], source: 'demo'
    };
  }

  /* the drop zone on the library page: a folder dropped anywhere opens the
     uploader already reading it */
  (function wireDropZone() {
    ['dragover', 'drop'].forEach(evt => {
      document.addEventListener(evt, ev => {
        const zone = ev.target && ev.target.closest ? ev.target.closest('[data-drop="samples"]') : null;
        if (!zone) return;
        ev.preventDefault();
        if (evt === 'dragover') { zone.classList.add('is-over'); return; }
        zone.classList.remove('is-over');
        if (!ev.dataTransfer) return;
        filesFromDrop(ev.dataTransfer).then(files => {
          if (!files || !files.length) return;
          uploadModal(files.length > 1 ? 'folder' : 'file');
          setTimeout(() => ingestFiles(files), 60);
        });
      });
    });
  })();

  App.action('samples.match', () => {
    const rows = App.dict.businessTypes.map(t => {
      const s = App.samples.forBusiness({ businessType: t[0], name: '', category: t[1] });
      return [t[1], s ? s.name : '(none)'];
    });
    ui.modal({
      title: 'Which sample each business type gets',
      sub: 'Nothing to configure — the category decides. Upload more samples to change the mix.',
      size: 'md',
      body: '<div class="max-h-[420px] overflow-auto">' + rows.map(r =>
        '<div class="flex items-center justify-between gap-3 py-1.5 border-b border-borderMain">' +
        '<span class="text-[11px]">' + U.esc(r[0]) + '</span><span class="text-[10px] text-textMuted">' + U.esc(r[1]) + '</span></div>').join('') + '</div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>'
    });
  });
})(window);

</script>
  <script>
/* ===== assets/js/views.assistant.js ===== */
/* =============================================================================
   Triverse OS — Assistant view
   The page where the studio hands work to the AI: give it a job, watch it plan
   and run each step against the real records, and read back everything it did.
   Permissions are the gate — nothing is sent or deleted unless switched on.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  const EXAMPLES = [
    'Which businesses have no website and are worth a first message today?',
    'Write the first WhatsApp message for the best-rated business without a website.',
    'Build the website draft for the highest rated business that has no website.',
    'List every unpaid invoice and tell me who to chase first.',
    'Add a project for the newest won client and set it to development.',
    'Tidy up: mark every business with no reply after 14 days as qualified again.'
  ];

  function state() {
    App.router.q.assistant = App.router.q.assistant || { text: '', task: null, running: false };
    return App.router.q.assistant;
  }

  function permsOn() {
    const p = App.agent.perms();
    return App.agent.PERMS.filter(x => p[x[0]]).length;
  }

  function stats() {
    const list = App.agent.history();
    const steps = U.sum(list, t => (t.steps || []).length);
    return { tasks: list.length, steps: steps, perms: permsOn(), blocked: list.filter(t => t.status === 'blocked').length };
  }

  /* ------------------------------- composer -------------------------------- */
  function composer() {
    const s = state();
    const rows = state().task;
    return ui.card(
      ui.head('Give the assistant a job',
        '<button class="btn btn-ghost btn-sm" data-action="assistant.clear"><i class="fa-solid fa-eraser"></i> Clear</button>',
        'It reads the workspace, works out the steps, then runs only what your permissions allow') +
      '<div id="assistant-live">' + (s.running && s.task ? runningBox(s.task) : rows ? taskBox(rows) : idleBox()) + '</div>' +
      '<textarea class="inp mt-3" id="assistant-ask" rows="3" placeholder="e.g. Find every cafe in Addis Ababa with no website, build the draft site and write its first message">' +
      U.esc(s.text || '') + '</textarea>' +
      '<div class="btn-row mt-2.5">' +
      '<button class="btn btn-lime" data-action="assistant.run"><i class="fa-solid fa-wand-magic-sparkles"></i> Give it the job</button>' +
      '<button class="btn btn-ghost" data-action="assistant.history"><i class="fa-solid fa-clock-rotate-left"></i> History</button>' +
      '</div>' +
      '<div class="assistant__examples">' + EXAMPLES.map((e, i) =>
        '<button class="chip" data-action="assistant.example" data-arg="' + i + '">' + U.esc(e.length > 56 ? e.slice(0, 56) + '…' : e) + '</button>').join('') +
      '</div>'
    );
  }

  function idleBox() {
    return '<div class="assistant__idle">' +
      ui.icon('fa-robot', 'text-accentMint') +
      '<p>Nothing running. Describe the job in plain language — it will plan first, show you each step, and stop the moment a permission is missing.</p>' +
      '</div>';
  }

  function runningBox(task) {
    const steps = (task.steps || []);
    return '<div class="assistant__run">' +
      '<p class="assistant__say"><i class="fa-solid fa-wand-magic-sparkles fa-fade text-accentMint"></i> ' +
      U.esc(task.say || 'Reading the workspace and working out the steps…') + '</p>' +
      (steps.length ? steps.map(stepRow).join('') :
        '<div class="assistant__wait"><span class="dot-live"></span> planning…</div>') +
      '</div>';
  }

  function taskBox(task) {
    const tone = task.status === 'done' ? 'lime' : task.status === 'blocked' ? 'amber' : task.status === 'error' ? 'red' : 'muted';
    return '<div class="assistant__run">' +
      '<div class="assistant__headline tone tone-' + tone + '"><i class="fa-solid ' +
      (task.status === 'done' ? 'fa-circle-check' : task.status === 'blocked' ? 'fa-lock' : 'fa-circle-info') + '"></i> ' +
      '<span>' + U.esc(task.say || 'Finished') + '</span></div>' +
      '<p class="assistant__meta">' + (task.steps || []).length + ' step(s) · ' + U.esc(task.status) +
      (task.error ? ' · ' + U.esc(task.error) : '') + ' · ' + U.relTime(task.at) + '</p>' +
      ((task.steps || []).length ? (task.steps || []).map(stepRow).join('') : '<p class="assistant__meta">Nothing was changed.</p>') +
      '</div>';
  }

  function stepRow(row) {
    const blocked = row.result && row.result.blocked;
    const tone = blocked ? 'amber' : row.ok ? 'lime' : 'red';
    const summary = row.ok
      ? (row.result.data && row.result.count !== undefined ? row.result.count + ' row(s)'
        : U.esc(JSON.stringify(row.result.data || {}).slice(0, 260)))
      : U.esc((row.result && row.result.error) || 'failed');
    return '<div class="assistant__step tone tone-' + tone + '">' +
      '<div class="assistant__step-top">' +
      ui.icon(blocked ? 'fa-lock' : row.ok ? 'fa-circle-check' : 'fa-triangle-exclamation') +
      '<span class="assistant__tool">' + U.esc(row.tool) + '</span>' +
      '</div>' +
      (row.why ? '<p class="assistant__why">' + U.esc(row.why) + '</p>' : '') +
      '<p class="assistant__result">' + summary + '</p>' +
      '</div>';
  }

  /* ------------------------------ permissions ------------------------------ */
  function permissions() {
    const p = App.agent.perms();
    const tiles = App.agent.PERMS.map(x =>
      '<button class="assistant__perm' + (p[x[0]] ? ' is-on' : '') + '" data-action="assistant.perm" data-arg="' + x[0] + '">' +
      '<span class="assistant__perm-top">' + U.esc(x[1]) +
      '<i class="fa-solid ' + (p[x[0]] ? 'fa-toggle-on' : 'fa-toggle-off') + '"></i></span>' +
      '<span class="assistant__perm-sub">' + U.esc(x[2]) + '</span>' +
      '</button>').join('');
    return ui.card(
      ui.head('What it may do', '', 'Send and Delete stay off until you switch them on yourself') +
      '<div class="assistant__perms">' + tiles + '</div>'
    );
  }

  /* -------------------------------- history -------------------------------- */
  function historyCard() {
    const list = App.agent.history().slice(0, 6);
    return ui.card(
      ui.head('Recent jobs',
        '<button class="btn btn-ghost btn-sm" data-action="assistant.history"><i class="fa-solid fa-list-check"></i> All</button>',
        list.length ? list.length + ' most recent' : '') +
      (list.length
        ? '<div class="assistant__history">' + list.map(t =>
          '<button class="assistant__job" data-action="assistant.open" data-arg="' + U.attr(t.id) + '">' +
          '<span class="assistant__job-top"><b>' + U.esc(String(t.request || '').slice(0, 96)) + '</b>' +
          '<i class="fa-solid fa-chevron-right"></i></span>' +
          '<span class="assistant__job-sub">' + U.esc(t.status) + ' · ' + (t.steps || []).length + ' step(s) · ' + U.relTime(t.at) + '</span>' +
          '</button>').join('') + '</div>'
        : ui.empty('No jobs yet', 'The first job you give it is recorded here', 'fa-robot'))
    );
  }

  App.views.assistant = {
    title: 'Assistant',
    sub: 'Hand work to the AI — it plans, you approve the permissions, it runs',

    render(el) {
      const s = stats();
      const ready = App.ai.ready();
      el.innerHTML =
        (ready ? '' :
          '<div class="glass-soft rounded-xl p-3 mb-4 tone tone-amber border flex items-start gap-2">' +
          ui.icon('fa-key', 'text-amber-300 fa-fade') +
          '<p class="text-[11px]">No Gemini key saved yet. Add it in <b>Settings → AI</b> — you can set the permissions below right now.</p>' +
          '</div>') +
        '<div class="assistant__tiles">' +
        tile('Jobs run', s.tasks, 'fa-clipboard-check', 'lime') +
        tile('Steps taken', s.steps, 'fa-shoe-prints', 'blue') +
        tile('Permissions on', s.perms + ' of ' + App.agent.PERMS.length, 'fa-shield-halved', 'violet') +
        tile('Blocked', s.blocked, 'fa-lock', 'amber') +
        '</div>' +
        '<div class="assistant__grid">' +
        '<div>' + composer() + '</div>' +
        '<div>' + permissions() + historyCard() + '</div>' +
        '</div>';
      const box = document.getElementById('assistant-ask');
      if (box) {
        box.addEventListener('input', () => { state().text = box.value; });
        box.addEventListener('keydown', ev => {
          if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { ev.preventDefault(); App.actions['assistant.run']({}, null); }
        });
      }
    }
  };

  function tile(label, value, icon, tone) {
    return '<div class="glass-soft rounded-xl p-3 flex items-center gap-3 assistant__tile">' +
      '<span class="assistant__tile-icon tone tone-' + tone + '">' + ui.icon(icon) + '</span>' +
      '<span class="min-w-0"><b>' + U.esc(String(value)) + '</b><i>' + U.esc(label) + '</i></span>' +
      '</div>';
  }

  /* --------------------------------- actions ------------------------------- */
  App.action('assistant.focus', () => {
    const box = document.getElementById('assistant-ask');
    if (box) { box.focus(); box.scrollIntoView({ block: 'center' }); }
  });

  App.action('assistant.example', el => {
    const text = EXAMPLES[Number(el.getAttribute('data-arg'))] || '';
    state().text = text;
    const box = document.getElementById('assistant-ask');
    if (box) { box.value = text; box.focus(); }
  });

  App.action('assistant.perm', el => {
    const key = el.getAttribute('data-arg');
    const p = App.agent.perms();
    App.agent.setPerm(key, !p[key]);
    App.ui.toast('Permission “' + key + '” ' + (!p[key] ? 'granted' : 'revoked'), 'lime');
    App.refresh();
  });

  App.action('assistant.clear', () => {
    state().text = '';
    state().task = null;
    App.refresh();
  });

  App.action('assistant.open', el => {
    const rec = App.agent.history().filter(t => t.id === el.getAttribute('data-arg'))[0];
    if (!rec) { App.ui.toast('That job is no longer in the history', 'muted'); return; }
    state().text = rec.request || '';
    state().task = rec;
    App.refresh();
  });

  App.action('assistant.history', () => {
    const list = App.agent.history();
    ui.modal({
      title: 'Assistant history',
      sub: list.length + ' jobs recorded',
      size: 'md',
      body: list.length
        ? '<div class="assistant__history assistant__history--modal">' + list.map(t =>
          '<div class="assistant__job is-static">' +
          '<span class="assistant__job-top"><b>' + U.esc(String(t.request || '')) + '</b></span>' +
          '<span class="assistant__job-sub">' + U.esc(t.status) + ' · ' + (t.steps || []).length + ' step(s) · ' + U.relTime(t.at) + '</span>' +
          '<p class="assistant__job-say">' + U.esc(t.say || '') + '</p>' +
          ((t.steps || []).length ? '<p class="assistant__why">' + (t.steps || []).map(s => U.esc(s.tool)).join(' · ') + '</p>' : '') +
          '</div>').join('') + '</div>'
        : ui.empty('Nothing yet', 'Give the assistant its first job', 'fa-robot'),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>'
    });
  });

  App.action('assistant.run', () => {
    const box = document.getElementById('assistant-ask');
    const text = (box ? box.value : state().text || '').trim();
    if (!text) { App.ui.toast('Describe the job first', 'amber'); return; }
    if (!App.ai.ready()) { App.ui.toast('Add the Gemini key in Settings → AI first', 'amber'); App.router.go('settings'); return; }

    state().text = text;
    state().running = true;
    state().task = { say: '', steps: [], status: 'running', at: U.now(), request: text };
    const live = document.getElementById('assistant-live');
    if (live) live.innerHTML = runningBox(state().task);

    App.agent.task(text, {
      rounds: 3,
      onStep(row) {
        state().task.steps.push(row);
        const target = document.getElementById('assistant-live');
        if (target) target.innerHTML = runningBox(state().task);
      }
    }).then(task => {
      state().running = false;
      state().task = task;
      const target = document.getElementById('assistant-live');
      if (target) target.innerHTML = taskBox(task);
      App.ui.toast(task.status === 'done' ? 'Job finished' : 'Job ' + task.status, task.status === 'done' ? 'lime' : 'amber');
      App.refresh();
    }).catch(err => {
      state().running = false;
      state().task = { say: String(err.message || err), steps: [], status: 'error', at: U.now(), request: text };
      const target = document.getElementById('assistant-live');
      if (target) target.innerHTML = taskBox(state().task);
    });
  });
})(window);

</script>

/* ===== assets/js/views.settings.js ===== */
/* =============================================================================
   Triverse OS — Settings
   Company profile, discovery/API, outreach rules, the cold-message library,
   sending integrations, backup/restore and the operating manual.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  const VARIABLES = ['business', 'category', 'city', 'rating', 'reviews', 'website', 'phone', 'whatsapp', 'sender', 'sender_role', 'company', 'portfolio', 'hook', 'offer', 'price', 'delivery', 'invoice', 'due', 'signature'];

  function tplState() {
    App.router.q.tplEdit = App.router.q.tplEdit || { id: (App.msg.templates()[0] || {}).id || '' };
    return App.router.q.tplEdit;
  }

  /** the template preview uses one of your own discovered businesses — never a fake one */
  function sampleLead() {
    return App.store.get('leads', [])[0] || {
      id: '', name: 'Business name', businessType: 'general', category: 'Local business', city: App.store.get('settings.google.city', 'Addis Ababa'),
      address: 'Addis Ababa, Ethiopia', phone: '', intlPhone: '', whatsapp: false,
      telegram: '', email: '', rating: 0, reviews: 0, hours: '', outreach: []
    };
  }

  function anchor(id) { return '<a id="settings-' + id + '"></a>'; }

  function companyCard() {

  /* ------------------------- connection diagnostics ------------------------- */
  App.action('settings.checkSources', () => {
    const box = document.getElementById('source-check');
    if (!box) return;
    const key = App.store.get('settings.google.apiKey', '');
    const rows = [];
    /* keep the machine-readable part of a Google error but make its links clickable */
    const linkify = (text) => U.esc(text).replace(/(https?:\/\/[^\s<)]+)/g,
      '<a class="link" href="$1" target="_blank" rel="noopener">$1</a>');
    const paint = () => {
      box.innerHTML = rows.map(r =>
        '<div class="glass-soft p-3 mb-2 flex items-start gap-3">' +
        '<span class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 ' +
        (r.state === 'ok' ? 'bg-accentMint text-bgMain' : r.state === 'bad' ? 'tone tone-red' : r.state === 'warn' ? 'tone tone-amber' : 'tone tone-muted') + '">' +
        '<i class="fa-solid ' + (r.state === 'ok' ? 'fa-check' : r.state === 'bad' ? 'fa-triangle-exclamation' : r.state === 'warn' ? 'fa-circle-info' : r.state === 'run' ? 'fa-spinner fa-spin' : 'fa-hourglass-half') + '"></i></span>' +
        '<div class="min-w-0"><p class="text-[12px] font-semibold text-white">' + U.esc(r.name) + '</p>' +
        '<p class="text-[11px] text-textMuted whitespace-pre-line">' + linkify(r.text) + '</p></div></div>').join('');
    };
    const withTimeout = (p, ms, label) => Promise.race([
      p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' did not answer within ' + Math.round(ms / 1000) + ' seconds.')), ms))
    ]);

    const searchRow = { name: '1 · Places API — business search', state: 'run', text: 'Asking Google for cafés in Addis Ababa…' };
    const detailRow = { name: '2 · Places API — the full business record', state: 'idle', text: 'Starts when the search returns a business: this is the call that brings opening hours, phone, website and the business\u2019s own details.' };
    const atmoRow = { name: '4 · Reviews & photos (Enterprise “Atmosphere” data)', state: 'idle', text: 'Starts after the record is read.' };
    const mapRow = { name: '3 · Maps JavaScript API — the interactive pin map', state: 'run', text: 'Loading the map library…' };
    rows.push(searchRow, detailRow, mapRow, atmoRow);
    paint();

    if (!key) {
      searchRow.state = 'bad';
      searchRow.text = 'No Places API key is saved. Paste your key above and press Check connections again.';
      detailRow.text = 'Skipped — there is no key to test with.';
      mapRow.state = 'bad';
      mapRow.text = 'Skipped — there is no key to test with.';
      atmoRow.text = 'Skipped — there is no key to test with.';
      paint();
      return;
    }

    withTimeout(App.providers.google({ typeKey: 'cafe', city: 'Addis Ababa', pageSize: 3 }), 20000, 'Google')
      .then(r => {
        searchRow.state = r.leads.length ? 'ok' : 'bad';
        searchRow.text = r.leads.length
          ? 'Working — ' + r.leads.length + ' real businesses came back with name, rating, review count, phone and website.'
          : 'Google answered, but no business matched that search in this area.';
        paint();
        const withId = r.leads.filter(l => l.placeId)[0];
        if (!withId) { detailRow.state = 'bad'; detailRow.text = 'No place ID came back, so the deep record cannot be read.'; paint(); return; }
        detailRow.state = 'run';
        detailRow.text = 'Reading the full record of “' + withId.name + '”…';
        paint();
        return withTimeout(App.providers.details(withId.placeId, { apply: false }), 20000, 'Place Details').then(d => {
          detailRow.state = 'ok';
          detailRow.text = 'Working — ' + (d.hoursWeek.length ? d.hoursWeek.length + ' days of opening hours' : 'no hours listed') +
            ', phone ' + (d.nationalPhone || 'none') + ', website ' + (d.website ? 'yes' : 'none') +
            ', category ' + (d.categoryLabel || '—') +
            '. This is exactly what the deep-info panel shows when you tap a business.';
          /* Google can serve the record yet withhold its Atmosphere data — say so
             in plain words instead of leaving the reviews section empty forever */
          if (d.atmosphere) {
            atmoRow.state = 'ok';
            atmoRow.text = 'Working — ' + d.reviewsList.length + ' real reviews and ' + d.photos.length + ' photos came back for “' + withId.name + '”.';
          } else if (d.atmosphereBlocked) {
            atmoRow.state = 'warn';
            atmoRow.text = App.providers.atmosphereHelp(withId) +
              '\n\nhttps://console.cloud.google.com/billing/linkedaccount';
          } else {
            atmoRow.state = 'warn';
            atmoRow.text = 'Google returned no reviews and no photos for “' + withId.name + '”. It may genuinely have none yet — tap another business to be sure.';
          }
          paint();
        });
      })
      .catch(e => {
        searchRow.state = 'bad';
        searchRow.text = e.message;
        detailRow.state = 'idle';
        detailRow.text = 'Could not run — the search has to succeed first.';
        atmoRow.text = 'Could not run — the search has to succeed first.';
        paint();
      });

    loadMapsJs(key).then(() => {
      mapRow.state = 'ok';
      mapRow.text = 'Working — the pin map inside Discover uses this library.';
      paint();
    }).catch(e => {
      mapRow.state = 'bad';
      mapRow.text = e.message + '\nThe app keeps the Google embed map on screen meanwhile — to get clickable pins, enable “Maps JavaScript API” in the same project.';
      paint();
    });
  });

  /** does the Maps JavaScript API answer for this key? */
  function loadMapsJs(key) {
    if (window.google && window.google.maps) return Promise.resolve(true);
    return new Promise((resolve, reject) => {
      let done = false;
      const cb = '__triSettingsMaps';
      window[cb] = () => { done = true; resolve(true); };
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&loading=async&callback=' + cb;
      s.onerror = () => { if (!done) reject(new Error('The map script could not be loaded — the key may block this referrer.')); };
      setTimeout(() => { if (!done) reject(new Error('The map library did not answer within 12 seconds.')); }, 12000);
      document.head.appendChild(s);
    });
  }
