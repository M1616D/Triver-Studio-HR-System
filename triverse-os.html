  <script>
/* ===== assets/js/ai.js ===== */
/* =============================================================================
   Triverse OS — Gemini layer
   Reads a business's own Google Maps record and writes what a good salesperson
   would write: the brief, the offers to pitch, the first message, and the full
   copy for their new website (headline, about, services, FAQ, testimonials from
   their real reviews). Optional — set a key in Settings → AI. Without a key the
   system behaves exactly as before, with the built-in templates.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;

  const ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const LIST_URL = 'https://generativelanguage.googleapis.com/v1beta/models';
  // Google retires model names without warning (2.0-flash and 2.5-flash have
  // already been withdrawn). So we never trust a hard-coded name: the app asks
  // the key which models it can actually use, then picks the best one.
  const PREFERRED = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-flash-latest'];
  const FALLBACK_MODEL = 'gemini-2.5-flash';

  const HOUSE_RULES = [
    'You write for Triverse Studio Software Solution, a studio in Addis Ababa, Ethiopia (CEO: Bereket Mamuye).',
    'The studio sells: websites, digital QR menus, HR & payroll software, inventory & billing software, custom modules, mobile apps, logos, brand kits, flyers, banners, thumbnails, social media ad packs, Meta/TikTok ad setup, hosting and maintenance retainers.',
    'All prices are in Ethiopian Birr (ETB) and shown like "Br 55,000".',
    'Use ONLY the facts given about the business. Never invent awards, years in business, staff numbers, certificates or claims.',
    'Write in warm, plain, professional English. Short sentences. No hype words like "revolutionary" or "cutting-edge".',
    'Speak to the owner, not to a marketing department. Ethiopian business context: Telebirr / CBE Birr payments, WhatsApp as the main channel, walk-in customers.',
    'Return JSON only. No markdown, no code fences, no commentary around it.'
  ].join('\n');

  const ai = App.ai = {
    ready() {
      const a = App.store.get('settings.ai', {});
      return Boolean(a && a.geminiKey && String(a.geminiKey).length > 15);
    },
    key() { return String(App.store.get('settings.ai.geminiKey', '') || '').trim(); },
    model() {
      const m = String(App.store.get('settings.ai.model', '') || '').trim();
      return m || PREFERRED[0];
    },
    setModel(name) {
      App.store.set('settings.ai.model', String(name || '').replace(/^models\//, ''), { silent: true });
      App.store.save();
    },

    /* --------------------------------------------------- which models exist? */
    /**
     * Ask the key itself which models it may call. This is the fix for
     * "models/gemini-2.0-flash is no longer available": we stop guessing names
     * and read the list Google returns for this exact key.
     */
    listModels(force) {
      const cached = App.store.get('settings.ai.modelList', null);
      const at = App.store.get('settings.ai.modelListAt', 0);
      if (!force && Array.isArray(cached) && cached.length && (U.now() - at) < 6 * 60 * 60 * 1000) {
        return Promise.resolve(cached);
      }
      if (!ai.key()) return Promise.reject(new Error('No Gemini API key saved. Add one in Settings \u2192 AI.'));
      return fetch(LIST_URL + '?pageSize=200&key=' + encodeURIComponent(ai.key()))
        .then(res => res.json().then(data => ({ res: res, data: data })))
        .then(r => {
          if (!r.res.ok) {
            const err = (r.data && r.data.error) || {};
            throw new Error('Gemini: ' + (err.message || ('HTTP ' + r.res.status)) + ai.hint(r.res.status, err));
          }
          const names = ((r.data && r.data.models) || [])
            .filter(m => ((m.supportedGenerationMethods || m.supportedActions) || []).indexOf('generateContent') !== -1)
            .map(m => String(m.name || '').replace(/^models\//, ''))
            .filter(Boolean);
          const list = ai.rank(names);
          App.store.set('settings.ai.modelList', list, { silent: true });
          App.store.set('settings.ai.modelListAt', U.now(), { silent: true });
          App.store.save();
          return list;
        });
    },

    /** only text models that can actually answer; best first */
    rank(names) {
      const bad = /embedding|aqa|imagen|image|vision-only|tts|audio|learnlm|gemma/i;
      const seen = {};
      const ok = (names || []).filter(n => {
        if (!/^gemini/i.test(n) || bad.test(n) || seen[n]) return false;
        seen[n] = 1;
        return true;
      });
      function score(n) {
        const v = parseFloat((n.match(/(\d+(?:\.\d+)?)/) || [])[1] || '0');
        let s = v * 100;
        if (/flash/.test(n)) s += 40;            // fast enough for a sales desk
        if (/flash-lite/.test(n)) s -= 10;
        if (/pro/.test(n)) s -= 5;
        if (/preview|exp|experimental/.test(n)) s -= 20;
        if (/latest/.test(n)) s += 5;
        if (/thinking/.test(n)) s -= 15;
        const pref = PREFERRED.indexOf(n);
        if (pref !== -1) s += 500 - pref;
        return s;
      }
      return ok.sort((a, b) => score(b) - score(a));
    },

    /** the best model this key can use (asks Google once, then caches) */
    bestModel(force) {
      return ai.listModels(force).then(list => list[0] || FALLBACK_MODEL).catch(() => ai.model());
    },

    /** if the saved name is dead, swap it for a live one and remember the swap */
    ensureModel(force) {
      return ai.listModels(force).then(list => {
        if (!list.length) return FALLBACK_MODEL;
        const cur = ai.model();
        if (list.indexOf(cur) !== -1) return cur;
        const next = list[0];
        ai.setModel(next);
        App.store.set('settings.ai.modelSwappedFrom', cur, { silent: true });
        App.store.save();
        return next;
      });
    },

    /** one raw Gemini call: prompt in, text out */
    call(prompt, opts) {
      return ai.attempt(prompt, opts, false);
    },

    attempt(prompt, opts, retried) {
      opts = opts || {};
      if (!ai.key()) return Promise.reject(new Error('No Gemini API key saved. Add one in Settings → AI.'));
      const model = ai.model();
      const gen = {
        temperature: opts.temperature === undefined ? 0.75 : opts.temperature,
        maxOutputTokens: opts.maxTokens || 3000,
        responseMimeType: 'application/json'
      };
      /*
       * 2.5-and-later models THINK before answering, and thinking tokens are
       * charged against maxOutputTokens. Left on, the model can spend the whole
       * budget thinking and the JSON comes back chopped — which is exactly what
       * "The AI answer was not JSON: {"ok":true,"message":" was. Every call here
       * wants one short exact object, so thinking is switched off.
       */
      const thinking = !opts.noThinking && ai.supportsThinking(model);
      if (thinking) gen.thinkingConfig = { thinkingBudget: 0 };

      const body = {
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        systemInstruction: { role: 'system', parts: [{ text: opts.system || HOUSE_RULES }] },
        generationConfig: gen
      };
      return fetch(ENDPOINT + encodeURIComponent(model) + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': ai.key() },
        body: JSON.stringify(body)
      }).then(res => res.json().then(data => ({ res: res, data: data })))
        .then(r => {
          if (!r.res.ok) {
            const err = (r.data && r.data.error) || {};
            const text = String(err.message || '');
            const deadModel = r.res.status === 404 || /no longer available|not found for API version|not supported for/i.test(text);
            const badThinking = thinking && /thinking|unknown name|invalid.*field|Invalid JSON payload/i.test(text);
            // Self-heal: a retired model name is not the user's problem to fix.
            if (deadModel && !retried) {
              return ai.ensureModel(true)
                .then(live => ai.attempt(prompt, opts, true))
                .then(txt => txt, () => Promise.reject(new Error('Gemini: ' + text + ai.hint(r.res.status, err))));
            }
            // Self-heal: a model that rejects thinkingConfig is called without it.
            if (badThinking && !retried) {
              return ai.attempt(prompt, Object.assign({}, opts, { noThinking: true }), true);
            }
            throw new Error('Gemini: ' + (err.message || ('HTTP ' + r.res.status)) + ai.hint(r.res.status, err));
          }
          const cand = (r.data.candidates || [])[0] || {};
          const parts = (cand.content && cand.content.parts) || [];
          // a thought part is the model thinking out loud — never the answer
          const text = parts.filter(p => !p.thought).map(p => p.text || '').join('').trim();
          if (!text) throw new Error('Gemini returned an empty answer' + (cand.finishReason ? ' (' + cand.finishReason + ')' : ''));
          /*
           * MAX_TOKENS means the object was cut off mid-sentence. Retrying with a
           * bigger budget is far better than showing a broken answer, which is
           * what used to happen here.
           */
          if (cand.finishReason === 'MAX_TOKENS' && !retried) {
            return ai.attempt(prompt, Object.assign({}, opts, {
              maxTokens: Math.min((gen.maxOutputTokens || 3000) * 2, 16000)
            }), true);
          }
          return text;
        });
    },

    /** only 2.5-and-later models accept thinkingConfig */
    supportsThinking(model) {
      return /gemini-(?:2\.5|3|4)|thinking/i.test(String(model || ''));
    },

    hint(status, err) {
      const msg = String((err && err.message) || '');
      if (status === 400 && /API key not valid/i.test(msg)) return ' The key was rejected — copy it again from aistudio.google.com/apikey (it starts with AIza).';
      if (status === 403) return ' The key is valid but the Generative Language API is not enabled for its project. Open console.cloud.google.com → APIs & Services → Library → enable “Generative Language API”.';
      if (status === 429) return ' Free-tier rate limit reached — wait a minute and try again.';
      if (status === 404 || /no longer available/i.test(msg)) return ' That model has been retired by Google. Press “Detect models” in Settings \u2192 AI and the app will switch to a live one automatically.';
      return '';
    },

    /**
     * Gemini often wraps JSON in prose or fences, and a truncated answer has no
     * closing brace at all. This pulls the object out, and when the tail is
     * missing it closes the brackets rather than failing the whole call.
     */
    parseJSON(text) {
      let t = String(text || '').trim()
        .replace(/^```(?:json)?/i, '').replace(/```\s*$/, '')
        .replace(/^[\s\S]*?(?=\{)/, '').trim();
      if (!t) throw new Error('The AI answer was empty where JSON was expected.');

      const direct = ai.tryParse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));
      if (direct) return direct;

      /* the answer was cut off — close whatever is still open */
      const repaired = ai.repairJSON(t.slice(t.indexOf('{')));
      const parsed = ai.tryParse(repaired);
      if (parsed) return parsed;

      throw new Error('The AI answer was not usable JSON: ' + t.slice(0, 160));
    },

    tryParse(s) {
      if (!s || s.length < 2) return null;
      try { return JSON.parse(s); } catch (e) { return null; }
    },

    /** close open strings, arrays and objects so a truncated answer still reads */
    repairJSON(s) {
      let out = '', depth = 0, inStr = false, esc = false;
      const stack = [];
      for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (esc) { out += c; esc = false; continue; }
        if (c === '\\') { out += c; esc = true; continue; }
        if (c === '"') { inStr = !inStr; out += c; continue; }
        if (!inStr) {
          if (c === '{' || c === '[') { stack.push(c); depth++; }
          else if (c === '}' || c === ']') { stack.pop(); depth--; }
        }
        out += c;
      }
      if (inStr) out += '"';
      /* a half-written member (  ,"key":  ) is dropped before we close brackets */
      out = out.replace(/,?\s*"[^"]*"\s*:\s*$/, '');
      out = out.replace(/[,:]\s*$/, '');
      out = out.replace(/,\s*$/, '');
      while (stack.length) out += stack.pop() === '{' ? '}' : ']';
      return out;
    },

    /* --------------------------------------------------------- the facts we send */
    /** the business's real Google record, in plain text, for the model */
    context(lead) {
      const c = App.store.get('settings.company', {});
      const t = App.dict.typeOf(lead.businessType);
      const reviews = (lead.reviewsList || []).slice(0, 5).map(r =>
        '- ' + r.when + ', ' + r.rating + '★, ' + r.author + ': ' + String(r.text || '(rating only)').slice(0, 240));
      return [
        'BUSINESS FACTS (from Google Maps)',
        'Name: ' + (lead.name || ''),
        'Category: ' + (lead.category || t.label),
        'Type group: ' + t.label,
        'Address: ' + (lead.address || ''),
        'Area: ' + (lead.areaLabel || lead.city || 'Addis Ababa'),
        'Google rating: ' + (lead.rating ? Number(lead.rating).toFixed(1) + ' out of 5' : 'not rated'),
        'Number of Google reviews: ' + (lead.reviews || 0),
        'Website on Google: ' + (lead.website ? lead.website : 'NONE — this is the opportunity'),
        'Phone on Google: ' + (lead.phone || lead.intlPhone || 'none listed'),
        'Opening hours: ' + ((lead.hoursWeek && lead.hoursWeek.length) ? lead.hoursWeek.join(' | ') : (lead.hours || 'not listed')),
        'Currently: ' + (lead.openNow === true ? 'open now' : lead.openNow === false ? 'closed now' : 'unknown'),
        'Price level: ' + (lead.priceLevelLabel || 'not listed'),
        lead.lat ? 'Coordinates: ' + lead.lat + ', ' + lead.lng : '',
        lead.summary ? 'Google description: ' + lead.summary : '',
        reviews.length ? 'REAL CUSTOMER REVIEWS:\n' + reviews.join('\n') : 'No written reviews available.',
        '',
        'OUR STUDIO:',
        'Company: ' + (c.name || 'Triverse Studio Software Solution'),
        'Sender: ' + (c.senderName || 'Bereket Mamuye') + ', ' + (c.senderRole || 'Co-founder & CEO'),
        'City: ' + (c.city || 'Addis Ababa') + ', ' + (c.country || 'Ethiopia'),
        'Portfolio: ' + (c.portfolio || c.website || ''),
        'Recommended offer from our catalogue: ' + App.msg.recommend(lead).items.map(i => i.name + ' (' + U.money(i.price) + ')').join(', ')
      ].filter(Boolean).join('\n');
    },

    /* ------------------------------------------------------------- lead brief */
    brief(lead) {
      const prompt = ai.context(lead) + '\n\n' +
        'Write the sales brief for this business and the first cold message to its owner.\n' +
        'Return JSON with exactly these keys: {"summary": "2 sentences a salesperson would say about this business and why a website matters to it", "angle": "the single strongest reason they should care, in under 20 words", "offer": "the one product to lead with and why", "risks": "one honest thing to be careful about when approaching them", "message": "a WhatsApp-ready first message, maximum 120 words, using: their name, their own rating and review count, one detail taken from their real reviews, a no-pressure question asking permission to send a free design concept. Sign as the sender from the studio. Never claim the website exists already."}';
      return ai.call(prompt, { temperature: 0.8 }).then(txt => ai.parseJSON(txt));
    },

    /* ------------------------------------------------------------- site copy */
    siteCopy(lead, sections) {
      const items = App.sitegen.items(lead).map(i => i.name + ' — ' + (i.price ? U.money(i.price) : 'price on request') + ' — ' + i.desc).join('\n');
      const prompt = ai.context(lead) + '\n\n' +
        'These are the draft service items our system prepared for their page (keep the names and prices unless a fact above contradicts them):\n' + items + '\n\n' +
        'Sections the page will show: ' + (sections || []).join(', ') + '\n\n' +
        'Write the website copy for this business, in their voice, using their real facts.\n' +
        'Return JSON with exactly these keys:\n' +
        '{"headline":"max 8 words", "tagline":"one sentence under the headline", "about":"two short paragraphs about the business as they would write it, based only on the facts", ' +
        '"services":[{"name":"service or dish name","desc":"one clear line","price":number_or_0}], "faq":[["question","answer"]], "cta":"one short line inviting the customer to call or message"}\n' +
        'Give 4 to 6 services and exactly 4 FAQ entries. Prices are ETB numbers only (no currency symbol).';
      return ai.call(prompt, { temperature: 0.8, maxTokens: 2600 }).then(txt => ai.parseJSON(txt));
    },

    /* ------------------------------------------------------- reply analysis */
    replyHelp(lead, replyText) {
      const prompt = ai.context(lead) + '\n\n' +
        'The owner replied to our first message with:\n"' + String(replyText || '').slice(0, 900) + '"\n\n' +
        'Return JSON with exactly these keys: {"sentiment":"positive" or "negative" or "unclear", "reason":"why, in under 15 words", ' +
        '"next":"the single best next step", "answer":"a short, warm reply we should send back (max 90 words) that moves them toward seeing the design concept or explaining the price"}';
      return ai.call(prompt, { temperature: 0.6 }).then(txt => ai.parseJSON(txt));
    },

    /* ------------------------------------------------------------ connectivity */
    /** proves the key AND picks a live model in one press */
    test() {
      return ai.listModels(true).then(list => {
        if (!list.length) throw new Error('The key works but exposes no text model.');
        const cur = ai.model();
        const use = list.indexOf(cur) !== -1 ? cur : list[0];
        if (use !== cur) {
          ai.setModel(use);
          App.store.set('settings.ai.modelSwappedFrom', cur, { silent: true });
          App.store.save();
        }
        return ai.attempt('Return JSON: {"ok":true,"message":"Gemini is connected."}', { temperature: 0, maxTokens: 200 }, true)
          .then(j => {
            ai.parseJSON(j);
            return {
              model: use,
              total: list.length,
              swapped: use !== cur ? cur : '',
              alt: list.slice(1, 4)
            };
          });
      });
    }
  };

  /* ============================== the screens ============================== */

  /** drawer action: brief + a message written from this business's real record */
  App.action('lead.aiBrief', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    if (!lead) return;
    const body = '<div id="ai-brief"><div class="glass-soft rounded-xl p-4 text-[11px] text-textMuted flex items-center gap-2">' +
      '<i class="fa-solid fa-brain fa-fade text-accentMint"></i> Reading ' + U.esc(lead.name) + '’s Google Maps record — reviews, hours, website gaps — and writing the brief…</div></div>';
    App.ui.modal({
      title: 'AI brief · ' + lead.name,
      sub: 'Written from this business’s own Maps data, never from a template',
      size: 'lg',
      body: body,
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
        '<button class="btn btn-lime" data-action="ai.useMessage" data-arg="' + lead.id + '"><i class="fa-solid fa-paper-plane"></i> Put this message in the composer</button>'
    });
    ai.brief(lead).then(b => {
      App.router.q.aiBrief = b;
      const box = document.getElementById('ai-brief');
      if (!box) return;
      const rows = [
        ['What we know', b.summary, 'fa-circle-info'],
        ['Why they should care', b.angle, 'fa-bolt'],
        ['Lead with', b.offer, 'fa-tag'],
        ['Watch out', b.risks, 'fa-triangle-exclamation']
      ];
      box.innerHTML = rows.map(r => r[1] ? '<div class="glass-soft rounded-xl p-3 mb-2">' +
        '<p class="text-[10px] text-accentMint font-semibold mb-1">' + App.ui.icon(r[2], '') + ' ' + U.esc(r[0]) + '</p>' +
        '<p class="text-[11px] text-gray-300 leading-relaxed">' + U.esc(r[1]) + '</p></div>' : '').join('') +
        '<p class="lbl mt-3">First WhatsApp message</p>' +
        '<textarea class="inp" id="ai-message" rows="9">' + U.esc(b.message || '') + '</textarea>' +
        '<div class="btn-row mt-2">' +
        '<button class="btn btn-ghost btn-sm" data-action="ai.copyMessage"><i class="fa-solid fa-copy"></i> Copy</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="ai.sendMessage" data-arg="' + lead.id + '"><i class="fa-brands fa-whatsapp"></i> Send on WhatsApp</button>' +
        '</div>';
    }).catch(err => {
      const box = document.getElementById('ai-brief');
      if (box) box.innerHTML = '<div class="glass-soft rounded-xl p-3 text-[11px] tone tone-red border whitespace-pre-line">' + U.esc(err.message) + '</div>' +
        '<p class="text-[10px] text-textMuted mt-2">Without the AI layer you can still work: the built-in message templates in the drawer and in Settings → Messages are personalised with the same Google data.</p>';
    });
  });

  App.action('ai.copyMessage', () => {
    const box = document.getElementById('ai-message');
    if (box) U.copy(box.value).then(() => App.ui.toast('Message copied', 'lime'));
  });
  App.action('ai.sendMessage', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    const box = document.getElementById('ai-message');
    if (!lead || !box) return;
    const tpl = App.msg.defaultTemplate(lead);
    App.ui.closeModal();
    App.msg.send({ lead: lead, channel: 'whatsapp', templateId: tpl ? tpl.id : '', body: box.value }).then(() => {
      App.ui.toast('Chat opened with the AI-written message — press send', 'lime');
      App.emit('state:changed', { path: 'sent' });
    });
  });
  App.action('ai.useMessage', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    const box = document.getElementById('ai-message');
    if (!lead || !box) { App.ui.closeModal(); return; }
    App.router.q.compose = App.router.q.compose || {};
    App.router.q.compose[lead.id] = box.value;
    App.ui.closeModal();
    App.ui.toast('Message ready in the composer', 'lime');
    if (App.actions['outreach.openCompose']) App.actions['outreach.openCompose']({ getAttribute: () => lead.id }, null);
  });

  /** generator action: swap the generated copy for AI copy built on the record */
  App.action('gen.ai', () => {
    const g = App.router.q.gen;
    const lead = App.store.find('leads', g.leadId);
    if (!lead) return;
    const box = document.getElementById('gen-preview');
    if (box) box.innerHTML = '<div class="glass-soft rounded-xl p-4 text-[11px] text-textMuted flex items-center gap-2">' +
      '<i class="fa-solid fa-brain fa-fade text-accentMint"></i> Gemini is writing the copy from this business’s reviews, hours and services…</div>';
    ai.siteCopy(lead, g.sections).then(copy => {
      g.ai = copy;
      if (App.openGenPreview) App.openGenPreview();
      else if (App.actions['gen.build']) App.actions['gen.build']({}, null);
      App.ui.toast('AI copy written — check the preview', 'lime');
    }).catch(err => {
      if (box) box.innerHTML = '<div class="glass-soft rounded-xl p-3 text-[11px] tone tone-red border whitespace-pre-line">' + U.esc(err.message) + '</div>' +
        '<p class="text-[10px] text-textMuted mt-2">The template copy is still there — press “Regenerate preview”.</p>';
    });
  });

  /** settings action: is the key working? */
  App.action('settings.aiTest', () => {
    const out = document.getElementById('ai-check');
    if (!out) return;
    const key = ai.key();
    if (!key) { out.innerHTML = '<div class="glass-soft p-3 text-[11px] tone tone-amber border">Paste your Gemini API key above first (aistudio.google.com/apikey).</div>'; return; }
    out.innerHTML = '<div class="glass-soft p-3 text-[11px] text-textMuted flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin text-accentMint"></i> Asking Gemini a one-word question…</div>';
    ai.test().then(info => {
      App.store.set('settings.ai.lastCheck', U.now(), { silent: true });
      App.store.set('settings.ai.lastCheckState', 'ok', { silent: true });
      App.store.set('settings.ai.lastCheckText', 'Connected on ' + info.model, { silent: true });
      App.store.set('settings.ai.enabled', true, { silent: true });
      App.store.save();
      out.innerHTML = '<div class="glass-soft p-3 text-[11px] tone tone-lime border">' +
        '<b>Connected.</b> Model in use: <b>' + U.esc(info.model) + '</b>' +
        (info.swapped ? ' <span class="text-textMuted">(“' + U.esc(info.swapped) + '” was retired by Google, switched automatically)</span>' : '') +
        '. ' + info.total + ' text models available on this key' +
        (info.alt.length ? ', e.g. ' + info.alt.map(x => U.esc(x)).join(', ') : '') + '.' +
        '<div class="btn-row mt-2">' +
        '<button class="btn btn-ghost btn-sm" data-action="settings.aiTest"><i class="fa-solid fa-rotate"></i> Test again</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="ai.openAssistant"><i class="fa-solid fa-wand-magic-sparkles"></i> Open the assistant</button>' +
        '</div></div>';
      App.emit('ai:changed', {});
    }).catch(err => {
      App.store.set('settings.ai.lastCheck', U.now(), { silent: true });
      App.store.set('settings.ai.lastCheckState', 'bad', { silent: true });
      App.store.set('settings.ai.lastCheckText', err.message, { silent: true });
      App.store.set('settings.ai.enabled', false, { silent: true });
      App.store.save();
      out.innerHTML = '<div class="glass-soft p-3 text-[11px] tone tone-red border whitespace-pre-line">' + U.esc(err.message) + '</div>' +
        '<div class="btn-row mt-2"><button class="btn btn-ghost btn-sm" data-action="settings.aiTest"><i class="fa-solid fa-rotate"></i> Try again</button></div>';
    });
  });

  /** Settings → AI: list every model the key can really call */
  App.action('settings.aiModels', () => {
    const out = document.getElementById('ai-check');
    if (!out) return;
    if (!ai.key()) { out.innerHTML = '<div class="glass-soft p-3 text-[11px] tone tone-amber border">Paste the key above first.</div>'; return; }
    out.innerHTML = '<div class="glass-soft p-3 text-[11px] text-textMuted"><i class="fa-solid fa-spinner fa-spin"></i> Asking Google which models this key can use…</div>';
    ai.listModels(true).then(list => {
      const cur = ai.model();
      out.innerHTML = '<div class="glass-soft p-3 text-[11px]">' +
        '<p class="text-accentMint font-semibold mb-2">' + list.length + ' models available</p>' +
        '<div class="flex flex-wrap gap-1 max-h-40 overflow-auto">' +
        list.map(n => '<button class="chip ' + (n === cur ? 'is-on' : '') + '" data-action="ai.pickModel" data-arg="' + U.esc(n) + '">' + U.esc(n) + '</button>').join('') +
        '</div><div class="btn-row mt-2"><button class="btn btn-ghost btn-sm" data-action="settings.aiTest"><i class="fa-solid fa-plug-circle-check"></i> Test the selected one</button></div></div>';
    }).catch(err => {
      out.innerHTML = '<div class="glass-soft p-3 text-[11px] tone tone-red border whitespace-pre-line">' + U.esc(err.message) + '</div>';
    });
  });

  App.action('ai.pickModel', el => {
    ai.setModel(el.getAttribute('data-arg'));
    App.ui.toast('Model set to ' + ai.model(), 'lime');
    if (App.actions['settings.aiModels']) App.actions['settings.aiModels']({}, null);
  });
})(window);

</script>
  <script>
/* ===== assets/js/agent.js ===== */
/* =============================================================================
   Triverse OS — the assistant
   Gemini is given a job description and a fixed set of tools. It plans in
   steps, shows you the plan, and only runs a step when the permission for that
   group of tools is switched on. Everything it does is written to an audit log
   so you can always see what changed and why.

   Nothing is ever sent to a business and nothing is ever deleted unless you
   switch those two permissions on yourself.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;

  /* ------------------------------------------------------------------ rights */
  const PERMS = [
    ['read', 'Read', 'See businesses, clients, projects, files and money', true],
    ['draft', 'Draft', 'Write messages and build website drafts', true],
    ['records', 'Records', 'Create projects, clients, invoices and change statuses', true],
    ['files', 'Files', 'Store and tag files in the vault', true],
    ['send', 'Send', 'Actually open or send a message to a business', false],
    ['erase', 'Delete', 'Remove records permanently', false]
  ];

  function perms() {
    const saved = App.store.get('settings.ai.perms', {}) || {};
    const out = {};
    PERMS.forEach(p => { out[p[0]] = saved[p[0]] === undefined ? p[3] : saved[p[0]] === true; });
    return out;
  }

  const agent = App.agent = {
    PERMS: PERMS,

    perms: perms,

    /** switch one permission on or off (saved instantly, audited) */
    setPerm(key, on) {
      const all = Object.assign({}, App.store.get('settings.ai.perms', {}), {});
      all[key] = Boolean(on);
      App.store.set('settings.ai.perms', all);
      App.store.save();
      App.log('assistant', 'Permission “' + key + '” ' + (on ? 'granted' : 'revoked'), '');
      return perms();
    },

    allowed(group) { return perms()[group] === true; },

    /* ----------------------------------------------------------------- tools */
    /**
     * Each tool is a small, honest action on the real data. `group` names the
     * permission that has to be granted before it can run.
     */
    tools: {
      list_businesses: {
        group: 'read', label: 'List businesses',
        args: '{ "status": "new|qualified|interested|contacted|won|lost|rejected (optional)", "type": "business type key (optional)", "hasWebsite": true|false (optional)", "limit": 20 }',
        run(a) {
          let list = App.store.get('leads', []).slice();
          if (a.status) list = list.filter(x => x.status === a.status);
          if (a.type) list = list.filter(x => x.businessType === a.type);
          if (a.hasWebsite === true) list = list.filter(x => x.website);
          if (a.hasWebsite === false) list = list.filter(x => !x.website);
          list = list.slice(0, Math.min(Number(a.limit) || 20, 50));
          return {
            ok: true, count: list.length,
            data: list.map(x => ({
              id: x.id, name: x.name, type: x.businessType, status: x.status,
              area: x.areaLabel || x.city || '', rating: x.rating, reviews: x.reviews,
              website: x.website || 'none', phone: x.phone || '', value: App.msg.recommend(x).total
            }))
          };
        }
      },
      business_detail: {
        group: 'read', label: 'Read one business',
        args: '{ "id": "business id" }',
        run(a) {
          const l = App.store.find('leads', a.id);
          if (!l) return { ok: false, error: 'No business with id ' + a.id };
          return {
            ok: true, data: {
              id: l.id, name: l.name, type: l.businessType, category: l.category, status: l.status,
              address: l.address, area: l.areaLabel || l.city, phone: l.phone, website: l.website || 'none',
              rating: l.rating, reviews: l.reviews, openNow: l.openNow,
              hours: (l.hoursWeek || []).join(' | '), summary: l.summary || '',
              email: l.email || '', telegram: l.telegram || '', whatsapp: l.intlPhone || '',
              reviewsList: (l.reviewsList || []).slice(0, 4).map(r => r.author + ': ' + String(r.text || '').slice(0, 180)),
              recommended: App.msg.recommend(l).items.map(i => i.name + ' ' + U.money(i.price))
            }
          };
        }
      },
      overview: {
        group: 'read', label: 'Workspace overview',
        args: '{}',
        run() {
          const leads = App.store.get('leads', []);
          const pay = App.store.get('payments', []);
          const sites = App.store.get('sites', []);
          const sum = f => U.sum(pay.filter(f), x => Number(x.amount) || 0);
          return {
            ok: true, data: {
              businesses: leads.length,
              byStatus: leads.reduce((m, l) => { m[l.status || 'new'] = (m[l.status || 'new'] || 0) + 1; return m; }, {}),
              withoutWebsite: leads.filter(l => !l.website).length,
              clients: App.store.get('clients', []).length,
              projects: sites.length,
              invoices: pay.length,
              invoiced: U.money(sum(() => true)),
              paid: U.money(sum(x => x.status === 'paid')),
              unpaid: U.money(sum(x => x.status !== 'paid')),
              openDrafts: sites.filter(s => s.kind === 'draft').length,
              files: (App.files ? App.files.all().length : 0)
            }
          };
        }
      },
      list_projects: {
        group: 'read', label: 'List projects and websites',
        args: '{ "phase": "live|development|delivered|maintenance|paused (optional)" }',
        run(a) {
          let list = App.store.get('sites', []).slice();
          if (a.phase) list = list.filter(x => (x.phase || (x.status === 'live' ? 'live' : 'development')) === a.phase);
          return {
            ok: true, count: list.length,
            data: list.slice(0, 40).map(x => ({
              id: x.id, name: x.name, client: x.clientName || '', phase: x.phase || x.status,
              url: x.url || '', price: Number(x.price) || 0, renews: x.hostRenewDate || ''
            }))
          };
        }
      },
      list_clients: {
        group: 'read', label: 'List clients',
        args: '{ "stage": "prospect|active|won|lost (optional)" }',
        run(a) {
          let list = App.store.get('clients', []).slice();
          if (a.stage) list = list.filter(x => x.stage === a.stage);
          return {
            ok: true, count: list.length,
            data: list.slice(0, 40).map(x => ({ id: x.id, name: x.name, stage: x.stage, industry: x.industry, phone: x.phone }))
          };
        }
      },
      list_money: {
        group: 'read', label: 'Read the invoices',
        args: '{ "unpaidOnly": true|false }',
        run(a) {
          let list = App.store.get('payments', []).slice();
          if (a.unpaidOnly) list = list.filter(x => x.status !== 'paid');
          return {
            ok: true, count: list.length,
            data: list.slice(0, 40).map(x => ({
              id: x.id, invoiceNo: x.invoiceNo, client: (App.store.find('clients', x.clientId) || {}).name || '',
              title: x.projectTitle, amount: Number(x.amount) || 0, paid: Number(x.amountPaid) || 0,
              status: x.status, due: x.dueDate || '', renews: x.renewalDate || ''
            }))
          };
        }
      },
      list_files: {
        group: 'read', label: 'Search the file vault',
        args: '{ "search": "text (optional)" }',
        run(a) {
          const all = App.files ? App.files.all() : [];
          const list = a.search ? all.filter(f => U.hit(f.name, a.search) || U.hit(f.category, a.search) || U.hit(f.description, a.search)) : all;
          return {
            ok: true, count: list.length,
            data: list.slice(0, 30).map(f => ({ id: f.id, name: f.name, category: f.category, size: U.bytes(f.size), project: f.projectId || '' }))
          };
        }
      },

      draft_message: {
        group: 'draft', label: 'Draft the message for a business',
        args: '{ "id": "business id", "channel": "whatsapp|telegram|email (optional)", "focus": "what to push (optional)" }',
        run(a) {
          const l = App.store.find('leads', a.id);
          if (!l) return { ok: false, error: 'No business with id ' + a.id };
          const tpl = App.msg.defaultTemplate(l);
          const body = App.msg.render(tpl, l).body;
          if (App.router.q) {
            App.router.q.compose = App.router.q.compose || {};
            App.router.q.compose[l.id] = body;
          }
          return { ok: true, data: { business: l.name, channel: a.channel || (tpl && tpl.channel) || 'whatsapp', text: body, keptInComposer: true } };
        }
      },
      build_site: {
        group: 'draft', label: 'Build the website draft',
        args: '{ "id": "business id", "sampleId": "optional sample id" }',
        run(a) {
          const l = App.store.find('leads', a.id);
          if (!l) return { ok: false, error: 'No business with id ' + a.id };
          const sample = a.sampleId ? App.samples.find(a.sampleId) : App.samples.forBusiness(l);
          const res = App.sitegen.save(l, sample ? sample.id : '', { sampleId: sample ? sample.id : undefined });
          return {
            ok: true, data: {
              siteId: res.site.id, name: res.site.name, sample: (res.meta && res.meta.sampleName) || '',
              fieldsFilled: (res.meta && res.meta.placeholders ? res.meta.placeholders.length : 0),
              detailsReplaced: (res.meta && res.meta.swapped ? res.meta.swapped.length : 0),
              sizeKb: Math.round((res.html || '').length / 1024)
            }
          };
        }
      },
      create_project: {
        group: 'records', label: 'Create a project record',
        args: '{ "name": "project name", "phase": "live|development|delivered|maintenance", "url": "", "clientName": "", "price": 0 }',
        run(a) {
          if (!a.name) return { ok: false, error: 'name is required' };
          const phase = a.phase || 'development';
          const client = a.clientName ? App.store.findBy('clients', c => U.hit(c.name, a.clientName)) : null;
          const rec = App.store.add('sites', {
            name: a.name, phase: phase, kind: 'project',
            status: phase === 'live' ? 'live' : phase === 'delivered' ? 'archived' : 'draft',
            clientId: client ? client.id : '', clientName: client ? client.name : 'Triverse Studio',
            url: a.url || '', price: Number(a.price) || 0, progressPct: phase === 'live' ? 100 : 40,
            generatedFrom: null, notes: a.notes || 'Created by the assistant'
          });
          App.log('project', 'Project “' + rec.name + '” created by the assistant', rec.id);
          return { ok: true, data: { id: rec.id, name: rec.name, phase: rec.phase } };
        }
      },
      create_client: {
        group: 'records', label: 'Create a client record',
        args: '{ "name": "client name", "phone": "", "industry": "", "fromBusinessId": "optional business id" }',
        run(a) {
          if (!a.name) return { ok: false, error: 'name is required' };
          const lead = a.fromBusinessId ? App.store.find('leads', a.fromBusinessId) : null;
          const existing = App.store.findBy('clients', c => U.hit(c.name, a.name));
          if (existing) return { ok: true, data: { id: existing.id, name: existing.name, note: 'already existed' } };
          const rec = App.store.add('clients', {
            name: a.name, type: 'company', stage: 'prospect', industry: a.industry || (lead ? lead.businessType : ''),
            phone: a.phone || (lead ? lead.phone : ''), address: lead ? lead.address : '',
            website: lead ? lead.website : '', source: lead ? lead.source : 'assistant',
            sourceLeadId: lead ? lead.id : '', accountManager: App.store.get('settings.company.senderName', ''),
            health: 'warm', tags: ['from-assistant'], notes: a.notes || 'Created by the assistant.'
          });
          if (lead) App.store.patch('leads', lead.id, { clientId: rec.id });
          App.log('client', 'Client “' + rec.name + '” created by the assistant', rec.id);
          return { ok: true, data: { id: rec.id, name: rec.name } };
        }
      },
      create_invoice: {
        group: 'records', label: 'Raise an invoice',
        args: '{ "clientName": "", "title": "what it is for", "amount": 0, "status": "due|paid", "dueDate": "YYYY-MM-DD" }',
        run(a) {
          const client = a.clientName ? App.store.findBy('clients', c => U.hit(c.name, a.clientName)) : null;
          if (!client) return { ok: false, error: 'No client matching “' + (a.clientName || '') + '” — create the client first.' };
          const n = (App.store.get('counters.invoice', 0) || 0) + 1;
          const invoiceNo = 'TS-' + String(n).padStart(4, '0');
          App.store.set('counters.invoice', n, { silent: true });
          const rec = App.store.add('payments', {
            invoiceNo: invoiceNo, clientId: client.id, projectTitle: a.title || 'Website project',
            amount: Number(a.amount) || 0, amountPaid: a.status === 'paid' ? Number(a.amount) || 0 : 0,
            method: a.method || 'bank', status: a.status === 'paid' ? 'paid' : 'due',
            issueDate: U.todayISO(), dueDate: a.dueDate || '', currency: 'ETB',
            notes: a.notes || 'Raised by the assistant'
          });
          App.log('payment', 'Invoice ' + invoiceNo + ' raised for ' + client.name + ' · ' + U.money(rec.amount), client.id);
          return { ok: true, data: { id: rec.id, invoiceNo: invoiceNo, client: client.name, amount: U.money(rec.amount) } };
        }
      },
      set_business_status: {
        group: 'records', label: 'Move a business forward',
        args: '{ "id": "business id", "status": "qualified|interested|contacted|replied|won|lost|rejected" }',
        run(a) {
          const l = App.store.find('leads', a.id);
          if (!l) return { ok: false, error: 'No business with id ' + a.id };
          App.store.patch('leads', l.id, { status: a.status });
          App.log('lead', l.name + ' moved to “' + a.status + '” by the assistant', l.id);
          return { ok: true, data: { id: l.id, name: l.name, status: a.status } };
        }
      },

      send_message: {
        group: 'send', label: 'Send the message',
        args: '{ "id": "business id", "channel": "whatsapp|telegram|email", "text": "the message body" }',
        run(a) {
          const l = App.store.find('leads', a.id);
          if (!l) return { ok: false, error: 'No business with id ' + a.id };
          const text = a.text || App.msg.render(App.msg.defaultTemplate(l), l).body;
          return App.msg.send({ lead: l, channel: a.channel || 'whatsapp', body: text })
            .then(r => ({ ok: true, data: { via: r.via, channel: a.channel || 'whatsapp', business: l.name, text: text } }));
        }
      },
      delete_record: {
        group: 'erase', label: 'Delete a record',
        args: '{ "collection": "leads|clients|sites|payments|documents", "id": "record id" }',
        run(a) {
          if (!a.collection || !a.id) return { ok: false, error: 'collection and id are required' };
          const rec = App.store.find(a.collection, a.id);
          if (!rec) return { ok: false, error: 'Nothing found to delete' };
          App.store.remove(a.collection, a.id);
          App.log('assistant', 'Deleted ' + a.collection + ' record “' + (rec.name || rec.invoiceNo || a.id) + '”', '');
          return { ok: true, data: { collection: a.collection, removed: rec.name || rec.invoiceNo || a.id } };
        }
      }
    },

    /** the tool catalogue, written out for the model */
    catalogue() {
      const p = perms();
      return Object.keys(agent.tools).map(k => {
        const t = agent.tools[k];
        return '- ' + k + '  [' + t.group + (p[t.group] ? '' : ' — PERMISSION OFF, do not use') + ']\n    ' + t.label + '\n    args: ' + t.args;
      }).join('\n');
    },

    /** a compact picture of the workspace so the model can resolve names to ids */
    digest() {
      const out = [];
      const leads = App.store.get('leads', []);
      out.push('BUSINESSES (' + leads.length + ') — id | name | type | status | website');
      leads.slice(0, 25).forEach(l => out.push('  ' + l.id + ' | ' + l.name + ' | ' + l.businessType + ' | ' + (l.status || 'new') + ' | ' + (l.website || 'none')));
      const clients = App.store.get('clients', []);
      out.push('CLIENTS (' + clients.length + ') — id | name | stage');
      clients.slice(0, 15).forEach(c => out.push('  ' + c.id + ' | ' + c.name + ' | ' + (c.stage || '')));
      const sites = App.store.get('sites', []);
      out.push('PROJECTS & WEBSITES (' + sites.length + ') — id | name | phase | client');
      sites.slice(0, 15).forEach(s => out.push('  ' + s.id + ' | ' + s.name + ' | ' + (s.phase || s.status) + ' | ' + (s.clientName || '')));
      const pay = App.store.get('payments', []);
      out.push('INVOICES (' + pay.length + ') — id | no | client | amount | status');
      pay.slice(0, 15).forEach(p => out.push('  ' + p.id + ' | ' + p.invoiceNo + ' | ' + ((App.store.find('clients', p.clientId) || {}).name || '') + ' | ' + (Number(p.amount) || 0) + ' | ' + p.status));
      out.push('SAMPLES: ' + App.samples.list().map(s => s.id + ' (' + s.category + ')').join(', '));
      out.push('TODAY: ' + U.todayISO());
      return out.join('\n');
    },

    RULES: [
      'You are the operations assistant inside Triverse Studio Software Solution (Addis Ababa, Ethiopia).',
      'You act on the company\'s own records through the tools listed. You never invent a record, an id, a price or a fact.',
      'Only use a tool if its permission is on. If the job needs a tool whose permission is off, do the part you can and say plainly in "say" which permission has to be switched on.',
      'Prefer reading before writing. Never guess an id — ids come from the digest or from an earlier step result.',
      'Money is Ethiopian Birr, written like “Br 55,000”. Dates are YYYY-MM-DD.',
      'Return JSON only, no markdown and no commentary outside the JSON object.'
    ].join('\n'),

    /**
     * One round: the model answers with what it understood and the steps to run.
     * `history` carries earlier rounds so it can chain (read → decide → act).
     */
    plan(request, history) {
      const prompt = 'THE REQUEST\n' + request + '\n\n' +
        'THE WORKSPACE RIGHT NOW\n' + agent.digest() + '\n\n' +
        'TOOLS AVAILABLE\n' + agent.catalogue() + '\n\n' +
        (history && history.length
          ? 'STEPS ALREADY RUN IN THIS TASK\n' + history.map((h, i) => (i + 1) + '. ' + h.tool + ' → ' + JSON.stringify(h.result).slice(0, 900)).join('\n') + '\n\n'
          : '') +
        'Answer with JSON in exactly this shape:\n' +
        '{"say":"one or two plain sentences to the operator: what you understood and what you are about to do",' +
        '"steps":[{"tool":"tool_name","args":{...},"why":"short reason"}, ...],' +
        '"done":true|false}\n' +
        'Rules: at most 6 steps per answer. Set "done":true only when no further step is needed. ' +
        (history && history.length ? 'If the earlier steps already finished the job, return "steps":[] and "done":true with a summary in "say".' : 'Start with the steps that gather what you need.');
      return App.ai.call(prompt, { temperature: 0.25, maxTokens: 2200, system: agent.RULES })
        .then(txt => App.ai.parseJSON(txt));
    },

    /** run one planned step, respecting its permission */
    runStep(step) {
      const tool = agent.tools[step && step.tool];
      if (!tool) return Promise.resolve({ ok: false, error: 'Unknown tool “' + (step && step.tool) + '”' });
      if (!agent.allowed(tool.group)) {
        return Promise.resolve({ ok: false, blocked: tool.group, error: 'Permission “' + tool.group + '” is off — switch it on in the assistant panel and run again.' });
      }
      let out;
      try { out = tool.run(step.args || {}); }
      catch (e) { return Promise.resolve({ ok: false, error: e.message }); }
      return Promise.resolve(out).catch(e => ({ ok: false, error: e.message }));
    },

    /** the full task: plan, run, hand the results back, repeat until done */
    task(request, opts) {
      opts = opts || {};
      const history = [];
      const rounds = opts.rounds || 3;
      const record = {
        id: U.uid('task'), at: U.now(), request: request, say: '', steps: [],
        status: 'running', rounds: 0
      };

      const loop = n => {
        if (n > rounds) return Promise.resolve(record);
        return agent.plan(request, history).then(p => {
          record.rounds = n;
          if (p.say) record.say = p.say;
          const steps = (p.steps || []).slice(0, 6);
          if (!steps.length) {
            record.status = 'done';
            return record;
          }
          if (opts.onPlan) opts.onPlan(steps, p.say || '');
          const filtered = steps;
          return Promise.all(filtered.map(s => agent.runStep(s).then(r => {
            const row = { tool: s.tool, args: s.args || {}, why: s.why || '', result: r, ok: r.ok === true };
            history.push(row);
            record.steps.push(row);
            if (opts.onStep) opts.onStep(row, history.length, filtered.length);
            return row;
          }))).then(rows => {
            const blocked = rows.filter(r => r.result && r.result.blocked);
            const failed = rows.filter(r => !r.ok && !(r.result && r.result.blocked));
            if (blocked.length) { record.status = 'blocked'; return record; }
            if (p.done === true) { record.status = 'done'; return record; }
            if (failed.length && failed.length === rows.length) { record.status = 'stopped'; return record; }
            return loop(n + 1);
          });
        });
      };

      return loop(1)
        .then(r => {
          r.status = r.status === 'running' ? 'done' : r.status;
          r.finishedAt = U.now();
          if (opts.audit !== false) agent.audit(r);
          return r;
        })
        .catch(err => {
          record.status = 'error';
          record.error = err.message;
          if (opts.audit !== false) agent.audit(record);
          return record;
        });
    },

    /* -------------------------------------------------------------- audit log */
    audit(rec) {
      const list = (App.store.get('aiTasks', []) || []).slice();
      list.unshift(rec);
      App.store.set('aiTasks', list.slice(0, 200), { silent: true });
      App.store.save();
      App.emit('state:changed', { path: 'aiTasks' });
      return rec;
    },

    history() { return App.store.get('aiTasks', []) || []; }
  };

  /* ==========================================================================
     the assistant panel
     ====================================================================== */
  const EXAMPLES = [
    'Which businesses have no website and are worth a first message today?',
    'Read the bakery with the best rating and write its first WhatsApp message.',
    'Build the website draft for the highest rated business without a website.',
    'List every unpaid invoice and tell me who to chase first.'
  ];

  function permsPanel() {
    const p = perms();
    return '<div class="glass-soft rounded-xl p-3 mb-3">' +
      '<p class="text-[11px] font-semibold mb-2">' + App.ui.icon('fa-shield-halved', 'text-accentMint') + ' What the assistant may do</p>' +
      '<div class="grid grid-cols-1 md:grid-cols-3 gap-2">' +
      PERMS.map(x => '<button class="text-left rounded-lg border px-3 py-2 transition ' +
        (p[x[0]] ? 'border-limeAccent bg-accentMint/10' : 'border-borderMain bg-bgPanel hover:border-limeAccent/40') +
        '" data-action="ai.perm" data-arg="' + x[0] + '">' +
        '<span class="text-[11px] font-semibold">' + U.esc(x[1]) + (p[x[0]] ? ' · on' : ' · off') + '</span>' +
        '<span class="block text-[9px] text-textMuted leading-snug">' + U.esc(x[2]) + '</span></button>').join('') +
      '</div></div>';
  }

  function stepRow(row) {
    const tone = row.result && row.result.blocked ? 'amber' : row.ok ? 'lime' : 'red';
    const summary = row.ok
      ? (row.result.data && row.result.count !== undefined ? row.result.count + ' row(s)'
        : JSON.stringify(row.result.data || {}).slice(0, 220))
      : U.esc(row.result && row.result.error ? row.result.error : 'failed');
    return '<div class="glass-soft rounded-xl p-3 mb-2 tone tone-' + tone + ' border">' +
      '<p class="text-[10px] font-semibold">' + (row.ok ? App.ui.icon('fa-circle-check') : App.ui.icon(row.result && row.result.blocked ? 'fa-lock' : 'fa-triangle-exclamation')) + ' ' +
      U.esc(row.tool) + '</p>' +
      (row.why ? '<p class="text-[9px] text-textMuted">' + U.esc(row.why) + '</p>' : '') +
      '<p class="text-[10px] mt-1 break-words">' + (row.ok ? summary : summary) + '</p></div>';
  }

  function resultsBox(task) {
    const body = (task.steps || []).length
      ? (task.steps || []).map(stepRow).join('')
      : '<p class="text-[11px] text-textMuted">Nothing was changed.</p>';
    return '<div class="glass-soft rounded-xl p-3 mb-3"><p class="text-[11px] font-semibold mb-1">' + U.esc(task.say || 'Done') + '</p>' +
      '<p class="text-[10px] text-textMuted mb-2">' + (task.steps || []).length + ' step(s) · ' + U.esc(task.status) +
      (task.error ? ' · ' + U.esc(task.error) : '') + '</p>' + body + '</div>';
  }

  App.action('ai.openAssistant', () => {
    const hasKey = App.ai.ready();
    App.router.q.aiAsk = App.router.q.aiAsk || { text: '', task: null, busy: false };
    const q = App.router.q.aiAsk;
    App.ui.modal({
      title: 'Assistant',
      sub: hasKey
        ? 'Give it a job. It plans, shows you the steps, and only touches what you allowed.'
        : 'Switch the permissions on now; the key in Settings → AI turns the planner on.',
      size: 'lg',
      body:
        permsPanel() +
        (hasKey ? '' :
          '<div class="glass-soft rounded-xl p-3 mb-3 tone tone-amber border text-[11px]">' +
          App.ui.icon('fa-key', 'text-amber-300') + ' No Gemini key yet — permissions can be set now. ' +
          'Add the key in <b>Settings → AI</b> and the assistant starts working on its own.</div>') +
        '<div id="ai-assistant-body">' + (q.task ? resultsBox(q.task) : '') + '</div>' +
        '<label class="lbl mt-2">What should it do?</label>' +
        '<textarea class="inp" id="ai-ask" rows="3" placeholder="Read the best-rated business without a website and write its first message">' + U.esc(q.text || '') + '</textarea>' +
        '<div class="flex flex-wrap gap-1.5 mt-2">' + EXAMPLES.map((e, i) =>
          '<button class="chip" data-action="ai.example" data-arg="' + i + '">' + U.esc(e.slice(0, 46)) + (e.length > 46 ? '…' : '') + '</button>').join('') + '</div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="ai.log"><i class="fa-solid fa-clock-rotate-left"></i> History</button>' +
        (hasKey
          ? '<button class="btn btn-lime" id="ai-run" data-action="ai.run"><i class="fa-solid fa-wand-magic-sparkles"></i> Work out a plan</button>'
          : '<button class="btn btn-lime" data-nav="settings"><i class="fa-solid fa-key"></i> Add the key in Settings</button>')
    });
  });

  App.action('ai.perm', el => {
    const key = el.getAttribute('data-arg');
    const p = perms();
    agent.setPerm(key, !p[key]);
    App.ui.toast(key + ' permission ' + (!p[key] ? 'granted' : 'revoked'), 'lime');
    App.actions['ai.openAssistant']({}, null);
  });

  App.action('ai.example', el => {
    const text = EXAMPLES[Number(el.getAttribute('data-arg'))] || '';
    const box = document.getElementById('ai-ask');
    if (box) box.value = text;
    App.router.q.aiAsk.text = text;
  });

  App.action('ai.run', () => {
    const box = document.getElementById('ai-ask');
    const body = document.getElementById('ai-assistant-body');
    const text = (box ? box.value : App.router.q.aiAsk.text || '').trim();
    if (!text) { App.ui.toast('Type what you want done', 'amber'); return; }
    App.router.q.aiAsk.text = text;
    if (body) body.innerHTML = '<div class="glass-soft rounded-xl p-3 text-[11px] text-textMuted flex items-center gap-2">' +
      '<i class="fa-solid fa-wand-magic-sparkles fa-fade text-accentMint"></i> Reading the workspace and working out the steps…</div>';
    agent.task(text, {
      rounds: 3,
      onStep(row) {
        const target = document.getElementById('ai-assistant-body');
        if (target) target.innerHTML = '<div class="glass-soft rounded-xl p-3 mb-2 text-[11px]">' +
          '<p class="font-semibold mb-1">Running…</p>' + stepRow(row) + '</div>';
      }
    }).then(task => {
      App.router.q.aiAsk.task = task;
      const target = document.getElementById('ai-assistant-body');
      if (target) target.innerHTML = resultsBox(task);
      App.ui.toast(task.status === 'done' ? 'Task finished' : 'Task ' + task.status, task.status === 'done' ? 'lime' : 'amber');
      App.refresh();
    }).catch(err => {
      const target = document.getElementById('ai-assistant-body');
      if (target) target.innerHTML = '<div class="glass-soft rounded-xl p-3 text-[11px] tone tone-red border whitespace-pre-line">' + U.esc(err.message) + '</div>';
    });
  });

  App.action('ai.log', () => {
    const list = agent.history();
    App.ui.modal({
      title: 'Assistant history',
      sub: list.length + ' tasks recorded on this device',
      size: 'md',
      body: list.length
        ? '<div class="space-y-2 max-h-[440px] overflow-auto">' + list.map(t =>
          '<div class="glass-soft rounded-xl p-3">' +
          '<p class="text-[11px] font-semibold">' + U.esc(t.request) + '</p>' +
          '<p class="text-[9px] text-textMuted">' + U.relTime(t.at) + ' · ' + U.esc(t.status) + ' · ' + (t.steps || []).length + ' step(s)</p>' +
          '<p class="text-[10px] mt-1">' + U.esc(t.say || '') + '</p>' +
          ((t.steps || []).length ? '<p class="text-[9px] text-textMuted mt-1">' + (t.steps || []).map(s => U.esc(s.tool)).join(' · ') + '</p>' : '') +
          '</div>').join('') + '</div>'
        : '<p class="text-[11px] text-textMuted">Nothing yet.</p>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>'
    });
  });
})(window);

</script>
  <script>
/* ===== assets/js/views.dashboard.js ===== */
/* =============================================================================
   Triverse OS — Dashboard view (KPIs, funnel, today's work, revenue, activity)
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  /* ------------------------------ shared metrics --------------------------- */
  App.metrics = function () {
    const leads = App.store.get('leads', []);
    const clients = App.store.get('clients', []);
    const payments = App.store.get('payments', []);
    const sites = App.store.get('sites', []);
    const liveStatuses = ['paid', 'partial'];
    const openStatuses = ['pending', 'partial', 'overdue'];
    const paid = payments.filter(p => liveStatuses.indexOf(p.status) !== -1);
    const open = payments.filter(p => openStatuses.indexOf(p.status) !== -1);
    const collected = U.sum(paid, p => Number(p.amountPaid) || (p.status === 'paid' ? Number(p.amount) : 0));
    const outstanding = U.sum(open, p => (Number(p.amount) || 0) - (Number(p.amountPaid) || 0));
    const overdue = U.sum(payments.filter(p => p.status === 'overdue' || (openStatuses.indexOf(p.status) !== -1 && p.dueDate && p.dueDate < U.todayISO())), p => (Number(p.amount) || 0) - (Number(p.amountPaid) || 0));
    const thisMonth = U.monthKey(U.todayISO());
    const monthCollected = U.sum(paid.filter(p => U.monthKey(p.paidDate || p.issueDate) === thisMonth), p => Number(p.amountPaid) || Number(p.amount) || 0);

    const months = [];
    for (let i = 7; i >= 0; i--) {
      const d = new Date(); d.setMonth(d.getMonth() - i); d.setDate(1);
      months.push(d.toISOString().slice(0, 7));
    }
    const revenueByMonth = months.map(m => ({
      key: m, label: U.monthLabel(m).split(' ')[0],
      value: U.sum(paid.filter(p => U.monthKey(p.paidDate || p.issueDate) === m), p => Number(p.amountPaid) || Number(p.amount) || 0)
    }));

    const dueFollowUps = leads.filter(l => l.nextFollowUp && l.nextFollowUp <= U.todayISO() && ['replied-off'].indexOf(l.status) === -1 && ['won', 'lost', 'rejected'].indexOf(l.status) === -1);
    const renewals = sites.filter(s => s.hostRenewDate && U.daysUntil(s.hostRenewDate) !== null && U.daysUntil(s.hostRenewDate) <= 45)
      .concat(payments.filter(p => p.renewalDate && U.daysUntil(p.renewalDate) !== null && U.daysUntil(p.renewalDate) <= 45).map(p => ({
        name: 'Retainer renewal · ' + (App.store.find('clients', p.clientId) || {}).name, hostRenewDate: p.renewalDate, clientName: 'Payment'
      })));

    return {
      leads: leads, clients: clients, payments: payments, sites: sites,
      leadStats: App.msg.stats(leads),
      collected: collected, monthCollected: monthCollected, outstanding: outstanding, overdue: overdue,
      revenueByMonth: revenueByMonth,
      activeClients: clients.filter(c => c.stage === 'active').length,
      pastClients: clients.filter(c => c.stage === 'past').length,
      rejectedClients: clients.filter(c => c.stage === 'rejected').length,
      prospectClients: clients.filter(c => c.stage === 'prospect').length,
      sitesLive: sites.filter(s => s.status === 'live').length,
      sitesSample: sites.filter(s => s.kind === 'sample').length,
      sitesDraft: sites.filter(s => s.kind === 'draft').length,
      templates: App.store.get('templates', []).length,
      dueFollowUps: dueFollowUps,
      renewals: renewals,
      awaitingQuote: leads.filter(l => l.status === 'interested'),
      toTriage: leads.filter(l => l.reply && l.status === 'replied')
    };
  };

  /* --------------------------------- helpers -------------------------------- */
  function kpiRow(m) {
    const ls = m.leadStats;
    return '<div class="four-col">' +
      ui.stat({
        icon: 'fa-bullseye', label: 'Open pipeline value', value: U.money(ls.pipelineValue),
        badge: ls.interested + ' interested', tone: 'lime',
        sub: ls.noWebsite + ' of ' + ls.total + ' businesses have no website'
      }) +
      ui.stat({
        icon: 'fa-paper-plane', label: 'Cold messages sent', value: U.num(ls.sent),
        badge: ls.replyRate + '% reply rate', tone: ls.replyRate >= 20 ? 'lime' : 'amber',
        sub: ls.positive + ' positive · ' + ls.negative + ' negative replies'
      }) +
      ui.stat({
        icon: 'fa-wallet', label: 'Collected this month', value: U.money(m.monthCollected),
        badge: m.payments.length + ' invoices', tone: m.monthCollected ? 'lime' : 'amber',
        sub: U.money(m.collected) + ' collected in total'
      }) +
      ui.stat({
        icon: 'fa-hourglass-half', label: 'Outstanding', value: U.money(m.outstanding),
        badge: m.overdue ? U.money(m.overdue) + ' overdue' : 'on time', tone: m.overdue ? 'red' : 'lime',
        sub: m.activeClients + ' active clients · ' + m.pastClients + ' past'
      }) +
      '</div>';
  }

  /** shown until the first business is discovered — three obvious next moves */
  function startCard() {
    const cards = [
      ['fa-map-location-dot', 'Find businesses', 'Search a business type on Google Maps and get every listing in that area of Addis Ababa.', 'focus.discover', 'Find businesses'],
      ['fa-wand-magic-sparkles', 'Build their website', 'One tap generates a complete site from a business\u2019s own Google information and type.', 'sites.generate', 'Build a website'],
      ['fa-file-invoice-dollar', 'Get paid', 'Add a client, raise the invoice and track what is paid in Ethiopian Birr.', 'pay.new', 'Raise an invoice']
    ];
    return '<div class="grid grid-cols-1 md:grid-cols-3 gap-5">' + cards.map(c =>
      '<div class="glass-card hover-lift p-5 flex flex-col">' +
      '<div class="stat-ico mb-4"><i class="fa-solid ' + c[0] + '"></i></div>' +
      '<h3 class="section-title">' + c[1] + '</h3>' +
      '<p class="text-[12px] text-textMuted leading-relaxed mt-1.5 flex-1">' + c[2] + '</p>' +
      '<button class="btn btn-lime mt-4" data-action="' + c[3] + '">' + c[4] + '</button></div>').join('') + '</div>';
  }

  function funnelCard(m) {
    const ls = m.leadStats;
    const rows = [
      ['Businesses found', ls.total, 'muted'],
      ['With no website', ls.noWebsite, 'amber'],
      ['Contacted', ls.contacted, 'blue'],
      ['Replied', ls.replied, 'violet'],
      ['Interested', ls.interested, 'lime'],
      ['Won', ls.won, 'lime']
    ];
    const max = Math.max.apply(null, rows.map(r => r[1]).concat([1]));
    return ui.card(
      ui.head('Discovery funnel', '<button class="btn btn-ghost btn-sm" data-nav="discover">Open discovery</button>', 'From Google Maps lead to paying client') +
      '<div class="space-y-2.5">' + rows.map(r =>
        '<div><div class="flex items-center justify-between text-[10px] mb-1"><span class="text-gray-300">' + r[0] + '</span><span class="text-textMuted">' + U.num(r[1]) + ' · ' + U.pct(r[1], ls.total) + '%</span></div>' +
        ui.progress((r[1] / max) * 100) + '</div>').join('') + '</div>' +
      '<div class="flex items-center justify-around pt-4 mt-3 border-t border-white/5">' +

    }));
    m.renewals.slice(0, 3).forEach(s => {
      const d = U.daysUntil(s.hostRenewDate);
      items.push({
        icon: 'fa-rotate', tone: 'blue', title: s.name,
        sub: 'Renewal on ' + U.fmtDate(s.hostRenewDate) + ' · ' + (d < 0 ? Math.abs(d) + ' days overdue' : d + (d === 1 ? ' day' : ' days') + ' left'),
        action: s.id ? 'sites.open' : 'nav', arg: s.id || 'sites', cta: 'Open'

    return ui.card(
      ui.head('Today\'s worklist', items.length ? ui.badge(items.length + ' items', 'lime') : ui.badge('all clear', 'muted'), 'Follow-ups, replies, quotes, money and renewals') +
      (items.length ? '<div class="space-y-2">' + items.map(it =>
        '<div class="bg-field border border-line rounded-xl p-2.5 flex items-center gap-3">' +
        '<span class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ' + (ui.TONES[it.tone] || '') + '"><i class="fa-solid ' + it.icon + ' text-[11px]"></i></span>' +
        '<div class="min-w-0 flex-1"><p class="text-[11px] font-semibold text-white truncate">' + U.esc(it.title) + '</p>' +
        '<p class="text-[9px] text-textMuted truncate">' + U.esc(it.sub) + '</p></div>' +
        '<button class="btn btn-ghost btn-sm" data-action="' + it.action + '" data-arg="' + it.arg + '">' + it.cta + '</button></div>').join('') + '</div>'
        : ui.empty('Nothing is due right now', 'Discovery keeps the pipeline full — search a business type and start messaging.', 'fa-mug-hot')));
  }

  App.views = App.views || {};
  App.views.dashboard = {
    title: 'Dashboard',
    sub: 'Live snapshot of discovery, outreach and cash',
    icon: 'fa-shapes',
    render(el) {
      const m = App.metrics();
      const c = App.store.get('settings.company', {});
      const activities = App.store.get('activities', []).slice(0, 8);

      el.innerHTML =
        (m.leads.length ? kpiRow(m) : startCard()) +
        '<div class="two-col mt-5">' +
        '<div class="space-y-4">' + funnelCard(m) +
        ui.card(ui.head('Collections — last 8 months', ui.badge('collected ' + U.money(m.collected), 'lime'), 'Paid and partially paid invoices, in Ethiopian Birr') +
          ui.bars(m.revenueByMonth, { highlight: m.revenueByMonth[m.revenueByMonth.length - 1].key }) +
          '<div class="flex items-center gap-2 text-[10px] text-textMuted mt-2"><span class="w-2 h-2 rounded-full bg-limeAccent"></span> This month <span class="text-white font-semibold">' + U.money(m.monthCollected) + '</span></div>') +
        ui.card(ui.head('Business assets', '<button class="btn btn-ghost btn-sm" data-nav="sites">Manage</button>', 'Websites, samples and templates you already own') +
          '<div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-center">' +
          [['Live websites', m.sitesLive], ['Sample pages', m.sitesSample], ['Generated drafts', m.sitesDraft], ['Templates', m.templates]].map(x =>

        '</div>' +
        '<div class="space-y-4">' + todayCard(m) +
        ui.card(ui.head('Recent activity', '<button class="btn btn-ghost btn-sm" data-nav="pipeline">Pipeline</button>') +
