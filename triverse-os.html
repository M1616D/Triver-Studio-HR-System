<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triverse Studio — Business System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%2391C8B9'/><path d='M6 6h12v2.6h-4.6V18h-2.8V8.6H6z' fill='%230F1015'/></svg>" />

  <!-- theme is applied before first paint so there is no flash of the wrong mode -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('triverse.os.theme');
        if (saved !== 'light' && saved !== 'dark') {
          saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', saved);
        document.documentElement.classList.toggle('dark', saved !== 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

/* =============================================================================
   Triverse OS — design system
   Palette, structure and motion mirrored from the reference dashboard:
   mint accent on near-black panels, 260px labelled sidebar, 88px header,
   circular icon badges, ring charts. Dark is the studio signature;
   light is daylight mode for offices and printing.
   ========================================================================== */

:root {
  /* ---- structure (rgb triples so Tailwind can apply opacity) ---- */
  --bg-main: 15 16 21;        /* #0F1015 — page */
  --bg-sidebar: 11 12 16;     /* #0B0C10 — sidebar */
  --bg-panel: 21 22 28;       /* #15161C — cards */
  --bg-panel-2: 28 29 36;     /* #1C1D24 — inputs, active nav */
  --hover: 33 35 45;
  --track: 36 38 50;

  --line: 36 38 50;           /* #242632 */
  --line-soft: 30 32 42;
  --line-strong: 48 51 66;

  --ink: 255 255 255;         /* #FFFFFF */
  --ink-2: 224 227 236;
  --ink-3: 176 182 202;
  --muted: 143 149 178;       /* #8F95B2 */

  --accent: 145 200 185;      /* #91C8B9 — mint */
  --accent-dark: 90 134 121;  /* #5A8679 */
  --accent-trans: rgba(145, 200, 185, .12);

  /* status tones */
  --tone-lime-bg: 25 36 33;   --tone-lime-fg: 145 200 185; --tone-lime-bd: rgba(145, 200, 185, .32);
  --tone-muted-bg: 31 34 44;  --tone-muted-fg: 143 149 178; --tone-muted-bd: 43 46 62;
  --tone-red-bg: 42 22 26;    --tone-red-fg: 252 165 165;  --tone-red-bd: rgba(248, 113, 113, .30);
  --tone-amber-bg: 42 35 20;  --tone-amber-fg: 252 211 77; --tone-amber-bd: rgba(245, 158, 11, .30);
  --tone-blue-bg: 19 30 44;   --tone-blue-fg: 125 211 252; --tone-blue-bd: rgba(56, 189, 248, .30);
  --tone-violet-bg: 30 26 46; --tone-violet-fg: 196 181 253; --tone-violet-bd: rgba(167, 139, 250, .30);

  /* effect */
  --shadow: 0 14px 34px -22px rgba(0, 0, 0, .9);
  --shadow-lift: 0 24px 50px -24px rgba(0, 0, 0, .95);
  --glow: 0 0 0 1px rgba(145, 200, 185, .28), 0 14px 34px -16px rgba(145, 200, 185, .35);
  --rim: inset 0 1px 0 rgba(255, 255, 255, .045);
  --radius: 18px;
  --radius-lg: 24px;
  --ease: cubic-bezier(.22, .68, .35, 1);
}

:root[data-theme="light"] {
  --bg-main: 246 247 249;
  --bg-sidebar: 255 255 255;
  --bg-panel: 255 255 255;
  --bg-panel-2: 242 245 247;
  --hover: 236 241 245;
  --track: 226 232 240;

  --line: 226 232 240;
  --line-soft: 236 240 244;
  --line-strong: 206 214 226;

  --ink: 14 20 29;
  --ink-2: 44 56 74;
  --ink-3: 82 95 114;
  --muted: 108 120 140;

  --accent: 58 126 110;       /* readable mint on white */
  --accent-dark: 38 96 84;
  --accent-trans: rgba(58, 126, 110, .10);

  --tone-lime-bg: 232 244 240; --tone-lime-fg: 38 96 84;  --tone-lime-bd: rgba(58, 126, 110, .30);
  --tone-muted-bg: 240 243 247; --tone-muted-fg: 92 104 124; --tone-muted-bd: 214 221 231;
  --tone-red-bg: 253 236 236;  --tone-red-fg: 180 35 24;  --tone-red-bd: rgba(180, 35, 24, .25);
  --tone-amber-bg: 253 245 227; --tone-amber-fg: 154 100 8; --tone-amber-bd: rgba(154, 100, 8, .25);
  --tone-blue-bg: 233 244 254; --tone-blue-fg: 11 107 168; --tone-blue-bd: rgba(11, 107, 168, .25);
  --tone-violet-bg: 242 238 255; --tone-violet-fg: 91 63 214; --tone-violet-bd: rgba(91, 63, 214, .22);

  --shadow: 0 14px 34px -24px rgba(15, 23, 42, .35);
  --shadow-lift: 0 24px 50px -28px rgba(15, 23, 42, .45);
  --glow: 0 0 0 1px rgba(58, 126, 110, .28), 0 14px 30px -18px rgba(58, 126, 110, .35);
  --rim: inset 0 1px 0 rgba(255, 255, 255, .8);
}

/* ---------------------------------- base ---------------------------------- */
* { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body {
  margin: 0;
  background-color: rgb(var(--bg-main));
  /* two soft light sources so the shell never looks flat, plus an almost
     invisible grid that gives large empty areas something to sit on */
  background-image:
    radial-gradient(920px 460px at 82% -10%, color-mix(in srgb, rgb(var(--accent)) 11%, transparent), transparent 68%),
    radial-gradient(760px 420px at -8% 106%, rgba(120, 140, 255, .07), transparent 62%),
    linear-gradient(color-mix(in srgb, rgb(var(--ink)) 2.5%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, rgb(var(--ink)) 2.5%, transparent) 1px, transparent 1px);
  background-size: auto, auto, 34px 34px, 34px 34px;
  background-attachment: fixed, fixed, fixed, fixed;
  color: rgb(var(--ink));
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background-color .3s var(--ease), color .3s var(--ease);
}

::selection { background: rgb(var(--accent)); color: rgb(var(--bg-main)); }
button, a, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* custom scrollbars, as in the reference */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: rgb(var(--bg-main)); }
::-webkit-scrollbar-thumb { background: rgb(var(--line)); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgb(var(--muted)); }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; }

/* ------------------------------- sidebar nav ------------------------------ */
.side-link {
  position: relative;
  display: flex; align-items: center; gap: .9rem;
  padding: .7rem 1rem; border-radius: .6rem;
  color: rgb(var(--muted)); font-size: 13px; font-weight: 500;
  transition: color .18s var(--ease), background .2s var(--ease), transform .18s var(--ease);
}
.side-link i { font-size: 16px; transition: transform .25s var(--ease); }
.side-link:hover { color: rgb(var(--ink)); background: rgb(var(--bg-panel-2)); transform: translateX(2px); }
.side-link:hover i { transform: scale(1.12); }
.side-link.is-active { background: rgb(var(--bg-panel-2)); color: rgb(var(--accent)); }
.side-link__n {
  margin-left: auto; font-size: 10px; font-weight: 600; padding: .1rem .38rem; border-radius: 999px;
  background: rgb(var(--track)); color: rgb(var(--muted));
}
.side-link.is-active .side-link__n { background: var(--accent-trans); color: rgb(var(--accent)); }
.side-link.is-active::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 22px; border-radius: 0 4px 4px 0;
  background: rgb(var(--accent)); box-shadow: 0 0 12px rgba(145, 200, 185, .65);
  animation: indicator .28s var(--ease);
}

/* ------------------------------- surfaces --------------------------------- */
body .glass-card {
  background: rgb(var(--bg-panel));
  border: 1px solid rgb(var(--line));
  border-radius: var(--radius);
  box-shadow: var(--shadow), var(--rim);
  transition: border-color .2s var(--ease), box-shadow .28s var(--ease), transform .22s var(--ease), background .3s var(--ease);
}
body .glass-card:hover { box-shadow: var(--shadow-lift), var(--rim); }
body .glass-soft {
  background: rgb(var(--bg-panel-2));
  border: 1px solid rgb(var(--line));
  border-radius: 14px;
  transition: border-color .2s var(--ease), background .3s var(--ease), transform .2s var(--ease);
}
body .glass-soft:hover { border-color: color-mix(in srgb, rgb(var(--accent)) 35%, rgb(var(--line))); }
.hover-lift { transition: transform .22s var(--ease), box-shadow .28s var(--ease), border-color .2s var(--ease); }
.hover-lift:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: color-mix(in srgb, rgb(var(--accent)) 32%, rgb(var(--line))); }
.surface-hover:hover { border-color: color-mix(in srgb, rgb(var(--accent)) 45%, transparent); box-shadow: var(--shadow-lift); transform: translateY(-2px); }

/* ------------------------------- typography ------------------------------- */
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.link { color: rgb(var(--accent)); border-bottom: 1px dashed transparent; transition: border-color .18s var(--ease); }
.link:hover { border-bottom-color: currentColor; }
.section-label { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: rgb(var(--muted)); }
.section-title { font-size: 15px; font-weight: 600; color: rgb(var(--ink)); }
.section-sub { font-size: 11px; color: rgb(var(--muted)); margin-top: .15rem; }

/* --------------------------------- buttons -------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  font-size: 11px; font-weight: 600; padding: .55rem .9rem; border-radius: .7rem;
  border: 1px solid transparent; white-space: nowrap; color: rgb(var(--ink-2));
  transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease),
              transform .16s var(--ease), box-shadow .24s var(--ease);
}
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid color-mix(in srgb, rgb(var(--accent)) 60%, transparent); outline-offset: 2px; }
.btn-lime { background: rgb(var(--accent)); color: rgb(var(--bg-main)); box-shadow: 0 10px 24px -12px rgba(145, 200, 185, .8); }
.btn-lime:hover { background: rgb(var(--accent-dark)); color: #fff; transform: translateY(-1px); box-shadow: 0 16px 30px -14px rgba(145, 200, 185, .9); }
.btn-ghost { background: rgb(var(--bg-panel-2)); border-color: rgb(var(--line)); color: rgb(var(--ink-2)); }
.btn-ghost:hover { border-color: color-mix(in srgb, rgb(var(--accent)) 55%, transparent); color: rgb(var(--ink)); transform: translateY(-1px); }
.btn-danger { background: rgb(var(--tone-red-bg)); border-color: rgb(var(--tone-red-bd)); color: rgb(var(--tone-red-fg)); }
.btn-danger:hover { box-shadow: 0 0 0 1px rgb(var(--tone-red-bd)); transform: translateY(-1px); }
.btn-sm { padding: .34rem .62rem; font-size: 10px; border-radius: .6rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .45rem; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
  background: rgb(var(--bg-panel-2)); border: 1px solid transparent; color: rgb(var(--muted));
  transition: color .18s var(--ease), background .2s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
}
.icon-btn:hover { color: rgb(var(--ink)); background: rgb(var(--bg-panel)); box-shadow: var(--glow); transform: translateY(-2px); }
.icon-btn:active { transform: scale(.94); }
.icon-btn i { transition: transform .45s var(--ease); }
.icon-btn:hover i { transform: rotate(-8deg) scale(1.08); }

/* app.css is loaded after Tailwind's utilities, so a component rule with a bare
   `display` would win over `.hidden`. Hiding must always win. */
.hidden { display: none !important; }

/* ---------------------------------- inputs -------------------------------- */
.inp {
  width: 100%; background: rgb(var(--bg-panel-2)); border: 1px solid rgb(var(--line)); border-radius: .7rem;
  padding: .55rem .75rem; font-size: 12px; color: rgb(var(--ink)); outline: none;
  transition: border-color .18s var(--ease), box-shadow .22s var(--ease), background .3s var(--ease);
}
.inp::placeholder { color: rgb(var(--muted)); }
.inp:hover { border-color: rgb(var(--line-strong)); }
.inp:focus { border-color: color-mix(in srgb, rgb(var(--accent)) 70%, transparent); box-shadow: 0 0 0 3px var(--accent-trans); }
select.inp, select.inp option { background: rgb(var(--bg-panel-2)); color: rgb(var(--ink)); }
textarea.inp { line-height: 1.6; resize: vertical; }
.lbl { display: block; font-size: 10px; color: rgb(var(--muted)); margin-bottom: .3rem; font-weight: 500; }

/* the big search field on Discover */
.search-hero {
  position: relative; display: flex; align-items: center; gap: .6rem;
  background: rgb(var(--bg-panel-2)); border: 1px solid rgb(var(--line)); border-radius: 999px;
  padding: .4rem .4rem .4rem 1.1rem;
  transition: border-color .2s var(--ease), box-shadow .28s var(--ease), background .3s var(--ease), transform .2s var(--ease);
}
.search-hero:hover { border-color: rgb(var(--line-strong)); }
.search-hero:focus-within { border-color: color-mix(in srgb, rgb(var(--accent)) 65%, transparent); box-shadow: 0 0 0 4px var(--accent-trans); transform: translateY(-1px); }
.search-hero input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: rgb(var(--ink)); font-size: 15px; padding: .5rem 0; }
.search-hero input::placeholder { color: rgb(var(--muted)); }
.search-hero .hint-key { font-size: 9px; color: rgb(var(--muted)); border: 1px solid rgb(var(--line)); border-radius: 6px; padding: .05rem .3rem; }

.suggest {
  position: absolute; left: 0; right: 0; top: calc(100% + .45rem); z-index: 60;
  background: rgb(var(--bg-panel)); border: 1px solid rgb(var(--line)); border-radius: 1rem;
  box-shadow: var(--shadow-lift); padding: .35rem; max-height: 340px; overflow-y: auto;
  animation: pop .18s var(--ease);
}
.suggest button {
  width: 100%; text-align: left; display: flex; align-items: center; gap: .6rem;
  padding: .5rem .55rem; border-radius: .7rem; border: 0; background: transparent; color: rgb(var(--ink-2)); font-size: 12px;
  transition: background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
}
.suggest button:hover, .suggest button.is-cursor { background: rgb(var(--bg-panel-2)); color: rgb(var(--ink)); transform: translateX(3px); }
.suggest .sug-ico { width: 24px; height: 24px; border-radius: .5rem; display: inline-flex; align-items: center; justify-content: center; background: rgb(var(--track)); color: rgb(var(--accent)); font-size: 10px; flex: none; }

/* ---------------------------------- chips --------------------------------- */
.chip {
  display: inline-flex; align-items: center; gap: .35rem; font-size: 11px; font-weight: 600; white-space: nowrap;
  padding: .38rem .68rem; border-radius: 999px; border: 1px solid rgb(var(--line));
  background: rgb(var(--bg-panel-2)); color: rgb(var(--muted));
  transition: all .18s var(--ease);
}
.chip:hover { border-color: color-mix(in srgb, rgb(var(--accent)) 55%, transparent); color: rgb(var(--ink)); transform: translateY(-1px); }
.chip:active { transform: scale(.96); }
.chip .chip-n { font-size: 9px; opacity: .85; background: rgb(var(--track)); border-radius: 999px; padding: 0 .32rem; }
.chip.is-on { background: var(--accent-trans); border-color: color-mix(in srgb, rgb(var(--accent)) 55%, transparent); color: rgb(var(--accent)); box-shadow: 0 0 0 3px var(--accent-trans); }

/* --------------------------- lists, cards and rows ------------------------- */
.row-card {
  position: relative; background: rgb(var(--bg-panel)); border: 1px solid rgb(var(--line)); border-radius: .85rem;
  cursor: pointer; overflow: hidden;
  transition: border-color .18s var(--ease), transform .2s var(--ease), box-shadow .24s var(--ease), background .24s var(--ease);
}
.row-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgb(var(--accent));
  transform: scaleY(0); transform-origin: top; transition: transform .24s var(--ease);
}
.row-card:hover { border-color: color-mix(in srgb, rgb(var(--accent)) 45%, transparent); transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.row-card:hover::before { transform: scaleY(1); }
.row-card.is-sel { border-color: color-mix(in srgb, rgb(var(--accent)) 75%, transparent); background: color-mix(in srgb, rgb(var(--accent)) 8%, rgb(var(--bg-panel))); }

/* staggered entrance for any list of cards */
.stagger > * { animation: rise .36s var(--ease) both; }
.stagger > *:nth-child(1) { animation-delay: .01s } .stagger > *:nth-child(2) { animation-delay: .04s }
.stagger > *:nth-child(3) { animation-delay: .07s } .stagger > *:nth-child(4) { animation-delay: .10s }
.stagger > *:nth-child(5) { animation-delay: .13s } .stagger > *:nth-child(6) { animation-delay: .16s }
.stagger > *:nth-child(7) { animation-delay: .19s } .stagger > *:nth-child(8) { animation-delay: .22s }
.stagger > *:nth-child(9) { animation-delay: .25s } .stagger > *:nth-child(10) { animation-delay: .28s }
.stagger > *:nth-child(n+11) { animation-delay: .3s }

/* step bar: 1 Search → 2 Filter → 3 Open → 4 Build → 5 Send */
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
.step { display: inline-flex; align-items: center; gap: .4rem; font-size: 10px; font-weight: 600; color: rgb(var(--muted));
  border: 1px solid rgb(var(--line)); background: rgb(var(--bg-panel-2)); border-radius: 999px; padding: .32rem .66rem; transition: all .2s var(--ease); }
.step .n { width: 16px; height: 16px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
  background: rgb(var(--track)); font-size: 9px; }
.step.is-done { color: rgb(var(--tone-lime-fg)); border-color: rgb(var(--tone-lime-bd)); background: rgb(var(--tone-lime-bg)); }
.step.is-active { color: rgb(var(--ink)); border-color: color-mix(in srgb, rgb(var(--accent)) 60%, transparent); box-shadow: 0 0 0 3px var(--accent-trans); }
.step.is-active .n { background: rgb(var(--accent)); color: rgb(var(--bg-main)); }
.step-sep { width: 12px; height: 1px; background: rgb(var(--line)); }

/* ---------------------------------- tables -------------------------------- */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 12px; }
.tbl th { text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: rgb(var(--muted)); font-weight: 600; padding: 0 .6rem .2rem; }
.tbl td { background: rgb(var(--bg-panel)); padding: .6rem .65rem; border-top: 1px solid rgb(var(--line)); border-bottom: 1px solid rgb(var(--line)); vertical-align: middle;
  transition: background .18s var(--ease), border-color .18s var(--ease); }
.tbl tr td:first-child { border-left: 1px solid rgb(var(--line)); border-radius: .75rem 0 0 .75rem; }
.tbl tr td:last-child { border-right: 1px solid rgb(var(--line)); border-radius: 0 .75rem .75rem 0; }
.tbl tbody tr { transition: transform .18s var(--ease); }
.tbl tbody tr:hover td { background: rgb(var(--bg-panel-2)); border-color: color-mix(in srgb, rgb(var(--accent)) 35%, rgb(var(--line))); }
.tbl tbody tr:hover { transform: translateX(3px); }
tr.hl td { border-color: color-mix(in srgb, rgb(var(--accent)) 45%, transparent); }

/* ---------------------------------- badges -------------------------------- */
.tag { font-size: 9px; padding: .14rem .5rem; border-radius: 999px; background: rgb(var(--track)); color: rgb(var(--muted)); border: 1px solid rgb(var(--line)); }
.tone { border-width: 1px; border-style: solid; transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); }
.tone-lime   { background: rgb(var(--tone-lime-bg));   color: rgb(var(--tone-lime-fg));   border-color: rgb(var(--tone-lime-bd)); }
.tone-muted  { background: rgb(var(--tone-muted-bg));  color: rgb(var(--tone-muted-fg));  border-color: rgb(var(--tone-muted-bd)); }
.tone-red    { background: rgb(var(--tone-red-bg));    color: rgb(var(--tone-red-fg));    border-color: rgb(var(--tone-red-bd)); }
.tone-amber  { background: rgb(var(--tone-amber-bg));  color: rgb(var(--tone-amber-fg));  border-color: rgb(var(--tone-amber-bd)); }
.tone-blue   { background: rgb(var(--tone-blue-bg));   color: rgb(var(--tone-blue-fg));   border-color: rgb(var(--tone-blue-bd)); }
.tone-violet { background: rgb(var(--tone-violet-bg)); color: rgb(var(--tone-violet-fg)); border-color: rgb(var(--tone-violet-bd)); }

/* Solid stage colours. The .tone-* classes above are pale badge tints — at the
   3px height of a stage rail or a progress bar they read as empty outlines, so
   the board uses these instead. */
.fill-lime   { background: rgb(var(--accent)); }
.fill-muted  { background: rgb(var(--muted)); }
.fill-blue   { background: #4f8ff7; }
.fill-violet { background: #a78bfa; }
.fill-amber  { background: #f0b429; }
.fill-red    { background: #ef4444; }
:root[data-theme="light"] .fill-blue { background: #2563eb; }
:root[data-theme="light"] .fill-amber { background: #d97706; }
:root[data-theme="light"] .fill-muted { background: #94a3b8; }

.dot-live { position: relative; display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: rgb(var(--accent)); }
.dot-live::after { content: ''; position: absolute; inset: -3px; border-radius: 999px; border: 1px solid rgb(var(--accent)); animation: ping 2s var(--ease) infinite; }

/* ---------------------------- metrics and rings --------------------------- */
.circle-chart { transform: rotate(-90deg); transform-origin: 50% 50%; }
.circle-chart path:last-of-type { transition: stroke-dasharray .9s var(--ease); }

/* the circular mint badge every KPI card leads with */
.stat-ico {
  width: 52px; height: 52px; border-radius: 999px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgb(var(--accent)); color: rgb(var(--bg-main)); font-size: 20px;
  box-shadow: 0 10px 26px -14px rgba(145, 200, 185, .85);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.metric-card:hover .stat-ico { transform: scale(1.06) rotate(-4deg); box-shadow: 0 16px 32px -14px rgba(145, 200, 185, .95); }

.metric-card { position: relative; overflow: hidden; }
.metric-card::after {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgb(var(--accent)), transparent);
  opacity: 0; transition: opacity .28s var(--ease);
}
.metric-card:hover::after { opacity: .9; }
.metric-card:hover .count-pop { transform: translateY(-2px); }
.count-pop { display: inline-block; transition: transform .28s var(--ease); animation: count-pop .5s var(--ease) both; }
.metric-card::before {
  content: ''; position: absolute; top: 0; bottom: 0; width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .05), transparent);
  transform: translateX(-120%); transition: transform .8s var(--ease);
}
.metric-card:hover::before { transform: translateX(320%); }

.bar-anim { animation: bar-grow .9s var(--ease) both; }

/* ring chart (reference dashboard look) */
.ring-chart { position: relative; }
.ring-chart svg { width: 100%; height: 100%; }
.ring-chart__circle { transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s var(--ease); }
.ring-chart__val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: rgb(var(--ink)); }

/* ------------------------------ nav / legacy ------------------------------ */
.nav-link { position: relative; transition: color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease), box-shadow .28s var(--ease); }
.nav-link:hover { transform: translateY(-1px) scale(1.04); }
.nav-link.is-active { background: rgb(var(--accent)); color: rgb(var(--bg-main)); box-shadow: 0 8px 22px -12px rgba(145, 200, 185, .9); }

/* --------------------------------- overlays ------------------------------- */
.overlay { position: fixed; inset: 0; background: rgba(6, 7, 10, .66); backdrop-filter: blur(7px); z-index: 100; animation: fade .18s var(--ease); }
:root[data-theme="light"] .overlay { background: rgba(15, 23, 42, .30); }
.modal-panel { animation: pop .26s var(--ease); }
.drawer-panel { animation: slide .3s var(--ease); }
/* detail views open as a centred panel rather than a side sheet */
.detail-panel {
  animation: pop .3s var(--ease);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lift), var(--rim);
  position: relative;
}
.detail-panel::before {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 2px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: linear-gradient(90deg, transparent, rgb(var(--accent)), transparent); opacity: .55;
}
.detail-head { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(10px); background: color-mix(in srgb, rgb(var(--bg-panel)) 88%, transparent); }
.toast { animation: toast-in .3s var(--ease); }

@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.985) } to { opacity: 1; transform: none } }
@keyframes slide { from { transform: translateX(30px); opacity: .35 } to { transform: none; opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes count-pop { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes ping { 0% { transform: scale(.8); opacity: .9 } 70%, 100% { transform: scale(1.9); opacity: 0 } }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px) } to { opacity: 1; transform: none } }
@keyframes sk { from { background-position: 200% 0 } to { background-position: -200% 0 } }
@keyframes view-in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes indicator { from { height: 0; opacity: 0 } to { height: 22px; opacity: 1 } }
@keyframes draw { to { stroke-dashoffset: 0 } }

.fade-in { animation: view-in .3s var(--ease); }
#view > * { animation: view-in .3s var(--ease) both; }

.skeleton {
  background: linear-gradient(90deg, rgb(var(--bg-panel-2)), rgb(var(--hover)), rgb(var(--bg-panel-2)));
  background-size: 200% 100%; animation: sk 1.3s infinite linear; border-radius: .6rem;
}

/* ----------------------------------- misc --------------------------------- */
.kv { display: flex; justify-content: space-between; gap: .75rem; padding: .38rem 0; border-bottom: 1px dashed rgb(var(--line-soft)); font-size: 12px; }
.kv:last-child { border-bottom: none; }
.kv .k { color: rgb(var(--muted)); }
.kv .v { color: rgb(var(--ink-2)); text-align: right; word-break: break-word; }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
@media (min-width: 1180px) { .two-col { grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); } }
.three-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
@media (min-width: 900px) { .three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.four-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
@media (min-width: 1100px) { .four-col { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 560px) { .four-col { grid-template-columns: minmax(0, 1fr); } }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: .9rem; overflow-x: auto; padding-bottom: .5rem; }

/* tidy the reference dashboard's generous card padding where the app uses it */
body .glass-card.p-4 { padding: 1.15rem; }

/* ---------------------------------------------------------------------------
   rhythm
   The fix for controls sitting flush against the words above them: a row of
   buttons, chips or tags always gets its own space, and text always keeps a gap
   from whatever follows it.
   --------------------------------------------------------------------------- */

/* a tool row is allowed to breathe */
.btn-row { gap: .5rem; row-gap: .5rem; }
.btn-row .btn { min-height: 30px; }

/* anything that follows a line of text gets one clear step of space */
.lbl + .btn-row,
p + .btn-row,
.section-sub + .btn-row,
.kv + .btn-row,
.tag + .btn-row,
.chip + .btn-row,
.glass-soft + .btn-row,
.text-textMuted + .btn-row,
.inp + .btn-row,
select + .btn-row { margin-top: .7rem; }

/* and text following a tool row gets one too */
.btn-row + p,
.btn-row + .lbl,
.btn-row + .glass-soft,
.btn-row + .text-textMuted,
.chip + .lbl,
.chip + p { margin-top: .8rem; }

/* a heading and the line under it never touch */
.section-title + p, .section-title + .section-sub { margin-top: .3rem; }
.section-sub + .lbl, .section-sub + .inp { margin-top: .55rem; }

/* stacked panels keep a consistent step between them */
.two-col, .three-col { gap: 1.4rem; }
.four-col { gap: 1.2rem; }

/* tables: roomier rows so the numbers are not cramped against the labels */
.tbl { border-spacing: 0 8px; }
.tbl th { padding: .1rem .8rem .3rem; }
.tbl td { padding: .68rem .8rem; }
.tbl td .tag { margin: 0; }

/* a badge never touches the title beside it */
.section-title + .badge, .flex > .badge + .badge { margin-left: .35rem; }

/* icon-only buttons stay square and separated from neighbours */
.btn-row .btn.btn-sm > i:only-child { margin: 0; }
.icon-btn { margin-left: .1rem; }

/* an empty state always has room around its action */
.empty p + .btn-row, .empty .btn-row { margin-top: .85rem; }

/* --------------------------- storage warning strip ------------------------- */
.storage-warning {
  display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
  padding: .7rem .95rem; border-radius: 14px;
  background: rgb(var(--tone-amber-bg)); border: 1px solid rgb(var(--tone-amber-bd));
  color: rgb(var(--tone-amber-fg)); font-size: 11px; line-height: 1.5;
  animation: rise .3s var(--ease);
}
.storage-warning span { flex: 1; min-width: 240px; }
.storage-warning b { font-weight: 700; }
.storage-warning .btn { flex: none; }

/* ------------------------------ the live map ------------------------------ */
/* Advanced markers require a cloud map ID, and a map ID makes Google ignore
   inline map styles. Dark mode is therefore painted here instead, so the map
   still reads as part of the dark shell. */
#tri-map.map-dark { filter: invert(92%) hue-rotate(180deg) contrast(.92) saturate(.75) brightness(1.03); }

/* the pin itself: one dot per business, lime when they have no website yet */
.tri-pin {
  width: 14px; height: 14px; border-radius: 50%;
  background: #91c8b9; border: 2px solid #0f1015;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
  cursor: pointer;
  transition: transform .16s var(--ease), background .16s var(--ease);
}
.tri-pin:hover { transform: scale(1.45); background: #d4ff7a; }
.tri-pin.has-site { background: #5a8679; }
.tri-pin.has-site:hover { background: #8fd0bd; }

/* --------------------- literal utility colours, retuned ------------------- */
/* the screens were written with fixed dark values; these keep light mode clean */
:root[data-theme="light"] .text-white { color: rgb(var(--ink)); }
:root[data-theme="light"] .text-gray-200,
:root[data-theme="light"] .text-gray-300 { color: rgb(var(--ink-2)); }
:root[data-theme="light"] .text-gray-100 { color: rgb(var(--ink)); }
:root[data-theme="light"] .text-limeAccent { color: rgb(var(--accent)); }
:root[data-theme="light"] .text-red-300,
:root[data-theme="light"] .text-red-400 { color: rgb(var(--tone-red-fg)); }
:root[data-theme="light"] .text-amber-300 { color: rgb(var(--tone-amber-fg)); }
:root[data-theme="light"] .text-sky-300 { color: rgb(var(--tone-blue-fg)); }
:root[data-theme="light"] .text-violet-300 { color: rgb(var(--tone-violet-fg)); }
:root[data-theme="light"] .text-textMuted { color: rgb(var(--muted)); }
:root[data-theme="light"] .bg-limeAccent.text-black,
:root[data-theme="light"] .btn-lime { color: rgb(var(--bg-main)); }
:root[data-theme="light"] .shadow-2xl { box-shadow: var(--shadow-lift); }

/* ---------------------------- reduced motion ------------------------------ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ------------------------------ chart drawing ----------------------------- */
.spark path, .area svg path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s var(--ease) forwards; }
.spark, .area svg { overflow: visible; }

/* ------------------------- responsive sidebar ----------------------------- */
@media (max-width: 1023px) {
  #sidebar {
    position: fixed; inset: 0 auto 0 0; transform: translateX(-100%);
    transition: transform .3s var(--ease);
    box-shadow: 0 0 60px rgba(0, 0, 0, .6);
  }
  body.sidebar-open #sidebar { transform: none; }
  body.sidebar-open::after {
    content: ''; position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 35;
    animation: fade .2s var(--ease);
  }
}

/* ============================================================================
   Branding — the studio mark is always a circle, whether it is an uploaded
   logo or the studio initials.
   ========================================================================== */
.brand-circle {
  width: 42px; height: 42px; border-radius: 999px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
  background: rgb(var(--accent)); color: rgb(var(--bg-main));
  font-weight: 700; font-size: 12px; letter-spacing: .02em;
  box-shadow: 0 8px 20px -12px rgba(145, 200, 185, .9);
  transition: transform .4s var(--ease), box-shadow .4s var(--ease);
}
.brand-circle:hover { transform: translateY(-2px) scale(1.04); box-shadow: var(--glow); }
.brand-circle--sm { width: 40px; height: 40px; }
.brand-circle__img { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand-mark { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand-mark--text { display: flex; align-items: center; justify-content: center; }

/* #user-avatar and #user-avatar-lg already are round frames */
#user-avatar, #user-avatar-lg { overflow: hidden; }
#user-avatar img, #user-avatar-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px; display: block; }

/* ============================================================================
   Sign-in / lock screen
   ========================================================================== */
.lock-screen {
  position: fixed; inset: 0; z-index: 200; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgb(var(--bg-main));
}
.lock-backdrop { position: absolute; inset: 0; overflow: hidden; }
.lock-glow {
  position: absolute; width: 780px; height: 780px; border-radius: 999px;
  top: -320px; right: -220px; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, rgb(var(--accent)) 26%, transparent) 0%, transparent 62%);
  filter: blur(12px);
  animation: lockFloat 14s var(--ease) infinite alternate;
}
.lock-glow::after {
  content: ''; position: absolute; inset: 0; border-radius: 999px; transform: translate(-620px, 780px);
  background: radial-gradient(circle, color-mix(in srgb, rgb(var(--accent)) 16%, transparent) 0%, transparent 60%);
}
@keyframes lockFloat { from { transform: translateY(0) scale(1); } to { transform: translateY(34px) scale(1.07); } }
.lock-card {
  position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 30px 30px 22px;
  border-radius: 22px; animation: rise .42s var(--ease) both;
  box-shadow: var(--shadow-lift);
}
.lock-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.lock-logo {
  width: 54px; height: 54px; border-radius: 999px; flex: 0 0 auto; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: rgb(var(--accent)); color: rgb(var(--bg-main)); font-weight: 700; font-size: 15px;
  box-shadow: 0 10px 26px -14px rgba(145, 200, 185, .95);
}
.lock-logo__img { width: 100%; height: 100%; object-fit: cover; }
.lock-brand__name { font-size: 14px; font-weight: 600; color: rgb(var(--ink)); line-height: 1.2; }
.lock-brand__sub { font-size: 10px; color: rgb(var(--muted)); margin-top: 3px; }
.lock-body { display: block; }
.lock-title { font-size: 15px; font-weight: 600; color: rgb(var(--ink)); }
.lock-note { font-size: 11px; color: rgb(var(--muted)); line-height: 1.65; margin-top: 6px; }
.lock-error {
  font-size: 11px; margin-top: 12px; padding: 8px 11px; border-radius: 10px;
  background: rgb(var(--tone-red-bg)); color: rgb(var(--tone-red-fg)); border: 1px solid rgb(var(--tone-red-bd));
  animation: shake .32s var(--ease);
}
@keyframes shake {
  0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); }
  50% { transform: translateX(4px); } 75% { transform: translateX(-2px); }
}
.lock-hint { font-size: 10px; color: rgb(var(--muted)); margin-top: 10px; font-style: italic; }
.lock-label { display: block; font-size: 10px; color: rgb(var(--muted)); margin: 16px 0 6px; font-weight: 500; }
.lock-field { position: relative; }
.lock-input {
  width: 100%; background: rgb(var(--bg-panel-2)); border: 1px solid rgb(var(--line));
  border-radius: 11px; padding: 11px 40px 11px 13px; font-size: 12px; color: rgb(var(--ink));
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.lock-input::placeholder { color: rgb(var(--muted)); }
.lock-input:focus { outline: none; border-color: color-mix(in srgb, rgb(var(--accent)) 70%, transparent); box-shadow: 0 0 0 3px var(--accent-trans); }
.lock-reveal {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px; border-radius: 8px; color: rgb(var(--muted));
}
.lock-reveal:hover { color: rgb(var(--ink)); background: rgb(var(--hover)); }
.lock-submit {
  width: 100%; margin-top: 20px; padding: 12px; border-radius: 11px; font-size: 12px; font-weight: 600;
  background: rgb(var(--accent)); color: rgb(var(--bg-main));
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s var(--ease);
  box-shadow: 0 12px 26px -14px rgba(145, 200, 185, .9);
}
.lock-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--glow); }
.lock-submit:disabled { opacity: .5; cursor: not-allowed; }
.lock-submit.is-busy { letter-spacing: .02em; }
.lock-links { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.lock-links--row { flex-direction: row; gap: 16px; }
.lock-link { font-size: 10px; color: rgb(var(--muted)); text-align: left; transition: color .2s var(--ease); }
.lock-link:hover { color: rgb(var(--accent)); }
.lock-code {
  margin-top: 14px; padding: 16px; border-radius: 12px; text-align: center;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-size: 15px; letter-spacing: .16em; font-weight: 600; color: rgb(var(--ink));
  background: rgb(var(--bg-panel-2)); border: 1px dashed rgb(var(--line-strong));
  word-break: break-all; user-select: all;
}
.lock-agree { display: flex; align-items: center; gap: 9px; font-size: 10px; color: rgb(var(--muted)); margin-top: 16px; cursor: pointer; }
.lock-agree input { accent-color: rgb(var(--accent)); width: 14px; height: 14px; }
.lock-foot { font-size: 9px; color: rgb(var(--muted)); text-align: center; margin-top: 20px; letter-spacing: .02em; }
body.is-locked #net-banner { display: none !important; }

/* ============================================================================
   File vault
   ========================================================================== */
.drop-zone {
  border: 1.5px dashed rgb(var(--line-strong)); border-radius: 16px; padding: 26px 18px;
  text-align: center; color: rgb(var(--muted)); transition: all .25s var(--ease);
  background: rgb(var(--bg-panel-2));
}
.drop-zone:hover, .drop-zone.is-over {
  border-color: color-mix(in srgb, rgb(var(--accent)) 70%, transparent);
  background: color-mix(in srgb, rgb(var(--accent)) 7%, rgb(var(--bg-panel-2)));
  transform: translateY(-2px);
}
.drop-zone.is-over { box-shadow: var(--glow); }
.file-glyph {
  width: 32px; height: 32px; border-radius: 10px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, rgb(var(--accent)) 12%, rgb(var(--bg-panel-2)));
  color: rgb(var(--accent)); font-size: 12px;
  transition: transform .35s var(--ease);
}
tr:hover .file-glyph { transform: scale(1.08) rotate(-4deg); }
.code-preview {
  max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-size: 10px; line-height: 1.6; color: rgb(var(--ink-2));
  background: rgb(var(--bg-panel-2)); border: 1px solid rgb(var(--line));
  border-radius: 12px; padding: 14px;
}
.mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }

/* the vault's own progress strip while several files upload */
.uploading-bar { height: 3px; border-radius: 999px; overflow: hidden; background: rgb(var(--track)); }
.uploading-bar > i { display: block; height: 100%; background: rgb(var(--accent)); animation: uploadPulse 1.4s var(--ease) infinite; }
@keyframes uploadPulse { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* ============================================================================
   Social chips — the studio's public profiles, as small round links
   ========================================================================== */
.social-chip {
  width: 26px; height: 26px; border-radius: 999px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; text-decoration: none;
  transition: transform .32s var(--ease), box-shadow .32s var(--ease), background .32s var(--ease);
}
.social-chip:hover { transform: translateY(-3px) scale(1.12); box-shadow: var(--glow); }
.social-chip:active { transform: scale(.94); }

/* ============================================================================
   Global polish — rhythm, motion and depth applied once so every page benefits
   ========================================================================== */

/* momentum scrolling and no scroll chaining on the two scrolling regions */
#scroll-area, #nav-main, .overflow-y-auto, .overflow-x-auto {
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
}
#scroll-area { scroll-padding-top: 12px; }

/* a slim, self-effacing scrollbar that matches the theme */
#scroll-area::-webkit-scrollbar, #nav-main::-webkit-scrollbar { width: 8px; height: 8px; }
#scroll-area::-webkit-scrollbar-thumb, #nav-main::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, rgb(var(--accent)) 30%, transparent);
  border-radius: 999px; border: 2px solid transparent; background-clip: content-box;
}
#scroll-area::-webkit-scrollbar-thumb:hover, #nav-main::-webkit-scrollbar-thumb:hover {
  background: color-mix(in srgb, rgb(var(--accent)) 60%, transparent); background-clip: content-box;
}
#scroll-area::-webkit-scrollbar-track, #nav-main::-webkit-scrollbar-track { background: transparent; }

/* every section rises into place as the view renders */
#view > * { animation: rise .36s var(--ease) both; }
#view > *:nth-child(2) { animation-delay: .04s; }
#view > *:nth-child(3) { animation-delay: .08s; }
#view > *:nth-child(4) { animation-delay: .12s; }
#view > *:nth-child(n + 5) { animation-delay: .16s; }

/* cards lift and catch the light on hover, consistently everywhere */
.glass-card, .glass-soft {
  transition: transform .34s var(--ease), box-shadow .34s var(--ease), border-color .34s var(--ease);
}
.glass-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, rgb(var(--accent)) 26%, rgb(var(--line)));
  box-shadow: var(--shadow-lift);
}

/* a figure that leans out of the frame becomes a real, obvious button */
a.btn, button.icon-btn, .social-chip { cursor: pointer; }
.btn:disabled, .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* ============================================================================
   Responsive hardening — phones first, then small tablets
   ========================================================================== */

/* page gutter tightens on a narrow screen so content keeps its width */
@media (max-width: 640px) {
  #view .glass-card, #view .glass-soft { border-radius: 16px; }
  #page-title { font-size: 1.25rem; }
  .btn-row { gap: .4rem; }
  .btn { padding: .42rem .72rem; }
  .drop-zone { padding: 20px 14px; }
  .code-preview { font-size: 9.5px; padding: 11px; }
  /* the drawer and modal go full-bleed instead of hugging a narrow viewport */
  .drawer-panel { width: 100% !important; max-width: 100% !important; border-radius: 20px 20px 0 0 !important; }
  .modal-panel { width: 100% !important; max-width: 100% !important; }
}

/* tables scroll rather than squash, and stay legible while they do */
@media (max-width: 900px) {
  .tbl { min-width: 560px; }
  .overflow-x-auto { padding-bottom: 4px; }
}

/* very short viewports (landscape phones) drop the sidebar profile block */
@media (max-height: 560px) {
  #sidebar .brand-circle { width: 34px; height: 34px; }
  #nav-foot { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  #view > *, .glass-card, .glass-soft, .social-chip, .icon-btn, .icon-btn i { animation: none !important; transition: none !important; }
}

/* ============================================================================
   Sign-in page — the door to the workspace
   ========================================================================== */
.signin {
  position: fixed; inset: 0; z-index: 300; overflow: auto;
  background: rgb(var(--bg-main));
}
.signin__glow {
  position: fixed; width: 820px; height: 820px; border-radius: 999px; pointer-events: none;
  top: -360px; left: -160px; filter: blur(18px);
  background: radial-gradient(circle, color-mix(in srgb, rgb(var(--accent)) 20%, transparent) 0%, transparent 62%);
  animation: lockFloat 16s var(--ease) infinite alternate;
}
.signin__shell {
  position: relative; display: grid; grid-template-columns: 1.05fr .95fr;
  min-height: 100vh; width: 100%;
}
/* ---- left: who we are ---- */
.signin__aside {
  padding: 56px clamp(28px, 5vw, 72px);
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
  border-right: 1px solid rgb(var(--line));
  animation: rise .5s var(--ease) both;
}
.signin__brand { display: flex; align-items: center; gap: 13px; }
.signin__brand b { display: block; font-size: 14px; color: rgb(var(--ink)); font-weight: 600; line-height: 1.25; }
.signin__brand i { display: block; font-size: 10px; font-style: normal; color: rgb(var(--muted)); margin-top: 3px; }
.signin__mark {
  width: 46px; height: 46px; border-radius: 999px; overflow: hidden; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgb(var(--accent)); color: rgb(var(--bg-main)); font-weight: 700; font-size: 14px;
  box-shadow: 0 12px 28px -16px rgba(145, 200, 185, .95);
}
.signin__mark img { width: 100%; height: 100%; object-fit: cover; }
.signin__headline {
  font-size: clamp(24px, 3.4vw, 40px); line-height: 1.15; font-weight: 600;
  color: rgb(var(--ink)); letter-spacing: -.02em;
}
.signin__headline em { font-style: normal; color: rgb(var(--accent)); }
.signin__points { display: flex; flex-direction: column; gap: 11px; margin: 0; padding: 0; list-style: none; }
.signin__points li {
  display: flex; gap: 11px; align-items: flex-start; font-size: 11.5px; line-height: 1.6;
  color: rgb(var(--muted));
}
.signin__points li i { margin-top: 2px; font-size: 12px; width: 15px; text-align: center; flex: 0 0 auto; }
.signin__socials { display: flex; flex-wrap: wrap; gap: 8px; }
.signin__social {
  width: 32px; height: 32px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; color: rgb(var(--muted)); text-decoration: none;
  background: rgb(var(--bg-panel-2)); border: 1px solid rgb(var(--line));
  transition: transform .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
}
.signin__social:hover { transform: translateY(-3px); color: rgb(var(--accent)); border-color: color-mix(in srgb, rgb(var(--accent)) 45%, transparent); box-shadow: var(--glow); }
.signin__foot { font-size: 10px; color: rgb(var(--muted)); letter-spacing: .04em; }
/* ---- right: the panel ---- */
.signin__panel {
  display: flex; align-items: center; justify-content: center;
  padding: 40px clamp(20px, 4vw, 56px);
  background: linear-gradient(160deg, color-mix(in srgb, rgb(var(--accent)) 5%, transparent), transparent 60%);
}
.signin__card {
  width: 100%; max-width: 400px; padding: 30px; border-radius: 22px;
  background: rgb(var(--bg-panel)); border: 1px solid rgb(var(--line));
  box-shadow: var(--shadow-lift); animation: rise .55s var(--ease) both;
}
.signin__eyebrow { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: rgb(var(--accent)); font-weight: 600; }
.signin__title { font-size: 22px; font-weight: 600; color: rgb(var(--ink)); margin-top: 6px; letter-spacing: -.01em; }
.signin__sub { font-size: 11px; color: rgb(var(--muted)); margin-top: 6px; line-height: 1.6; }
.signin__actions { display: flex; flex-direction: column; gap: 9px; margin-top: 20px; }
.signin__btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 12px 16px; border-radius: 12px; cursor: pointer;
  font-size: 12px; font-weight: 500; color: rgb(var(--ink));
  background: rgb(var(--bg-panel-2)); border: 1px solid rgb(var(--line));
  transition: transform .24s var(--ease), border-color .24s var(--ease), box-shadow .24s var(--ease), background .24s var(--ease);
}
.signin__btn i { font-size: 14px; }
.signin__btn:hover:not(:disabled) { transform: translateY(-2px); border-color: color-mix(in srgb, rgb(var(--accent)) 45%, transparent); box-shadow: var(--glow); }
.signin__btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
.signin__btn:disabled { opacity: .45; cursor: not-allowed; }
.signin__btn--google { background: rgb(var(--accent)); color: rgb(var(--bg-main)); border-color: transparent; font-weight: 600; }
.signin__btn--google i { color: rgb(var(--bg-main)); }
.signin__btn--quiet { background: transparent; color: rgb(var(--muted)); font-size: 11px; font-weight: 400; padding: 10px 16px; }
.signin__or { display: flex; align-items: center; gap: 10px; color: rgb(var(--muted)); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; margin: 3px 0; }
.signin__or::before, .signin__or::after { content: ''; flex: 1; height: 1px; background: rgb(var(--line)); }
.signin__hint { font-size: 10px; color: rgb(var(--muted)); line-height: 1.55; }
.signin__message { font-size: 11px; padding: 9px 12px; border-radius: 10px; line-height: 1.55; }
.signin__message.is-busy { background: color-mix(in srgb, rgb(var(--accent)) 12%, transparent); color: rgb(var(--accent)); }
.signin__message.is-error { background: rgb(var(--tone-red-bg)); color: rgb(var(--tone-red-fg)); border: 1px solid rgb(var(--tone-red-bd)); }
.signin__legal { font-size: 9.5px; color: rgb(var(--muted)); line-height: 1.6; margin-top: 18px; text-align: center; }
@media (max-width: 900px) {
  .signin__shell { grid-template-columns: 1fr; min-height: 100vh; }
  .signin__aside { padding: 34px 24px 10px; border-right: 0; border-bottom: 1px solid rgb(var(--line)); gap: 16px; }
  .signin__points { display: none; }
  .signin__headline { font-size: 22px; }
  .signin__panel { padding: 22px 20px 40px; }
  .signin__card { padding: 22px; border-radius: 18px; }
}

/* ============================================================================
   Studio bar — the public profiles, in one calm strip under the workspace
   ========================================================================== */
#studio-bar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 20px 8px; border-top: 1px solid rgb(var(--line));
  background: rgb(var(--bg-main));
}

#studio-bar .social-chip { width: 24px; height: 24px; font-size: 10px; }
@media (max-width: 640px) { #studio-bar { display: none; } }

/* ---- the sidebar footer, stripped back to three lines ---- */
.nav-foot__box {
  display: flex; flex-direction: column; gap: 9px;
  padding: 12px; border-radius: 14px;
  background: rgb(var(--bg-panel)); border: 1px solid rgb(var(--line));
}

  display: flex; align-items: center; justify-content: center; gap: 7px;
  width: 100%; padding: 9px 12px; border-radius: 10px; cursor: pointer;
  background: rgb(var(--accent)); color: rgb(var(--bg-main));

}

}
.nav-foot__link:hover { color: rgb(var(--accent)); }
.nav-foot__link.is-warn { color: rgb(var(--tone-amber-fg)); }

/* ============================================================================
   Assistant page
   ========================================================================== */
.assistant__tiles {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px;
}
.assistant__tile { animation: rise .34s var(--ease) both; }
.assistant__tile:nth-child(2) { animation-delay: .04s; }
.assistant__tile:nth-child(3) { animation-delay: .08s; }
.assistant__tile:nth-child(4) { animation-delay: .12s; }
.assistant__tile-icon {
  width: 34px; height: 34px; border-radius: 11px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; font-size: 12px;

  <script>
/* ===== assets/js/core.js ===== */
/* =============================================================================
   Triverse OS — core runtime
   Storage, state, events, UI partials, modals/drawers, router, utilities.
   Plain browser script: no build step, works from file:// or any static host.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App = global.App || {};
  App.version = '2.0.0';
  App.STORE_KEY = 'triverse.os.state.v1';
  App.HTML_KEY = 'triverse.os.html.';
  App.ARCHIVE_KEY = 'triverse.os.archive.v1';
  /* schema 2 = Google Maps only, no bundled sample businesses. An older install is
     archived and cleared on first open so no invented business can ever show up. */
  App.SCHEMA = 2;
  /* bump this whenever the published price list changes: it is what lets the
     new figures reach a workspace that already saved a catalogue */
  App.PRICING_VERSION = 3;

  /** true when a string carries a pictograph that should not be in business copy */
  const PICTO_TEST = v => {
    const txt = String(v == null ? '' : v);
    for (let i = 0; i < txt.length; i++) if (txt.charCodeAt(i) >= 0x2700) return true;
    return false;
  };

  /* ------------------------------- utilities ------------------------------ */
  const U = App.util = {
    uid(prefix) { return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },
    esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },
    /** escape a value for use inside an HTML attribute */
    attr(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },
    clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
    now() { return new Date().toISOString(); },
    todayISO() { return new Date().toISOString().slice(0, 10); },
    addDays(iso, n) { const d = iso ? new Date(iso) : new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); },
    digits(v) { return String(v == null ? '' : v).replace(/[^\d]/g, ''); },
    slug(v) { return String(v == null ? '' : v).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); },
    title(v) { return String(v == null ? '' : v).replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); },
    hit(hay, needle) {
      const h = String(hay == null ? '' : hay).toLowerCase(), n = String(needle || '').toLowerCase().trim();
      return !n || h.indexOf(n) !== -1;
    },
    num(n) { return (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 2 }); },
    /** 1.4 MB — never “1441792 bytes” */
    bytes(n) {
      const v = Number(n) || 0;
      if (v < 1024) return v + ' B';
      if (v < 1048576) return (v / 1024).toFixed(v < 10240 ? 1 : 0) + ' KB';
      if (v < 1073741824) return (v / 1048576).toFixed(1) + ' MB';
      return (v / 1073741824).toFixed(2) + ' GB';
    },
    fileKind(name, mime) {
      const ext = String(name || '').split('.').pop().toLowerCase();
      const map = {
        html: 'Markup', htm: 'Markup', css: 'Stylesheet', scss: 'Stylesheet', less: 'Stylesheet',
        js: 'JavaScript', mjs: 'JavaScript', cjs: 'JavaScript', jsx: 'React', ts: 'TypeScript', tsx: 'TypeScript',
        json: 'JSON', php: 'PHP', py: 'Python', rb: 'Ruby', java: 'Java', kt: 'Kotlin', cs: 'C#',
        go: 'Go', rs: 'Rust', c: 'C', h: 'C header', cpp: 'C++', swift: 'Swift', sql: 'SQL', sh: 'Shell',
        md: 'Markdown', txt: 'Text', csv: 'CSV', xlsx: 'Spreadsheet', xls: 'Spreadsheet', doc: 'Document', docx: 'Document',
        pdf: 'PDF', zip: 'Archive', rar: 'Archive', '7z': 'Archive', tar: 'Archive', gz: 'Archive',
        png: 'Image', jpg: 'Image', jpeg: 'Image', gif: 'Image', webp: 'Image', svg: 'Vector', ico: 'Icon',
        mp4: 'Video', mov: 'Video', webm: 'Video', mp3: 'Audio', wav: 'Audio',
        ttf: 'Font', otf: 'Font', woff: 'Font', woff2: 'Font',
        psd: 'Photoshop', ai: 'Illustrator', xd: 'XD', fig: 'Figma', env: 'Config', yml: 'Config', yaml: 'Config', toml: 'Config', ini: 'Config'
      };
      return map[ext] || (String(mime || '').split('/')[0] === 'image' ? 'Image' : (ext ? ext.toUpperCase() + ' file' : 'File'));
    },
    money(n, cur) {
      const c = cur || (App.store.state && App.store.state.settings.company.currency) || 'USD';
      const v = Number(n) || 0;
      const sym = (App.dict.currencies.find(x => x[0] === c) || [])[1] || '';
      return sym ? sym + ' ' + v.toLocaleString(undefined, { maximumFractionDigits: 2 }) : c + ' ' + v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    },
    pct(part, total) { return total ? Math.round((part / total) * 100) : 0; },
    sum(arr, fn) { return (arr || []).reduce((a, b) => a + (Number(fn ? fn(b) : b) || 0), 0); },
    avg(arr, fn) { return arr && arr.length ? U.sum(arr, fn) / arr.length : 0; },
    uniq(arr) { return Array.from(new Set(arr || [])); },
    clamp(n, min, max) { return Math.max(min, Math.min(max, n)); },
    groupBy(arr, fn) { const out = {}; (arr || []).forEach(x => { const k = fn(x); (out[k] = out[k] || []).push(x); }); return out; },
    sortBy(arr, fn, dir) { const d = dir === 'desc' ? -1 : 1; return (arr || []).slice().sort((a, b) => { const x = fn(a), y = fn(b); return x > y ? d : x < y ? -d : 0; }); },
    fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso); if (isNaN(d)) return String(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    },
    fmtDateTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso); if (isNaN(d)) return String(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' · ' +
        d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    },
    monthKey(iso) { return String(iso || '').slice(0, 7); },
    monthLabel(key) {
      const [y, m] = String(key).split('-');
      const names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return (names[Number(m) - 1] || '?') + ' ' + String(y).slice(2);
    },
    daysUntil(iso) { if (!iso) return null; return Math.round((new Date(iso) - new Date(U.todayISO())) / 864e5); },
    relTime(iso) {
      if (!iso) return '—';
      const s = (Date.now() - new Date(iso).getTime()) / 1000;
      if (isNaN(s)) return '—';
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';

    },
    csv(text) {
      const rows = [];
      let row = [], cell = '', q = false;
      const s = String(text || '').replace(/\r\n?/g, '\n');
      for (let i = 0; i < s.length; i++) {

        if (q) {

      }

      return rows.filter(r => r.some(v => String(v).trim() !== '')).map(r => {
        const o = {}; head.forEach((h, i) => { o[h] = (r[i] == null ? '' : String(r[i]).trim()); }); return o;

    },
    toCSV(rows, cols) {
      const heads = cols || (rows[0] ? Object.keys(rows[0]) : []);
      const line = a => a.map(v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',');
      return [line(heads)].concat(rows.map(r => line(heads.map(h => r[h])))).join('\n');
    },
    download(name, text, mime) {
      try {
        const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });

        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
        return true;
      } catch (e) { App.ui.toast('Download failed: ' + e.message, 'red'); return false; }
    },
    openHTML(html, name) {
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const w = global.open(url, '_blank');
      if (!w) App.ui.toast('Pop-up blocked — allow pop-ups to open the preview', 'amber');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return name;
    },
    copy(text) {
      const t = String(text == null ? '' : text);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(t).then(() => true).catch(() => U._copyFallback(t));
      }
      return Promise.resolve(U._copyFallback(t));
    },
    _copyFallback(t) {
      try {
        const ta = document.createElement('textarea');

    debounce(fn, ms) { let t = null; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms || 200); }; },
    openUrl(url) { const w = global.open(url, '_blank'); if (!w) App.ui.toast('Pop-up blocked by the browser', 'amber'); },

    /** any phone format → digits only, ready for tel: / wa.me links */
    telDigits(v, country) {
      let d = String(v == null ? '' : v).replace(/[^\d+]/g, '');
      const plus = d.charAt(0) === '+';
      d = d.replace(/\D/g, '');
      if (!d) return '';
      if (!plus) {
        if (d.charAt(0) !== '0') d = (country || '251') + d;
        else d = (country || '251') + d.slice(1);

      return d;

    telHref(lead) {

  /* -------------------------------- store --------------------------------- */
  const store = App.store = {
    state: null,
    _t: null,

    load() {
      const defaults = App.seed();
      /* An encrypted workspace cannot be read before the passphrase is entered,
         so boot stops at the lock screen instead of showing an empty system. */
      if (App.vault && App.vault.has()) {
        this.state = null;
        App.locked = true;
        return null;
      }
      let saved = null;
      try { const raw = localStorage.getItem(App.STORE_KEY); if (raw) saved = JSON.parse(raw); } catch (e) { saved = null; }
      if (this.isLegacy(saved)) saved = this.upgradeLegacy(saved);
      this.state = saved && typeof saved === 'object' ? this.migrate(defaults, saved) : defaults;
      this.state.schema = App.SCHEMA;
      this.state.meta = this.state.meta || {};
      this.state.meta.lastOpen = U.now();
      this.purgeLegacyRows();
      this.stripMessageEmoji();

    /**
     * Earlier versions of the message library used casual pictographs. Business
     * correspondence should read plainly, so they are removed once from whatever
     * is already stored — the owner's own wording is otherwise untouched.
     */
    stripMessageEmoji() {
      const s = this.state;
      if (!s || !s.messages || !s.meta || s.meta.emojiCleaned) return;
      /* the pictograph set, built from code points so the file itself stays ASCII */
      const picto = new RegExp(
        '[' + String.fromCharCode(0x2700, 0x2D, 0x27BF) + String.fromCharCode(0x2B00, 0x2D, 0x2BFF) + String.fromCharCode(0xFE0F) + ']' +
        '|' + String.fromCharCode(0xD83C, 0xDF00, 0x2D, 0xD83E, 0xDDFF) +
        '|' + String.fromCharCode(0xD83D, 0xDC00, 0x2D, 0xD83D, 0xDEFF), 'g');
      const clean = v => {
        const txt = String(v == null ? '' : v).split(picto).join('');
        return txt.split('\n').map(function (line) {
          let out = '';
          let prevSpace = false;
          for (let i = 0; i < line.length; i++) {
            const c = line.charAt(i);
            if (c === ' ') { if (prevSpace) continue; prevSpace = true; } else prevSpace = false;
            out += c;
          }
          while (out.charAt(out.length - 1) === ' ') out = out.slice(0, -1);
          return out;
        }).join('\n');
      };
      const list = s.messages.templates || [];
      list.forEach(function (t) {
        if (t && typeof t.body === 'string' && PICTO_TEST(t.body)) {
          t.body = clean(t.body);
          t.subject = clean(t.subject || '');
          t.editedForPlainText = true;
        }
      });
      s.meta.emojiCleaned = true;
    },

    /** take over a workspace that was just decrypted from the vault */
    adopt(saved) {
      const defaults = App.seed();

      this.state.meta.lastOpen = U.now();
      this.purgeLegacyRows();
      this.stripMessageEmoji();

      this.save(true);

    /** true while the workspace is stored encrypted instead of as plain text */
    protectedByVault() { return Boolean(App.vault && App.vault.active()); },

    /** an install from before schema 2 carries businesses that were never real */
    isLegacy(saved) {

    /**

     * seeded (businesses, clients, invoices, websites, activity log). Settings,
     * the price catalogue, templates and the message library are kept.

    upgradeLegacy(saved) {
      try { localStorage.setItem(App.ARCHIVE_KEY, JSON.stringify({ savedAt: U.now(), state: saved })); } catch (e) {}

    purgeLegacyRows() {

      const legacyPhone = v => /\+?880/.test(String(v || ''));
      const legacyText = v => /(dhaka|uttara|mirpur|dhanmondi|gulshan|banani|mohammadpur|bashundhara|tejgaon|motijheel|shyamoli|moghbazar|nilkhet|panthapath|bangladesh|bKash|Nagad)/i.test(String(v || ''));

    /** defaults provide any missing keys; saved data always wins */
    migrate(defaults, saved) {
      const out = U.clone(defaults);
      const deep = (tgt, src) => {
        Object.keys(src || {}).forEach(k => {

          if (sv === undefined) return;
          if (Array.isArray(sv)) { tgt[k] = sv; return; }
          if (sv && typeof sv === 'object') {
            if (!tgt[k] || typeof tgt[k] !== 'object' || Array.isArray(tgt[k])) tgt[k] = {};

          tgt[k] = sv;

         saved list so existing installs keep learning new words without losing any */

      if (out.messages && dk && sk) {
        const merged = {};
        Object.keys(dk).forEach(k => { merged[k] = U.uniq((dk[k] || []).concat(sk[k] || [])); });
        Object.keys(sk).forEach(k => { if (!merged[k]) merged[k] = U.uniq(sk[k] || []); });
        out.messages.keywords = merged;

       *    kept exactly as they are.
       * 2. Our own published list is taken from the app when the price list

       *    menu tiers reach an install that already saved a catalogue. Between
       *    versions, the owner's own price edits are left alone.

      const dcat = defaults.catalog || [];

          for (let i = 0; i < parts.length - 1; i++) { if (!node[parts[i]]) node[parts[i]] = {}; node = node[parts[i]]; }
          node[parts[parts.length - 1]] = value;
        }

      fill('settings.cloud.clientId', '440939143986-nefs0f1260tv58v1d8p6vtigphtpaoil.apps.googleusercontent.com');
      fill('settings.cloud.account', 'bereket1515mamuye@gmail.com');
      fill('settings.company.phone', '+251902468625');
      fill('settings.company.whatsapp', '+251902468625');
      fill('settings.company.email', 'bereket1515mamuye@gmail.com');

      fill('settings.company.portfolio', 'https://m1616d.github.io/Triverse-Studio/');
      fill('settings.google.apiKey', 'AIzaSyD3es3VxVtt9ryJFWOENWpAkeWu61vxOXY');
