  App.action('client.filter', el => { q().stage = el.getAttribute('data-arg'); App.emit('state:changed', { path: 'cfilter' }); });
  App.action('client.applyFilters', () => {
    const s = q();
    s.search = App.store.get('ui.clientSearch', '');
    s.industry = App.store.get('ui.clientIndustry', s.industry);
    s.sort = App.store.get('ui.clientSort', s.sort);
    App.emit('state:changed', { path: 'cfilter' });
  });
  App.action('client.open', el => App.router.go('clients', el.getAttribute('data-arg')));
  App.action('client.export', () => {
    const rows = filtered().map(c => {
      const m = App.clientMoney(c.id);
      return {
        name: c.name, stage: c.stage, industry: c.industry, contact: c.contactName, phone: c.phone, whatsapp: c.whatsapp,
        email: c.email, address: c.address, website: c.website, contracted: m.contracts, paid: m.paid, due: m.due,
        startedAt: c.startedAt, endedAt: c.endedAt, notes: (c.notes || '').replace(/\n/g, ' ')
      };
    });
    U.download('triverse-clients-' + U.todayISO() + '.csv', U.toCSV(rows), 'text/csv');
    ui.toast('Exported ' + rows.length + ' clients', 'lime');
  });
  App.action('client.edit', el => clientForm(el.getAttribute('data-arg')));
  App.action('client.new', () => clientForm(''));

  function clientForm(id) {
    const c = id ? App.store.find('clients', id) : null;
    const catalog = App.store.get('catalog', []);
    ui.modal({
      title: c ? 'Edit ' + c.name : 'New client / company',
      size: 'lg',
      body: '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
        ui.field({ label: 'Company name', model: 'ui.c.name', value: c ? c.name : '' }) +
        ui.field({ label: 'Stage', model: 'ui.c.stage', value: c ? c.stage : 'prospect', options: App.dict.clientStages.map(s => [s, U.title(s)]) }) +
        ui.field({ label: 'Industry / business type', model: 'ui.c.industry', value: c ? c.industry : 'general', options: App.dict.businessTypes.map(t => [t[0], t[1]]).concat([['general', 'Other']]) }) +
        ui.field({ label: 'Contact person', model: 'ui.c.contactName', value: c ? c.contactName : '' }) +
        ui.field({ label: 'Designation', model: 'ui.c.designation', value: c ? c.designation : '' }) +
        ui.field({ label: 'Phone', model: 'ui.c.phone', value: c ? c.phone : '' }) +
        ui.field({ label: 'WhatsApp', model: 'ui.c.whatsapp', value: c ? c.whatsapp : '' }) +
        ui.field({ label: 'Telegram', model: 'ui.c.telegram', value: c ? c.telegram : '' }) +
        ui.field({ label: 'Email', model: 'ui.c.email', value: c ? c.email : '' }) +
        ui.field({ label: 'Website', model: 'ui.c.website', value: c ? c.website : '' }) +
        ui.field({ label: 'Address', model: 'ui.c.address', value: c ? c.address : '' }) +
        ui.field({ label: 'Account manager', model: 'ui.c.accountManager', value: c ? c.accountManager : App.store.get('settings.company.senderName', '') }) +
        ui.field({ label: 'Health', model: 'ui.c.health', value: c ? c.health : 'warm', options: [['excellent', 'Excellent'], ['good', 'Good'], ['warm', 'Warm'], ['poor', 'Poor'], ['muted', 'Dormant']] }) +
        ui.field({ label: 'Started', model: 'ui.c.startedAt', value: c ? c.startedAt : '', type: 'date' }) +
        ui.field({ label: 'Ended (past clients)', model: 'ui.c.endedAt', value: c ? c.endedAt : '', type: 'date' }) +
        ui.field({ label: 'Tags (comma separated)', model: 'ui.c.tags', value: c ? (c.tags || []).join(', ') : '' }) +
        '</div>' +
        '<p class="lbl mt-2">Services sold / planned</p>' +
        '<div class="flex flex-wrap gap-1.5 mb-2">' + catalog.map(s =>
          '<button class="chip ' + (c && (c.services || []).indexOf(s.id) !== -1 ? 'is-on' : '') + '" data-action="client.toggleSvc" data-arg="' + s.id + '">' + U.esc(s.name) + ' · ' + U.money(s.price) + '</button>').join('') + '</div>' +
        '<div class="flex flex-wrap gap-1.5">' + ['logo', 'banners', 'thumbnail', 'flyer', 'business-card', 'social-ads', 'website', 'qr-menu', 'hr-system', 'custom-software', 'maintenance']
          .map(t => '<button class="chip" data-action="client.presetTag" data-arg="' + t + '">+ ' + U.esc(t) + '</button>').join('') + '</div>' +
        ui.field({ label: 'Notes', model: 'ui.c.notes', value: c ? c.notes : '', rows: 3, wrapCls: 'mt-3' }),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-lime" data-action="client.save" data-arg="' + (c ? c.id : '') + '"><i class="fa-solid fa-floppy-disk"></i> Save client</button>'
    });
    App.store.set('ui.c.services', c ? (c.services || []).slice() : [], { silent: true });
    App.store.set('ui.c.id', c ? c.id : '', { silent: true });
  }

  App.action('client.toggleSvc', el => {
    const id = el.getAttribute('data-arg');
    const arr = App.store.get('ui.c.services', []).slice();
    const i = arr.indexOf(id);
    if (i === -1) arr.push(id); else arr.splice(i, 1);
    App.store.set('ui.c.services', arr, { silent: true });
    el.classList.toggle('is-on');
  });
  App.action('client.presetTag', el => {
    const t = el.getAttribute('data-arg');
    const f = document.querySelector('[data-model="ui.c.tags"]');
    if (f) { const v = f.value ? f.value.split(',').map(x => x.trim()) : []; if (v.indexOf(t) === -1) v.push(t); f.value = v.join(', '); }
  });
  App.action('client.save', el => {
    const id = el.getAttribute('data-arg');
    const g = k => App.store.get('ui.c.' + k, '');
    const data = {
      name: g('name'), stage: g('stage'), industry: g('industry'), contactName: g('contactName'), designation: g('designation'),
      phone: g('phone'), whatsapp: g('whatsapp'), telegram: g('telegram'), email: g('email'), website: g('website'),
      address: g('address'), accountManager: g('accountManager'), health: g('health'),
      startedAt: g('startedAt'), endedAt: g('endedAt'), notes: g('notes'),
      tags: String(g('tags')).split(',').map(t => t.trim()).filter(Boolean),
      services: App.store.get('ui.c.services', [])
    };
    if (!data.name) { ui.toast('Company name is required', 'amber'); return; }
    if (!data.whatsapp && data.phone) data.whatsapp = data.phone;
    if (id) { App.store.patch('clients', id, data); ui.toast('Client updated', 'lime'); }
    else {
      const rec = App.store.add('clients', Object.assign({ type: 'company', source: 'manual', sourceLeadId: '', type2: '' }, data));
      App.log('client', data.name + ' added to the client list', rec.id);
      ui.toast('Client added', 'lime');
      setTimeout(() => App.router.go('clients', rec.id), 250);
    }
    ui.closeModal();
  });
  App.action('client.addNote', el => {
    const id = el.getAttribute('data-arg');
    const box = document.getElementById('client-note');
    const text = box ? box.value.trim() : '';
    if (!text) { ui.toast('Write the note first', 'amber'); return; }
    const c = App.store.find('clients', id);
    App.store.patch('clients', id, { notes: (c.notes ? c.notes + '\n\n' : '') + '[' + U.fmtDate(U.todayISO()) + '] ' + text });
    if (box) box.value = '';
    ui.toast('Note added', 'lime');
  });
  App.action('client.stage', el => {
    const id = el.getAttribute('data-arg');
    const c = App.store.find('clients', id);
    ui.modal({
      title: 'Move ' + c.name,
      size: 'sm',
      body: '<div class="space-y-1.5">' + App.dict.clientStages.map(s =>
        '<button class="w-full text-left btn ' + (c.stage === s ? 'btn-lime' : 'btn-ghost') + '" data-action="client.setStage" data-arg="' + id + '" data-extra="' + s + '">' + U.title(s) + '</button>').join('') + '</div>' +
        '<p class="text-[10px] text-textMuted mt-2">Rejected companies stop receiving outreach and appear in the do-not-chase list.</p>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>'
    });
  });
  App.action('client.setStage', el => {
    const id = el.getAttribute('data-arg'), stage = el.getAttribute('data-extra');
    const c = App.store.find('clients', id);
    const patch = { stage: stage };
    if (stage === 'active' && !c.startedAt) patch.startedAt = U.todayISO();
    if ((stage === 'past' || stage === 'rejected') && !c.endedAt) patch.endedAt = U.todayISO();
    App.store.patch('clients', id, patch);
    ui.closeModal();
    ui.toast(c.name + ' → ' + U.title(stage), stage === 'rejected' ? 'amber' : 'lime');
  });
  App.action('client.delete', el => {
    const id = el.getAttribute('data-arg');
    const c = App.store.find('clients', id);
    ui.confirm({
      title: 'Delete this client?', tone: 'danger', confirmLabel: 'Delete', message: c.name + ' and its link to invoices will be removed. Invoices stay in the ledger.',
      onConfirm() { App.store.remove('clients', id); ui.closeDrawer(); ui.toast('Client deleted', 'amber'); }
    });
  });
  App.action('client.compose', el => {
    const c = App.store.find('clients', el.getAttribute('data-arg'));
    const lead = c.sourceLeadId ? App.store.find('leads', c.sourceLeadId) : null;
    const tpl = App.msg.templates().filter(t => t.id === 'msg_wa_welcome')[0] || App.msg.templates()[0];
    const fake = lead || {
      id: c.id, name: c.name, category: App.dict.typeLabel(c.industry), city: '', rating: 0, reviews: 0,
      phone: c.whatsapp || c.phone, intlPhone: c.whatsapp || c.phone, whatsapp: true, telegram: c.telegram,
      email: c.email, website: c.website, businessType: c.industry, outreach: []
    };
    const body = App.msg.render(tpl, fake).body;
    ui.modal({
      title: 'Message ' + c.name,
      sub: 'Sent from your number with the text ready to send',
      size: 'lg',
      body: '<textarea class="inp" id="client-msg" rows="10">' + U.esc(body) + '</textarea>' +
        '<div class="flex items-center gap-2 mt-2">' + ui.badge(App.dict.chanLabel('whatsapp'), 'lime') + '<span class="text-[10px] text-textMuted">' + U.esc(c.whatsapp || c.phone || 'no number') + '</span></div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-ghost" data-action="client.copyMsg" data-arg="' + c.id + '">Copy</button>' +
        '<button class="btn btn-lime" data-action="client.sendMsg" data-arg="' + c.id + '"><i class="fa-brands fa-whatsapp"></i> Open WhatsApp</button>'
    });
  });
  App.action('client.copyMsg', () => {
    const box = document.getElementById('client-msg');
    U.copy(box ? box.value : '').then(() => ui.toast('Copied', 'lime'));
  });
  App.action('client.sendMsg', el => {
    const c = App.store.find('clients', el.getAttribute('data-arg'));
    const box = document.getElementById('client-msg');
    const lead = { name: c.name, phone: c.whatsapp || c.phone, intlPhone: c.whatsapp || c.phone, whatsapp: true };
    const url = App.msg.deepLink('whatsapp', lead, { body: box ? box.value : '' });
    if (!url) { ui.toast('No WhatsApp number saved for this client', 'amber'); return; }
    U.openUrl(url);
    U.copy(box ? box.value : '');
    App.log('message', 'WhatsApp message sent to client ' + c.name, c.id);
    ui.closeModal();
    ui.toast('WhatsApp opened with the message', 'lime');
  });
  App.action('client.generate', el => {
    const c = App.store.find('clients', el.getAttribute('data-arg'));
    const lead = c.sourceLeadId ? App.store.find('leads', c.sourceLeadId) : null;
    const source = lead || {
      id: '', name: c.name, businessType: c.industry || 'general', category: App.dict.typeLabel(c.industry),
      city: '', address: c.address, phone: c.phone, intlPhone: c.whatsapp || c.phone, whatsapp: true,
      email: c.email, website: c.website, rating: 0, reviews: 0, outreach: [], tags: []
    };
    const out = App.sitegen.build({ lead: source, templateId: App.store.get('templates')[0].id, options: {} });
    ui.modal({
      title: 'Website for ' + c.name,
      size: 'xl',
      body: '<p class="text-[10px] text-textMuted mb-2">Built from the client record. Save it to their site list to keep the file.</p>' + ui.previewFrame(out.html, 520),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
        '<button class="btn btn-ghost" data-action="client.dlSite">Download HTML</button>' +
        '<button class="btn btn-lime" data-action="client.saveSite" data-arg="' + c.id + '">Save to their websites</button>'
    });
    App.router.q.tmpHtml = out.html;
    App.router.q.tmpMeta = out.meta;
  });
  App.action('client.dlSite', () => U.download('client-website.html', App.router.q.tmpHtml || '', 'text/html'));
  App.action('client.saveSite', el => {
    const c = App.store.find('clients', el.getAttribute('data-arg'));
    const rec = App.store.add('sites', {
      name: (U.slug(c.name) || 'client') + '.com', kind: 'client', status: 'draft', clientId: c.id, clientName: c.name,
      url: c.website || '', templateId: (App.router.q.tmpMeta || {}).templateId || '', businessType: c.industry || 'general',
      stack: 'Generated static page', hostingProvider: '', repoUrl: '', price: App.msg.recommend({ businessType: c.industry, website: c.website, reviews: 0 }).total,
      hostRenewDate: '', domainRenewDate: '', notes: 'Generated from the client record.', generatedFrom: { leadId: c.sourceLeadId || '', businessType: c.industry || 'general' }
    });
    App.store.setHTML(rec.id, App.router.q.tmpHtml || '');
    ui.closeModal();
    ui.toast('Saved to their websites', 'lime');
    App.router.go('sites', rec.id);
  });
  App.action('client.filterIndustry', () => App.emit('state:changed', { path: 'cfilter' }));

  /* -------------------------- service catalogue view ------------------------ */
  App.views.catalog = {
    title: 'Service catalogue',
    sub: 'What we sell, at what price — used by proposals, invoices and messages',
    icon: 'fa-award',
    render(el) {
      const catalog = App.store.get('catalog', []);
      const groups = U.groupBy(catalog, s => s.category);
      const used = App.store.get('payments', []);
      const totalPotential = U.sum(catalog.filter(s => s.active), s => Number(s.price) || 0);

      el.innerHTML =
        '<div class="flex items-center justify-between gap-3 flex-wrap mb-3">' +
        '<div class="flex flex-wrap gap-1.5">' + Object.keys(groups).map(g => '<span class="chip">' + U.esc(g) + ' · ' + groups[g].length + '</span>').join('') +
        '<span class="chip is-on">' + ui.icon('fa-tags', 'text-[9px]') + ' Basket max ' + U.money(totalPotential) + '</span></div>' +
        '<div class="btn-row">' +
        '<button class="btn btn-ghost btn-sm" data-action="cat.export"><i class="fa-solid fa-file-csv"></i> Export price list</button>' +
        '<button class="btn btn-lime btn-sm" data-action="cat.new"><i class="fa-solid fa-plus"></i> Add service</button>' +
        '</div></div>' +

        Object.keys(groups).map(g =>
          ui.card(ui.head(U.title(g) + ' services', ui.badge(groups[g].length + '', 'muted')) +
            ui.table(['Service', 'Price', 'Unit', 'Delivery', 'Status', ''], groups[g].map(s => {
              const sold = used.filter(p => p.serviceId === s.id).length;
              return {
                cells: [
                  '<div><p class="text-[11px] text-gray-200">' + U.esc(s.name) + '</p><p class="text-[9px] text-textMuted">' + U.esc(s.desc || '') + '</p></div>',
                  '<b class="text-limeAccent">' + U.money(s.price) + '</b>',
                  U.esc(s.unit || '—'),
                  (s.deliveryDays ? s.deliveryDays + ' days' : '—'),
                  (s.active ? ui.badge('active', 'lime') : ui.badge('hidden', 'muted')) + (sold ? ' <span class="tag">' + sold + ' sold</span>' : ''),
                  '<button class="btn btn-ghost btn-sm" data-action="cat.edit" data-arg="' + s.id + '">Edit</button>'
                ],
                attrs: ' data-action="cat.edit" data-arg="' + s.id + '"'
              };
            })), 'mb-4')).join('');
    }
  };

  App.action('cat.new', () => catForm(''));
  App.action('cat.edit', el => catForm(el.getAttribute('data-arg')));
  function catForm(id) {
    const s = id ? App.store.find('catalog', id) : null;
    ui.modal({
      title: s ? 'Edit ' + s.name : 'Add a service / product',
      body: '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
        ui.field({ label: 'Name', model: 'ui.s.name', value: s ? s.name : '' }) +
        ui.field({ label: 'Category', model: 'ui.s.category', value: s ? s.category : 'website', options: [['website', 'Website'], ['software', 'Software'], ['design', 'Graphic design'], ['marketing', 'Marketing'], ['hosting', 'Hosting'], ['retainer', 'Retainer']] }) +
        ui.field({ label: 'Price', model: 'ui.s.price', value: s ? s.price : 0, type: 'number' }) +
        ui.field({ label: 'Unit', model: 'ui.s.unit', value: s ? s.unit : 'one-time', options: [['one-time', 'One time'], ['monthly', 'Monthly'], ['yearly', 'Yearly'], ['each', 'Each'], ['hourly', 'Hourly']] }) +
        ui.field({ label: 'Delivery days', model: 'ui.s.deliveryDays', value: s ? s.deliveryDays : 3, type: 'number' }) +
        ui.field({ label: 'Active', model: 'ui.s.active', value: s ? s.active : true, type: 'checkbox', checkLabel: 'Show in proposals and invoices' }) +
        '</div>' + ui.field({ label: 'Short description', model: 'ui.s.desc', value: s ? s.desc : '', rows: 2, wrapCls: 'mt-3' }),
      footer: (s ? '<button class="btn btn-danger" data-action="cat.delete" data-arg="' + s.id + '">Delete</button>' : '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>') +
        '<button class="btn btn-lime" data-action="cat.save" data-arg="' + (s ? s.id : '') + '">Save</button>'
    });
  }
  App.action('cat.save', el => {
    const id = el.getAttribute('data-arg');
    const data = {
      name: App.store.get('ui.s.name', ''), category: App.store.get('ui.s.category', 'website'),
      price: Number(App.store.get('ui.s.price', 0)) || 0, unit: App.store.get('ui.s.unit', 'one-time'),
      deliveryDays: Number(App.store.get('ui.s.deliveryDays', 3)) || 0, desc: App.store.get('ui.s.desc', ''),
      active: Boolean(App.store.get('ui.s.active', true))
    };
    if (!data.name) { ui.toast('Name is required', 'amber'); return; }
    if (id) App.store.patch('catalog', id, data); else App.store.add('catalog', data);
    ui.closeModal(); ui.toast('Catalogue saved', 'lime');
  });
  App.action('cat.delete', el => {
    const id = el.getAttribute('data-arg');
    ui.confirm({
      title: 'Delete this service?', tone: 'danger', confirmLabel: 'Delete',
      message: 'Existing invoices keep their amounts; the service just stops appearing in new proposals.',
      onConfirm() { App.store.remove('catalog', id); ui.closeModal(); ui.toast('Service deleted', 'amber'); }
    });
  });
  App.action('cat.export', () => {
    U.download('triverse-price-list.csv', U.toCSV(App.store.get('catalog', []).map(s => ({
      name: s.name, category: s.category, price: s.price, unit: s.unit, deliveryDays: s.deliveryDays, active: s.active, desc: s.desc
    }))), 'text/csv');
    ui.toast('Price list exported', 'lime');
  });
})(window);

</script>
  <script>
/* ===== assets/js/views.projects.js ===== */
/* =============================================================================
   Triverse OS — Projects
   The studio's whole working history in one screen:
     · websites we host and keep online,
     · the new builds and apps coming next,
     · the clients we are working with right now,
     · the ongoing care and retainer clients,
     · everything already delivered to past clients.
   Each project keeps its own record: who it is for, what it costs, what has been
   paid, where it is deployed, every file we hold for it and the next action.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  /* --------------------------------- phases -------------------------------- */
  const PHASES = [
    ['live', 'Hosted & live', 'fa-tower-broadcast', 'lime', 'Online now and being hosted for the client'],
    ['development', 'In development', 'fa-code-branch', 'blue', 'New websites and apps being built'],
    ['active', 'Working on now', 'fa-hammer', 'violet', 'Client work in progress this period'],
    ['maintenance', 'Ongoing & retainers', 'fa-rotate', 'amber', 'Continue-working clients on a care plan'],
    ['delivered', 'Completed / past', 'fa-circle-check', 'muted', 'Delivered and handed over'],
    ['paused', 'Paused / on hold', 'fa-circle-pause', 'muted', 'Waiting on the client or on budget'],
    ['cancelled', 'Cancelled', 'fa-ban', 'red', 'Did not go ahead']
  ];

  const KINDS = [['website', 'Website'], ['app', 'Mobile app'], ['software', 'Software / system'], ['qr', 'QR menu'], ['branding', 'Branding & design'], ['service', 'Service / retainer'], ['other', 'Other']];

  function phaseMeta(key) {
    return PHASES.filter(p => p[0] === key)[0] || PHASES[1];
  }
  function kindLabel(key) {
    const k = KINDS.filter(x => x[0] === key)[0];
    return k ? k[1] : U.title(key || 'other');
  }

  /** every project, with a phase worked out even for records made before phases existed */
  function projects() {
    return (App.store.get('sites', []) || []).map(s => {
      let phase = s.phase;
      if (!phase) {
        if (s.status === 'live') phase = 'live';
        else if (s.status === 'archived') phase = 'delivered';
        else if (s.status === 'offline') phase = 'paused';
        else if (s.kind === 'draft') phase = 'development';
        else phase = 'development';
      }
      if (s.maintenancePlan && (phase === 'live' || phase === 'delivered')) phase = 'maintenance';
      return Object.assign({}, s, { phase: phase });
    });
  }

  function filesFor(project) {
    return App.files.all().filter(d => d.projectId === project.id);
  }
  function paymentsFor(project) {
    return App.store.get('payments', []).filter(p => p.projectId === project.id || (project.clientId && p.clientId === project.clientId && U.hit(p.projectTitle, project.name)));
  }
  function paidFor(project) {
    return U.sum(paymentsFor(project).filter(p => p.status === 'paid' || p.status === 'partial'), p => Number(p.paidAmount || (p.status === 'paid' ? p.amount : 0)) || 0);
  }
  function dueFor(project) {
    return paymentsFor(project).filter(p => ['pending', 'overdue', 'partial'].indexOf(p.status) !== -1);
  }

  function q() {
    App.router.q.projects = App.router.q.projects || { tab: 'live', search: '', client: '' };
    return App.router.q.projects;
  }

  function filtered() {
    const s = q();
    let rows = projects();
    if (s.client) rows = rows.filter(p => p.clientId === s.client);
    if (s.search) rows = rows.filter(p => U.hit(p.name, s.search) || U.hit(p.clientName, s.search) || U.hit(p.url, s.search) || U.hit(p.notes, s.search) || U.hit(p.techStack, s.search));
    if (s.tab === 'all') return rows;
    return rows.filter(p => p.phase === s.tab);
  }

  /* --------------------------------- card ---------------------------------- */
  function projectCard(p) {
    const meta = phaseMeta(p.phase);
    const client = p.clientId ? App.store.find('clients', p.clientId) : null;
    const files = filesFor(p);
    const paid = paidFor(p);
    const price = Number(p.price) || 0;
    const outstanding = Math.max(0, price - paid);
    const progress = U.clamp(Number(p.progressPct != null ? p.progressPct : (p.phase === 'live' || p.phase === 'delivered' ? 100 : 55)), 0, 100);
    return '<div class="glass-card rounded-2xl p-4 hover-lift flex flex-col" data-action="projects.open" data-arg="' + p.id + '">' +
      '<div class="flex items-start justify-between gap-2 mb-2">' +
      '<div class="min-w-0 flex-1">' +
      '<p class="text-[12px] font-bold truncate">' + U.esc(p.name) + '</p>' +
      '<p class="text-[9px] text-textMuted truncate">' + U.esc(client ? client.name : (p.clientName || 'Triverse Studio')) + ' · ' + U.esc(kindLabel(p.kind)) + '</p>' +
      '</div>' +
      '<span class="tone tone-' + meta[3] + ' text-[9px] px-2 py-0.5 rounded-full border shrink-0">' + U.esc(meta[1]) + '</span>' +
      '</div>' +

      (p.url
        ? '<p class="text-[10px] mb-2 truncate">' + ui.link(p.url, String(p.url).replace(/^https?:\/\//, '')) + '</p>'
        : '<p class="text-[10px] text-textMuted mb-2">' + (p.phase === 'development' ? 'not launched yet' : 'no address recorded') + '</p>') +

      '<div class="mb-3"><div class="flex justify-between text-[9px] text-textMuted mb-1"><span>Progress</span><span class="num">' + progress + '%</span></div>' + ui.progress(progress) + '</div>' +

      '<div class="flex flex-wrap gap-1 mb-3">' +
      (p.techStack ? '<span class="tag">' + U.esc(p.techStack) + '</span>' : '') +
      (price ? '<span class="tag" style="color:rgb(var(--accent))">' + U.money(price) + '</span>' : '') +
      (outstanding ? '<span class="tag" style="color:#fbbf24">' + U.money(outstanding) + ' due</span>' : '') +
      (files.length ? '<span class="tag">' + files.length + ' file' + (files.length === 1 ? '' : 's') + '</span>' : '') +
      (p.maintenanceFee ? '<span class="tag">' + U.money(p.maintenanceFee) + '/mo</span>' : '') +
      '</div>' +

      '<div class="text-[9px] text-textMuted mt-auto flex items-center justify-between gap-2">' +
      '<span>' + (p.dueDate ? 'target ' + U.fmtDate(p.dueDate) : (p.deliveredAt ? 'delivered ' + U.fmtDate(p.deliveredAt) : 'no date set')) + '</span>' +
      '<span>' + (p.updatedAt ? U.relTime(p.updatedAt) : '') + '</span>' +
      '</div></div>';
  }

  /* -------------------------------- detail --------------------------------- */
  function openProject(id) {
    const p = projects().filter(x => x.id === id)[0];
    if (!p) return;
    const meta = phaseMeta(p.phase);
    const client = p.clientId ? App.store.find('clients', p.clientId) : null;
    const files = filesFor(p);
    const invoices = paymentsFor(p);
    const paid = paidFor(p);
    const due = dueFor(p);
    const html = App.store.html(p.id);

    ui.drawer({
      title: p.name,
      sub: (client ? client.name : (p.clientName || 'Triverse Studio')) + ' · ' + kindLabel(p.kind) + ' · ' + meta[1],
      body:
        '<div class="flex flex-wrap gap-2 mb-3">' +
        (p.url ? '<a class="btn btn-lime btn-sm" href="' + U.attr(p.url) + '" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open the live site</a>' : '') +
        (html ? '<button class="btn btn-ghost btn-sm" data-action="sites.open" data-arg="' + p.id + '"><i class="fa-solid fa-eye"></i> Preview stored copy</button>' : '') +
        '<button class="btn btn-ghost btn-sm" data-action="projects.edit" data-arg="' + p.id + '"><i class="fa-solid fa-pen"></i> Edit</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="projects.uploadFile" data-arg="' + p.id + '"><i class="fa-solid fa-arrow-up-from-bracket"></i> Add a file</button>' +
        (client ? '<button class="btn btn-ghost btn-sm" data-action="client.open" data-arg="' + client.id + '"><i class="fa-solid fa-user-tie"></i> Client record</button>' : '') +
        '</div>' +

        ui.card(ui.head('Progress', '<span class="tone tone-' + meta[3] + ' text-[9px] px-2 py-0.5 rounded-full border">' + U.esc(meta[1]) + '</span>') +
          ui.meter(Number(p.progressPct != null ? p.progressPct : ((p.phase === 'live' || p.phase === 'delivered') ? 100 : 55)), 'Overall completion') +
          '<p class="text-[10px] text-textMuted mt-2">' + U.esc(meta[4]) + '</p>', 'mb-3') +

        ui.card(ui.head('Commercials') +
          ui.kv('Project value', U.money(p.price)) +
          ui.kv('Received', '<span class="text-limeAccent">' + U.money(paid) + '</span>') +
          ui.kv('Outstanding', due.length ? '<span class="text-amber-300">' + U.money(U.sum(due, x => Number(x.amount) - Number(x.paidAmount || 0))) + '</span>' : U.money(Math.max(0, Number(p.price || 0) - paid))) +
          ui.kv('Care plan', p.maintenancePlan ? U.esc(p.maintenancePlan) + (p.maintenanceFee ? ' · ' + U.money(p.maintenanceFee) + '/month' : '') : '—') +
          ui.kv('Invoices', invoices.length ? invoices.map(i => '<span class="tag">' + U.esc(i.invoiceNo || '') + '</span>').join(' ') : '—'), 'mb-3') +

        ui.card(ui.head('Timeline') +
          ui.kv('Started', p.startedAt ? U.fmtDate(p.startedAt) : U.fmtDate(p.createdAt)) +
          ui.kv('Target', p.dueDate ? U.fmtDate(p.dueDate) : '—') +
          ui.kv('Delivered', p.deliveredAt ? U.fmtDate(p.deliveredAt) : '—') +
          ui.kv('Hosting renewal', p.hostRenewDate ? U.fmtDate(p.hostRenewDate) + ' (' + U.daysUntil(p.hostRenewDate) + 'd)' : '—') +
          ui.kv('Domain renewal', p.domainRenewDate ? U.fmtDate(p.domainRenewDate) + ' (' + U.daysUntil(p.domainRenewDate) + 'd)' : '—'), 'mb-3') +

        ui.card(ui.head('Build & hosting') +
          ui.kv('Kind', U.esc(kindLabel(p.kind))) +
          ui.kv('Stack', U.esc(p.techStack || p.stack || '—')) +
          ui.kv('Hosting', U.esc(p.hostingProvider || '—')) +
          ui.kv('Repository', p.repoUrl ? ui.link(p.repoUrl, 'open', 'link') : '—') +
          ui.kv('Live address', p.url ? ui.link(p.url, 'open', 'link') : '—') +
          ui.kv('Stored copy', html ? U.bytes(html.length) + ' of HTML saved locally' : '—'), 'mb-3') +

        ui.card(ui.head('Files in the vault', files.length ? '<button class="btn btn-ghost btn-sm" data-action="projects.files" data-arg="' + p.id + '">Open all</button>' : '') +
          (files.length
            ? '<div class="space-y-1.5">' + files.slice(0, 6).map(d =>
              '<div class="row-card p-2 flex items-center gap-2" data-action="files.detail" data-arg="' + d.id + '">' +
              ui.icon(App.files.categoryIcon(d.category), 'text-textMuted text-[10px]') +
              '<div class="min-w-0 flex-1"><p class="text-[11px] truncate">' + U.esc(d.name) + '</p>' +
              '<p class="text-[9px] text-textMuted">' + U.esc(d.kind) + ' · ' + U.bytes(d.size) + ' · v' + U.esc(d.version || '1.0') + '</p></div>' +
              '<button class="btn btn-ghost btn-sm" data-action="files.download" data-arg="' + d.id + '"><i class="fa-solid fa-download"></i></button></div>').join('') + '</div>'
            : '<p class="text-[10px] text-textMuted">No files attached yet. Add the build folder, the design source, the contract — anything that belongs to this project.</p>'), 'mb-3') +

        (p.notes ? ui.card(ui.head('Notes') + '<p class="text-[10px] text-gray-300 whitespace-pre-line">' + U.esc(p.notes) + '</p>') : '')
    });
  }

  /* --------------------------------- form ---------------------------------- */
  function projectForm(id) {
    const p = id ? (projects().filter(x => x.id === id)[0] || {}) : {};
    ui.closeDrawer();
    ui.modal({
      title: id ? 'Edit ' + p.name : 'New project',
      sub: 'A website, an app, a software build or a service retainer — one record for each',
      size: 'lg',
      body:
        '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
        ui.field({ label: 'Project name', model: 'ui.proj.name', value: p.name || '' }) +
        ui.field({ label: 'Phase', model: 'ui.proj.phase', value: p.phase || 'development', options: PHASES.map(x => [x[0], x[1]]) }) +
        ui.field({ label: 'Kind', model: 'ui.proj.kind', value: p.kind || 'website', options: KINDS }) +
        ui.field({ label: 'Client', model: 'ui.proj.clientId', value: p.clientId || '', options: [['', '— our own project —']].concat(App.store.get('clients', []).map(c => [c.id, c.name])) }) +
        ui.field({ label: 'Live address', model: 'ui.proj.url', value: p.url || '', placeholder: 'https://…' }) +
        ui.field({ label: 'Tech stack', model: 'ui.proj.techStack', value: p.techStack || p.stack || '', placeholder: 'HTML/CSS/JS, PHP, React…' }) +
        ui.field({ label: 'Hosting provider', model: 'ui.proj.hostingProvider', value: p.hostingProvider || '' }) +
        ui.field({ label: 'Repository', model: 'ui.proj.repoUrl', value: p.repoUrl || '' }) +
        ui.field({ label: 'Project value (ETB)', model: 'ui.proj.price', value: p.price || 0, type: 'number' }) +
        ui.field({ label: 'Progress %', model: 'ui.proj.progressPct', value: p.progressPct != null ? p.progressPct : 50, type: 'number' }) +
        ui.field({ label: 'Started', model: 'ui.proj.startedAt', value: p.startedAt || U.todayISO(), type: 'date' }) +
        ui.field({ label: 'Target date', model: 'ui.proj.dueDate', value: p.dueDate || '', type: 'date' }) +
        ui.field({ label: 'Delivered on', model: 'ui.proj.deliveredAt', value: p.deliveredAt || '', type: 'date' }) +
        ui.field({ label: 'Hosting renewal', model: 'ui.proj.hostRenewDate', value: p.hostRenewDate || '', type: 'date' }) +
        ui.field({ label: 'Domain renewal', model: 'ui.proj.domainRenewDate', value: p.domainRenewDate || '', type: 'date' }) +
        ui.field({ label: 'Care plan', model: 'ui.proj.maintenancePlan', value: p.maintenancePlan || '', placeholder: 'e.g. Maintenance retainer' }) +
        ui.field({ label: 'Care fee per month (ETB)', model: 'ui.proj.maintenanceFee', value: p.maintenanceFee || 0, type: 'number' }) +
        '</div>' +
        ui.field({ label: 'Notes', model: 'ui.proj.notes', value: p.notes || '', rows: 3, wrapCls: 'mt-3', placeholder: 'Scope, what changed, what the client asked for next.' }),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        (id ? '<button class="btn btn-danger" data-action="projects.delete" data-arg="' + id + '">Delete</button>' : '') +
        '<button class="btn btn-lime" data-action="projects.save" data-arg="' + (id || '') + '"><i class="fa-solid fa-floppy-disk"></i> Save project</button>'
    });
  }

  /* --------------------------------- screen -------------------------------- */
  App.views = App.views || {};
  App.views.projects = {
    title: 'Projects',
    sub: 'Live sites, new builds, current clients, ongoing care and past work',
    icon: 'fa-diagram-project',
    render(el, params) {
      const s = q();
      const all = projects();
      const rows = U.sortBy(filtered(), x => x.updatedAt || x.createdAt || '', 'desc');
      const clients = App.store.get('clients', []);
      const live = all.filter(p => p.phase === 'live').length;
      const building = all.filter(p => p.phase === 'development' || p.phase === 'active').length;
      const care = all.filter(p => p.phase === 'maintenance').length;
      const value = U.sum(all.filter(p => p.phase !== 'cancelled'), p => Number(p.price) || 0);
      const dueCount = all.reduce((a, p) => a + dueFor(p).length, 0);

      el.innerHTML =
        '<div class="flex items-center justify-between gap-3 flex-wrap mb-3">' +
        '<div class="flex flex-wrap gap-1.5">' +
        ui.chip('Everything (' + all.length + ')', s.tab === 'all', 'projects.tab', 'all', 'fa-layer-group') +
        PHASES.map(p => ui.chip(p[1] + ' (' + all.filter(x => x.phase === p[0]).length + ')', s.tab === p[0], 'projects.tab', p[0], p[2])).join('') +
        '</div>' +
        '<div class="btn-row">' +
        '<select class="inp" data-model="ui.projClientFilter" data-change-action="projects.filterClient">' +
        '<option value="">All clients</option>' +
        clients.map(c => '<option value="' + U.attr(c.id) + '"' + (s.client === c.id ? ' selected' : '') + '>' + U.esc(c.name) + '</option>').join('') +
        '</select>' +
        '<input class="inp w-[170px]" data-model="ui.projSearch" data-change-action="projects.applyFilters" data-enter="projects.applyFilters" value="' + U.attr(s.search) + '" placeholder="Search projects…" />' +
        '<button class="btn btn-lime btn-sm" data-action="projects.new"><i class="fa-solid fa-plus"></i> New project</button>' +
        '</div></div>' +

        '<div class="four-col mb-4">' +
        ui.stat({ tag: 'Live', label: 'Hosted & online', value: String(live), badge: 'being maintained', sub: 'Renewals are tracked per project' }) +
        ui.stat({ tag: 'Build', label: 'In development', value: String(building), tone: 'blue', badge: 'coming next', sub: 'New websites, apps and systems' }) +
        ui.stat({ tag: 'Care', label: 'Ongoing clients', value: String(care), tone: 'amber', badge: 'retainers', sub: 'The work that pays every month' }) +
        ui.stat({ tag: 'Value', label: 'Portfolio value', value: U.money(value), tone: 'violet', badge: dueCount ? dueCount + ' payment' + (dueCount === 1 ? '' : 's') + ' due' : 'all settled', sub: 'Across every project still active' }) +
        '</div>' +

        (dueCount
          ? '<div class="glass-soft rounded-xl p-3 mb-3 text-[11px] flex items-center gap-2.5 tone tone-amber border">' +
            ui.icon('fa-hourglass-half', '') +
            '<span>' + dueCount + ' project payment' + (dueCount === 1 ? ' is' : 's are') + ' still open. Open the project or the Money screen to collect them.</span>' +
            '<button class="btn btn-ghost btn-sm ml-auto" data-nav="payments">Open Money</button></div>'
          : '') +

        (rows.length
          ? '<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 stagger">' + rows.map(projectCard).join('') + '</div>'
          : ui.empty(all.length ? 'Nothing in this phase' : 'No projects yet',
            all.length ? 'Pick another phase above, or clear the filters.' : 'Register the websites you host, the builds in progress and the clients you work with. Files, payments and renewals all attach to a project.',
            'fa-diagram-project',
            '<button class="btn btn-lime btn-sm" data-action="projects.new"><i class="fa-solid fa-plus"></i> Create the first project</button>'));

      if (params) openProject(params);
    }
  };

  /* --------------------------------- actions ------------------------------- */
  App.action('projects.tab', el => { q().tab = el.getAttribute('data-arg'); App.emit('state:changed', { path: 'projects' }); });
  App.action('projects.applyFilters', () => { q().search = App.store.get('ui.projSearch', ''); App.emit('state:changed', { path: 'projects' }); });
  App.action('projects.filterClient', el => { q().client = el.value || ''; App.emit('state:changed', { path: 'projects' }); });
  App.action('projects.open', el => { const id = el.getAttribute('data-arg'); if (id) openProject(id); });
  App.action('projects.new', () => projectForm(''));
  App.action('projects.edit', el => projectForm(el.getAttribute('data-arg')));
  App.action('projects.files', el => { const id = el.getAttribute('data-arg'); ui.closeDrawer(); App.router.go('files', id); });
  App.action('projects.uploadFile', el => {
    const id = el.getAttribute('data-arg');
    const p = App.store.find('sites', id);
    App.store.set('ui.upload.category', 'website', { silent: true });
    App.store.set('ui.upload.projectId', id, { silent: true });
    App.store.set('ui.upload.clientId', (p && p.clientId) || '', { silent: true });
    ui.closeDrawer();
    App.actions['files.upload']();
  });
  App.action('projects.save', el => {
    const id = el.getAttribute('data-arg');
    const g = k => App.store.get('ui.proj.' + k, '');
    const client = App.store.find('clients', g('clientId'));
    const data = {
      name: g('name'),
      phase: g('phase'),
      kind: g('kind'),
      clientId: g('clientId'),
      clientName: client ? client.name : 'Triverse Studio',
      url: g('url'),
      techStack: g('techStack'),
      hostingProvider: g('hostingProvider'),
      repoUrl: g('repoUrl'),
      price: Number(g('price')) || 0,
      progressPct: U.clamp(Number(g('progressPct')) || 0, 0, 100),
      startedAt: g('startedAt'),
      dueDate: g('dueDate'),
      deliveredAt: g('deliveredAt'),
      hostRenewDate: g('hostRenewDate'),
      domainRenewDate: g('domainRenewDate'),
      maintenancePlan: g('maintenancePlan'),
      maintenanceFee: Number(g('maintenanceFee')) || 0,
      notes: g('notes')
    };
    if (!data.name) { ui.toast('Give the project a name', 'amber'); return; }
    data.status = data.phase === 'live' ? 'live' : (data.phase === 'delivered' ? 'archived' : (data.phase === 'paused' ? 'offline' : 'draft'));
    if (id) {
      App.store.patch('sites', id, data);
      App.log('project', 'Project “' + data.name + '” updated', id);
    } else {
      const made = App.store.add('sites', Object.assign({ generatedFrom: null, kind: data.kind }, data));
      App.log('project', 'Project “' + data.name + '” created', made.id);
    }
    ui.closeModal();
    ui.toast(id ? 'Project updated' : 'Project created', 'lime');
    App.refresh();
  });
  App.action('projects.delete', el => {
    const id = el.getAttribute('data-arg');
    const p = App.store.find('sites', id);
    const files = filesFor(p || {});
    ui.confirm({
      title: 'Delete this project?', tone: 'danger', confirmLabel: 'Delete the project',
      message: '“' + (p ? p.name : '') + '” will be removed. ' + (files.length ? files.length + ' attached file record(s) stay in the File vault (unlink them there if you want them gone). ' : '') + 'Invoices are untouched.',
      onConfirm() {
        App.store.dropHTML(id);
        App.store.remove('sites', id);
        ui.closeModal(); ui.closeDrawer();
        ui.toast('Project deleted', 'amber');
        App.refresh();
      }
    });
  });
})(window);

</script>
  <script>
/* ===== assets/js/views.files.js ===== */
/* =============================================================================
   Triverse OS — File vault
   One place for every file the studio owns, with the information a real archive
   needs: what it is, which project and client it belongs to, its version,
   who made it, how big it is and a checksum that proves a download is intact.
   Upload anything — html, css, js, php, images, source archives, fonts — and
   download it again from any device the workspace is opened on.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  function q() {
    App.router.q.files = App.router.q.files || { category: 'all', search: '', project: '' };
    return App.router.q.files;
  }

  function iconFor(doc) {
    if (doc.kind === 'Image' || doc.kind === 'Vector') return 'fa-image';
    if (doc.kind === 'Markup') return 'fa-code';
    if (doc.kind === 'Stylesheet') return 'fa-brush';
    if (doc.kind === 'JavaScript' || doc.kind === 'TypeScript' || doc.kind === 'React') return 'fa-file-code';
    if (doc.kind === 'PDF') return 'fa-file-pdf';
    if (doc.kind === 'Archive') return 'fa-file-zipper';
    if (doc.kind === 'Spreadsheet') return 'fa-file-excel';
    if (doc.kind === 'Document') return 'fa-file-word';
    if (doc.kind === 'Video' || doc.kind === 'Audio') return 'fa-photo-film';
    if (doc.kind === 'Font') return 'fa-font';
    return 'fa-file';
  }

  function sizeLabel(doc) { return U.bytes(doc.size); }

  function projectLabel(doc) {
    if (doc.projectId) {
      const site = App.store.find('sites', doc.projectId);
      if (site) return site.name;
    }
    if (doc.projectName) return doc.projectName;
    const client = doc.clientId ? App.store.find('clients', doc.clientId) : null;
    return client ? client.name : '';
  }

  /* --------------------------------- upload -------------------------------- */
  function uploadModal() {
    ui.modal({
      title: 'Add files to the vault',
      sub: 'Any file, any language. The description you add here is what makes it findable in a year.',
      size: 'lg',
      body:
        '<div id="drop-zone" class="drop-zone">' +
        ui.icon('fa-cloud-arrow-up', 'text-xl') +
        '<p class="text-[12px] font-semibold mt-2">Drop a folder, or choose files</p>' +
        '<p class="text-[10px] text-textMuted mt-1">A whole project folder is read as it is, with every sub-folder. HTML, CSS, JS, PHP, Python, images, fonts, archives, PDFs, any language.</p>' +
        '<input id="file-input" type="file" multiple class="hidden" />' +
        '<input id="dir-input" type="file" webkitdirectory directory multiple class="hidden" />' +
        '<div class="btn-row mt-3">' +
        '<button class="btn btn-lime btn-sm" data-pick="folder"><i class="fa-solid fa-folder-tree"></i> Choose a folder</button>' +
        '<button class="btn btn-ghost btn-sm" data-pick="files"><i class="fa-solid fa-file-circle-plus"></i> Choose files</button>' +
        '</div>' +
        '<ul id="drop-list" class="text-left text-[10px] text-textMuted mt-3 space-y-1"></ul>' +
        '</div>' +
        '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">' +
        ui.field({ label: 'Category', model: 'ui.upload.category', value: 'website', options: App.files.categories().map(c => [c[0], c[1]]) }) +
        ui.field({ label: 'Belongs to project / website', model: 'ui.upload.projectId', value: '', options: [['', '— not linked —']].concat(App.store.get('sites', []).map(s => [s.id, s.name])) }) +
        ui.field({ label: 'Client', model: 'ui.upload.clientId', value: '', options: [['', '— not linked —']].concat(App.store.get('clients', []).map(c => [c.id, c.name])) }) +
        ui.field({ label: 'Version', model: 'ui.upload.version', value: '1.0' }) +
        ui.field({ label: 'Language / stack', model: 'ui.upload.language', value: '', placeholder: 'e.g. HTML, PHP 8, React' }) +
        ui.field({ label: 'Tags (comma separated)', model: 'ui.upload.tags', value: '', placeholder: 'homepage, v2, approved' }) +
        '</div>' +
        ui.field({ label: 'What is this file?', model: 'ui.upload.description', value: '', rows: 2, wrapCls: 'mt-3', placeholder: 'Final homepage markup delivered to the client, approved on 12 March.' }) +
        '<div id="upload-progress" class="text-[10px] text-textMuted mt-3"></div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-lime" id="upload-go" data-action="files.uploadGo"><i class="fa-solid fa-arrow-up-from-bracket"></i> Store in the vault</button>',
      onMount(root) {
        const input = root.querySelector('#file-input');
        const zone = root.querySelector('#drop-zone');
        const list = root.querySelector('#drop-list');
        ui._uploadFiles = [];
        const render = () => {
          const rows = ui._uploadFiles || [];
          const folders = {};
          rows.forEach(f => { if (f.folder) folders[f.folder] = 1; });
          list.innerHTML = (Object.keys(folders).length ? '<li class="text-accentMint"><i class="fa-solid fa-folder-tree"></i> ' +
            rows.length + ' file(s) from ' + Object.keys(folders).length + ' folder(s) — the structure is kept</li>' : '') +
            rows.slice(0, 60).map(f =>
            '<li class="flex items-center gap-2"><i class="fa-solid ' + iconFor({ kind: U.fileKind(f.name, f.type) }) + '"></i>' +
            '<span class="truncate">' + U.esc(f.folder ? f.folder + '/' + f.name : f.name) + '</span>' +
            '<span class="ml-auto num">' + U.bytes(f.size) + '</span></li>').join('') +
            (rows.length > 60 ? '<li class="text-textMuted">… and ' + (rows.length - 60) + ' more</li>' : '');
        };
        const dir = root.querySelector('#dir-input');
        const take = files => {
          const rows = Array.prototype.slice.call(files || []);
          // a folder keeps its shape: the relative path becomes part of the name
          rows.forEach(f => { if (f.webkitRelativePath && f.webkitRelativePath.indexOf('/') !== -1) f.folder = f.webkitRelativePath.split('/').slice(0, -1).join('/'); });
          ui._uploadFiles = (ui._uploadFiles || []).concat(rows);
          render();
        };
        root.querySelectorAll('[data-pick="files"]').forEach(b => b.addEventListener('click', () => input.click()));
        root.querySelectorAll('[data-pick="folder"]').forEach(b => b.addEventListener('click', () => dir.click()));
        input.addEventListener('change', () => take(input.files));
        dir.addEventListener('change', () => take(dir.files));
        zone.addEventListener('dragover', ev => { ev.preventDefault(); zone.classList.add('is-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('is-over'));
        zone.addEventListener('drop', ev => {
          ev.preventDefault();
          zone.classList.remove('is-over');
          if (!ev.dataTransfer) return;
          const items = ev.dataTransfer.items ? Array.prototype.slice.call(ev.dataTransfer.items) : [];
          const entries = items.map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
          if (!entries.length) { take(ev.dataTransfer.files); return; }
          const found = [];
          const walk = entry => new Promise(res => {
            if (!entry) return res();
            if (entry.isFile) return entry.file(f => { f.folder = entry.fullPath ? entry.fullPath.replace(/^\//, '').split('/').slice(0, -1).join('/') : ''; found.push(f); res(); }, () => res());
            if (!entry.isDirectory) return res();
            const reader = entry.createReader();
            const read = () => reader.readEntries(entries2 => {
              if (!entries2.length) return res();
              Promise.all(entries2.map(walk)).then(read);
            }, () => res());
            read();
          });
          Promise.all(entries.map(walk)).then(() => take(found));
        });
      }
    });
  }

  /* --------------------------------- screen -------------------------------- */
  App.views = App.views || {};
  App.views.files = {
    title: 'File vault',
    sub: 'Every website build, design source and document we own — with its full record',
    icon: 'fa-box-archive',
    render(el, params) {
      const s = q();
      const stats = App.files.stats();
      const rows = U.sortBy(App.files.search(s.search, { category: s.category, projectId: s.project }), d => d.uploadedAt || '', 'desc');
      const backend = App.files.backend();

      el.innerHTML =
        '<div class="flex items-center justify-between gap-3 flex-wrap mb-3">' +
        '<div class="flex flex-wrap gap-1.5">' +
        [['all', 'All files']].concat(App.files.categories()).map(c =>
          ui.chip(c[1] + (c[0] === 'all' ? ' (' + stats.count + ')' : stats.byCategory[c[0]] ? ' (' + stats.byCategory[c[0]] + ')' : ''),
            s.category === c[0], 'files.category', c[0], c[0] === 'all' ? 'fa-layer-group' : c[2])).join('') +
        '</div>' +
        '<div class="btn-row">' +
        '<input class="inp w-[190px]" data-model="ui.filesSearch" data-change-action="files.applyFilters" data-enter="files.applyFilters" value="' + U.attr(s.search) + '" placeholder="Search name, tag, content…" />' +
        '<button class="btn btn-lime btn-sm" data-action="files.upload"><i class="fa-solid fa-arrow-up-from-bracket"></i> Add files</button>' +
        '</div></div>' +

        '<div class="four-col mb-4">' +
        ui.stat({ tag: 'Vault', label: 'Files stored', value: String(stats.count), badge: U.bytes(stats.bytes), sub: backend === 'indexedDB' ? 'On this device, in the browser database' : 'Device storage is limited — connect Drive' }) +
        ui.stat({ tag: 'Linked', label: 'Files linked to projects', value: String(stats.links), tone: 'blue', badge: stats.count ? U.pct(stats.links, stats.count) + '%' : '0%', sub: 'The rest are general studio files' }) +
        ui.stat({ tag: 'Latest', label: 'Most recent upload', value: stats.newest ? U.relTime(stats.newest.uploadedAt) : '—', tone: 'amber', badge: stats.newest ? U.bytes(stats.newest.size) : '', sub: stats.newest ? stats.newest.name : 'Nothing stored yet' }) +
        ui.stat({ tag: 'Cloud', label: 'Copies in Drive', value: String(App.files.all().filter(d => d.cloud && d.cloud.driveId).length), tone: 'violet', badge: App.cloud.isConnected() ? 'Drive connected' : 'Drive not connected', sub: App.cloud.status().http ? 'Backs the vault up off this device' : 'Needs the app opened over http://localhost' }) +
        '</div>' +

        (App.files.all().some(d => d.missing)
          ? '<div class="glass-soft rounded-xl p-3 mb-3 text-[11px] flex items-start gap-2.5 tone tone-amber border">' +
            ui.icon('fa-triangle-exclamation', 'mt-0.5') +
            '<div class="flex-1"><p class="font-semibold">Some records have no stored copy on this device</p>' +
            '<p class="text-textMuted">They are listed with an amber mark. Restore a backup, re-upload the file, or pull it back from Google Drive.</p></div>' +
            '<button class="btn btn-ghost btn-sm" data-action="files.audit">Re-check</button></div>'
          : '') +

        (rows.length
          ? '<div class="glass-card rounded-2xl overflow-hidden">' +
            ui.table(
              ['File', 'Type', 'Category', 'Project / client', 'Size', 'Version', 'Added', ''],
              rows.map(d => ({
                cells: [
                  '<div class="flex items-center gap-3 min-w-0">' +
                    '<span class="file-glyph"><i class="fa-solid ' + iconFor(d) + '"></i></span>' +
                    '<span class="min-w-0"><span class="block text-[11px] font-semibold truncate">' + U.esc(d.name) + (d.missing ? ' <i class="fa-solid fa-triangle-exclamation text-amber-300 text-[9px]"></i>' : '') + '</span>' +
                    '<span class="block text-[9px] text-textMuted truncate">' + U.esc(d.description || 'no description') + '</span></span></div>',
                  '<span class="tag">' + U.esc(d.kind) + '</span>',
                  U.esc(App.files.categoryLabel(d.category)),
                  U.esc(projectLabel(d) || '—'),
                  '<span class="num">' + sizeLabel(d) + '</span>',
                  'v' + U.esc(d.version || '1.0'),
                  U.relTime(d.uploadedAt),
                  '<div class="btn-row justify-end">' +
                    '<button class="btn btn-ghost btn-sm" data-action="files.detail" data-arg="' + d.id + '" title="Full record"><i class="fa-solid fa-circle-info"></i></button>' +
                    '<button class="btn btn-ghost btn-sm" data-action="files.download" data-arg="' + d.id + '" title="Download"><i class="fa-solid fa-download"></i></button>' +
                    (d.previewable ? '<button class="btn btn-lime btn-sm" data-action="files.open" data-arg="' + d.id + '" title="Open"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>' : '') +
                  '</div>'
                ],
                attrs: ' data-action="files.detail" data-arg="' + d.id + '"'
              })),
              { empty: 'No files yet', emptySub: '', emptyIcon: 'fa-box-archive' }
            ) + '</div>'
          : ui.empty(stats.count ? 'Nothing matches that filter' : 'The vault is empty',
            stats.count ? 'Clear the search or pick another category.' : 'Add the files you already own — website builds, logos, contracts, invoices. Each one keeps its full record here.',
            'fa-box-archive',
            '<button class="btn btn-lime btn-sm" data-action="files.upload"><i class="fa-solid fa-arrow-up-from-bracket"></i> Add your first files</button>'));

      if (params) openDetail(params);
    }
  };

  /* ------------------------------- detail view ----------------------------- */
  async function openDetail(id) {
    const d = App.store.find('documents', id);
    if (!d) return;
    const hasLocal = await App.files.has(d.id);
    const inDrive = Boolean(d.cloud && d.cloud.driveId);
    const project = d.projectId ? App.store.find('sites', d.projectId) : null;
    const client = d.clientId ? App.store.find('clients', d.clientId) : (project && project.clientId ? App.store.find('clients', project.clientId) : null);
    const isImage = /^image\//.test(d.mime || '') || /\.(png|jpe?g|gif|webp|svg|ico)$/i.test(d.name);
    const isText = /\.(html?|css|js|mjs|json|txt|md|csv|sql|php|py|ts|tsx|jsx|yml|yaml)$/i.test(d.name) || /^text\//.test(d.mime || '');
    const isPdf = d.kind === 'PDF';

    let preview = '';
    if (hasLocal && isImage) {
      const url = await App.files.blobUrl(d);
      preview = '<img src="' + U.attr(url) + '" alt="" class="w-full max-h-[320px] object-contain rounded-xl bg-black/20" />';
    } else if (isText && d.preview) {
      preview = '<pre class="code-preview">' + U.esc(String(d.preview).slice(0, 4000)) + (String(d.preview).length >= 4000 ? '\n…' : '') + '</pre>';
    } else if (isPdf && hasLocal) {
      const url = await App.files.blobUrl(d);
      preview = '<iframe src="' + U.attr(url) + '" class="w-full rounded-xl border border-line" style="height:340px"></iframe>';
    } else {
      preview = '<div class="glass-soft rounded-xl p-6 text-center text-[11px] text-textMuted">' +
        (hasLocal ? 'No preview for this file type — open or download it to inspect it.' : 'The stored copy is not on this device.') + '</div>';
    }

    ui.drawer({
      title: d.name,
      sub: App.files.categoryLabel(d.category) + ' · ' + d.kind + ' · v' + (d.version || '1.0'),
      body:
        '<div class="space-y-3">' +
        '<div class="flex flex-wrap gap-2">' +
        (hasLocal ? '<button class="btn btn-lime btn-sm" data-action="files.download" data-arg="' + d.id + '"><i class="fa-solid fa-download"></i> Download</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="files.open" data-arg="' + d.id + '"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</button>' : '') +
        '<button class="btn btn-ghost btn-sm" data-action="files.replace" data-arg="' + d.id + '"><i class="fa-solid fa-arrows-rotate"></i> Upload a new version</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="files.drive" data-arg="' + d.id + '" title="Keep a copy in Google Drive"><i class="fa-brands fa-google-drive"></i> ' + (inDrive ? 'Update Drive copy' : 'Copy to Drive') + '</button>' +
        (!hasLocal && inDrive ? '<button class="btn btn-ghost btn-sm" data-action="files.pull" data-arg="' + d.id + '"><i class="fa-solid fa-cloud-arrow-down"></i> Pull from Drive</button>' : '') +
        '<button class="btn btn-ghost btn-sm" data-action="files.edit" data-arg="' + d.id + '"><i class="fa-solid fa-pen"></i> Edit details</button>' +
        '<button class="btn btn-danger btn-sm" data-action="files.delete" data-arg="' + d.id + '"><i class="fa-solid fa-trash"></i> Delete</button>' +
        '</div>' +

        preview +

        ui.card(ui.head('File') +
          ui.kv('Name', U.esc(d.name)) +
          ui.kv('Type', U.esc(d.kind) + (d.mime ? ' <span class="text-textMuted">(' + U.esc(d.mime) + ')</span>' : '')) +
          ui.kv('Extension', '.' + U.esc(d.ext || '—')) +
          ui.kv('Size', '<span class="num">' + U.bytes(d.size) + '</span> (' + U.num(d.size) + ' bytes)') +
          ui.kv('Version', 'v' + U.esc(d.version || '1.0')) +
          ui.kv('Language / stack', U.esc(d.language || '—')) +
          ui.kv('SHA-256', '<span class="mono text-[9px] break-all">' + U.esc(d.checksum || 'not computed') + '</span>'), 'mb-3') +

        ui.card(ui.head('Ownership') +
          ui.kv('Category', U.esc(App.files.categoryLabel(d.category))) +
          ui.kv('Project', project ? ui.link('#/sites/' + project.id, project.name, 'link') : U.esc(d.projectName || '—')) +
          ui.kv('Client', client ? ui.link('#/clients/' + client.id, client.name, 'link') : '—') +
          ui.kv('Author', U.esc(d.author || '—')) +
          ui.kv('Tags', (d.tags && d.tags.length) ? d.tags.map(t => '<span class="tag">' + U.esc(t) + '</span>').join(' ') : '—'), 'mb-3') +

        ui.card(ui.head('History') +
          ui.kv('Added', U.fmtDateTime(d.uploadedAt)) +
          ui.kv('Last changed', U.fmtDateTime(d.updatedAt)) +
          ui.kv('Times opened', U.num(d.opened || 0)) +
          ui.kv('Times downloaded', U.num(d.downloads || 0)) +
          ((d.history && d.history.length) ? ui.kv('Previous versions', d.history.map(h => '<span class="tag">' + U.esc(h.version || '—') + ' · ' + U.bytes(h.size) + '</span>').join(' ')) : ''), 'mb-3') +

        ui.card(ui.head('Storage') +
          ui.kv('This device', hasLocal ? '<span class="text-limeAccent">stored</span> (' + U.esc(d.backend || App.files.backend()) + ')' : '<span class="text-amber-300">not on this device</span>') +
          ui.kv('Google Drive', inDrive ? '<span class="text-limeAccent">copied</span> · ' + U.fmtDateTime(d.cloud.syncedAt) + (d.cloud.link ? ' · ' + ui.link(d.cloud.link, 'open in Drive', 'link') : '') : 'not copied yet'), 'mb-3') +

        (d.description || d.notes
          ? ui.card(ui.head('Description') +
            (d.description ? '<p class="text-[11px] text-gray-300 whitespace-pre-line">' + U.esc(d.description) + '</p>' : '') +
            (d.notes ? '<p class="text-[10px] text-textMuted whitespace-pre-line mt-2">' + U.esc(d.notes) + '</p>' : ''))
          : '') +
        '</div>'
    });
  }
  App.openDocument = openDetail;

  /* --------------------------------- actions ------------------------------- */
  App.action('files.category', el => { q().category = el.getAttribute('data-arg'); App.emit('state:changed', { path: 'files' }); });
  App.action('files.applyFilters', () => { q().search = App.store.get('ui.filesSearch', ''); App.emit('state:changed', { path: 'files' }); });
  App.action('files.upload', uploadModal);
  App.action('files.pick', () => { const i = document.getElementById('file-input'); if (i) i.click(); });
  App.action('files.uploadGo', async () => {
    const list = ui._uploadFiles || [];
    if (!list.length) { ui.toast('Choose at least one file first', 'amber'); return; }
    const g = k => App.store.get('ui.upload.' + k, '');
    const project = App.store.find('sites', g('projectId'));
    const client = App.store.find('clients', g('clientId')) || (project && project.clientId ? App.store.find('clients', project.clientId) : null);
    const meta = {
      category: g('category') || 'other',
      projectId: g('projectId') || '',
      projectName: project ? project.name : '',
      clientId: client ? client.id : '',
      version: g('version') || '1.0',
      language: g('language') || '',
      description: g('description') || '',
      tags: String(g('tags') || '').split(',').map(x => x.trim()).filter(Boolean)
    };
    const bar = document.getElementById('upload-progress');
    const btn = document.getElementById('upload-go');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Storing…'; }
    const out = { added: [], failed: [] };
    for (let i = 0; i < list.length; i++) {
      if (bar) bar.textContent = 'Storing ' + (i + 1) + ' of ' + list.length + ' — ' + list[i].name;
      try { out.added.push(await App.files.add(list[i], Object.assign({}, meta, { folder: list[i].folder || '' }))); }
      catch (e) { out.failed.push({ name: list[i].name, error: e.message }); }
    }
    ui._uploadFiles = [];
    ui.closeModal();
    ui.toast(out.added.length + ' file' + (out.added.length === 1 ? '' : 's') + ' stored' + (out.failed.length ? ' · ' + out.failed.length + ' failed' : ''), out.failed.length ? 'amber' : 'lime');
    if (out.failed.length) {
      ui.modal({
        title: 'Some files were not stored',
        size: 'sm',
        body: '<div class="space-y-1.5">' + out.failed.map(f =>
          '<div class="glass-soft rounded-lg p-2"><p class="text-[11px]">' + U.esc(f.name) + '</p>' +
          '<p class="text-[10px] text-red-300">' + U.esc(f.error) + '</p></div>').join('') + '</div>',
        footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>'
      });
    }
    App.emit('state:changed', { path: 'documents' });
  });

  App.action('files.detail', el => { const id = el.getAttribute('data-arg'); if (id) openDetail(id); });
  App.action('files.open', el => App.files.open(el.getAttribute('data-arg')));
  App.action('files.download', el => App.files.download(el.getAttribute('data-arg')));
  App.action('files.delete', el => {
    const id = el.getAttribute('data-arg');
    const d = App.store.find('documents', id);
    ui.confirm({
      title: 'Delete this file?', tone: 'danger', confirmLabel: 'Delete for good',
      message: '“' + (d ? d.name : '') + '” and its stored copy will be removed from this device. A copy already in Google Drive is not touched — delete it there too if you want it gone completely.',
      onConfirm: async () => {
        await App.files.remove(id);
        App.store.remove('documents', id);
        App.log('file', 'Deleted “' + (d ? d.name : '') + '” from the vault', '');
        ui.closeModal(); ui.closeDrawer(); ui.toast('File deleted', 'amber');
        App.refresh();
      }
    });
  });
  App.action('files.replace', el => {
    const id = el.getAttribute('data-arg');
    const input = document.createElement('input');
    input.type = 'file';
    input.onchange = async () => {
      if (!input.files || !input.files[0]) return;
      try {
        await App.files.replace(id, input.files[0]);
        ui.toast('New version stored', 'lime');
        ui.closeDrawer();
        setTimeout(() => openDetail(id), 200);
      } catch (e) { ui.toast(e.message, 'red'); }
    };
    input.click();
  });
  App.action('files.drive', async el => {
    const id = el.getAttribute('data-arg');
    ui.toast('Copying to Google Drive…', 'blue');
    try {
      await App.cloud.uploadFile(id);
      ui.toast('Copied to the “Triverse OS” folder in Drive', 'lime');
      ui.closeDrawer();
      setTimeout(() => openDetail(id), 200);
    } catch (e) { ui.toast(String(e.message).split('\n')[0], 'red'); }
  });
  App.action('files.pull', async el => {
    const id = el.getAttribute('data-arg');
    try {
      await App.cloud.fetchFile(id);
      ui.toast('Pulled back from Google Drive', 'lime');
      ui.closeDrawer();
      setTimeout(() => openDetail(id), 200);
    } catch (e) { ui.toast(String(e.message).split('\n')[0], 'red'); }
  });
  App.action('files.audit', async () => {
    ui.toast('Checking the vault…', 'blue');
    const out = await App.files.audit();
    ui.toast(out.missing ? out.missing + ' of ' + out.total + ' files are not on this device' : 'All ' + out.total + ' files are stored here', out.missing ? 'amber' : 'lime');
    App.refresh();
  });

  App.action('files.edit', el => {
    const d = App.store.find('documents', el.getAttribute('data-arg'));
    if (!d) return;
    ui.closeDrawer();
    ui.modal({
      title: 'Edit the file record',
      sub: 'The description is the part that makes an archive usable years later',
      size: 'lg',
      body: '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
        ui.field({ label: 'File name', model: 'ui.doc.name', value: d.name }) +
        ui.field({ label: 'Category', model: 'ui.doc.category', value: d.category, options: App.files.categories().map(c => [c[0], c[1]]) }) +
        ui.field({ label: 'Version', model: 'ui.doc.version', value: d.version || '1.0' }) +
        ui.field({ label: 'Language / stack', model: 'ui.doc.language', value: d.language || '' }) +
        ui.field({ label: 'Project / website', model: 'ui.doc.projectId', value: d.projectId || '', options: [['', '— not linked —']].concat(App.store.get('sites', []).map(s => [s.id, s.name])) }) +
        ui.field({ label: 'Client', model: 'ui.doc.clientId', value: d.clientId || '', options: [['', '— not linked —']].concat(App.store.get('clients', []).map(c => [c.id, c.name])) }) +
        ui.field({ label: 'Author', model: 'ui.doc.author', value: d.author || '' }) +
        ui.field({ label: 'Tags (comma separated)', model: 'ui.doc.tags', value: (d.tags || []).join(', ') }) +
        '</div>' +
        ui.field({ label: 'What is this file?', model: 'ui.doc.description', value: d.description || '', rows: 3, wrapCls: 'mt-3' }) +
        ui.field({ label: 'Internal notes', model: 'ui.doc.notes', value: d.notes || '', rows: 2, wrapCls: 'mt-3' }),
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-lime" data-action="files.saveEdit" data-arg="' + d.id + '">Save</button>'
    });
  });
  App.action('files.saveEdit', el => {
    const id = el.getAttribute('data-arg');
    const g = k => App.store.get('ui.doc.' + k, '');
    const project = App.store.find('sites', g('projectId'));
    App.store.patch('documents', id, {
      name: g('name'), category: g('category'), version: g('version'), language: g('language'),
      projectId: g('projectId'), projectName: project ? project.name : '', clientId: g('clientId'),
      author: g('author'), description: g('description'), notes: g('notes'),
      tags: String(g('tags') || '').split(',').map(x => x.trim()).filter(Boolean)
    });
    ui.closeModal();
    ui.toast('Record updated', 'lime');
    App.refresh();
  });
})(window);

</script>
  <script>
/* ===== assets/js/views.money.js ===== */
/* =============================================================================
   Triverse OS — Payments, invoices and receivables
   Ledger of everything sold: paid, partial, pending, overdue, cancelled —
   plus printable invoices and WhatsApp payment reminders.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  function q() {
    App.router.q.money = App.router.q.money || { status: 'all', clientId: 'all', search: '', month: 'all', method: 'all' };
    return App.router.q.money;
  }

  function balance(p) { return (Number(p.amount) || 0) - (Number(p.amountPaid) || 0); }
  function effectiveStatus(p) {
    if (p.status === 'paid' || p.status === 'cancelled') return p.status;
    if (p.dueDate && p.dueDate < U.todayISO()) return 'overdue';
    return p.status;
  }

  function filtered() {
    const s = q();
    let list = App.store.get('payments', []).slice();
    if (s.status !== 'all') list = list.filter(p => effectiveStatus(p) === s.status);
    if (s.clientId !== 'all') list = list.filter(p => p.clientId === s.clientId);
    if (s.method !== 'all') list = list.filter(p => p.method === s.method);
    if (s.month !== 'all') list = list.filter(p => U.monthKey(p.issueDate) === s.month);
    if (s.search) list = list.filter(p => U.hit(p.invoiceNo, s.search) || U.hit(p.projectTitle, s.search) || U.hit(clientName(p.clientId), s.search) || U.hit(p.notes, s.search));
    return U.sortBy(list, p => p.issueDate || '', 'desc');
  }

  function clientName(id) { const c = App.store.find('clients', id); return c ? c.name : '—'; }

  function nextInvoiceNo() {
    const n = (App.store.get('counters.invoice', 0) || 0) + 1;
    return 'TS-' + new Date().getFullYear() + '-' + String(n).padStart(4, '0');
  }

  App.views = App.views || {};
  App.views.payments = {
    title: 'Payments & invoices',
    sub: 'Every birr in and out — collected, pending, overdue',
    icon: 'fa-wallet',
    render(el) {
      const m = App.metrics();
      const list = filtered();
      const s = q();
      const months = U.uniq(App.store.get('payments', []).map(p => U.monthKey(p.issueDate))).filter(Boolean).sort().reverse();
      const renewals = App.store.get('payments', []).filter(p => p.renewalDate && U.daysUntil(p.renewalDate) !== null && U.daysUntil(p.renewalDate) <= 45 && U.daysUntil(p.renewalDate) >= -30);

      el.innerHTML =
        '<div class="four-col mb-4">' +
        ui.stat({ tag: 'This month', label: 'Collected', value: U.money(m.monthCollected), badge: U.money(m.collected) + ' lifetime', sub: 'Across ' + m.payments.filter(p => p.status === 'paid').length + ' settled invoices' }) +
        ui.stat({ tag: 'Receivable', label: 'Outstanding', value: U.money(m.outstanding), badge: 'open', tone: 'blue', sub: 'Pending + partial balances' }) +
        ui.stat({ tag: 'Risk', label: 'Overdue', value: U.money(m.overdue), badge: m.payments.filter(p => effectiveStatus(p) === 'overdue').length + ' invoices', tone: m.overdue ? 'red' : 'lime', sub: 'Send a reminder with one tap' }) +
        ui.stat({ tag: 'Recurring', label: 'Renewals next 45 days', value: U.money(U.sum(renewals, p => Number(p.amount) || 0)), badge: renewals.length + ' items', tone: 'amber', sub: 'Retainers, hosting and ads packages' }) +
        '</div>' +

        ui.card(ui.head('Collections trend', ui.badge('last 8 months', 'muted'), 'Paid invoices by month') +
          ui.bars(m.revenueByMonth, { highlight: m.revenueByMonth[m.revenueByMonth.length - 1].key }), 'mb-4') +

        '<div class="flex items-center justify-between gap-3 flex-wrap mb-3">' +
        '<div class="flex flex-wrap gap-1.5">' +
        ui.chip('All (' + m.payments.length + ')', s.status === 'all', 'pay.filter', 'all') +
        App.dict.paymentStatuses.map(st => ui.chip(U.title(st) + ' (' + m.payments.filter(p => effectiveStatus(p) === st).length + ')', s.status === st, 'pay.filter', st)).join('') +
        '</div>' +
        '<div class="btn-row">' +
        '<input class="inp w-[160px]" data-model="ui.paySearch" data-change-action="pay.applyFilters" data-enter="pay.applyFilters" value="' + U.attr(s.search) + '" placeholder="Invoice / project…" />' +
        '<select class="inp w-[170px]" data-model="ui.payClient" data-change-action="pay.applyFilters"><option value="all">All clients</option>' +
        App.store.get('clients', []).map(c => '<option value="' + U.attr(c.id) + '"' + (s.clientId === c.id ? ' selected' : '') + '>' + U.esc(c.name) + '</option>').join('') + '</select>' +
        '<select class="inp w-[140px]" data-model="ui.payMonth" data-change-action="pay.applyFilters"><option value="all">All months</option>' +
        months.map(mm => '<option value="' + mm + '"' + (s.month === mm ? ' selected' : '') + '>' + U.monthLabel(mm) + '</option>').join('') + '</select>' +
        '<select class="inp w-[140px]" data-model="ui.payMethod" data-change-action="pay.applyFilters"><option value="all">All methods</option>' +
        App.dict.paymentMethods.map(mm => '<option value="' + U.attr(mm) + '"' + (s.method === mm ? ' selected' : '') + '>' + U.esc(mm) + '</option>').join('') + '</select>' +
        '<button class="btn btn-lime btn-sm" data-action="pay.new"><i class="fa-solid fa-plus"></i> New invoice</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="pay.export"><i class="fa-solid fa-file-csv"></i> Export</button>' +
        '</div></div>' +

        ui.card(ui.table(['Invoice', 'Client / project', 'Amount', 'Paid', 'Balance', 'Status', 'Dates', ''], list.map(p => {
          const st = effectiveStatus(p);
          const cl = App.store.find('clients', p.clientId);
          return {
            cells: [
              '<span class="mono text-[10px]">' + U.esc(p.invoiceNo) + '</span>' + (p.recurring && p.recurring !== 'none' ? '<span class="tag ml-1">' + p.recurring + '</span>' : ''),
              '<div><p class="text-[11px] text-gray-200">' + U.esc(cl ? cl.name : '—') + '</p><p class="text-[9px] text-textMuted">' + U.esc(p.projectTitle) + '</p></div>',
              '<b>' + U.money(p.amount) + '</b>',
              U.money(p.amountPaid),
              '<span style="color:' + (balance(p) > 0 ? '#fcd34d' : '#cbfa31') + '">' + U.money(balance(p)) + '</span>',
              ui.badge(st, App.dict.paymentTones[st] || 'muted') + (p.method ? ' <span class="tag">' + U.esc(p.method) + '</span>' : ''),
              '<span class="text-[9px] text-textMuted">issued ' + U.fmtDate(p.issueDate) + '<br>due ' + U.fmtDate(p.dueDate) + (p.paidDate ? '<br>paid ' + U.fmtDate(p.paidDate) : '') + '</span>',
              '<div class="flex items-center gap-1 justify-end">' +
              (st !== 'paid' && st !== 'cancelled' ? '<button class="btn btn-lime btn-sm" data-action="pay.markPaid" data-arg="' + p.id + '" title="Mark paid"><i class="fa-solid fa-check"></i></button>' : '') +
              (st !== 'cancelled' ? '<button class="btn btn-ghost btn-sm" data-action="pay.remind" data-arg="' + p.id + '" title="Remind"><i class="fa-brands fa-whatsapp"></i></button>' : '') +
              '<button class="btn btn-ghost btn-sm" data-action="pay.print" data-arg="' + p.id + '" title="Invoice"><i class="fa-solid fa-print"></i></button>' +
              '<button class="btn btn-ghost btn-sm" data-action="pay.edit" data-arg="' + p.id + '" title="Edit"><i class="fa-solid fa-pen"></i></button>' +
              '</div>'
            ]
          };
        }), { empty: 'No invoices match this filter', emptySub: 'Create an invoice when a client confirms a project.', emptyIcon: 'fa-file-invoice-dollar' }));
    }
  };

  /* ---------------------------------- form ---------------------------------- */
  function payForm(id, presetClientId) {
    const p = id ? App.store.find('payments', id) : null;
    const clients = App.store.get('clients', []);
    const catalog = App.store.get('catalog', []);
    const inv = p ? p.invoiceNo : nextInvoiceNo();
    ui.modal({
      title: p ? 'Edit invoice ' + p.invoiceNo : 'New invoice · ' + inv,
      sub: 'Invoice numbers are generated automatically and never reused',
      size: 'lg',
      body: '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
        ui.field({ label: 'Invoice number', model: 'ui.pay.invoiceNo', value: inv }) +
        ui.field({ label: 'Client', model: 'ui.pay.clientId', value: p ? p.clientId : (presetClientId || (clients[0] || {}).id || ''), options: clients.map(c => [c.id, c.name]) }) +
        ui.field({ label: 'Service (from catalogue)', model: 'ui.pay.serviceId', value: p ? p.serviceId : '', options: [['', '— none / custom —']].concat(catalog.map(s => [s.id, s.name + ' · ' + U.money(s.price)])) }) +
        ui.field({ label: 'Project title', model: 'ui.pay.projectTitle', value: p ? p.projectTitle : '' }) +
        ui.field({ label: 'Amount', model: 'ui.pay.amount', value: p ? p.amount : 0, type: 'number' }) +
        ui.field({ label: 'Already paid', model: 'ui.pay.amountPaid', value: p ? p.amountPaid : 0, type: 'number' }) +
        ui.field({ label: 'Method', model: 'ui.pay.method', value: p ? p.method : 'Telebirr', options: App.dict.paymentMethods.map(x => [x, x]) }) +
        ui.field({ label: 'Status', model: 'ui.pay.status', value: p ? p.status : 'pending', options: App.dict.paymentStatuses.map(x => [x, U.title(x)]) }) +
        ui.field({ label: 'Issue date', model: 'ui.pay.issueDate', value: p ? p.issueDate : U.todayISO(), type: 'date' }) +
        ui.field({ label: 'Due date', model: 'ui.pay.dueDate', value: p ? p.dueDate : U.addDays(U.todayISO(), 7), type: 'date' }) +
        ui.field({ label: 'Paid on', model: 'ui.pay.paidDate', value: p ? p.paidDate : '', type: 'date' }) +
        ui.field({ label: 'Recurring', model: 'ui.pay.recurring', value: p ? p.recurring : 'none', options: [['none', 'One time'], ['monthly', 'Monthly retainer'], ['yearly', 'Yearly (hosting / domain)']] }) +
        ui.field({ label: 'Next renewal date', model: 'ui.pay.renewalDate', value: p ? p.renewalDate : '', type: 'date' }) +
        ui.field({ label: 'Accepted currency', model: 'ui.pay.currency', value: p ? p.currency : App.store.get('settings.company.currency', 'ETB'), options: App.dict.currencies.map(c => [c[0], c[0]]) }) +
        '</div>' +
        ui.field({ label: 'Notes / terms', model: 'ui.pay.notes', value: p ? p.notes : '50% advance, 50% on delivery.', rows: 2, wrapCls: 'mt-3' }),
      footer: (p ? '<button class="btn btn-danger" data-action="pay.delete" data-arg="' + p.id + '">Delete</button>' : '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>') +
        '<button class="btn btn-lime" data-action="pay.save" data-arg="' + (p ? p.id : '') + '"><i class="fa-solid fa-floppy-disk"></i> Save invoice</button>',
      onMount(root) {
        const svc = root.querySelector('[data-model="ui.pay.serviceId"]');
        if (svc) svc.addEventListener('change', () => {
          const s = App.store.find('catalog', svc.value);
