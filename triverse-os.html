            : ui.empty('No activity yet', '', 'fa-clock-rotate-left'))) +
        ui.card(ui.head('Top opportunities', '<button class="btn btn-ghost btn-sm" data-nav="pipeline">All</button>', 'Highest value open leads') +
          (function () {
            const top = U.sortBy(m.leads.filter(l => ['new', 'qualified', 'contacted', 'replied', 'interested', 'proposal'].indexOf(l.status) !== -1), l => Number(l.value) || 0, 'desc').slice(0, 5);
            if (!top.length) return ui.empty('No open leads', 'Discover businesses to get started', 'fa-bullseye');
            return '<div class="space-y-2">' + top.map(l =>
              '<div class="row-card p-2.5 flex items-center gap-3" data-action="lead-open" data-arg="' + l.id + '">' +
              ui.avatar(l.name, 'w-7 h-7 text-[10px]') +
              '<div class="min-w-0 flex-1"><p class="text-[11px] font-semibold truncate">' + U.esc(l.name) + '</p>' +
              '<p class="text-[9px] text-textMuted truncate">' + U.esc(l.category) + ' · ' + (l.website ? 'has website' : 'no website') + '</p></div>' +
              '<span class="text-[10px] font-bold text-limeAccent">' + U.money(l.value) + '</span></div>').join('') + '</div>';
          })()) +
        '</div></div>';
    }
  };

  function activityIcon(kind) {
    const map = {
      message: ['fa-paper-plane', 'blue'], reply: ['fa-reply', 'violet'], 'reply-negative': ['fa-thumbs-down', 'red'],
      win: ['fa-trophy', 'lime'], payment: ['fa-money-bill-wave', 'lime'], lead: ['fa-magnifying-glass', 'muted'],
      site: ['fa-wand-magic-sparkles', 'lime'], client: ['fa-user-plus', 'blue'], note: ['fa-note-sticky', 'muted']
    };
    const it = map[kind] || map.note;
    return '<span class="w-6 h-6 rounded-lg flex items-center justify-center ' + (ui.TONES[it[1]] || '') + '"><i class="fa-solid ' + it[0] + ' text-[9px]"></i></span>';
  }
})(window);

</script>
  <script>
/* ===== assets/js/views.discover.js ===== */
/* =============================================================================
   Triverse OS — Discover
   1 Search a business type in an Addis Ababa area → 2 filter → 3 open the deep
   info → 4 build their website → 5 send the message and triage the reply.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  const FILTERS = [
    ['all', 'All', 'fa-layer-group'],
    ['no-site', 'No website', 'fa-triangle-exclamation'],
    ['has-site', 'Has website', 'fa-globe'],
    ['whatsapp', 'WhatsApp', 'fa-whatsapp'],
    ['high-rated', '4.5★ and up', 'fa-star'],
    ['new', 'Not contacted', 'fa-bolt-lightning'],
    ['replied', 'Replied', 'fa-reply'],
    ['won', 'Won', 'fa-trophy']
  ];

  /* how far around the chosen area Google should look */
  const RADIUS = [[3, 'within 3 km'], [5, 'within 5 km'], [8, 'within 8 km'], [15, 'within 15 km'], [30, 'within 30 km']];

  /** escape text but make any URL in it clickable (Google tells you where to go) */
  function linkify(text) {
    return U.esc(String(text || '')).replace(/(https?:\/\/[^\s<)]+)/g,
      '<a class="link break-all" href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function q() {
    App.router.q.discover = App.router.q.discover || {
      typeKey: '', query: '', areaKey: 'addis-ababa', city: App.store.get('settings.google.city', 'Addis Ababa'),
      radiusKm: Number(App.store.get('settings.google.radiusKm', 8)) || 8, filter: 'all', sort: 'rating', search: '',
      queue: [], selected: [], note: '', error: '', pageToken: '', loading: false, at: '', cursor: -1, suggest: []
    };
    const s = App.router.q.discover;
    if (!s.areaKey) s.areaKey = 'addis-ababa';
    return s;
  }

  /* ------------------------------ the current list -------------------------- */
  /** queue order + text search + sort, before the chip filter */
  function queueLeads() {
    const s = q();
    const byId = {};
    App.store.get('leads', []).forEach(l => { byId[l.id] = l; });
    const ids = s.queue.length ? s.queue : App.store.get('leads', []).map(l => l.id);
    let list = ids.map(id => byId[id]).filter(Boolean);
    if (s.search) {
      list = list.filter(l => U.hit(l.name, s.search) || U.hit(l.category, s.search) || U.hit(l.address, s.search) || U.hit(l.phone, s.search));
    }
    const key = {
      rating: l => Number(l.rating) || 0, reviews: l => Number(l.reviews) || 0,
      value: l => Number(l.value) || 0, name: l => String(l.name).toLowerCase(),
      dist: l => Number(l.dist) || 999, status: l => l.status, updated: l => l.updatedAt || ''
    }[s.sort] || (l => 0);
    const dir = s.sort === 'name' || s.sort === 'dist' ? 'asc' : 'desc';
    return U.sortBy(list, key, dir);
  }

  function applyChip(list, filter) {
    if (filter === 'has-site') return list.filter(l => l.website);
    if (filter === 'no-site') return list.filter(l => !l.website);
    if (filter === 'whatsapp') return list.filter(l => l.whatsapp);
    if (filter === 'high-rated') return list.filter(l => Number(l.rating) >= 4.5);
    if (filter === 'new') return list.filter(l => ['new', 'qualified'].indexOf(l.status) !== -1);
    if (filter === 'replied') return list.filter(l => l.reply);
    if (filter === 'won') return list.filter(l => l.status === 'won');
    return list;
  }

  function leadsOfQueue() { const s = q(); return applyChip(queueLeads(), s.filter); }

  App.ui.leadBadges = function (lead) {
    const out = [];
    if (!lead.website) out.push(ui.badge('no website', 'amber'));
    else out.push(ui.badge('has website', 'muted'));
    if (lead.whatsapp) out.push(ui.badge('WhatsApp', 'lime'));
    if (lead.telegram) out.push(ui.badge('Telegram', 'blue'));
    if (Number(lead.rating) >= 4.5) out.push(ui.badge('★ ' + Number(lead.rating).toFixed(1), 'lime'));
    if (lead.clientId) out.push(ui.badge('client', 'lime'));
    if (lead.siteId) out.push(ui.badge('website built', 'violet'));
    return out.join(' ');
  };

  /* --------------------------- which step are we on ------------------------- */
  function stepIndex(leads) {
    const s = q();
    if (!leads.length) return 0;
    if (App.router.q.openLead) return 2;
    if (leads.some(l => (l.outreach || []).length)) return leads.some(l => l.siteId) ? 4 : 3;
    if (leads.some(l => l.siteId)) return 3;
    return 1;
  }

  /* --------------------------------- search -------------------------------- */
  /** "dental clinic" → the dentist preset, unknown text → a free-text search */
  function resolveType(raw) {
    const t = String(raw || '').trim().toLowerCase();
    if (!t) return { key: '', label: '' };
    const list = App.dict.businessTypes;
    const exact = list.filter(b => b[0] === t || b[1].toLowerCase() === t)[0];
    if (exact) return { key: exact[0], label: exact[1] };
    const partial = list.filter(b => b[0].indexOf(t) !== -1 || b[1].toLowerCase().indexOf(t) !== -1)[0];
    if (partial) return { key: partial[0], label: partial[1] };
    return { key: '', label: String(raw).trim() };
  }
  App.discoverResolveType = resolveType;

  function runSearch(extra) {
    const s = q();
    const more = Boolean(extra && extra.more);
    const box = document.getElementById('discover-results');
    const raw = String(App.store.get('ui.discoverType', '') || '').trim();
    const resolved = resolveType(raw);
    s.typeKey = resolved.key;
    s.query = resolved.label || raw;
    s.areaKey = App.store.get('ui.discoverArea', s.areaKey) || s.areaKey;
    s.radiusKm = Number(App.store.get('ui.discoverRadius', s.radiusKm || 8)) || 8;
    const area = App.dict.areaOf(s.areaKey);
    s.city = area && area.key !== 'addis-ababa' ? area.label + ', Addis Ababa' : 'Addis Ababa';
    if (area) {
      App.store.set('settings.google.centerLat', area.lat, { silent: true });
      App.store.set('settings.google.centerLng', area.lng, { silent: true });
    }
    App.store.set('settings.google.radiusKm', s.radiusKm, { silent: true });
    closeSuggest();
    if (!more && !s.typeKey && !s.query) {
      ui.toast('Type a business type first — dentist, restaurant, gym, hotel…', 'amber');
      return;
    }
    if (!App.providers.hasKey()) {
      s.loading = false;
      s.error = 'No Google Places API key saved. Open Settings → Google Maps and paste your key — the app then searches the real Maps record.';
      App.emit('state:changed', { path: 'search' });
      App.router.go('settings');
      ui.toast('Add your Google Places key first', 'amber');
      return;
    }
    /* Never block a search up front. A search that has been run before is served
       from the studio's own saved copy at no cost, so the wall only ever matters
       for a genuinely new search — and even then the app keeps working. */
    if (!more) { s.queue = []; s.pageToken = ''; s.at = ''; }
    s.loading = true; s.error = '';
    if (box) box.innerHTML = skeleton();
    const t = App.dict.typeOf(s.typeKey);
    App.providers.search({
      typeKey: s.typeKey, query: s.query || t.label, city: s.city,
      areaKey: s.areaKey, pageToken: more ? s.pageToken : '', radiusKm: s.radiusKm,
      fresh: Boolean(extra && extra.fresh)
    })
      .then(out => {
        const keys = {};
        out.leads.forEach(l => { keys[l.placeId || ('n:' + U.slug(l.name))] = true; });
        App.providers.ingest(out.leads, { refresh: true });
        const ids = App.store.get('leads', []).filter(l => keys[l.placeId || ('n:' + U.slug(l.name))]).map(l => l.id);
        s.queue = more ? U.uniq(s.queue.concat(ids)) : ids;
        s.pageToken = out.nextPageToken || '';
        s.note = out.note;
        s.error = out.failed ? out.note : '';
        s.fromCache = Boolean(out.fromCache);
        s.loading = false; s.at = U.now();
        App.log('lead', 'Searched “' + (s.query || App.dict.typeLabel(s.typeKey)) + '” in ' + s.city + ' — ' + ids.length + ' results (' + (out.fromCache ? 'saved copy' : 'Google Maps') + ')', '');
        App.emit('state:changed', { path: 'search' });
        if (!s.error) ui.toast(out.fromCache
          ? ids.length + ' businesses loaded from your own saved results — no daily allowance spent'
          : ids.length + ' businesses loaded from Google Maps', out.fromCache ? 'blue' : 'lime');
      })
      .catch(err => {
        s.loading = false; s.error = err.message; s.note = '';
        App.emit('state:changed', { path: 'search' });
        ui.toast(String(err.message).split('\n')[0], 'red');
      });
  }

  function skeleton() {
    return '<div class="space-y-2">' + [1, 2, 3, 4, 5].map(() =>
      '<div class="skeleton h-[64px]"></div>').join('') + '</div>';
  }

  /* ---------------------------------- map ----------------------------------- */
  /* A real Google map with a pin per result. If the Maps JavaScript API is not
     enabled for the saved key we keep the keyless Google embed, so a map is
     always on screen. */
  const MAP_LIB = { ok: false, promise: null, map: null, pins: [] };

  const DARK_MAP_STYLE = [
    { elementType: 'geometry', stylers: [{ color: '#15161c' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#8f95b2' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#15161c' }] },
    { featureType: 'poi', elementType: 'geometry', stylers: [{ color: '#1c1d24' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#242632' }] },
    { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#8f95b2' }] },
    { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#1c1d24' }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0f1015' }] },
    { featureType: 'administrative', elementType: 'geometry', stylers: [{ color: '#303342' }] }
  ];

  function currentArea() {
    const s = q();
    return App.dict.areaOf(App.store.get('ui.discoverArea', s.areaKey || 'addis-ababa')) || App.dict.areaOf('addis-ababa');
  }

  function mapsReady(key) {
    if (MAP_LIB.ok) return Promise.resolve(true);
    if (MAP_LIB.promise) return MAP_LIB.promise;
    MAP_LIB.promise = new Promise((resolve, reject) => {
      let done = false;
      const cb = '__triMapsReady';
      window[cb] = () => { done = true; MAP_LIB.ok = true; resolve(true); };
      const s = document.createElement('script');
      s.async = true;
      /* the marker library is what lets us use AdvancedMarkerElement instead of
         the deprecated google.maps.Marker */
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
        '&libraries=marker&loading=async&callback=' + cb;
      s.onerror = () => { if (!done) reject(new Error('the map script was blocked')); };
      setTimeout(() => { if (!done) reject(new Error('the map did not answer')); }, 9000);
      document.head.appendChild(s);
    });
    return MAP_LIB.promise;
  }

  /** draw (or redraw) the pins for the current result list */
  function drawPins(leads) {
    const box = document.getElementById('discover-map');
    if (!box || !MAP_LIB.ok || !window.google || !window.google.maps) return false;
    const area = currentArea();
    const pale = document.documentElement.getAttribute('data-theme') !== 'light';
    let host = document.getElementById('tri-map');
    if (!host) {
      box.innerHTML = '<div id="tri-map" style="width:100%;height:100%"></div>';
      MAP_LIB.map = null;
      host = document.getElementById('tri-map');
    }
    /*
     * google.maps.Marker is deprecated and logs a warning on every load. The
     * replacement, AdvancedMarkerElement, needs a map ID — and a map ID makes
     * Google ignore the inline `styles` array. So: dark mode is now painted by
     * a CSS filter on the map container (which works with a map ID) and the
     * markers are AdvancedMarkerElement. Marker is kept only as the fallback
     * for a library that loaded without the marker bundle.
     */
    const g = window.google.maps;
    const Advanced = g.marker && g.marker.AdvancedMarkerElement;
    if (!MAP_LIB.map) {
      const opts = {
        center: { lat: area.lat, lng: area.lng }, zoom: 13,
        mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
        backgroundColor: pale ? '#15161c' : '#f2f5f7'
      };
      if (Advanced) opts.mapId = 'DEMO_MAP_ID';
      else if (pale) opts.styles = DARK_MAP_STYLE;
      MAP_LIB.map = new g.Map(host, opts);
      host.classList.toggle('map-dark', Boolean(Advanced) && pale);
      MAP_LIB.pins = [];
    }
    MAP_LIB.pins.forEach(p => {
      if (p.setMap) p.setMap(null);
      if (p.remove) p.remove();
    });
    MAP_LIB.pins = [];
    const bounds = new g.LatLngBounds();
    let placed = 0;
    leads.forEach(l => {
      const lat = Number(l.lat), lng = Number(l.lng);
      if (!lat || !lng) return;
      let pin;
      if (Advanced) {
        const dot = document.createElement('div');
        dot.className = 'tri-pin' + (l.website ? ' has-site' : '');
        dot.title = l.name || '';
        pin = new Advanced({ position: { lat: lat, lng: lng }, map: MAP_LIB.map, title: l.name, content: dot });
        dot.addEventListener('click', () => openLead(l.id));
      } else {
        pin = new g.Marker({
          position: { lat: lat, lng: lng }, map: MAP_LIB.map, title: l.name,
          icon: {
            path: g.SymbolPath.CIRCLE, scale: 8,
            fillColor: l.website ? '#5A8679' : '#91C8B9', fillOpacity: 1,
            strokeColor: '#0F1015', strokeWeight: 2
          }
        });
        pin.addListener('click', () => openLead(l.id));
      }
      MAP_LIB.pins.push(pin);
      bounds.extend({ lat: lat, lng: lng });
      placed++;
    });
    if (placed > 1) MAP_LIB.map.fitBounds(bounds, 60);
    else if (!placed) MAP_LIB.map.setCenter({ lat: area.lat, lng: area.lng });
    return true;
  }

  function mapCard(leads) {
    const area = currentArea();
    const key = App.store.get('settings.google.apiKey', '');
    const embedQ = encodeURIComponent((q().query || App.dict.typeLabel(q().typeKey) || 'businesses') + ' ' + area.label + ' Addis Ababa Ethiopia');
    return '<div class="glass-card p-3.5 mb-5">' +
      '<div class="flex items-center justify-between gap-3 mb-3 flex-wrap">' +
      '<div class="flex items-center gap-2.5 min-w-0">' +
      '<span class="w-9 h-9 rounded-full bg-accentMint/10 text-accentMint flex items-center justify-center shrink-0"><i class="fa-solid fa-map-location-dot"></i></span>' +
      '<div class="min-w-0"><p class="text-xs font-semibold text-white truncate">' + U.esc(area.label) + '</p>' +
      '<p class="text-[10px] text-textMuted">' + leads.length + ' businesses on the map' +
      (q().query ? ' · “' + U.esc(q().query) + '”' : '') + '</p></div></div>' +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost btn-sm" data-action="discover.mapRefresh"><i class="fa-solid fa-rotate"></i> Refresh map</button>' +

  /* ------------------------------ type-ahead ------------------------------- */
  function buildSuggestions(text) {
    const t = String(text || '').trim().toLowerCase();
    const out = [];
    if (!t) return out;
    App.dict.businessTypes.forEach(bt => {
      if (bt[0].indexOf(t) !== -1 || bt[1].toLowerCase().indexOf(t) !== -1) {
        out.push({ label: bt[1], sub: 'Business type · typical deal ' + U.money(bt[5]), icon: bt[2], action: 'discover.pickType', arg: bt[0] });
      }
    });
    App.dict.areas.forEach(a => {
      const hay = (a[1] + ' ' + a[4]).toLowerCase();
      if (hay.indexOf(t) !== -1) out.push({ label: a[1], sub: 'Addis Ababa area · ' + a[4], icon: 'fa-location-dot', action: 'discover.pickArea', arg: a[0] });
    });
    App.store.get('leads', []).filter(l => U.hit(l.name, t)).slice(0, 4).forEach(l =>
      out.push({ label: l.name, sub: 'Saved business · ' + (l.areaLabel || l.city || ''), icon: 'fa-store', action: 'lead-open', arg: l.id }));
    if (!out.length || (out[0] && out[0].label.toLowerCase() !== t)) {
      out.push({ label: 'Search “' + text + '” as typed', sub: 'Live search on the map for exactly this text', icon: 'fa-magnifying-glass', action: 'discover.freeText', arg: text });
    }
    return out.slice(0, 8);
  }

  function renderSuggest() {
    const s = q();
    const box = document.getElementById('discover-suggest');
    if (!box) return;
    if (!s.suggest.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    box.innerHTML = s.suggest.map((x, i) =>
      '<button class="' + (i === s.cursor ? 'is-cursor' : '') + '" data-action="' + x.action + '" data-arg="' + U.attr(x.arg) + '" data-sug="' + i + '">' +
      '<span class="sug-ico">' + ui.icon(x.icon, '') + '</span>' +
      '<span class="min-w-0"><span class="block truncate">' + U.esc(x.label) + '</span>' +
      '<span class="block text-[9px] text-textMuted truncate">' + U.esc(x.sub) + '</span></span></button>').join('');
    box.classList.remove('hidden');
  }

  function closeSuggest() {
    const s = q();
    s.suggest = []; s.cursor = -1;
    const box = document.getElementById('discover-suggest');
    if (box) { box.classList.add('hidden'); box.innerHTML = ''; }
  }

  function onTypeKeydown(ev) {
    const s = q();
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (!s.suggest.length) s.suggest = buildSuggestions(App.store.get('ui.discoverType', ''));
      s.cursor = ev.key === 'ArrowDown'
        ? Math.min(s.cursor + 1, s.suggest.length - 1)
        : Math.max(s.cursor - 1, 0);
      renderSuggest();
      return;
    }
    if (ev.key === 'Escape') { closeSuggest(); ev.target.blur(); return; }
    if (ev.key === 'Enter') {
      ev.preventDefault();
      ev.stopPropagation();
      if (s.cursor >= 0 && s.suggest[s.cursor]) {
        const pick = s.suggest[s.cursor];
        const fn = App.actions[pick.action];
        if (fn) fn({ getAttribute: () => pick.arg });
        return;
      }
      runSearch();
    }
  }

  function bindHero() {
    const box = document.getElementById('discover-type');
    if (box) {
      box.addEventListener('input', U.debounce(() => {
        const s = q();
        s.suggest = buildSuggestions(box.value);
        s.cursor = -1;
        renderSuggest();
      }, 90));
      box.addEventListener('keydown', onTypeKeydown);
      box.addEventListener('blur', () => setTimeout(closeSuggest, 140));
    }
  }

  /* -------------------------------- drawer --------------------------------- */
  /* The business's own Google record — phone, website, hours, photos and the real
     reviews — is fetched the first time it is opened, then cached on the record. */
  const DETAILS = {};

  function openLead(id) {
    const lead = App.store.find('leads', id);
    if (!lead) { ui.toast('Business not found', 'red'); return; }
    App.router.q.openLead = id;
    renderDrawer();
    loadDetails(lead);
  }

  function loadDetails(lead, force) {
    const id = lead.id;
    if (lead.source !== 'google' || !lead.placeId) return;
    const st = DETAILS[id];
    if (!force && (st === 'loading' || st === 'done')) return;
    if (!force && lead.detailsAt && !lead.detailsError) { DETAILS[id] = 'done'; return; }
    DETAILS[id] = 'loading';
    if (App.router.q.openLead === id) renderDrawer();
    App.providers.details(lead.placeId).then(d => {
      DETAILS[id] = 'done';
      if (App.router.q.openLead === id) renderDrawer();
      if (force) ui.toast('Pulled ' + d.reviewsList.length + ' reviews and ' + d.photos.length + ' photos from Google', 'lime');
    }).catch(err => {
      DETAILS[id] = 'error:' + err.message;
      App.store.patch('leads', id, { detailsAt: U.now(), detailsError: err.message });
      if (App.router.q.openLead === id) renderDrawer();
    });
  }

  /* ---------------------------- website generator --------------------------- */
  function siteModal(leadId, preselectedTemplate) {

    App.router.q.gen = App.router.q.gen || {};
    const g = App.router.q.gen;
    if (g.leadId !== leadId || !g.mode) {
      g.leadId = leadId;
      // with nothing uploaded yet there is no design to clone, so start on template
      g.mode = App.samples.empty() ? 'template' : 'sample';
      g.sampleId = (App.samples.forBusiness(lead) || {}).id || '';
      g.templateId = preselectedTemplate || (App.store.get('templates')[0] || {}).id;
      g.sections = App.sitegen.sectionsFor(lead.businessType);
      g.credit = true;
      g.mapEmbed = false;
      g.ai = null;
      g.html = '';
      g.meta = null;
    }
    const templates = App.store.get('templates', []);
    const sampleList = App.samples.list();
    const activeSample = App.samples.find(g.sampleId) || App.samples.forBusiness(lead);
    const isSample = g.mode !== 'template';

    const sampleRow = s => '<button class="w-full text-left glass-soft rounded-xl p-2.5 border ' +

      '<p class="text-[9px] text-textMuted truncate">' + U.esc(s.blurb || s.category || '') + '</p></button>';

    ui.modal({
      title: 'Build the website for ' + lead.name,

      body:

        '<div>' +
        '<div class="btn-row mb-3">' +

        '<button class="btn btn-sm ' + (isSample ? 'btn-ghost' : 'btn-lime') + '" data-action="gen.mode" data-arg="template">Template</button>' +

            '<div class="btn-row mt-2"><button class="btn btn-ghost btn-sm" data-action="samples.library"><i class="fa-solid fa-folder-plus"></i> ' + (sampleList.length ? 'Add a design' : 'Upload a design') + '</button></div>'

              '<div class="flex items-center gap-2"><span class="w-6 h-6 rounded-md shrink-0" style="background:' + U.attr(t.accent) + '"></span>' +

  function buildPreview() {
    const g = App.router.q.gen;
    const lead = App.store.find('leads', g.leadId);
    if (!lead) return;
    const effectiveLead = Object.assign({}, lead, { businessType: App.store.get('ui.genType', lead.businessType) || lead.businessType });
    g.credit = App.store.get('ui.genCredit', g.credit) !== false;
    g.mapEmbed = App.store.get('ui.genMap', g.mapEmbed) === true;
    const useSample = g.mode !== 'template';
    const out = App.sitegen.build({
      lead: effectiveLead,
      sampleId: useSample ? (g.sampleId || ((App.samples.forBusiness(effectiveLead) || {}).id || '')) : undefined,
      preferSample: useSample,
      templateId: useSample ? undefined : g.templateId,
      options: { sections: g.sections, credit: g.credit, mapEmbed: g.mapEmbed, ai: g.ai }
    });
    g.html = out.html; g.meta = out.meta;
    if (out.meta && out.meta.sampleId) App.samples.bump(out.meta.sampleId);
    const box = document.getElementById('gen-preview');
    if (box) box.innerHTML = ui.previewFrame(g.html, 520);
    App.store.set('ui.genType', effectiveLead.businessType, { silent: true });
  }

  App.action('discover.filter', el => { q().filter = el.getAttribute('data-arg'); App.emit('state:changed', { path: 'filter' }); });
  App.action('discover.select', (el, ev) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    const s = q(), id = el.getAttribute('data-arg');
    const i = s.selected.indexOf(id);
    if (i === -1) s.selected.push(id); else s.selected.splice(i, 1);
    App.emit('state:changed', { path: 'select' });
  });
  App.action('discover.selectAll', () => {
    const s = q();
    const ids = leadsOfQueue().map(l => l.id);
    s.selected = s.selected.length === ids.length ? [] : ids;
    App.emit('state:changed', { path: 'selectAll' });
  });
  App.action('discover.reset', () => { const s = q(); s.queue = []; s.filter = 'all'; s.search = ''; s.note = ''; App.emit('state:changed', { path: 'reset' }); });
  App.action('discover.export', () => {
    const rows = leadsOfQueue().map(l => ({
      name: l.name, category: l.category, area: l.areaLabel || '', phone: l.phone, website: l.website,
      rating: l.rating, reviews: l.reviews, address: l.address, status: l.status,
      whatsapp: l.whatsapp ? 'yes' : 'no', email: l.email, maps: l.mapsUrl
    }));
    U.download('triverse-leads-' + U.todayISO() + '.csv', U.toCSV(rows), 'text/csv');
    ui.toast('Exported ' + rows.length + ' businesses', 'lime');
  });
  App.action('discover.import', () => {
    ui.modal({
      title: 'Import businesses from a CSV / JSON export',
      sub: 'Works with Outscraper, Apify, Instant Data Scraper or any sheet with name / phone / website columns',
      size: 'lg',
      body: ui.field({ label: 'Paste CSV or JSON (or pick a file below)', model: 'ui.importText', value: App.store.get('ui.importText', ''), rows: 9, placeholder: 'name,category,phone,website,rating,reviews,address\n…' }) +
        ui.field({ label: 'Business type for imported rows', model: 'ui.importType', value: 'auto', options: [['auto', 'Detect automatically']].concat(App.dict.businessTypes.map(t => [t[0], t[1]])) }) +
        '<input type="file" id="import-file" accept=".csv,.json,.txt" class="inp mt-2" />' +
        '<p class="text-[9px] text-textMuted mt-2">Run a search in any Maps scraper, export CSV, and drop it here. Duplicates (same place ID or name + address) are skipped automatically. Nothing leaves this computer.</p>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-lime" data-action="discover.importRun"><i class="fa-solid fa-file-import"></i> Import</button>',
      onMount(root) {
        const f = root.querySelector('#import-file');
        if (!f) return;
        f.addEventListener('change', () => {
          const file = f.files && f.files[0];
          if (!file) return;
          const r = new FileReader();
          r.onload = () => {
            App.store.set('ui.importText', String(r.result), { silent: true });
            const box = root.querySelector('textarea');
            if (box) box.value = String(r.result);
            ui.toast('Loaded ' + file.name + ' — now press Import', 'lime');
          };
          r.readAsText(file);
        });
      }
    });
  });
  App.action('discover.importRun', () => {
    try {
      const text = App.store.get('ui.importText', '');
      if (!text.trim()) { ui.toast('Paste or pick a file first', 'amber'); return; }
      const typeKey = App.store.get('ui.importType', 'auto');
      const parsed = App.providers.importText(text, { typeKey: typeKey, source: 'import' });
      if (!parsed.leads.length) { ui.toast('No usable rows found — check the column names', 'red'); return; }
      const res = App.providers.ingest(parsed.leads, { refresh: false });
      const s = q();
      s.queue = App.store.get('leads', []).filter(l => l.source === 'import' && l.createdAt).map(l => l.id).slice(0, 500);
      s.note = res.added + ' rows imported · ' + res.skipped + ' duplicates skipped';
      ui.closeModal();
      ui.toast(res.added + ' businesses imported', 'lime');
      App.emit('state:changed', { path: 'import' });
    } catch (e) { ui.toast('Import failed: ' + e.message, 'red'); }
  });

  /* ------------------------------ lead actions ----------------------------- */
  App.action('lead-open', el => App.router.go('discover', el.getAttribute('data-arg')));
  App.openLead = openLead;
  App.action('lead.saveMeta', el => {
    const id = el.getAttribute('data-arg');
    App.store.patch('leads', id, {
      status: App.store.get('ui.leadStatus', 'new'),
      value: Number(App.store.get('ui.leadValue', 0)) || 0,
      nextFollowUp: App.store.get('ui.leadFollow', ''),
      tags: String(App.store.get('ui.leadTags', '')).split(',').map(t => t.trim()).filter(Boolean)
    });
    ui.toast('Saved', 'lime');
  });
  App.action('lead.addNote', el => {
    const id = el.getAttribute('data-arg');
    const box = document.getElementById('lead-note');
    const text = box ? box.value.trim() : '';
    if (!text) { ui.toast('Write a note first', 'amber'); return; }
    const lead = App.store.find('leads', id);
    App.store.patch('leads', id, { notes: [{ id: U.uid('note'), at: U.now(), text: text }].concat(lead.notes || []).slice(0, 60) });
    if (box) box.value = '';
    ui.toast('Note added', 'lime');
  });
  App.action('lead.skip', el => { App.store.patch('leads', el.getAttribute('data-arg'), { status: 'skipped' }); App.actions['lead.next'](el); });
  App.action('lead.reject', el => {
    const id = el.getAttribute('data-arg');
    const lead = App.store.find('leads', id);
    ui.confirm({
      title: 'Mark as rejected?', tone: 'danger', confirmLabel: 'Reject',
      message: lead.name + ' will move to the rejected list and stop receiving follow-ups until you change the status back.',
      onConfirm() {
        App.store.patch('leads', id, { status: 'rejected', nextFollowUp: '', clientId: lead.clientId || '' });
        App.log('reply-negative', lead.name + ' marked as rejected', id);
        ui.toast('Moved to rejected — loading the next business', 'amber');
        App.router.go('discover');
        setTimeout(() => App.actions['lead.next']({ getAttribute: () => id }), 350);
      }
    });
  });
  App.action('lead.next', el => {
    const id = el.getAttribute('data-arg');
    const next = App.msg.nextLead(id, l => ['won', 'lost', 'rejected'].indexOf(l.status) === -1);
    if (!next) { ui.toast('That was the last business in this list', 'amber'); return; }
    ui.closeDrawer();
    App.router.go('discover', next);
  });
  App.action('lead.reply', el => App.openReply(el.getAttribute('data-arg')));
  App.action('lead.toClient', el => {
    const id = el.getAttribute('data-arg');
    const lead = App.store.find('leads', id);
    const existing = App.store.findBy('clients', c => c.sourceLeadId === id);
    if (existing) { ui.toast('Already a client record', 'amber'); App.router.go('clients', existing.id); return; }
    const client = App.store.add('clients', {
      name: lead.name, type: 'company', stage: 'prospect', industry: lead.businessType,
      contactName: '', designation: '', phone: lead.phone,
      whatsapp: lead.whatsapp ? lead.phone : '', telegram: lead.telegram, email: lead.email,
      address: lead.address, website: lead.website, services: App.msg.recommend(lead).ids,
      accountManager: App.store.get('settings.company.senderName', ''), source: lead.source, sourceLeadId: lead.id,
      startedAt: '', endedAt: '', health: 'warm', tags: ['from-discovery'], notes: 'Created from discovery.'
    });
    App.store.patch('leads', id, { clientId: client.id, status: lead.status === 'rejected' ? 'rejected' : (lead.status === 'won' ? 'won' : 'proposal') });
    App.log('client', lead.name + ' added to the client list', client.id);
    ui.closeDrawer();
    ui.toast('Client record created', 'lime');
    App.router.go('clients', client.id);
  });
  App.action('lead.copyMsg', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    const tpl = App.msg.defaultTemplate(lead);
    U.copy(App.msg.render(tpl, lead).body).then(() => ui.toast('Message copied', 'lime'));
  });
  App.action('lead.sendOne', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    const channel = el.getAttribute('data-extra') || 'whatsapp';
    const tpl = App.msg.defaultTemplate(lead);
    const msgText = App.msg.render(tpl, lead).body;
    App.msg.send({ lead: lead, channel: channel, templateId: tpl.id, body: msgText }).then(r => {
      ui.toast(r.via === 'api' ? 'Sent automatically through your API' : 'Chat opened with the message ready — press send', 'lime');
      App.emit('state:changed', { path: 'sent' });
    });
  });
  App.action('lead.generate', el => siteModal(el.getAttribute('data-arg')));

  /* ------------------- Google record & one-tap contact --------------------- */
  App.action('discover.more', () => runSearch({ more: true }));
  App.action('discover.check', () => {
    App.router.go('settings');
    setTimeout(() => { if (App.actions['settings.checkSources']) App.actions['settings.checkSources']({}); }, 450);
  });
  App.action('lead.call', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    const href = U.telHref(lead);
    if (!href) { ui.toast('No phone number on this Google record', 'amber'); return; }
    App.log('note', 'Called ' + lead.name + ' (' + (lead.phone || '') + ')', lead.id);
    location.href = href;
  });
  App.action('lead.openWebsite', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    if (!lead || !lead.website) { ui.toast('No website on this business’s Google record', 'amber'); return; }
    U.openUrl(/^https?:/i.test(lead.website) ? lead.website : 'https://' + lead.website);
  });
  App.action('lead.googleRefresh', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    if (!lead) return;
    delete DETAILS[lead.id];
    loadDetails(lead, true);
  });
  App.action('lead.copyDetails', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    if (!lead) return;
    const lines = [
      lead.name + (lead.category ? ' — ' + lead.category : ''),
      'Phone: ' + (lead.phone || '—') + (lead.intlPhone && lead.intlPhone !== lead.phone ? ' / ' + lead.intlPhone : ''),
      'Website: ' + (lead.website || 'none on Google'),
      'Rating: ' + (lead.rating ? Number(lead.rating).toFixed(1) + '★ from ' + U.num(lead.reviews || 0) + ' reviews' : 'not rated'),
      'Address: ' + (lead.address || '—'),
      'Hours: ' + (lead.hoursWeek && lead.hoursWeek.length ? lead.hoursWeek.join(' | ') : (lead.hours || '—')),
      'Google Maps: ' + (lead.mapsUrl || '—'),
      'Place ID: ' + (lead.placeId || '—')
    ];
    if ((lead.reviewsList || []).length) {
      lines.push('', 'Recent reviews:');
      lead.reviewsList.slice(0, 2).forEach(r => lines.push('- ' + r.author + ' (' + r.rating + '★, ' + r.when + '): ' + r.text));
    }
    U.copy(lines.join('\n')).then(() => ui.toast('Full business record copied', 'lime'));
  });

  /* ------------------------- generator modal actions ----------------------- */
  App.action('gen.template', el => { App.router.q.gen.templateId = el.getAttribute('data-arg'); buildPreview(); refreshGenModal(); });
  App.action('gen.sample', el => {
    const g = App.router.q.gen;
    g.sampleId = el.getAttribute('data-arg');
    g.mode = 'sample';
    g.html = '';
    buildPreview();
    refreshGenModal();
  });
  App.action('gen.mode', el => {
    const g = App.router.q.gen;
    g.mode = el.getAttribute('data-arg');
    g.html = '';
    buildPreview();
    refreshGenModal();
  });
  App.action('gen.section', el => {
    const g = App.router.q.gen, key = el.getAttribute('data-arg');
    const i = g.sections.indexOf(key);
    if (i === -1) g.sections.push(key); else g.sections.splice(i, 1);
    buildPreview(); refreshGenModal();
  });
  App.action('gen.build', () => { buildPreview(); ui.toast('Preview regenerated', 'lime'); refreshGenModal(); });
  App.action('gen.open', () => {
    const g = App.router.q.gen;
    if (!g.html) buildPreview();
    U.openHTML(g.html, 'preview');
  });
  App.action('gen.download', () => {
    const g = App.router.q.gen;
    if (!g.html) buildPreview();
    const lead = App.store.find('leads', g.leadId);
    U.download(U.slug(lead.name) + '-website.html', g.html, 'text/html');
    ui.toast('HTML downloaded — upload it to any hosting', 'lime');
  });
  App.action('gen.copy', () => {
    const g = App.router.q.gen;
    if (!g.html) buildPreview();
    U.copy(g.html).then(() => ui.toast('Full HTML copied to clipboard', 'lime'));
  });
  App.action('gen.save', () => {
    const g = App.router.q.gen;
    const lead = App.store.find('leads', g.leadId);
    if (!lead) return;
    const res = App.sitegen.save(lead, g.templateId, { sections: g.sections, credit: g.credit, ai: g.ai });
    ui.closeModal();
    ui.toast('Draft saved to Websites & templates', 'lime');
    App.emit('state:changed', { path: 'sites' });
    App.router.go('sites', res.site.id);
  });
  App.action('gen.sendDemo', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    const g = App.router.q.gen;
    if (!g.html) buildPreview();
    App.sitegen.save(lead, g.templateId, { sections: g.sections, credit: g.credit, ai: g.ai });
    const tpl = App.msg.templates().filter(t => t.id === 'msg_wa_first_nowebsite')[0] || App.msg.templates()[0];
    const body = App.msg.render(tpl, lead).body + '\n\n(P.S. I attached the concept — I can also make it live on a free subdomain this week.)';
    App.msg.send({ lead: lead, channel: 'whatsapp', templateId: tpl.id, body: body }).then(() => {
      ui.toast('Demo message sent — the draft is saved in Websites', 'lime');
      App.emit('state:changed', { path: 'sent' });
    });
  });

  function refreshGenModal() {
    const g = App.router.q.gen;
    const box = document.getElementById('gen-preview');
    if (box) box.innerHTML = ui.previewFrame(g.html, 520);
    document.querySelectorAll('[data-action="gen.template"]').forEach(btn => {
      const on = btn.getAttribute('data-arg') === g.templateId;
      btn.className = 'w-full text-left glass-soft rounded-xl p-2.5 border ' + (on ? 'border-limeAccent' : 'border-transparent');
    });
    document.querySelectorAll('[data-action="gen.section"]').forEach(btn => {
      const on = g.sections.indexOf(btn.getAttribute('data-arg')) !== -1;
      btn.className = 'chip ' + (on ? 'is-on' : '');
    });
  }

  /* --------------------------- batch send session --------------------------- */
  App.action('discover.bulkSend', () => {
    const s = q();
    if (!s.selected.length) { ui.toast('Tick businesses with the checkbox first (or “Select all shown”)', 'amber'); return; }
    App.router.q.batch = { ids: s.selected.slice(), index: 0, templateId: '', sent: 0 };
    openBatch();
  });

  function openBatch() {
    const b = App.router.q.batch;
    if (!b || b.index >= b.ids.length) {
      ui.closeDrawer();
      ui.toast('Batch finished — ' + (b ? b.sent : 0) + ' messages sent', 'lime');
      App.router.q.batch = null;
      const s = q(); s.selected = [];
      App.emit('state:changed', { path: 'batch-done' });
      return;
    }
    const lead = App.store.find('leads', b.ids[b.index]);
    if (!lead) { b.index++; openBatch(); return; }
    const tpl = App.msg.template(b.templateId) || App.msg.defaultTemplate(lead);
    b.templateId = tpl.id;
    const rendered = App.msg.render(tpl, lead).body;
    const channels = App.msg.channelsFor(lead);
    ui.drawer({
      title: 'Batch send · ' + (b.index + 1) + ' of ' + b.ids.length,
      sub: 'One tap per business — the chat opens with the message already written',
      body:
        '<div class="mb-3 flex items-center gap-3">' + ui.avatar(lead.name, 'w-10 h-10 text-xs') +
        '<div><p class="text-[12px] font-bold">' + U.esc(lead.name) + '</p><p class="text-[10px] text-textMuted">' + U.esc(lead.category) + ' · ' + U.esc(lead.phone || 'no phone') + '</p></div></div>' +
        ui.field({ label: 'Template', model: 'ui.batchTemplate', value: tpl.id, options: App.msg.templates().map(t => [t.id, App.dict.chanLabel(t.channel) + ' · ' + t.name]) }) +
        ui.card('<textarea class="inp" id="batch-body" rows="12">' + U.esc(rendered) + '</textarea>', 'mt-3') +
        '<p class="text-[9px] text-textMuted mt-2">Sent from this batch: ' + b.sent + '. Missing phone numbers are skipped automatically.</p>',
      footer: '<button class="btn btn-ghost btn-sm" data-action="batch.stop">Stop</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="batch.skip">Skip this one</button>' +
        channels.slice(0, 2).map(ch => '<button class="btn ' + (ch.key === 'whatsapp' ? 'btn-lime' : 'btn-ghost') + '" data-action="batch.send" data-extra="' + ch.key + '">' +
          App.dict.chanIcon(ch.key) + ' Send on ' + App.dict.chanLabel(ch.key) + '</button>').join('')
    });
  }

  App.action('batch.send', el => {
    const b = App.router.q.batch;
    const channel = el.getAttribute('data-extra') || 'whatsapp';
    const lead = App.store.find('leads', b.ids[b.index]);
    const box = document.getElementById('batch-body');
    const body = box ? box.value : '';
    const tpl = App.msg.template(App.store.get('ui.batchTemplate', b.templateId)) || App.msg.defaultTemplate(lead);
    App.msg.send({ lead: lead, channel: channel, templateId: tpl.id, body: body }).then(() => {
      b.sent++; b.index++;
      setTimeout(openBatch, 400);
    });
  });
  App.action('batch.skip', () => { const b = App.router.q.batch; b.index++; openBatch(); });
  App.action('batch.stop', () => { App.router.q.batch = null; ui.closeDrawer(); ui.toast('Batch stopped', 'amber'); });

  /* ------------------------- live refresh of the drawer --------------------- */
  App.on('state:changed', payload => {
    if (App.router.q.openLead && document.getElementById('drawer-root').innerHTML &&
      payload && ['discover', 'filter', 'select', 'selectAll'].indexOf(payload.path) === -1) {
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(document.activeElement.tagName) !== -1) return;
      renderDrawer();
    }
  });
})(window);

</script>
  <script>
/* ===== assets/js/views.outreach.js ===== */
/* =============================================================================
   Triverse OS — Outreach desk + Pipeline
   Compose personalised cold messages, send in one tap, triage replies
   (positive → work it, negative → jump to the next business) and move the
   deal through the pipeline board.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  function o() {
    App.router.q.outreach = App.router.q.outreach || { leadId: '', channel: 'whatsapp', templateId: '', mode: 'compose', dirty: {} };
    return App.router.q.outreach;
  }

  function hotList() {
    return U.sortBy(App.store.get('leads', []).filter(l => ['interested', 'replied'].indexOf(l.status) !== -1), l => l.lastReplyAt || l.updatedAt || '', 'desc');
  }
  function triageList() { return App.store.get('leads', []).filter(l => l.reply && l.status !== 'won' && l.status !== 'rejected' && (!l.reply.reasons || l.reply.reasons.length === 0)); }
  function dueList() { return App.store.get('leads', []).filter(l => l.nextFollowUp && l.nextFollowUp <= U.todayISO() && ['won', 'lost', 'rejected', 'skipped'].indexOf(l.status) === -1); }
  function stoppedList() { return App.store.get('leads', []).filter(l => l.status === 'rejected' || l.status === 'lost'); }

  function channelChips(lead, current) {
    return App.msg.channelsFor(lead).map(ch =>
      '<button class="chip ' + (ch.key === current ? 'is-on' : '') + '" data-action="outreach.channel" data-arg="' + ch.key + '">' +
      App.dict.chanIcon(ch.key, 'text-[9px]') + ' ' + U.esc(App.dict.chanLabel(ch.key)) + '</button>').join('');
  }

  function composer(lead) {
    if (!lead) {
      return ui.card(ui.empty('Pick a business to message', 'Choose one from the queues on the right, or open a lead from Discover.', 'fa-comment-dots',
        '<button class="btn btn-lime btn-sm" data-nav="discover">Go to Discover</button>'));
    }
    const s = o();
    const tpl = App.msg.template(s.templateId) || App.msg.defaultTemplate(lead);
    if (!s.templateId) s.templateId = tpl.id;
    const rendered = App.msg.render(tpl, lead);
    const body = s.body && s.dirty[lead.id + ':' + tpl.id] ? s.body : rendered.body;
    const rec = App.msg.recommend(lead);
    const channels = App.msg.channelsFor(lead);

    return ui.card(
      ui.head('Compose · ' + lead.name,
        '<div class="flex items-center gap-2">' +
        '<button class="btn btn-ghost btn-sm" data-action="outreach.openLead" data-arg="' + lead.id + '"><i class="fa-solid fa-circle-info"></i> Deep info</button>' +
        (App.router.q.batch ? ui.badge('batch mode', 'lime') : '') + '</div>',
        (lead.category || '') + ' · ' + (lead.website ? 'has a website' : 'no website on Google')) +

      '<div class="flex flex-wrap gap-1.5 mb-3">' + channelChips(lead, s.channel) +
      '<span class="text-[10px] text-textMuted self-center ml-1">' + (channels.length ? channels.length + ' reachable channels detected' : 'no contact details yet') + '</span></div>' +

      '<div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3">' +
      '<div><label class="lbl">Message template</label><select class="inp" data-model="ui.outreachTemplate" data-change-action="outreach.retemplate">' +
      App.msg.templates().map(t => '<option value="' + U.attr(t.id) + '"' + (t.id === tpl.id ? ' selected' : '') + '>' + U.esc(t.name) + ' · ' + U.esc(App.dict.chanLabel(t.channel)) + '</option>').join('') +
      '</select></div>' +
      '<div><label class="lbl">Recommended offer · ' + U.money(rec.total) + ' · ' + U.esc(rec.deliveryLabel) + '</label>' +
      '<div class="flex flex-wrap gap-1">' + rec.items.map(i => '<span class="tag">' + U.esc(i.name) + '</span>').join('') + '</div></div>' +
      '</div>' +

      (tpl.channel === 'email' ? ui.field({ label: 'Subject', model: 'ui.outreachSubject', value: rendered.subject, wrapCls: 'mb-2' }) : '') +
      '<textarea class="inp" id="outreach-body" rows="13" data-model="ui.outreachBody">' + U.esc(body) + '</textarea>' +

      '<div class="flex items-center justify-between gap-2 mt-2 flex-wrap">' +
      '<p class="text-[9px] text-textMuted">Merge fields are filled from the Google data — edit anything before sending.</p>' +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost btn-sm" data-action="outreach.retemplate"><i class="fa-solid fa-rotate"></i> Reset text</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="outreach.copy"><i class="fa-solid fa-copy"></i> Copy</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="outreach.preview"><i class="fa-solid fa-eye"></i> Variables</button>' +
      '</div></div>' +

      '<div class="btn-row mt-3">' +
      '<button class="btn btn-lime" data-action="outreach.send"><i class="fa-solid fa-paper-plane"></i> Send on ' + U.esc(App.dict.chanLabel(s.channel)) + '</button>' +

  App.views = App.views || {};
  App.views.outreach = {
    title: 'Outreach desk',
    sub: 'Compose → send → triage replies → close',
    icon: 'fa-comment-dots',
    render(el, params) {
      const s = o();
      if (params) s.leadId = params;
      const leads = App.store.get('leads', []);
      if (!s.leadId) {
        const hot = hotList()[0] || dueList()[0] || leads.filter(l => ['new', 'qualified'].indexOf(l.status) !== -1)[0];
        s.leadId = hot ? hot.id : '';
      }
      const lead = App.store.find('leads', s.leadId);
      const st = App.msg.stats(leads);
      const sentToday = U.sum(leads, l => (l.outreach || []).filter(x => x.at && x.at.slice(0, 10) === U.todayISO()).length);

      el.innerHTML =
        '<div class="four-col mb-4">' +
        ui.stat({ tag: 'Volume', label: 'Messages sent today', value: sentToday + ' / ' + App.store.get('settings.outreach.dailySendLimit', 40), badge: U.num(st.sent) + ' all time', sub: 'Keep it human — under 40 a day protects your number' }) +
        ui.stat({ tag: 'Replies', label: 'Reply rate', value: st.replyRate + '%', badge: st.replied + ' replies', tone: st.replyRate >= 20 ? 'lime' : 'amber', sub: 'Industry average for cold WhatsApp is 8–15%' }) +
        ui.stat({ tag: 'Quality', label: 'Positive replies', value: st.positive + '', badge: st.positiveRate + '% positive', sub: 'Negative/stop: ' + st.negative + ' → skipped automatically' }) +

        queueCard('Follow-ups due', 'No reply yet — nudge once, then stop', dueList(), { tone: 'amber', showDue: true, emptyText: 'No follow-ups due today', emptyIcon: 'fa-clock' }) +
        queueCard('Needs triage', 'Replies the filters could not judge — set the sentiment yourself', triageList(), { tone: 'violet', action: 'outreach.logReply', emptyText: 'Nothing to triage', emptyIcon: 'fa-scale-balanced' }) +

  /* --------------------------------- actions -------------------------------- */
  App.action('outreach.openCompose', el => {
    const s = o();
    s.leadId = el.getAttribute('data-arg') || s.leadId;

  App.action('outreach.openLead', el => App.router.go('discover', el.getAttribute('data-arg')));
  App.action('outreach.channel', el => { o().channel = el.getAttribute('data-arg'); App.emit('state:changed', { path: 'channel' }); });
  App.action('outreach.retemplate', () => {
    const s = o();
    const lead = App.store.find('leads', s.leadId);
    const tpl = App.msg.template(s.templateId) || App.msg.defaultTemplate(lead);
    if (lead && tpl) {
      const rendered = App.msg.render(tpl, lead);
      s.body = rendered.body;
      s.dirty[lead.id + ':' + tpl.id] = false;
      const box = document.getElementById('outreach-body');
      if (box) box.value = rendered.body;
      const subj = document.querySelector('[data-model="ui.outreachSubject"]');
      if (subj) subj.value = rendered.subject;
      ui.toast('Template re-applied', 'lime');
    }
  });

    const box = document.getElementById('outreach-body');
    U.copy(box ? box.value : '').then(() => ui.toast('Message copied', 'lime'));
  });
  App.action('outreach.preview', () => {
    const s = o();
    const lead = App.store.find('leads', s.leadId);
    const tpl = App.msg.template(s.templateId) || App.msg.defaultTemplate(lead);
    const v = App.msg.vars(lead);
    ui.modal({
      title: 'Merge fields used in this message',
      sub: lead.name, size: 'lg',
      body: '<div class="grid grid-cols-1 md:grid-cols-2 gap-x-4">' + Object.keys(v).map(k => ui.kv('{{' + k + '}}', U.esc(v[k]))).join('') + '</div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Close</button>'
    });
  });
  App.action('outreach.send', () => {
    const s = o();
    const lead = App.store.find('leads', s.leadId);
    if (!lead) { ui.toast('Pick a business first', 'amber'); return; }
    const box = document.getElementById('outreach-body');
    const body = box ? box.value : '';
    if (!body.trim()) { ui.toast('Message is empty', 'amber'); return; }
    const subj = document.querySelector('[data-model="ui.outreachSubject"]');
    const tpl = App.msg.template(App.store.get('ui.outreachTemplate', s.templateId)) || App.msg.defaultTemplate(lead);
    App.msg.send({ lead: lead, channel: s.channel, templateId: tpl.id, body: body, subject: subj ? subj.value : '' }).then(r => {
      ui.toast(r.via === 'api' ? 'Sent automatically ✓' : 'Opened ' + App.dict.chanLabel(s.channel) + ' with the message — press send there', 'lime');
      s.body = '';
      setTimeout(() => App.emit('state:changed', { path: 'sent' }), 150);
    });
  });
  App.action('outreach.logReply', el => App.openReply(el.getAttribute('data-arg') || o().leadId));
  App.action('outreach.toNext', () => {
    const s = o();
    const next = App.msg.nextLead(s.leadId, l => ['won', 'lost', 'rejected'].indexOf(l.status) === -1 && l.id !== s.leadId);
    if (!next) { ui.toast('No other lead in this queue', 'amber'); return; }

    App.emit('state:changed', { path: 'next' });

  /* ------------------------------ reply triage ------------------------------ */
  function replyModal(leadId) {
    const lead = App.store.find('leads', leadId);
    if (!lead) { ui.toast('Business not found', 'red'); return; }
    const t = App.dict.typeOf(lead.businessType);
    ui.modal({
      title: 'Log reply from ' + lead.name,
      sub: 'Paste or type what they answered — the system reads it and moves the deal automatically',
      size: 'lg',
      body:
        '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
        '<div>' +
        ui.field({ label: 'Their reply', model: 'ui.replyText', value: '', rows: 6, placeholder: 'e.g. "Yes please send the demo and price"' }) +
        '<div class="flex items-center gap-2 mt-1">' +
        '<button class="btn btn-ghost btn-sm" data-action="reply.classify"><i class="fa-solid fa-wand-magic-sparkles"></i> Read sentiment</button>' +
        '<span class="text-[9px] text-textMuted">Automatic analysis runs on save too</span></div>' +
        '<div id="reply-verdict" class="mt-3"></div>' +
        '</div>' +
        '<div>' +
        ui.card(ui.head('Suggested replies', ui.badge('after a positive reply', 'lime'), 'One tap: loads the template, copies it and opens the chat') +
          '<div class="space-y-2">' +
          App.msg.templates().filter(x => ['proposal', 'followup'].indexOf(x.stage) !== -1).slice(0, 2).map(x =>
            '<button class="w-full text-left bg-field border border-line hover:border-limeAccent/50 rounded-lg p-2" data-action="reply.useTemplate" data-arg="' + x.id + '">' +
            '<p class="text-[10px] font-semibold text-limeAccent">' + U.esc(x.name) + '</p>' +
            '<p class="text-[9px] text-textMuted line-clamp-2">' + U.esc(App.msg.render(x, lead).body.slice(0, 130)) + '…</p></button>').join('') +
          '</div>') +
        ui.card(ui.head('What happens on save') +
          '<ul class="ticks">' +
          '<li><b>Positive</b> → status “interested”, appears in the Hot list, price proposal suggested</li>' +
          '<li><b>Negative</b> → status “rejected”, added to do-not-chase, and the next lead loads automatically</li>' +
          '<li><b>Unclear</b> → kept in “needs triage” for you to decide</li>' +
          '</ul>', 'mt-3') +
        '</div></div>',
      footer: '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-ghost" data-action="reply.markNegative" data-arg="' + leadId + '"><i class="fa-solid fa-thumbs-down"></i> Save as negative</button>' +
        '<button class="btn btn-lime" data-action="reply.save" data-arg="' + leadId + '"><i class="fa-solid fa-check"></i> Save reply</button>',
      onMount(root) {
        const ta = root.querySelector('textarea');
        if (ta) { ta.focus(); }
      }
    });
  }
  App.openReply = function (leadId) {
    const s = o();
    s.leadId = leadId; s.mode = 'reply';
    if (App.router.current().route !== 'outreach') App.router.go('outreach', leadId);
    else replyModal(leadId);
  };

  App.action('reply.classify', () => {
    const text = App.store.get('ui.replyText', '');
    const res = App.msg.classify(text);
    const box = document.getElementById('reply-verdict');
    if (box) box.innerHTML = verdictHtml(res);
  });
  App.action('reply.useTemplate', el => {
    const lead = App.store.find('leads', o().leadId);
    const tpl = App.msg.template(el.getAttribute('data-arg'));
    const text = App.msg.render(tpl, lead).body;
    ui.closeModal();
    const s = o();
    s.templateId = tpl.id; s.channel = tpl.channel; s.body = text;
    if (App.router.current().route === 'outreach') App.emit('state:changed', { path: 'useTemplate' });
    else App.router.go('outreach', lead.id);
    U.copy(text);
    ui.toast('Template ready and copied', 'lime');
  });
  App.action('reply.save', el => {
    const id = el.getAttribute('data-arg');
    const text = App.store.get('ui.replyText', '');
    if (!String(text).trim()) { ui.toast('Paste their reply first', 'amber'); return; }
    commitReply(id, text);
  });
  App.action('reply.markNegative', el => commitReply(el.getAttribute('data-arg'), App.store.get('ui.replyText', '') || 'Not interested.'));

  function commitReply(id, text) {
    const res = App.msg.recordReply(id, text, o().channel);
    if (!res) { ui.toast('Could not save', 'red'); return; }
    ui.closeModal();
    const lead = res.lead;
    if (res.sentiment === 'negative') {
      ui.toast('Negative reply recorded — moved to do-not-chase', 'red');
      if (res.nextLeadId) {
        ui.confirm({
          title: 'Load the next business?', confirmLabel: 'Next lead', tone: 'lime',
          message: res.nextLeadId ? (App.store.find('leads', res.nextLeadId) || {}).name + ' is next in this queue.' : '',
          onConfirm() { const s = o(); s.leadId = res.nextLeadId; s.templateId = ''; s.body = ''; App.emit('state:changed', { path: 'next' }); }
        });
      }
      App.emit('state:changed', { path: 'replied' });
      return;
    }
    if (res.sentiment === 'positive') {
      ui.toast(res.wantsSite
        ? 'Positive reply — moved to the Interested list. Send the price proposal.'
        : 'Positive reply — moved to the Interested list. Ask one clarifying question before quoting.', 'lime');
      const tpl = App.msg.templates().filter(t => t.id === 'msg_wa_proposal')[0];
      if (tpl) {
        const text = App.msg.render(tpl, lead).body;
        const s = o();
        s.leadId = lead.id; s.templateId = tpl.id; s.channel = 'whatsapp'; s.body = text;
      }
      App.emit('state:changed', { path: 'replied' });
      return;
    }
    ui.toast('Reply saved — kept in needs triage', 'amber');
    App.emit('state:changed', { path: 'replied' });
  }

    const tone = res.sentiment === 'positive' ? 'lime' : res.sentiment === 'negative' ? 'red' : 'amber';

      '<p class="text-[10px] mt-1">Matched: ' + U.esc(res.reasons.join(', ') || 'nothing recognisable') + '</p>' +
      '<p class="text-[10px] mt-1">' + (res.wantsSite ? 'They mentioned a website / software need → send the proposal.' : 'Ask one clarifying question before quoting.') + '</p></div>';

      const wonThisMonth = leads.filter(l => l.status === 'won');

      const reachable = leads.filter(l => (l.outreach || []).length || l.reply).length;
      const wonValue = U.sum(wonThisMonth, l => Number(l.value) || 0);
      const barTotal = Math.max(1, U.sum(stages, s => stageOf(s).count));

      el2.push(

        '</div></div>'
      );

        '<div class="glass-soft rounded-2xl p-5 mb-5">' +
        '<div class="flex items-end justify-between gap-3 mb-4">' +
        '<div><p class="text-[12px] font-semibold">Stage flow</p>' +

        '<div class="flex flex-wrap gap-x-5 gap-y-2 mt-4">' + stages.map(s => {

        '</div>'

          (rows.length ? '<div class="overflow-x-auto -mx-1 px-1"><table class="tbl min-w-[720px]">' +
            '<thead><tr><th>Business</th><th>Stage</th><th>Value</th><th>Site</th><th>Reached</th><th>Next follow-up</th><th class="text-right">Move</th></tr></thead><tbody>' +

                '<td class="text-[10px] text-textMuted whitespace-nowrap">' + (reached ? reached + ' sent' : 'not yet') +

              '<button class="btn btn-lime btn-sm" data-nav="discover">Find businesses</button>')))

      /* ---- money and follow-ups side by side ---- */
      el2.push('<div class="two-col mt-5">' +
        ui.card(ui.head('Value by stage', ui.badge('ETB', 'lime'), 'Where the money is actually sitting right now') +
          '<div class="space-y-3">' + stages.map(s => {
            const st = stageOf(s);
            const pct = totalValue ? Math.round((st.value / totalValue) * 100) : 0;
            return '<div>' +
              '<div class="flex items-center justify-between text-[10px] mb-1"><span>' + U.title(s) + '</span>' +
              '<span class="text-textMuted">' + U.money(st.value) + '</span></div>' +
              '<div class="h-2 rounded-full bg-track overflow-hidden">' +
              '<div class="h-full fill fill-' + (App.dict.leadTones[s] || 'muted') + '" style="width:' + U.clamp(pct, st.value ? 3 : 0, 100) + '%;transition:width .5s cubic-bezier(.22,.9,.28,1)"></div>' +
              '</div></div>';
          }).join('') + '</div>') +
        ui.card(ui.head('Next calls to make', '<button class="btn btn-ghost btn-sm" data-action="pipe.autoFollow">Auto-schedule</button>', 'Rejected leads are never contacted again — they wait 12 months') +
          (dueList().length ? '<div class="space-y-2">' + dueList().slice(0, 8).map(l =>
            '<div class="row-card p-3 flex items-center gap-3" data-action="pipe.open" data-arg="' + l.id + '">' +
            ui.avatar(l.name, 'w-7 h-7 text-[10px]') +
            '<div class="min-w-0 flex-1"><p class="text-[11px] font-semibold truncate">' + U.esc(l.name) + '</p>' +
            '<p class="text-[9px] text-textMuted">' + U.esc(App.dict.chanLabel('whatsapp')) + ' · due ' + U.fmtDate(l.nextFollowUp) + '</p></div>' +
            '<button class="btn btn-lime btn-sm" data-action="outreach.openCompose" data-arg="' + l.id + '"><i class="fa-solid fa-comment-dots"></i></button></div>'
          ).join('') + '</div>'
            : ui.empty('Nothing due today', 'Interested leads get a follow-up in ' + App.store.get('settings.outreach.followUpDays', 3) + ' days, then one more', 'fa-mug-hot'))) +
        '</div>');

      return el2.join('');
    }
  }

  App.action('pipe.filter', el => {
    const stage = el.getAttribute('data-arg');
    App.router.q.pipeline = App.router.q.pipeline || {};
    App.router.q.pipeline.stage = stage === 'all' ? '' : stage;
    if (App.refresh) App.refresh();
  });


  App.action('pipe.open', el => App.router.go('discover', el.getAttribute('data-arg')));
  App.action('pipe.advance', el => {
    const id = el.getAttribute('data-arg');
    const lead = App.store.find('leads', id);
    const i = App.dict.pipelineStages.indexOf(lead.status);
    const next = App.dict.pipelineStages[Math.min(i + 1, App.dict.pipelineStages.length - 1)];
    move(id, next);
  });
  App.action('pipe.back', el => {
    const lead = App.store.find('leads', el.getAttribute('data-arg'));
    const i = App.dict.pipelineStages.indexOf(lead.status);
    move(lead.id, App.dict.pipelineStages[Math.max(i - 1, 0)]);
  });
  App.action('pipe.autoFollow', () => {
    const days = App.store.get('settings.outreach.followUpDays', 3);
    const days2 = App.store.get('settings.outreach.secondFollowUpDays', 7);
    let n = 0;
    App.store.get('leads', []).forEach(l => {
      if (['won', 'lost', 'rejected', 'skipped'].indexOf(l.status) !== -1) return;
      if (l.nextFollowUp) return;
      const sent = (l.outreach || []).length;
      const at = sent === 0 ? U.addDays(U.todayISO(), 0) : U.addDays(U.todayISO(), sent === 1 ? days : days2);
      App.store.patch('leads', l.id, { nextFollowUp: at }); n++;
    });
    ui.toast(n + ' follow-up dates scheduled', 'lime');
  });

  function move(id, status) {
    const lead = App.store.find('leads', id);
    const patch = { status: status };
    if (status === 'won') {
      patch.nextFollowUp = '';
      if (!lead.clientId) {
        const client = App.store.add('clients', {
          name: lead.name, type: 'company', stage: 'active', industry: lead.businessType,
          contactName: '', designation: '', phone: lead.phone, whatsapp: lead.whatsapp ? lead.phone : '',
          telegram: lead.telegram, email: lead.email, address: lead.address, website: lead.website,
          services: App.msg.recommend(lead).ids, accountManager: App.store.get('settings.company.senderName', ''),
          source: lead.source, sourceLeadId: lead.id, startedAt: U.todayISO(), endedAt: '', health: 'excellent',
          tags: ['from-discovery'], notes: 'Converted from a cold lead.'
        });
        patch.clientId = client.id;
        App.log('win', lead.name + ' converted to an active client', client.id);
      }
    }
    if (status === 'rejected' || status === 'lost') patch.nextFollowUp = '';
    App.store.patch('leads', id, patch);
    ui.toast(lead.name + ' → ' + U.title(status), status === 'won' ? 'lime' : 'muted');
  }

  /* data-model change hook for selects with data-change-action */
  App.on('field:changed', payload => {
    if (payload && payload.path === 'ui.outreachTemplate') {
      const s = o();
      s.templateId = payload.value;
      s.dirty[s.leadId + ':' + payload.value] = false;
      App.actions['outreach.retemplate']();
    }
  });
})(window);

</script>
  <script>
/* ===== assets/js/views.clients.js ===== */
/* =============================================================================
   Triverse OS — Clients (CRM) + Service catalogue
   Worked / current / paused / past / rejected companies, their contacts,
   projects, service history, money and linked websites.
   ========================================================================== */
(function (global) {
  'use strict';

  const App = global.App;
  const U = App.util;
  const ui = App.ui;

  function q() {
    App.router.q.clients = App.router.q.clients || { stage: 'all', search: '', industry: 'all', sort: 'value' };
    return App.router.q.clients;
  }

  function servicesOf(client) {
    const catalog = App.store.get('catalog', []);
    return (client.services || []).map(id => catalog.filter(s => s.id === id)[0]).filter(Boolean);
  }

  App.clientMoney = function (clientId) {
    const rows = App.store.get('payments', []).filter(p => p.clientId === clientId);
    const paid = U.sum(rows.filter(p => ['paid', 'partial'].indexOf(p.status) !== -1), p => Number(p.amountPaid) || (p.status === 'paid' ? Number(p.amount) : 0));
    const due = U.sum(rows.filter(p => ['pending', 'partial', 'overdue'].indexOf(p.status) !== -1), p => (Number(p.amount) || 0) - (Number(p.amountPaid) || 0));
    const overdue = U.sum(rows.filter(p => p.status === 'overdue'), p => (Number(p.amount) || 0) - (Number(p.amountPaid) || 0));
    const retainer = U.sum(rows.filter(p => p.recurring === 'monthly' && p.status === 'paid'), p => Number(p.amount) || 0);
    return { rows: rows, paid: paid, due: due, overdue: overdue, retainer: retainer, contracts: U.sum(rows, p => Number(p.amount) || 0) };
  };

  function filtered() {
    const s = q();
    let list = App.store.get('clients', []).slice();
    if (s.stage !== 'all') list = list.filter(c => c.stage === s.stage);
    if (s.industry !== 'all') list = list.filter(c => c.industry === s.industry);
    if (s.search) list = list.filter(c => U.hit(c.name, s.search) || U.hit(c.contactName, s.search) || U.hit(c.phone, s.search) || U.hit(c.email, s.search) || U.hit(c.industry, s.search));
    const key = {
      value: c => App.clientMoney(c.id).contracts,
      name: c => String(c.name).toLowerCase(),
      recent: c => c.updatedAt || '',
      stage: c => App.dict.clientStages.indexOf(c.stage)
    }[s.sort] || (c => 0);
    return U.sortBy(list, key, s.sort === 'name' || s.sort === 'stage' ? 'asc' : 'desc');
  }

  function clientRow(c) {
    const money = App.clientMoney(c.id);
    const sites = App.store.get('sites', []).filter(s => s.clientId === c.id);
    return '<div class="row-card p-3 grid grid-cols-1 md:grid-cols-[2fr_1.4fr_1fr_auto] gap-3 items-center" data-action="client.open" data-arg="' + c.id + '">' +
      '<div class="flex items-center gap-3 min-w-0">' + ui.avatar(c.name, 'w-9 h-9 text-[11px]') +
      '<div class="min-w-0"><p class="text-[12px] font-bold text-white truncate">' + U.esc(c.name) + '</p>' +
      '<p class="text-[9px] text-textMuted truncate">' + U.esc(c.contactName || '—') + (c.designation ? ' · ' + U.esc(c.designation) : '') + ' · ' + U.esc(App.dict.typeLabel(c.industry)) + '</p></div></div>' +
      '<div class="min-w-0"><p class="text-[10px] text-gray-300 truncate">' + U.esc(c.phone || 'no phone') + '</p>' +
      '<p class="text-[9px] text-textMuted truncate">' + U.esc(c.email || (c.whatsapp ? 'WhatsApp ' + c.whatsapp : 'no email')) + '</p></div>' +
      '<div><div class="flex items-center gap-1.5 flex-wrap">' + ui.badge(c.stage, App.dict.clientTones[c.stage]) +
      (c.health ? '<span class="tag">' + U.esc(c.health) + '</span>' : '') +
      (sites.length ? '<span class="tag">' + sites.length + ' site' + (sites.length > 1 ? 's' : '') + '</span>' : '') +
      (money.overdue ? ui.badge(U.money(money.overdue) + ' overdue', 'red') : '') + '</div>' +
      '<p class="text-[9px] text-textMuted mt-1">Paid ' + U.money(money.paid) + ' · due ' + U.money(money.due) + ' · ' + (c.services || []).length + ' services</p></div>' +
      '<div class="flex items-center gap-1 justify-end">' +
      '<button class="btn btn-ghost btn-sm" data-action="client.compose" data-arg="' + c.id + '" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>' +
      '<button class="btn btn-ghost btn-sm" data-action="pay.new" data-arg="' + c.id + '" title="Invoice"><i class="fa-solid fa-file-invoice-dollar"></i></button>' +
      '<i class="fa-solid fa-chevron-right text-[10px] text-textMuted"></i></div></div>';
  }

  App.views = App.views || {};
  App.views.clients = {
    title: 'Clients & companies',
    sub: 'Current, past and rejected companies with full history',
    icon: 'fa-border-all',
    render(el, params) {
      const m = App.metrics();
      const list = filtered();
      const s = q();
      const industries = U.uniq(App.store.get('clients', []).map(c => c.industry).filter(Boolean));
      const mrr = U.sum(m.clients.filter(c => c.stage === 'active'), c => App.clientMoney(c.id).retainer);

      el.innerHTML =
        '<div class="four-col mb-4">' +
        ui.stat({ tag: 'Active', label: 'Working clients', value: m.activeClients + '', badge: U.money(mrr) + ' retainers/mo', sub: 'Prospects: ' + m.prospectClients + ' · paused: ' + m.clients.filter(c => c.stage === 'paused').length }) +
        ui.stat({ tag: 'Completed', label: 'Past clients', value: m.pastClients + '', badge: 'references', tone: 'muted', sub: 'Great for portfolio and referrals' }) +
        ui.stat({ tag: 'Declined', label: 'Rejected companies', value: m.rejectedClients + '', badge: 'do not chase', tone: 'red', sub: 'Revisit list — 12 month cycle' }) +
        ui.stat({ tag: 'Lifetime', label: 'Contracted value', value: U.money(U.sum(m.clients, c => App.clientMoney(c.id).contracts)), badge: U.money(m.collected) + ' collected', sub: 'Outstanding ' + U.money(m.outstanding) }) +
        '</div>' +

        '<div class="flex items-center justify-between gap-3 flex-wrap mb-3">' +
        '<div class="flex flex-wrap gap-1.5">' +
        ui.chip('All (' + m.clients.length + ')', s.stage === 'all', 'client.filter', 'all') +
        App.dict.clientStages.map(st => ui.chip(U.title(st) + ' (' + m.clients.filter(c => c.stage === st).length + ')', s.stage === st, 'client.filter', st)).join('') +
        '</div>' +
        '<div class="btn-row">' +
        '<input class="inp w-[170px]" data-model="ui.clientSearch" data-change-action="client.applyFilters" data-enter="client.applyFilters" value="' + U.attr(s.search) + '" placeholder="Search clients…" />' +
        '<select class="inp w-[160px]" data-model="ui.clientIndustry" data-change-action="client.applyFilters">' + ['all'].concat(industries).map(i =>
          '<option value="' + U.attr(i) + '"' + (s.industry === i ? ' selected' : '') + '>' + (i === 'all' ? 'All industries' : U.esc(App.dict.typeLabel(i))) + '</option>').join('') + '</select>' +
        '<select class="inp w-[150px]" data-model="ui.clientSort" data-change-action="client.applyFilters">' + [['value', 'Biggest first'], ['recent', 'Recently updated'], ['name', 'A → Z'], ['stage', 'By stage']].map(o =>
          '<option value="' + o[0] + '"' + (s.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
        '<button class="btn btn-lime btn-sm" data-action="client.new"><i class="fa-solid fa-user-plus"></i> Add client</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="client.export"><i class="fa-solid fa-file-csv"></i> Export</button>' +
        '</div></div>' +

        '<div class="space-y-2">' + (list.length ? list.map(clientRow).join('') : ui.empty('No clients match this filter', 'Add a client manually, or convert a lead from Discover with one tap.', 'fa-users')) + '</div>';

      if (params) openClient(params);
    }
  };

  /* -------------------------------- drawer --------------------------------- */
  function openClient(id) {
    const c = App.store.find('clients', id);
    if (!c) return;
    App.router.q.openClient = id;
    const money = App.clientMoney(id);
    const svc = servicesOf(c);
    const sites = App.store.get('sites', []).filter(s => s.clientId === id);
    const payments = money.rows;
    const lead = c.sourceLeadId ? App.store.find('leads', c.sourceLeadId) : null;

    ui.drawer({
      title: c.name,
      sub: App.dict.typeLabel(c.industry) + ' · ' + U.title(c.stage) + (c.startedAt ? ' since ' + U.fmtDate(c.startedAt) : ''),
      body:
        '<div class="flex items-center gap-2 flex-wrap mb-3">' + ui.badge(c.stage, App.dict.clientTones[c.stage]) +
        (c.health ? '<span class="tag">health: ' + U.esc(c.health) + '</span>' : '') +
        (c.tags || []).map(t => '<span class="tag">' + U.esc(t) + '</span>').join('') +
        (c.website ? ui.link(c.website, 'website', 'link text-[10px]') : ui.badge('no website', 'amber')) + '</div>' +

        '<div class="btn-row mb-4">' +
        (c.whatsapp || c.phone ? '<button class="btn btn-lime btn-sm" data-action="client.compose" data-arg="' + c.id + '"><i class="fa-brands fa-whatsapp"></i> Message</button>' : '') +
        (c.phone ? '<a class="btn btn-ghost btn-sm" href="tel:' + U.attr(c.phone) + '"><i class="fa-solid fa-phone"></i> Call</a>' : '') +
        (c.email ? '<a class="btn btn-ghost btn-sm" href="mailto:' + U.attr(c.email) + '"><i class="fa-solid fa-envelope"></i> Email</a>' : '') +
        '<button class="btn btn-ghost btn-sm" data-action="pay.new" data-arg="' + c.id + '"><i class="fa-solid fa-file-invoice-dollar"></i> New invoice</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="client.generate" data-arg="' + c.id + '"><i class="fa-solid fa-wand-magic-sparkles"></i> Build / rebuild website</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="client.edit" data-arg="' + c.id + '"><i class="fa-solid fa-pen"></i> Edit</button>' +
        '</div>' +

        ui.card(ui.head('Company & contact') +
          ui.kv('Contact person', U.esc(c.contactName || '—')) +
          ui.kv('Designation', U.esc(c.designation || '—')) +
          ui.kv('Phone', c.phone ? '<a class="link" href="tel:' + U.attr(c.phone) + '">' + U.esc(c.phone) + '</a>' : '—') +
          ui.kv('WhatsApp', U.esc(c.whatsapp || '—')) +
          ui.kv('Telegram', U.esc(c.telegram || '—')) +
          ui.kv('Email', c.email ? '<a class="link" href="mailto:' + U.attr(c.email) + '">' + U.esc(c.email) + '</a>' : '—') +
          ui.kv('Address', U.esc(c.address || '—')) +
          ui.kv('Account manager', U.esc(c.accountManager || '—')) +
          ui.kv('Source', U.esc(c.source || '—') + (lead ? ' · ' + ui.link('#/discover/' + lead.id, 'view original lead', 'link') : '')) +
          ui.kv('Timeline', (c.startedAt ? 'started ' + U.fmtDate(c.startedAt) : 'not started') + (c.endedAt ? ' · ended ' + U.fmtDate(c.endedAt) : '')), 'mb-4') +

        ui.card(ui.head('Money', ui.badge(U.money(money.paid) + ' received', 'lime')) +
          ui.kv('Contracted', U.money(money.contracts)) +
          ui.kv('Received', U.money(money.paid)) +
          ui.kv('Outstanding', '<span style="color:' + (money.due ? '#fcd34d' : '#e5e7eb') + '">' + U.money(money.due) + '</span>') +
          ui.kv('Overdue', '<span style="color:' + (money.overdue ? '#fca5a5' : '#e5e7eb') + '">' + U.money(money.overdue) + '</span>') +
          ui.kv('Monthly retainer', U.money(money.retainer)) +
          ui.table(['Invoice', 'Project', 'Amount', 'Status'], payments.slice(0, 6).map(p => ({
            cells: ['<span class="mono text-[10px]">' + U.esc(p.invoiceNo) + '</span>', U.esc(p.projectTitle), U.money(p.amount),
              ui.badge(p.status, App.dict.paymentTones[p.status])]
          })), { empty: 'No invoices yet' }), 'mb-4') +

        ui.card(ui.head('Services & projects', ui.badge(svc.length + '', 'muted')) +
          (svc.length ? '<div class="space-y-1.5">' + svc.map(x =>
            '<div class="flex items-center justify-between bg-field border border-line rounded-lg px-2.5 py-2">' +
            '<div><p class="text-[11px] text-gray-200">' + U.esc(x.name) + '</p>' +
            '<p class="text-[9px] text-textMuted">' + U.esc(x.category) + ' · ' + U.esc(x.unit || '') + '</p></div>' +
            '<span class="text-[10px] text-limeAccent font-semibold">' + U.money(x.price) + '</span></div>').join('') + '</div>'
            : '<p class="text-[10px] text-textMuted">No services attached yet — edit the client to pick from the catalogue.</p>'), 'mb-4') +

        ui.card(ui.head('Websites', ui.badge(sites.length + '', sites.length ? 'lime' : 'muted')) +
          (sites.length ? '<div class="space-y-1.5">' + sites.map(x =>
            '<div class="flex items-center gap-2 bg-field border border-line rounded-lg px-2.5 py-2">' +
            ui.badge(x.status, App.dict.siteTones[x.status] || 'muted') +
            '<div class="min-w-0 flex-1"><p class="text-[11px] truncate">' + U.esc(x.name) + '</p>' +
            '<p class="text-[9px] text-textMuted truncate">' + U.esc(x.templateId || '') + ' · ' + U.esc(x.hostingProvider || 'no host') + '</p></div>' +
            (x.url ? ui.link(x.url, 'open', 'link text-[10px]') : '<button class="btn btn-ghost btn-sm" data-action="sites.open" data-arg="' + x.id + '">Preview</button>') +
            '</div>').join('') + '</div>' : '<p class="text-[10px] text-textMuted">No website linked yet.</p>'), 'mb-4') +

        ui.card(ui.head('Notes & history') +
          '<div class="flex gap-2 mb-2"><input class="inp" id="client-note" placeholder="Call summary, next step, decision maker…" />' +
          '<button class="btn btn-lime btn-sm" data-action="client.addNote" data-arg="' + c.id + '">Add</button></div>' +
          '<p class="text-[11px] text-gray-300 whitespace-pre-line mb-2">' + U.esc(c.notes || 'No notes yet.') + '</p>' +
          ui.kv('Created', U.fmtDate(c.createdAt)) + ui.kv('Last updated', U.relTime(c.updatedAt))),
      footer: '<button class="btn btn-ghost btn-sm" data-action="client.stage" data-arg="' + c.id + '">Change stage</button>' +
        '<button class="btn btn-danger btn-sm" data-action="client.delete" data-arg="' + c.id + '">Delete</button>'
    });
  }
  App.openClient = openClient;

  /* --------------------------------- actions -------------------------------- */
